<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#000000" />
<title>Vibe - iOS Social</title>
<style>
/* ============ RESET & VARIABLES ============ */
:root {
  --bg: #000000;
  --bg-elevated: #121212;
  --bg-glass: rgba(18, 18, 18, 0.75);
  --border: rgba(255, 255, 255, 0.1);
  --text-primary: #ffffff;
  --text-secondary: #8e8e93;
  --ios-blue: #0A84FF;
  --ios-red: #FF453A;
  --ios-pink: #FF2D55;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --safe-top: env(safe-area-inset-top, 44px);
  --safe-bottom: env(safe-area-inset-bottom, 20px);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
}

body {
  background-color: var(--bg);
  color: var(--text-primary);
  font-family: var(--font);
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  user-select: none;
  -webkit-user-select: none;
}

/* ============ TOP BAR ============ */
.top-bar {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: calc(var(--safe-top) + 44px);
  padding-top: var(--safe-top);
  background: var(--bg-glass);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 0.5px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-inline: 16px;
  z-index: 100;
}
.logo {
  font-size: 24px;
  font-weight: 800;
  letter-spacing: -0.5px;
  background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  font-style: italic;
}
.top-icons { display: flex; gap: 16px; }
.top-icons svg { width: 24px; height: 24px; stroke: white; fill: none; stroke-width: 2; }

/* ============ MAIN CONTENT AREA ============ */
.main-content {
  flex: 1;
  overflow-y: auto;
  padding-top: calc(var(--safe-top) + 44px);
  padding-bottom: calc(var(--safe-bottom) + 60px);
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
}
.main-content::-webkit-scrollbar { display: none; }

.view { display: none; animation: fadeIn 0.3s ease; }
.view.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

/* ============ STORIES ============ */
.stories {
  display: flex;
  gap: 14px;
  padding: 12px 16px;
  overflow-x: auto;
  border-bottom: 0.5px solid var(--border);
}
.stories::-webkit-scrollbar { display: none; }
.story {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  cursor: pointer;
}
.story-ring {
  width: 68px; height: 68px;
  border-radius: 50%;
  padding: 3px;
  background: linear-gradient(45deg, #f09433, #dc2743, #bc1888);
  position: relative;
}
.story-ring.seen { background: #333; }
.story-img {
  width: 100%; height: 100%; border-radius: 50%;
  object-fit: cover; border: 2px solid var(--bg);
  background: #222;
}
.story-name { font-size: 11px; color: var(--text-secondary); max-width: 70px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.story.add .story-ring { background: none; border: 1px dashed #444; }
.story.add .story-img { background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; border: none; }
.story.add svg { width: 24px; height: 24px; stroke: white; }

/* ============ POSTS ============ */
.post { margin-bottom: 20px; border-bottom: 0.5px solid var(--border); padding-bottom: 16px; }
.post-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px;
}
.post-user { display: flex; align-items: center; gap: 10px; }
.post-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: #333; }
.post-username { font-size: 14px ; font-weight: 600; }
.post-location { font-size: 11px; color: var(--text-secondary); }
.post-more { width: 20px; height: 20px; stroke: white; fill: none; stroke-width: 2; }

.post-image-container { position: relative; width: 100%; aspect-ratio: 4/5; background: #111; overflow: hidden; }
.post-image { width: 100%; height: 100%; object-fit: cover; }
.heart-overlay {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%) scale(0);
  width: 100px; height: 100px;
  fill: white; opacity: 0; pointer-events: none;
  transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s;
  filter: drop-shadow(0 0 10px rgba(0,0,0,0.5));
}
.heart-overlay.animate { transform: translate(-50%, -50%) scale(1); opacity: 1; }

.post-actions { display: flex; justify-content: space-between; padding: 12px 16px 8px; }
.action-group { display: flex; gap: 16px; }
.action-btn { background: none; border: none; cursor: pointer; padding: 0; }
.action-btn svg { width: 26px; height: 26px; stroke: white; fill: none; stroke-width: 2; transition: all 0.2s; }
.action-btn.liked svg { fill: var(--ios-red); stroke: var(--ios-red); animation: heartPop 0.3s; }
@keyframes heartPop { 0% { transform: scale(1); } 50% { transform: scale(1.3); } 100% { transform: scale(1); } }

.post-likes { padding: 0 16px; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
.post-caption { padding: 0 16px; font-size: 14px; line-height: 1.4; }
.post-caption span { font-weight: 600; margin-left: 6px; }
.post-comments { padding: 6px 16px 0; font-size: 13px; color: var(--text-secondary); cursor: pointer; }
.post-time { padding: 8px 16px 0; font-size: 10px; color: var(--text-secondary); text-transform: uppercase; }

/* ============ EXPLORE GRID ============ */
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
.grid-item { aspect-ratio: 1; background: #222; cursor: pointer; position: relative; }
.grid-item img { width: 100%; height: 100%; object-fit: cover; }

/* ============ CREATE SCREEN ============ */
.create-screen { padding: 20px; display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: center; }
.upload-box {
  width: 200px; height: 200px;
  border: 2px dashed #444; border-radius: 20px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px; color: var(--text-secondary); cursor: pointer;
  background: rgba(255,255,255,0.02); transition: all 0.2s;
}
.upload-box:active { background: rgba(255,255,255,0.05); border-color: var(--ios-blue); }
.upload-box svg { width: 40px; height: 40px; stroke: currentColor; fill: none; stroke-width: 1.5; }
.create-btn { margin-top: 20px; background: var(--ios-blue); color: white; padding: 14px 40px; border-radius: 30px; font-weight: 600; font-size: 16px; border: none; }

/* ============ PROFILE ============ */
.profile-header { padding: 20px 16px; display: flex; align-items: center; gap: 20px; }
.profile-avatar { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border); }
.profile-stats { display: flex; gap: 24px; flex: 1; }
.stat { display: flex; flex-direction: column; align-items: center; }
.stat-num { font-size: 18px; font-weight: 700; }
.stat-label { font-size: 12px; color: var(--text-secondary); }
.profile-info { padding: 0 16px 20px; }
.profile-name { font-weight: 600; font-size: 14px; }
.profile-bio { font-size: 13px; margin-top: 4px; color: var(--text-secondary); }
.profile-actions { display: flex; gap: 8px; padding: 0 16px 20px; }
.profile-btn { flex: 1; background: #1c1c1e; color: white; border: none; padding: 8px; border-radius: 8px; font-weight: 600; font-size: 13px; }
.profile-btn.primary { background: var(--ios-blue); }
.profile-tabs { display: flex; border-top: 0.5px solid var(--border); border-bottom: 0.5px solid var(--border); }
.profile-tab { flex: 1; padding: 12px; text-align: center; border-bottom: 2px solid transparent; cursor: pointer; }
.profile-tab.active { border-bottom-color: white; }
.profile-tab svg { width: 24px; height: 24px; stroke: var(--text-secondary); }
.profile-tab.active svg { stroke: white; }

/* ============ BOTTOM NAV ============ */
.bottom-nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: calc(var(--safe-bottom) + 50px);
  padding-bottom: var(--safe-bottom);
  background: var(--bg-glass);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 0.5px solid var(--border);
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 100;
}
.nav-item { padding: 10px; cursor: pointer; position: relative; }
.nav-item svg { width: 26px; height: 26px; stroke: var(--text-secondary); fill: none; stroke-width: 2; transition: all 0.2s; }
.nav-item.active svg { stroke: white; fill: white; }
.nav-item.active[data-tab="create"] svg { stroke: var(--ios-blue); fill: var(--ios-blue); }
.nav-avatar { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; border: 2px solid transparent; transition: border-color 0.2s; }
.nav-item.active[data-tab="profile"] .nav-avatar { border-color: white; }

/* ============ STORY VIEWER ============ */
#story-viewer {
  position: fixed; inset: 0; background: #000;
  z-index: 1000; display: none; flex-direction: column;
  animation: fadeIn 0.2s;
}
#story-viewer.show { display: flex; }
.sv-progress { display: flex; gap: 4px; padding: calc(var(--safe-top) + 10px) 16px 10px; }
.sv-bar { flex: 1; height: 3px; background: rgba(255,255,255,0.3); border-radius: 2px; overflow: hidden; }
.sv-fill { height: 100%; background: white; width: 0%; }
.sv-fill.animating { animation: svProgress 5s linear forwards; }
@keyframes svProgress { from { width: 0%; } to { width: 100%; } }
.sv-header { display: flex; align-items: center; gap: 10px; padding: 0 16px; color: white; }
.sv-avatar { width: 32px; height: 32px; border-radius: 50%; }
.sv-name { font-weight: 600; font-size: 14px; }
.sv-time { font-size: 12px; opacity: 0.7; }
.sv-close { margin-left: auto; background: none; border: none; color: white; font-size: 24px; }
.sv-image { flex: 1; object-fit: contain; width: 100%; }

/* ============ LOADER ============ */
#loader { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 9999; transition: opacity 0.5s; }
#loader.hide { opacity: 0; pointer-events: none; }
.spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.2); border-top-color: white; border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ============ NOTIFICATIONS (TOAST) ============ */
#toast {
  position: fixed; top: calc(var(--safe-top) + 60px); left: 50%; transform: translateX(-50%) translateY(-20px);
  background: rgba(30,30,30,0.95); color: white; padding: 12px 24px; border-radius: 30px;
  font-size: 14px; font-weight: 500; z-index: 2000; opacity: 0; pointer-events: none;
  transition: all 0.3s; border: 0.5px solid var(--border); backdrop-filter: blur(10px);
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

</style>
</head>
<body>

<!-- Loader -->
<div id="loader"><div class="spinner"></div></div>

<!-- Top Bar -->
<div class="top-bar">
  <div class="logo">Vibe</div>
  <div class="top-icons">
    <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
    <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>

<!-- Main Content -->
<div class="main-content" id="main-scroll">

  <!-- HOME VIEW -->
  <div class="view active" id="view-home">

      <div class="story add">

</div>

<!-- Bottom Navigation -->

    <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
  </div>
  <div class="nav-item" data-tab="explore">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
  </div>

  </div>

</div>

<!-- Story Viewer Modal -->
<div id="story-viewer">
  <div class="sv-progress" id="sv-progress"></div>

    <img src="" class="sv-avatar" id="sv-avatar">
    <div>
      <div class="sv-name" id="sv-name">User</div>
      <div class="sv-time">منذ ساعتين</div>

  <img src="" class="sv-image" id="sv-image">
</div>

<!-- Toast -->

<script>
// ============ DATA ============
const users = [
  { id: 1, name: 'أحمد', avatar: 'https://i.pravatar.cc/150?img=12' },
  { id: 2, name: 'سارة', avatar: 'https://i.pravatar.cc/150?img=9' },
  { id: 3, name: 'محمد', avatar: 'https://i.pravatar.cc/150?img=3' },
  { id: 4, name: 'ليلى', avatar: 'https://i.pravatar.cc/150?img=5' },
  { id: 5, name: 'يوسف', avatar: 'https://i.pravatar.cc/150?img=7' }
];

const storiesData = [
  { user: users[0], image: 'https://picsum.photos/id/10/400/800', seen: false },
  { user: users[1], image: 'https://picsum.photos/id/20/400/800', seen: false },
  { user: users[2], image: 'https://picsum.photos/id/30/400/800', seen: true },
  { user: users[3], image: 'https://picsum.photos/id/40/400/800', seen: false },
  { user: users[4], image: 'https://picsum.photos/id/50/400/800', seen: true }
];

const postsData = [
  {
    user: users[0],
    image: 'https://picsum.photos/id/101/500/600',
    likes: 1240,
    caption: 'غروب الشمس اليوم كان رائعاً 🌅',
    location: 'الجزائر العاصمة',
    time: 'منذ 2 ساعة'
  },
  {
    user: users[1],
    image: 'https://picsum.photos/id/104/500/600',
    likes: 856,
    caption: 'جولة في الطبيعة 🌲✨',
    location: 'جبال الأطلس',
    time: 'منذ 5 ساعات'
  },
  {
    user: users[2],
    image: 'https://picsum.photos/id/106/500/600',
    likes: 3204,
    caption: 'إبداع بلا حدود 🎨',
    location: 'وهران',
    time: 'منذ 8 ساعات'
  }
];

const exploreImages = [
  'https://picsum.photos/id/201/300/300',
  'https://picsum.photos/id/202/300/300',
  'https://picsum.photos/id/203/300/300',
  'https://picsum.photos/id/204/300/300',
  'https://picsum.photos/id/205/300/300',
  'https://picsum.photos/id/206/300/300',
  'https://picsum.photos/id/207/300/300',
  'https://picsum.photos/id/208/300/300',
  'https://picsum.photos/id/209/300/300',
  'https://picsum.photos/id/210/300/300',
  'https://picsum.photos/id/211/300/300',
  'https://picsum.photos/id/212/300/300'
];

// ============ RENDER FUNCTIONS ============
function renderStories() {
  const container = document.getElementById('stories-container');
  storiesData.forEach((story, index) => {
    const div = document.createElement('div');
    div.className = 'story';
    div.innerHTML = `
      <div class="story-ring ${story.seen ? 'seen' : ''}">
        <img src="${story.user.avatar}" class="story-img" alt="story">
      </div>
      <div class="story-name">${story.user.name}</div>
    `;
    div.onclick = () => openStory(index);
    container.appendChild(div);
  });
}

function renderFeed() {
  const container = document.getElementById('feed-container');
  postsData.forEach((post, index) => {
    const div = document.createElement('div');
    div.className = 'post';
    div.innerHTML = `
      <div class="post-header">
        <div class="post-user">
          <img src="${post.user.avatar}" class="post-avatar" alt="avatar">
          <div>
            <div class="post-username">${post.user.name}</div>
            <div class="post-location">${post.location}</div>
          </div>
        </div>
        <svg class="post-more" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
      </div>
      <div class="post-image-container" id="post-img-${index}">
        <img src="${post.image}" class="post-image" alt="post">
        <svg class="heart-overlay" id="heart-${index}" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      </div>
      <div class="post-actions">
        <div class="action-group">
          <button class="action-btn" id="like-btn-${index}" onclick="toggleLike(${index}, ${post.likes})">
            <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          </button>
          <button class="action-btn"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></button>
          <button class="action-btn"><svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
        </div>
        <button class="action-btn"><svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg></button>
      </div>
      <div class="post-likes" id="likes-${index}">${post.likes.toLocaleString()} إعجاب</div>
      <div class="post-caption"><span>${post.user.name}</span>${post.caption}</div>
      <div class="post-comments">عرض كل التعليقات (24)</div>
      <div class="post-time">${post.time}</div>
    `;
    
    // Add double-tap to like
    setTimeout(() => {
      const imgContainer = document.getElementById(`post-img-${index}`);
      let lastTap = 0;
      imgContainer.addEventListener('click', (e) => {
        const now = Date.now();
        if (now - lastTap < 300) {
          // Double tap
          doubleTapLike(index, post.likes);
          e.preventDefault();
        }
        lastTap = now;
      });
    }, 0);

    container.appendChild(div);
  });
}

function renderExplore() {
  const container = document.getElementById('explore-grid');
  exploreImages.forEach(img => {
    const div = document.createElement('div');
    div.className = 'grid-item';
    div.innerHTML = `<img src="${img}" loading="lazy">`;
    div.onclick = () => showToast('عرض الصورة');
    container.appendChild(div);
  });
}

function renderProfile() {
  const container = document.getElementById('profile-grid');
  for (let i = 0; i < 9; i++) {
    const div = document.createElement('div');
    div.className = 'grid-item';
    div.innerHTML = `<img src="https://picsum.photos/id/${300+i}/300/300" loading="lazy">`;
    container.appendChild(div);
  }
}

// ============ INTERACTIONS ============
function toggleLike(index, baseLikes) {
  const btn = document.getElementById(`like-btn-${index}`);
  const likesEl = document.getElementById(`likes-${index}`);
  const isLiked = btn.classList.contains('liked');
  
  if (isLiked) {
    btn.classList.remove('liked');
    likesEl.textContent = `${baseLikes.toLocaleString()} إعجاب`;
  } else {
    btn.classList.add('liked');
    likesEl.textContent = `${(baseLikes + 1).toLocaleString()} إعجاب`;
  }
}

function doubleTapLike(index, baseLikes) {
  const btn = document.getElementById(`like-btn-${index}`);
  const likesEl = document.getElementById(`likes-${index}`);
  const heart = document.getElementById(`heart-${index}`);
  
  btn.classList.add('liked');
  likesEl.textContent = `${(baseLikes + 1).toLocaleString()} إعجاب`;
  
  // Animate heart
  heart.classList.add('animate');
  setTimeout(() => {
    heart.classList.remove('animate');
  }, 800);
}

// ============ STORY VIEWER ============
let currentStoryIndex = 0;
let storyTimer = null;

function openStory(index) {
  currentStoryIndex = index;
  const viewer = document.getElementById('story-viewer');
  viewer.classList.add('show');
  renderStoryContent();
}

function renderStoryContent() {
  const story = storiesData[currentStoryIndex];
  document.getElementById('sv-avatar').src = story.user.avatar;
  document.getElementById('sv-name').textContent = story.user.name;
  document.getElementById('sv-image').src = story.image;
  
  // Progress bar
  const progressContainer = document.getElementById('sv-progress');
  progressContainer.innerHTML = '';
  storiesData.forEach((_, i) => {
    const bar = document.createElement('div');
    bar.className = 'sv-bar';
    const fill = document.createElement('div');
    fill.className = 'sv-fill';
    if (i < currentStoryIndex) fill.style.width = '100%';
    if (i === currentStoryIndex) fill.classList.add('animating');
    bar.appendChild(fill);
    progressContainer.appendChild(bar);
  });
  
  clearTimeout(storyTimer);
  storyTimer = setTimeout(() => {
    nextStory();
  }, 5000);
}

function nextStory() {
  if (currentStoryIndex < storiesData.length - 1) {
    currentStoryIndex++;
    renderStoryContent();
  } else {
    closeStory();
  }
}

function closeStory() {
  document.getElementById('story-viewer').classList.remove('show');
  clearTimeout(storyTimer);
}

// ============ NAVIGATION ============
document.querySelectorAll('.nav-item').forEach(item => {
  item.addEventListener('click', () => {
    // Update active nav
    document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
    item.classList.add('active');
    
    // Switch view
    const tab = item.dataset.tab;
    document.querySelectorAll('.view').forEach(view => view.classList.remove('active'));
    document.getElementById(`view-${tab}`).classList.add('active');
    
    // Scroll to top
    document.getElementById('main-scroll').scrollTop = 0;
  });
});

// ============ TOAST ============
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

// ============ INIT ============
window.onload = () => {
  renderStories();
  renderFeed();
  renderExplore();
  renderProfile();
  
  setTimeout(() => {
    document.getElementById('loader').classList.add('hide');
  }, 800);
};

// Prevent double tap zoom on iOS
let lastTouchEnd = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTouchEnd <= 300) {
    e.preventDefault();
  }
  lastTouchEnd = now;
}, { passive: false });

</script>
