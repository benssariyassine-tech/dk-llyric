<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0a0a0a" />
<title>Djezzy Smart Hub</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body, html {
        width: 100%; height: 100%; overflow-y: auto; overflow-x: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #000000; color: #ffffff;
        -webkit-tap-highlight-color: transparent;
    }

    /* خلفية ديناميكية */
    body::before {
        content: ''; position: fixed; inset: 0;
        background: radial-gradient(circle at 10% 20%, rgba(227, 6, 19, 0.15) 0%, transparent 40%),
                    radial-gradient(circle at 90% 80%, rgba(0, 122, 255, 0.1) 0%, transparent 40%);
        z-index: -1; pointer-events: none;
    }

    #app {
        display: flex; flex-direction: column;
        padding: 20px; padding-top: 50px; padding-bottom: 40px;
        max-width: 500px; margin: 0 auto; min-height: 100vh;
    }

    /* الترويسة */
    header { text-align: center; margin-bottom: 25px; }
    .logo {
        width: 80px; height: 80px; border-radius: 24px;
        background: linear-gradient(135deg, #e30613, #8b0000);
        display: flex; align-items: center; justify-content: center;
        margin: 0 auto 15px; box-shadow: 0 10px 30px rgba(227, 6, 19, 0.3);
    }
    .logo svg { width: 45px; height: 45px; fill: white; }
    h1 { font-size: 24px; font-weight: 800; margin-bottom: 5px; letter-spacing: -0.5px; }
    p.sub { font-size: 13px; color: #888; }

    /* صندوق الإدخال (اللصق) */
    .input-card {
        background: rgba(28, 28, 30, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px; padding: 20px;
        backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
        margin-bottom: 25px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }
    textarea {
        width: 100%; height: 90px; background: #000;
        border: 1px solid #333; border-radius: 12px;
        color: #fff; padding: 12px; font-size: 14px;
        resize: none; outline: none; margin-bottom: 15px;
        font-family: monospace; direction: ltr; text-align: left;
    }
    textarea:focus { border-color: #e30613; }

    .btn-group { display: flex; gap: 10px; }
    .btn {
        flex: 1; padding: 14px; border-radius: 12px;
        font-size: 15px; font-weight: 700; cursor: pointer;
        display: flex; align-items: center; justify-content: center; gap: 8px;
        transition: all 0.2s;
    }
    .btn-paste { background: #e30613; color: white; box-shadow: 0 4px 15px rgba(227,6,19,0.4); }
    .btn-paste:active { transform: scale(0.96); }
    .btn-clear { background: #333; color: white; flex: 0.4; }
    
    /* لوحة النتائج */
    #results-dashboard { display: none; animation: slideUp 0.4s ease; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    .section-title {
        font-size: 14px; color: #888; margin-bottom: 12px;
        text-transform: uppercase; letter-spacing: 1px; font-weight: 600;
    }

    /* بطاقة الرصيد */
    .credit-card {
        background: linear-gradient(135deg, #1c1c1e, #0a0a0a);
        border: 1px solid #333; border-radius: 20px;
        padding: 25px 20px; text-align: center;
        margin-bottom: 20px; position: relative; overflow: hidden;
    }
    .credit-card::before {
        content: ''; position: absolute; top: 0; right: 0; width: 100%; height: 4px;
        background: linear-gradient(90deg, #e30613, #ff4d4d);
    }
    .credit-label { font-size: 14px; color: #aaa; margin-bottom: 8px; }
    .credit-amount { font-size: 48px; font-weight: 900; color: #fff; }
    .credit-currency { font-size: 20px; color: #aaa; font-weight: 500; }

    /* بطاقات الإنترنت */
    .data-card {
        background: rgba(28, 28, 30, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 18px; padding: 18px;
        margin-bottom: 12px; backdrop-filter: blur(10px);
    }
    .data-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .data-title { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .data-title svg { width: 18px; height: 18px; fill: #007aff; }
    .data-date { font-size: 12px; color: #888; background: #222; padding: 4px 10px; border-radius: 20px; }
    .data-amount { font-size: 28px; font-weight: 800; color: #fff; margin-bottom: 8px; }
    .data-amount span { font-size: 14px; color: #888; font-weight: 400; }
    
    /* شريط التقدم */
    .progress-bg { width: 100%; height: 8px; background: #000; border-radius: 10px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 10px; transition: width 1s ease-out; }
    .fill-blue { background: linear-gradient(90deg, #007aff, #5ac8fa); }
    .fill-green { background: linear-gradient(90deg, #34c759, #28cd41); }
    .fill-orange { background: linear-gradient(90deg, #ff9500, #ffcc00); }

    /* إشعار */
    #toast {
        position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px);
        background: #333; color: white; padding: 12px 24px; border-radius: 30px;
        font-size: 14px; font-weight: 600; opacity: 0; transition: all 0.3s;
        z-index: 100; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div id="app">
    <header>
        <div class="logo">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
        </div>
        <h1>Djezzy Smart Hub</h1>
        <p class="sub">قراءة ذكية لبيانات الرصيد</p>
    </header>

    <!-- صندوق الإدخال -->
    <div class="input-card">
        <p style="font-size: 13px; color: #aaa; margin-bottom: 12px; line-height: 1.5;">
            اطلب الكود <b style="color: #fff;">*710#</b>، انسخ الرسالة الناتجة، والصقها هنا لتحليلها:
        </p>
        <textarea id="ussd-input" placeholder="Crédit 0 DA. Internet: 970.63Mo au 19 oct. 2026 ..."></textarea>
        <div class="btn-group">
            <button class="btn btn-paste" onclick="pasteAndParse()">
                📋 لصق وتحليل
            </button>
            <button class="btn btn-clear" onclick="clearInput()">
                🗑️
            </button>
        </div>
    </div>

    <!-- لوحة النتائج -->
    <div id="results-dashboard">
        <div class="section-title">الرصيد المتبقي</div>
        
        <div class="credit-card">
            <div class="credit-label">الرصيد الحالي</div>
            <div class="credit-amount"><span id="out-credit">0</span> <span class="credit-currency">دج</span></div>
        </div>

        <div class="section-title">عروض الإنترنت</div>
        <div id="data-container">
            <!-- سيتم ملؤها ديناميكياً بالجافاسكريبت -->
        </div>
    </div>
</div>

<div id="toast">تم التحليل بنجاح!</div>

<script>
    // دالة إظهار الإشعارات
    let toastTimer;
    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // تفريغ الحقل
    function clearInput() {
        document.getElementById('ussd-input').value = '';
        document.getElementById('results-dashboard').style.display = 'none';
    }

    // لصق من الحافظة (Clipboard) وتحليل
    async function pasteAndParse() {
        const input = document.getElementById('ussd-input');
        try {
            // محاولة القراءة من الحافظة (تدعم المتصفحات الحديثة)
            if (navigator.clipboard && window.isSecureContext) {
                const text = await navigator.clipboard.readText();
                input.value = text;
            } else {
                input.focus();
                document.execCommand('paste');
            }
            parseText();
        } catch (err) {
            // إذا فشلت القراءة التلقائية، المستخدم يمكنه اللصق يدوياً
            showToast("الرجاء اللصق يدوياً في الصندوق");
            input.focus();
        }
    }

    // المستمع لحدث اللصق اليدوي (لأجهزة الآيفون)
    document.getElementById('ussd-input').addEventListener('input', parseText);

    // ==========================================
    // محرك التحليل (Regex Parser)
    // ==========================================
    function parseText() {
        const text = document.getElementById('ussd-input').value;
        if (!text || text.trim().length < 5) return;

        const dashboard = document.getElementById('results-dashboard');
        const outCredit = document.getElementById('out-credit');
        const dataContainer = document.getElementById('data-container');

        // 1. استخراج الرصيد (Credit)
        // يبحث عن كلمة Crédit متبوعة برقم ثم DA
        const creditMatch = text.match(/Crédit\s*([\d.,]+)\s*DA/i);
        outCredit.textContent = creditMatch ? creditMatch[1] : '0';

        // 2. استخراج عروض الإنترنت (Data)
        dataContainer.innerHTML = '';
        let foundData = false;

        // Regex لالتقاط: Internet: 970.63Mo au 19 oct. 2026
        // ملاحظة: النص قد يحتوي على "Internet:2964.34 Mo." (بدون مسافة)
        const internetRegex = /Internet\s*:\s*([\d.,]+)\s*Mo\.?\s*au\s*([^I]+?)(?=\s*Internet|\s*Bonus|$)/gi;
        let match;

        while ((match = internetRegex.exec(text)) !== null) {
            foundData = true;
            const amount = match[1];
            const date = match[2].trim();
            // افتراض حد أقصى للعرض (مثلاً 5 جيجا) لرسم شريط التقدم
            const maxCap = 5000; 
            const percentage = Math.min((parseFloat(amount) / maxCap) * 100, 100);
            
            const card = document.createElement('div');
            card.className = 'data-card';
            card.innerHTML = `
                <div class="data-header">
                    <div class="data-title">
                        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
                        إنترنت أساسي
                    </div>
                    <div class="data-date">حتى ${date}</div>
                </div>
                <div class="data-amount">${amount} <span>ميجا</span></div>
                <div class="progress-bg"><div class="progress-fill fill-blue" style="width: 0%"></div></div>
            `;
            dataContainer.appendChild(card);
            // أنيميشن شريط التقدم
            setTimeout(() => card.querySelector('.progress-fill').style.width = percentage + '%', 100);
        }

        // Regex لالتقاط البونص: Bonus Data: 500Mo au 241026
        const bonusRegex = /Bonus\s*Data\s*:\s*([\d.,]+)\s*Mo\.?\s*au\s*([^I]+?)(?=\s*Internet|\s*Bonus|$)/gi;
        while ((match = bonusRegex.exec(text)) !== null) {
            foundData = true;
            const amount = match[1];
            const date = match[2].trim();
            const maxCap = 1000;
            const percentage = Math.min((parseFloat(amount) / maxCap) * 100, 100);

            const card = document.createElement('div');
            card.className = 'data-card';
            card.innerHTML = `
                <div class="data-header">
                    <div class="data-title">
                        <svg viewBox="0 0 24 24" style="fill: #ff9500;"><path d="M20 6h-2.18c.11-.31.18-.65.18-1a2.996 2.996 0 0 0-5.5-1.65l-.5.67-.5-.68C10.96 2.54 10.05 2 9 2 7.34 2 6 3.34 6 5c0 .35.07.69.18 1H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-5-2c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zM9 4c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm11 15H4v-2h16v2zm0-5H4V8h5.08L7 10.83 8.62 12 11 8.76l1-1.36 1 1.36L15.38 12 17 10.83 14.92 8H20v6z"/></svg>
                        بونص إضافي
                    </div>
                    <div class="data-date">حتى ${date}</div>
                </div>
                <div class="data-amount">${amount} <span>ميجا</span></div>
                <div class="progress-bg"><div class="progress-fill fill-orange" style="width: 0%"></div></div>
            `;
            dataContainer.appendChild(card);
            setTimeout(() => card.querySelector('.progress-fill').style.width = percentage + '%', 100);
        }

        if (!foundData && !creditMatch) {
            showToast("لم يتم التعرف على التنسيق، تأكد من نسخ النص كاملاً");
            dashboard.style.display = 'none';
            return;
        }

        // إظهار اللوحة
        dashboard.style.display = 'block';
        showToast("تم تحليل الرصيد بنجاح! 🎉");
    }
</script>

</body>
</html>
