<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>المحرر — dk.llyric</title>
<meta name="theme-color" content="#0b0b0f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;700;900&family=Almarai:wght@400;700;800&family=Reem+Kufi:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="editor-body">

  <!-- 🔝 TOPBAR -->
  <header class="editor-topbar">
    <button class="etb-btn" onclick="closeEditor()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <div class="etb-title-wrap"><span class="etb-title">مشروع جديد</span></div>
    <span class="etb-badge">HD</span>
    <button class="etb-export" onclick="exportVideo()">حفظ</button>
  </header>

  <!-- 🎬 PREVIEW -->
  <div class="preview-wrap">
<div class="preview-frame" id="previewFrame" data-ratio="9:16" style="max-width: 100%;">
      <div class="bg-layer" id="bgLayer">
        <img id="bgImage" alt="">
      </div>

      <div class="preview-card" id="mainCard">

        <!-- 🔝 HEADER -->
<div class="card-header">
          <img class="album-art" id="previewCover" src="https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=200&q=80" alt="">
          <div class="track-info">
            <div class="track-name" id="previewSong"></div>
            <div class="artist-name" id="previewArtist"></div>
          </div>
        </div>

        <!-- ✨ DIVIDER 1 -->
        <div class="divider"></div>

        <!-- 🎯 LYRICS -->
        <div class="card-lyrics">
          <div class="lyric-prev" id="lyricPrev"></div>
          <div class="lyric-current" 
            <div class="lyric-current" id="lyricCurrent"></div>
          <div class="lyric-next" id="lyricNext"></div>
        </div>

        <!-- ✨ DIVIDER 2 -->
        <div class="divider"></div>

        <!-- 🔻 FOOTER -->
        <div class="card-footer" onclick="openInstagram()">
          <svg class="ig-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/>
            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>
          </svg>
          <span class="ig-name" id="igName">dk.llyric</span>
        </div>

      </div>
    </div>
  </div>

  <!-- ▶️ PLAYBACK -->
  <div class="playback-controls">
    <button class="pc-btn" onclick="undoAction()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg>
    </button>
    <button class="pc-btn" onclick="redoAction()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 14 20 9 15 4"/><path d="M4 20v-7a4 4 0 0 1 4-4h12"/></svg>
    </button>
    <div class="pc-time" id="timeDisplay">00:00 / 00:15</div>
    <button class="pc-btn" id="playBtn" onclick="togglePlay()">
      <svg id="playIcon" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
    </button>
  </div>

  <!-- 🎞️ TIMELINE -->
  <div class="timeline-wrap">
    <div class="timeline-viewport" id="timelineViewport">
      <div class="timeline-content" id="timelineContent">
        <div class="timeline-ruler" id="timelineRuler"></div>
        <div class="track track-text" id="trackText"></div>
        <div class="track track-audio" id="trackAudio">
          <div class="audio-segment hidden" id="audioSegment">
            <div class="audio-wave"></div>
            <span class="audio-label" id="audioLabel">الصوت</span>
          </div>
          <button class="audio-add-btn" id="audioAddBtn" onclick="openAudioPicker()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
        </div>
        <div class="track track-bg" id="trackBg">
          <div class="bg-segment hidden" id="bgSegment">
            <span class="bg-label" id="bgLabel">الخلفية</span>
          </div>
        </div>
        <div class="playhead" id="playhead"><div class="playhead-cap"></div></div>
      </div>
    </div>
  </div>

  <!-- 🎛️ NAV -->
  <nav class="editor-nav">
    <button class="editor-nav-item" data-tab="audio" onclick="openTab('audio', this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      <span>صوت</span>
    </button>
    <button class="editor-nav-item" data-tab="text" onclick="openTab('text', this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
      <span>نص</span>
    </button>
    <button class="editor-nav-item" data-tab="effects" onclick="openTab('effects', this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
      <span>تأثيرات</span>
    </button>
    <button class="editor-nav-item" data-tab="bg" onclick="openTab('bg', this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      <span>خلفية</span>
    </button>
    <button class="editor-nav-item" data-tab="card" onclick="openTab('card', this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/></svg>
      <span>بطاقة</span>
    </button>
  </nav>

  <!-- 📦 SHEETS -->
  <div class="sheet-backdrop" id="sheetBackdrop" onclick="closeSheet()"></div>
  <div class="bottom-sheet" id="bottomSheet">
    <div class="sheet-handle"></div>

    <!-- 🎵 AUDIO -->
    <div class="sheet-content" data-sheet="audio">
      <h3 class="sheet-title">الصوت</h3>
      <label for="audioInput" class="upload-btn" id="audioUploadBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        <span>اختر أغنية أو فيديو</span>
      </label>
      <input type="file" id="audioInput" accept="audio/*,video/*" hidden>
      <div class="upload-preview hidden" id="audioPreview">
        <div class="upload-preview-info" style="text-align:center;flex:1;">
          <div class="upload-preview-name" id="audioPreviewName"></div>
          <div class="upload-preview-meta" id="audioPreviewMeta"></div>
        </div>
        <button class="upload-preview-remove" onclick="removeAudio()">×</button>
      </div>
      <audio id="audioPlayer" class="hidden"></audio>
    </div>

    <!-- ✍️ TEXT -->
    <div class="sheet-content" data-sheet="text">
      <h3 class="sheet-title">الكلمات</h3>
      <p class="sheet-hint">كل سطر راح يظهر: سابق + حالي + جاي</p>
      <div id="lyricsList"></div>
      <button class="add-lyric-btn" onclick="addLyricLine()">+ إضافة سطر</button>
    </div>

    <!-- ✨ EFFECTS -->
    <div class="sheet-content" data-sheet="effects">
      <h3 class="sheet-title">التأثيرات</h3>
      <div class="font-group">
        <label class="font-label">فلتر الخطوط</label>
        <div class="filter-row">
          <button class="filter-btn active" data-filter="all" onclick="setFontFilter('all', this)">الكل</button>
          <button class="filter-btn" data-filter="ar" onclick="setFontFilter('ar', this)">عربي</button>
          <button class="filter-btn" data-filter="en" onclick="setFontFilter('en', this)">إنجليزي</button>
        </div>
      </div>
      <div class="font-group">
        <label class="font-label">الخط</label>
        <div class="font-family-grid">
          <button class="font-family-btn active" data-font="Cairo" data-lang="ar" style="font-family:'Cairo',sans-serif;">Cairo</button>
          <button class="font-family-btn" data-font="Tajawal" data-lang="ar" style="font-family:'Tajawal',sans-serif;">Tajawal</button>
          <button class="font-family-btn" data-font="Almarai" data-lang="ar" style="font-family:'Almarai',sans-serif;">Almarai</button>
          <button class="font-family-btn" data-font="Reem Kufi" data-lang="ar" style="font-family:'Reem Kufi',sans-serif;">Reem Kufi</button>
          <button class="font-family-btn" data-font="IBM Plex Sans Arabic" data-lang="ar" style="font-family:'IBM Plex Sans Arabic',sans-serif;">IBM Plex</button>
          <button class="font-family-btn" data-font="Inter" data-lang="en" style="font-family:'Inter',sans-serif;">Inter</button>
        </div>
      </div>
      <div class="font-group">
        <label class="font-label">الحجم: <span id="fontSizeVal">20</span>px</label>
        <input type="range" id="fontSizeRange" min="12" max="48" value="20" class="font-slider">
      </div>
      <div class="font-group">
        <label class="font-label">اللون</label>
        <div class="color-grid">
          <button class="color-btn active" data-color="#ffffff" style="background:#ffffff;"></button>
          <button class="color-btn" data-color="#ffd60a" style="background:#ffd60a;"></button>
          <button class="color-btn" data-color="#0a84ff" style="background:#0a84ff;"></button>
          <button class="color-btn" data-color="#ff453a" style="background:#ff453a;"></button>
          <button class="color-btn" data-color="#32d74b" style="background:#32d74b;"></button>
          <button class="color-btn" data-color="#bf5af2" style="background:#bf5af2;"></button>
        </div>
      </div>
      <div class="font-group">
        <label class="font-label">اسم Instagram</label>
        <input type="text" id="igNameInput" class="lyric-text-input" placeholder="dk.llyric" value="dk.llyric">
      </div>
    </div>

    <!-- 🖼️ BACKGROUND -->
<div class="sheet-content" data-sheet="bg">
      <h3 class="sheet-title">الخلفية</h3>
      <p class="sheet-hint">صورة خلفية — إذا ما حطيتش، تكون سوداء</p>
      <label for="bgInput" class="upload-btn" id="bgUploadBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        <span>اختر صورة خلفية</span>
      </label>
      <input type="file" id="bgInput" accept="image/*" hidden>
      <div class="upload-preview hidden" id="bgPreview">
        <img id="bgPreviewImg" alt="" style="width:50px;height:50px;border-radius:10px;object-fit:cover;">
        <div class="upload-preview-info">
          <div class="upload-preview-name" id="bgPreviewName"></div>
          <div class="upload-preview-meta">تم الرفع ✓</div>
        </div>
        <button class="upload-preview-remove" onclick="removeBackground()">×</button>
      </div>

      <div id="bgFiltersBox" style="display:none;">
        <div class="font-group" style="margin-top:20px;">
          <label class="font-label">الضبابية: <span id="bgBlurVal">0</span>px</label>
          <input type="range" id="bgBlurRange" min="0" max="30" step="1" value="0" class="font-slider">
        </div>

        <div class="font-group">
          <label class="font-label">السطوع: <span id="bgBrightnessVal">100</span>%</label>
          <input type="range" id="bgBrightnessRange" min="20" max="200" step="5" value="100" class="font-slider">
        </div>

        <div class="font-group">
          <label class="font-label">التشبع: <span id="bgSaturationVal">100</span>%</label>
          <input type="range" id="bgSaturationRange" min="0" max="200" step="5" value="100" class="font-slider">
        </div>

        <div class="font-group">
          <label class="font-label">التباين: <span id="bgContrastVal">100</span>%</label>
          <input type="range" id="bgContrastRange" min="50" max="200" step="5" value="100" class="font-slider">
        </div>

        <div class="font-group">
          <label class="font-label">الشفافية: <span id="bgOpacityVal">100</span>%</label>
          <input type="range" id="bgOpacityRange" min="10" max="100" step="5" value="100" class="font-slider">
        </div>

        <div class="font-group">
          <label class="font-label">تدوير اللون: <span id="bgHueVal">0</span>°</label>
          <input type="range" id="bgHueRange" min="0" max="360" step="5" value="0" class="font-slider">
        </div>

        <button onclick="resetBgFilters()" style="width:100%;padding:12px;background:rgba(10,132,255,0.15);color:#0a84ff;border:1px solid rgba(10,132,255,0.3);border-radius:12px;font-weight:700;font-family:inherit;font-size:13px;cursor:pointer;margin-top:4px;">
          إعادة ضبط الفلاتر
        </button>
      </div>
    </div>

    <!-- 🃏 CARD -->
    <div class="sheet-content" data-sheet="card">
      <h3 class="sheet-title">البطاقة</h3>

      <div class="font-group">
        <label class="font-label">حجم البطاقة: <span id="cardScaleVal">1.00</span>x</label>
        <input type="range" id="cardScaleRange" min="0.5" max="1.5" step="0.05" value="1" class="font-slider">
      </div>

      <div class="font-group">
        <label class="font-label">شفافية البطاقة: <span id="cardOpacityVal">65</span>%</label>
        <input type="range" id="cardOpacityRange" min="10" max="100" step="5" value="65" class="font-slider">
      </div>

      <div class="font-group">
        <label class="font-label">استدارة الحواف: <span id="cardRadiusVal">26</span>px</label>
        <input type="range" id="cardRadiusRange" min="0" max="40" step="2" value="26" class="font-slider">
      </div>

      <div class="font-group">
        <label class="font-label">حجم الصورة: <span id="coverSizeVal">68</span>px</label>
        <input type="range" id="coverSizeRange" min="40" max="120" step="2" value="68" class="font-slider">
      </div>
    </div>

  </div>

  <!-- 🎬 CAPCUT MENU -->
  <div class="capcut-menu" id="capcutMenu">
    <button class="cm-item" onclick="cmAction('split')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><path d="M8.12 8.12L12 12"/><path d="M20 4L8.12 15.88"/><circle cx="6" cy="18" r="3"/><path d="M14.8 14.8L20 20"/></svg>
      <span>تقسيم</span>
    </button>
    <button class="cm-item" onclick="cmAction('edit')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      <span>تعديل</span>
    </button>
    <button class="cm-item" onclick="cmAction('copy')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      <span>نسخ</span>
    </button>
    <button class="cm-item" onclick="cmAction('duplicate')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="13" height="13" rx="2"/><path d="M8 21h11a2 2 0 0 0 2-2V8"/></svg>
      <span>تكرار</span>
    </button>
    <button class="cm-item" onclick="cmAction('glass')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M3 12h18" opacity="0.4"/><path d="M12 3v18" opacity="0.4"/></svg>
      <span>زجاجي</span>
    </button>
    <button class="cm-item danger" onclick="cmAction('delete')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
      <span>حذف</span>
    </button>
  </div>

  <script src="script.js"></script>
</body>
</html>
