<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>dk.llyric — استوديو الكلمات</title>
<meta name="theme-color" content="#07070d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Tajawal:wght@400;700;900&family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#07070d;--card:rgba(255,255,255,0.05);--text:#fff;--sub:#8e8e93;--accent:#0a84ff;--accent2:#0062d2;--purple:#bf5af2;--danger:#ff453a;--border:rgba(255,255,255,0.1);--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
html,body{background:var(--bg);color:var(--text);font-family:Cairo,-apple-system,sans-serif;overflow-x:hidden;height:100dvh}
body{position:fixed;width:100%;overscroll-behavior:none}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}

/* Background */
.bg-ambient{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(100px);opacity:0.35;animation:float 20s ease-in-out infinite}
.blob-1{width:320px;height:320px;background:#0a84ff;top:-80px;right:-80px}
.blob-2{width:300px;height:300px;background:#bf5af2;bottom:-60px;left:-60px;animation-delay:-8s}
.blob-3{width:250px;height:250px;background:#ff2d92;top:40%;left:50%;animation-delay:-14s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(30px,-40px) scale(1.1)}66%{transform:translate(-30px,30px) scale(0.95)}}

/* Screens */
.screen{display:none;flex-direction:column;height:100dvh;overflow-y:auto;position:relative;z-index:1;-webkit-overflow-scrolling:touch}
.screen.active{display:flex}

/* ===== LOGIN ===== */
#screenLogin{justify-content:center;padding:calc(var(--sat) + 30px) 24px calc(var(--sab) + 30px);max-width:460px;margin:0 auto;width:100%}
.logo-wrap{text-align:center;margin-bottom:50px}
.logo-icon{width:90px;height:90px;margin:0 auto 22px;border-radius:24px;background:linear-gradient(135deg,#bf5af2,#0a84ff);display:flex;align-items:center;justify-content:center;box-shadow:0 20px 60px rgba(191,90,242,0.5)}
.logo-icon svg{width:48px;height:48px;stroke:#fff;fill:none;stroke-width:2}
.logo-title{font-size:34px;font-weight:900;background:linear-gradient(135deg,#fff,#bf5af2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-1px}
.logo-sub{font-size:14px;color:var(--sub);margin-top:8px;font-weight:500}
.auth-form{background:rgba(255,255,255,0.04);backdrop-filter:blur(40px);border:1px solid var(--border);border-radius:24px;padding:24px 22px}
.auth-tabs{display:flex;gap:6px;padding:4px;background:rgba(0,0,0,0.3);border-radius:12px;margin-bottom:22px}
.auth-tab{flex:1;padding:10px;background:none;border:none;color:var(--sub);font-size:13px;font-weight:700;border-radius:9px;font-family:inherit;transition:all 0.25s}
.auth-tab.active{background:linear-gradient(135deg,#bf5af2,#0a84ff);color:#fff;box-shadow:0 4px 12px rgba(191,90,242,0.4)}
.auth-field{margin-bottom:14px}
.auth-label{display:block;font-size:11px;font-weight:800;color:var(--sub);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.auth-input{width:100%;padding:15px 16px;background:rgba(255,255,255,0.06);border:1.5px solid var(--border);border-radius:14px;color:#fff;font-size:16px;font-weight:600;outline:none;font-family:inherit;transition:all 0.2s;-webkit-user-select:text;user-select:text}
.auth-input:focus{border-color:var(--accent);background:rgba(10,132,255,0.08);box-shadow:0 0 0 4px rgba(10,132,255,0.12)}
.auth-btn{width:100%;padding:16px;background:linear-gradient(135deg,#bf5af2,#0a84ff);color:#fff;border:none;border-radius:14px;font-size:15px;font-weight:900;font-family:inherit;margin-top:10px;box-shadow:0 10px 30px rgba(191,90,242,0.4);transition:transform 0.15s;display:flex;align-items:center;justify-content:center;gap:10px}
.auth-btn:active{transform:scale(0.96)}
.auth-btn:disabled{opacity:0.6;pointer-events:none}
.auth-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.5}
.auth-divider{display:flex;align-items:center;gap:12px;margin:18px 0;color:var(--sub);font-size:11px;font-weight:700}
.auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--border)}
.auth-error{background:rgba(255,69,58,0.12);border:1px solid rgba(255,69,58,0.3);color:#ff453a;padding:12px 14px;border-radius:12px;font-size:12px;font-weight:600;margin-bottom:14px;display:none}
.auth-error.show{display:block}
.auth-guest{margin-top:20px;text-align:center}
.auth-guest-btn{background:none;border:none;color:var(--sub);font-size:13px;font-weight:600;text-decoration:underline;font-family:inherit}

/* ===== DASHBOARD ===== */
#screenDash{padding-top:var(--sat)}
.dash-top{padding:16px 20px 12px;display:flex;align-items:center;gap:10px}
.dash-title{flex:1}
.dash-greeting{font-size:11px;color:var(--sub);font-weight:700;text-transform:uppercase;letter-spacing:1px}
.dash-name{font-size:20px;font-weight:900;margin-top:2px;color:#fff}
.avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#bf5af2,#0a84ff);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;color:#fff;flex-shrink:0}
.dash-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 20px 16px}
.stat-card{background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:16px;padding:14px 10px;text-align:center;backdrop-filter:blur(20px)}
.stat-value{font-size:22px;font-weight:900;background:linear-gradient(135deg,#bf5af2,#0a84ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.stat-label{font-size:10px;color:var(--sub);font-weight:700;margin-top:4px;text-transform:uppercase;letter-spacing:0.5px}
.section-head{padding:0 20px;margin:20px 0 12px;display:flex;align-items:center;justify-content:space-between}
.section-title{font-size:16px;font-weight:900}
.section-action{background:none;border:none;color:var(--accent);font-size:12px;font-weight:800;font-family:inherit}
.new-project-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:calc(100% - 40px);margin:0 20px 16px;padding:18px;background:linear-gradient(135deg,#bf5af2,#0a84ff);color:#fff;border:none;border-radius:18px;font-size:15px;font-weight:900;font-family:inherit;box-shadow:0 12px 36px rgba(191,90,242,0.4);transition:transform 0.15s}
.new-project-btn:active{transform:scale(0.97)}
.new-project-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.5}

/* Tabs */
.dash-tabs{display:flex;gap:4px;padding:4px;background:rgba(0,0,0,0.3);border-radius:14px;margin:0 20px 16px}
.dash-tab{flex:1;padding:10px;background:none;border:none;color:var(--sub);font-size:12px;font-weight:800;border-radius:10px;font-family:inherit;transition:all 0.25s}
.dash-tab.active{background:rgba(255,255,255,0.1);color:#fff}

/* Project Cards */
.projects-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:0 20px calc(var(--sab) + 100px)}
.project-card{background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:16px;overflow:hidden;transition:transform 0.2s,box-shadow 0.2s;cursor:pointer;position:relative;backdrop-filter:blur(20px)}
.project-card:active{transform:scale(0.96)}
.project-thumb{width:100%;aspect-ratio:16/10;background:linear-gradient(135deg,rgba(10,132,255,0.4),rgba(191,90,242,0.4));position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.project-thumb img{width:100%;height:100%;object-fit:cover}
.project-thumb svg{width:40px;height:40px;stroke:rgba(255,255,255,0.5);fill:none;stroke-width:1.5}
.project-thumb-overlay{position:absolute;inset:0;background:linear-gradient(180deg,transparent 0%,rgba(0,0,0,0.4) 100%)}
.project-badge{position:absolute;top:8px;right:8px;padding:4px 8px;background:rgba(0,0,0,0.6);backdrop-filter:blur(10px);border-radius:8px;font-size:9px;font-weight:900;color:#fff;letter-spacing:0.5px}
.project-info{padding:10px 12px}
.project-name{font-size:13px;font-weight:800;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.project-meta{font-size:10px;color:var(--sub);margin-top:4px;font-weight:600}
.project-delete{position:absolute;top:6px;left:6px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,0.6);backdrop-filter:blur(10px);border:none;color:#ff453a;display:flex;align-items:center;justify-content:center;z-index:2}
.project-delete svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.5}

/* Templates */
.templates-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:0 20px calc(var(--sab) + 100px)}
.template-card{background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:16px;overflow:hidden;cursor:pointer;transition:transform 0.2s;position:relative}
.template-card:active{transform:scale(0.96)}
.template-thumb{aspect-ratio:9/16;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.template-preview-text{font-size:16px;font-weight:900;color:#fff;text-shadow:0 4px 20px currentColor;padding:8px;text-align:center}
.template-badge{position:absolute;top:8px;right:8px;padding:4px 8px;background:rgba(255,255,255,0.15);backdrop-filter:blur(10px);border-radius:8px;font-size:9px;font-weight:900;color:#fff}
.template-info{padding:8px 10px}
.template-name{font-size:11px;font-weight:800;color:#fff;text-align:center}

/* Empty State */
.empty-state{text-align:center;padding:60px 20px calc(var(--sab) + 100px);color:var(--sub)}
.empty-state svg{width:60px;height:60px;stroke:var(--sub);fill:none;stroke-width:1.2;opacity:0.5;margin-bottom:16px}
.empty-title{font-size:15px;font-weight:800;color:#fff;margin-bottom:6px}
.empty-text{font-size:12px;line-height:1.6;max-width:260px;margin:0 auto}

/* Bottom Nav */
.bottom-nav{position:fixed;bottom:calc(var(--sab) + 12px);left:50%;transform:translateX(-50%);display:flex;align-items:center;justify-content:space-around;background:rgba(28,28,34,0.85);backdrop-filter:blur(40px) saturate(180%);border:1px solid rgba(255,255,255,0.12);border-radius:30px;padding:8px 6px;width:calc(100% - 32px);max-width:420px;z-index:100;box-shadow:0 20px 60px rgba(0,0,0,0.6)}
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;background:none;border:none;color:rgba(255,255,255,0.5);font-size:9px;font-weight:800;border-radius:22px;font-family:inherit;transition:all 0.25s}
.bnav-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2}
.bnav-btn.active{color:#fff;background:linear-gradient(135deg,#bf5af2,#0a84ff);box-shadow:0 6px 18px rgba(191,90,242,0.5)}

/* Modals */
.modal{position:fixed;inset:0;z-index:9999;display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.modal-back{position:absolute;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(10px)}
.modal-box{position:relative;width:100%;max-width:480px;background:rgba(20,20,28,0.95);backdrop-filter:blur(40px);border-top-left-radius:28px;border-top-right-radius:28px;border-top:1px solid rgba(255,255,255,0.12);padding:20px 22px calc(var(--sab) + 24px);animation:slideUp 0.35s cubic-bezier(0.16,1,0.3,1)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.handle-bar{width:40px;height:4px;background:rgba(255,255,255,0.25);border-radius:4px;margin:0 auto 18px}
.modal-title{font-size:18px;font-weight:900;text-align:center;margin-bottom:6px}
.modal-sub{font-size:12px;color:var(--sub);text-align:center;margin-bottom:20px;line-height:1.6}
.modal-input{width:100%;padding:16px;background:rgba(255,255,255,0.06);border:1.5px solid var(--border);border-radius:14px;color:#fff;font-size:16px;font-weight:600;outline:none;font-family:inherit;margin-bottom:14px;-webkit-user-select:text;user-select:text}
.modal-input:focus{border-color:var(--accent);background:rgba(10,132,255,0.08)}
.modal-btn{width:100%;padding:16px;background:linear-gradient(135deg,#bf5af2,#0a84ff);color:#fff;border:none;border-radius:14px;font-size:15px;font-weight:900;font-family:inherit;box-shadow:0 10px 30px rgba(191,90,242,0.4);display:flex;align-items:center;justify-content:center;gap:10px}
.modal-btn.ghost{background:rgba(255,255,255,0.08);box-shadow:none;margin-top:10px}

/* Toast */
.toast{position:fixed;top:calc(var(--sat) + 60px);left:50%;transform:translateX(-50%) scale(0.9);padding:10px 20px;background:rgba(60,60,67,0.95);backdrop-filter:blur(40px);color:#fff;font-size:13px;font-weight:700;border-radius:20px;z-index:99999;opacity:0;transition:all 0.25s cubic-bezier(0.16,1,0.3,1);pointer-events:none;white-space:nowrap;box-shadow:0 8px 32px rgba(0,0,0,0.4)}
.toast.show{opacity:1;transform:translateX(-50%) scale(1)}
.toast.success{background:rgba(48,209,88,0.95)}
.toast.error{background:rgba(255,69,58,0.95)}

/* Loader */
.loader{position:fixed;inset:0;z-index:99999;background:rgba(7,7,13,0.95);backdrop-filter:blur(20px);display:none;align-items:center;justify-content:center;flex-direction:column;gap:20px}
.loader.show{display:flex}
.spinner{width:50px;height:50px;border:3px solid rgba(255,255,255,0.1);border-top-color:#bf5af2;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-text{font-size:13px;font-weight:700;color:var(--sub)}

.hidden{display:none!important}
</style>
</head>
<body>

<div class="bg-ambient">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>

<!-- ===== SCREEN 1: LOGIN ===== -->
<div class="screen active" id="screenLogin">
  <div class="logo-wrap">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
    </div>
    <div class="logo-title">dk.llyric</div>
    <div class="logo-sub">استوديو الكلمات الحركية</div>
  </div>

  <div class="auth-form">
    <div class="auth-tabs">
      <button class="auth-tab active" data-auth="login" onclick="switchAuth('login')">تسجيل دخول</button>
      <button class="auth-tab" data-auth="signup" onclick="switchAuth('signup')">حساب جديد</button>
    </div>

    <div class="auth-error" id="authError"></div>

    <div class="auth-field" id="fieldName" style="display:none">
      <label class="auth-label">الاسم الكامل</label>
      <input type="text" class="auth-input" id="inputName" placeholder="اسمك">
    </div>
    <div class="auth-field">
      <label class="auth-label">البريد الإلكتروني</label>
      <input type="email" class="auth-input" id="inputEmail" placeholder="example@mail.com" autocomplete="email" inputmode="email">
    </div>
    <div class="auth-field">
      <label class="auth-label">كلمة المرور</label>
      <input type="password" class="auth-input" id="inputPassword" placeholder="••••••••" autocomplete="current-password" inputmode="text">
    </div>

    <button class="auth-btn" id="authSubmit" onclick="handleAuth()">
      <svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
      <span id="authBtnText">دخول</span>
    </button>

    <div class="auth-divider">أو</div>

    <button class="auth-btn ghost" onclick="handleGuest()" style="background:rgba(255,255,255,0.08);box-shadow:none">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      الدخول كضيف
    </button>
  </div>
</div>

<!-- ===== SCREEN 2: DASHBOARD ===== -->
<div class="screen" id="screenDash">
  <div class="dash-top">
    <div class="avatar" id="userAvatar">?</div>
    <div class="dash-title">
      <div class="dash-greeting">مرحباً بك</div>
      <div class="dash-name" id="userName">مستخدم</div>
    </div>
    <button class="bnav-btn" onclick="handleLogout()" style="background:rgba(255,69,58,0.15);border-radius:50%;width:44px;height:44px;flex:0 0 44px">
      <svg viewBox="0 0 24 24" style="width:18px;height:18px;stroke:#ff453a"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </button>
  </div>

  <div class="dash-stats">
    <div class="stat-card">
      <div class="stat-value" id="statProjects">0</div>
      <div class="stat-label">مشروع</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="statTemplates">12+</div>
      <div class="stat-label">قالب</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">∞</div>
      <div class="stat-label">إبداع</div>
    </div>
  </div>

  <button class="new-project-btn" onclick="openNewProject()">
    <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    مشروع جديد
  </button>

  <div class="dash-tabs">
    <button class="dash-tab active" data-dashtab="projects" onclick="switchDashTab('projects')">مشاريعي</button>
    <button class="dash-tab" data-dashtab="templates" onclick="switchDashTab('templates')">القوالب</button>
  </div>

  <div id="projectsContainer">
    <div id="projectsList" class="projects-grid"></div>
    <div id="projectsEmpty" class="empty-state hidden">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      <div class="empty-title">ما كاينش مشاريع بعد</div>
      <div class="empty-text">ابدأ مشروع جديد وشوف الإبداع ديالك</div>
    </div>
  </div>

  <div id="templatesContainer" class="hidden">
    <div id="templatesList" class="templates-grid"></div>
  </div>
</div>

<!-- ===== NEW PROJECT MODAL ===== -->
<div class="modal" id="newProjectModal">
  <div class="modal-back" onclick="closeNewProject()"></div>
  <div class="modal-box">
    <div class="handle-bar"></div>
    <h3 class="modal-title">مشروع جديد</h3>
    <p class="modal-sub">أدخل اسم المشروع باش تبدا</p>
    <input type="text" class="modal-input" id="newProjectName" placeholder="مثال: أغنية الشتاء">
    <button class="modal-btn" onclick="createProject()">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
      إنشاء
    </button>
    <button class="modal-btn ghost" onclick="closeNewProject()">إلغاء</button>
  </div>
</div>

<!-- Bottom Nav -->
<nav class="bottom-nav" id="bottomNav" style="display:none">
  <button class="bnav-btn active" data-nav="home" onclick="switchDashTab('projects')">
    <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    <span>الرئيسية</span>
  </button>
  <button class="bnav-btn" data-nav="templates" onclick="switchDashTab('templates')">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
    <span>القوالب</span>
  </button>
  <button class="bnav-btn" data-nav="new" onclick="openNewProject()">
    <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    <span>جديد</span>
  </button>
</nav>

<!-- Loader -->
<div class="loader" id="loader">
  <div class="spinner"></div>
  <div class="loader-text" id="loaderText">جاري التحميل...</div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   dk.llyric — Dashboard System v1
   ============================================================ */
var firebaseConfig = {
  apiKey: "AIzaSyC_yjHpXcygeUcuMKqqr-FH_35p32TZQbE",
  authDomain: "dk-llyric.firebaseapp.com",
  projectId: "dk-llyric",
  storageBucket: "dk-llyric.firebasestorage.app",
  messagingSenderId: "186577310307",
  appId: "1:186577310307:web:8c49fc23dcf1d312911e56"
};

var _fb = { ready:false, user:null, db:null, isGuest:false };
var _currentAuth = 'login';
var _currentTab = 'projects';
var _projects = [];
var _templates = [];

/* ===== TEMPLATES (built-in) ===== */
var BUILTIN_TEMPLATES = [
  { id:'neon',   name:'نيون أزرق',     color:'#0a84ff', glow:40, font:'Cairo',    preset:'neon',     text:'كلماتك هنا' },
  { id:'gold',   name:'ذهبي فاخر',    color:'#ffd60a', glow:50, font:'Tajawal',  preset:'gold',     text:'كلماتك هنا' },
  { id:'pink',   name:'رومانسي وردي', color:'#ff2d92', glow:45, font:'Cairo',    preset:'romantic', text:'كلماتك هنا' },
  { id:'purple', name:'سينمائي بنفسجي',color:'#bf5af2', glow:35, font:'Reem Kufi',preset:'cinema',   text:'كلماتك هنا' },
  { id:'white',  name:'أبيض بسيط',   color:'#ffffff', glow:15, font:'Inter',    preset:'minimal',  text:'كلماتك هنا' },
  { id:'fire',   name:'نار أحمر',    color:'#ff453a', glow:55, font:'Almarai',  preset:'fire',     text:'كلماتك هنا' },
  { id:'green',  name:'أخضر مضيء',   color:'#30d158', glow:45, font:'Cairo',    preset:'neon',     text:'كلماتك هنا' },
  { id:'cyan',   name:'سماوي',       color:'#00d4ff', glow:50, font:'Tajawal',  preset:'neon',     text:'كلماتك هنا' },
  { id:'orange', name:'برتقالي دافي', color:'#ff9500', glow:45, font:'Almarai',  preset:'fire',     text:'كلماتك هنا' },
  { id:'violet', name:'بنفسجي غامق', color:'#a855f7', glow:40, font:'Reem Kufi',preset:'cinema',   text:'كلماتك هنا' },
  { id:'lime',   name:'ليموني',      color:'#d4ff00', glow:55, font:'Inter',    preset:'neon',     text:'كلماتك هنا' },
  { id:'red',    name:'أحمر ناعم',   color:'#ff375f', glow:40, font:'Cairo',    preset:'romantic', text:'كلماتك هنا' }
];

/* ===== INIT FIREBASE ===== */
try {
  if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  _fb.db = firebase.firestore();
  firebase.auth().onAuthStateChanged(function(u){
    _fb.user = u;
    _fb.ready = true;
    if(u){
      console.log('✅ Logged in:', u.email || u.uid);
      showScreen('dash');
      loadUserProfile();
      loadProjects();
    } else {
      console.log('👤 Guest mode');
      showScreen('login');
    }
  });
} catch(e){ console.error(e); }

/* ===== UI UTILS ===== */
function $(id){ return document.getElementById(id); }
function showScreen(name){
  document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('active'); });
  $('screen' + (name === 'login' ? 'Login' : 'Dash')).classList.add('active');
  $('bottomNav').style.display = (name === 'dash') ? 'flex' : 'none';
}
function showLoader(text){
  $('loaderText').textContent = text || 'جاري التحميل...';
  $('loader').classList.add('show');
}
function hideLoader(){ $('loader').classList.remove('show'); }
var _toastTimer = null;
function toast(msg, type){
  var t = $('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2200);
}
function showAuthError(msg){
  var el = $('authError');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(function(){ el.classList.remove('show'); }, 4000);
}

/* ===== AUTH ===== */
function switchAuth(mode){
  _currentAuth = mode;
  document.querySelectorAll('.auth-tab').forEach(function(t){
    t.classList.toggle('active', t.dataset.auth === mode);
  });
  $('fieldName').style.display = (mode === 'signup') ? 'block' : 'none';
  $('authBtnText').textContent = (mode === 'signup') ? 'إنشاء حساب' : 'دخول';
}

async function handleAuth(){
  var email = $('inputEmail').value.trim();
  var pass = $('inputPassword').value;
  var name = $('inputName').value.trim();
  
  if(!email || !pass){ showAuthError('خاصك تكتب البريد وكلمة المرور'); return; }
  if(pass.length < 6){ showAuthError('كلمة المرور خاصها 6 أحرف على الأقل'); return; }
  if(_currentAuth === 'signup' && !name){ showAuthError('خاصك تكتب الاسم'); return; }
  
  $('authSubmit').disabled = true;
  showLoader(_currentAuth === 'signup' ? 'جاري إنشاء الحساب...' : 'جاري الدخول...');
  
  try {
    if(_currentAuth === 'signup'){
      var cred = await firebase.auth().createUserWithEmailAndPassword(email, pass);
      await cred.user.updateProfile({ displayName: name });
      // Save profile
      await _fb.db.collection('users').doc(cred.user.uid).set({
        name: name,
        email: email,
        createdAt: Date.now()
      }, { merge: true });
      toast('تم إنشاء حسابك!', 'success');
    } else {
      await firebase.auth().signInWithEmailAndPassword(email, pass);
      toast('مرحباً بك!', 'success');
    }
    // The onAuthStateChanged will handle navigation
    hideLoader();
  } catch(err){
    hideLoader();
    var msg = 'خطأ غير معروف';
    if(err.code === 'auth/email-already-in-use') msg = 'البريد مستعمل من قبل';
    else if(err.code === 'auth/invalid-email') msg = 'البريد غير صحيح';
    else if(err.code === 'auth/weak-password') msg = 'كلمة المرور ضعيفة';
    else if(err.code === 'auth/user-not-found') msg = 'الحساب ما كاينش';
    else if(err.code === 'auth/wrong-password') msg = 'كلمة المرور غلط';
    else if(err.code === 'auth/invalid-credential') msg = 'البريد ولا كلمة المرور غلط';
    else if(err.code === 'auth/network-request-failed') msg = 'مشكل في الاتصال';
    else msg = err.message;
    showAuthError(msg);
  } finally {
    $('authSubmit').disabled = false;
  }
}

function handleGuest(){
  _fb.isGuest = true;
  _fb.user = { uid: 'guest_' + Date.now(), displayName: 'ضيف', email: '' };
  showScreen('dash');
  $('userName').textContent = 'ضيف';
  $('userAvatar').textContent = 'ض';
  loadGuestProjects();
  toast('مرحباً بك كضيف', 'success');
}

function handleLogout(){
  if(_fb.isGuest){
    _fb.isGuest = false;
    _fb.user = null;
    showScreen('login');
    return;
  }
  firebase.auth().signOut().then(function(){
    toast('تم الخروج', 'success');
    showScreen('login');
  });
}

/* ===== USER PROFILE ===== */
async function loadUserProfile(){
  if(!_fb.user) return;
  try {
    var doc = await _fb.db.collection('users').doc(_fb.user.uid).get();
    var name = _fb.user.displayName || _fb.user.email?.split('@')[0] || 'مستخدم';
    if(doc.exists && doc.data().name) name = doc.data().name;
    
    $('userName').textContent = name;
    $('userAvatar').textContent = name.charAt(0).toUpperCase();
  } catch(e){
    console.warn(e);
    $('userName').textContent = _fb.user.email?.split('@')[0] || 'مستخدم';
    $('userAvatar').textContent = '?';
  }
}

/* ===== PROJECTS ===== */
async function loadProjects(){
  if(!_fb.user) return;
  showLoader('جاري تحميل المشاريع...');
  try {
    var snap = await _fb.db.collection('projects')
      .where('userId', '==', _fb.user.uid)
      .orderBy('updatedAt', 'desc')
      .limit(50)
      .get();
    
    _projects = [];
    snap.forEach(function(doc){
      _projects.push({ id: doc.id, ...doc.data() });
    });
    
    renderProjects();
    $('statProjects').textContent = _projects.length;
    hideLoader();
  } catch(e){
    console.error(e);
    hideLoader();
    toast('فشل التحميل', 'error');
  }
}

function loadGuestProjects(){
  try {
    var raw = localStorage.getItem('dk_guest_projects');
    _projects = raw ? JSON.parse(raw) : [];
    renderProjects();
    $('statProjects').textContent = _projects.length;
  } catch(e){ _projects = []; }
}

function saveGuestProjects(){
  try {
    localStorage.setItem('dk_guest_projects', JSON.stringify(_projects));
    $('statProjects').textContent = _projects.length;
  } catch(e){}
}

function renderProjects(){
  var list = $('projectsList');
  var empty = $('projectsEmpty');
  list.innerHTML = '';
  
  if(!_projects.length){
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');
  
  _projects.forEach(function(p){
    var card = document.createElement('div');
    card.className = 'project-card';
    
    var thumbContent = '';
    if(p.bgImgUrl){
      thumbContent = '<img src="' + p.bgImgUrl + '" alt="">';
    } else if(p.bgVideoUrl){
      thumbContent = '<svg viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>';
    } else {
      thumbContent = '<svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>';
    }
    
    var wordCount = (p.data && p.data.words && p.data.words.length) || 0;
    var date = p.updatedAt ? new Date(p.updatedAt).toLocaleDateString('ar') : '';
    
    card.innerHTML = 
      '<div class="project-thumb">' + thumbContent +
        '<div class="project-thumb-overlay"></div>' +
        '<div class="project-badge">' + wordCount + ' كلمة</div>' +
      '</div>' +
      '<button class="project-delete" onclick="event.stopPropagation();deleteProject(\'' + p.id + '\')">' +
        '<svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>' +
      '</button>' +
      '<div class="project-info">' +
        '<div class="project-name">' + (p.name || 'بدون اسم') + '</div>' +
        '<div class="project-meta">' + date + '</div>' +
      '</div>';
    
    card.onclick = function(){ openProject(p.id); };
    list.appendChild(card);
  });
}

async function deleteProject(id){
  if(!confirm('واش متأكد من الحذف؟')) return;
  
  if(_fb.isGuest){
    _projects = _projects.filter(function(p){ return p.id !== id; });
    saveGuestProjects();
    renderProjects();
    toast('تم الحذف', 'success');
    return;
  }
  
  try {
    await _fb.db.collection('projects').doc(id).delete();
    _projects = _projects.filter(function(p){ return p.id !== id; });
    renderProjects();
    toast('تم الحذف', 'success');
  } catch(e){
    toast('فشل الحذف', 'error');
  }
}

function openProject(id){
  location.href = 'editor.html?project=' + id;
}

/* ===== NEW PROJECT ===== */
function openNewProject(){
  $('newProjectName').value = '';
  $('newProjectModal').classList.add('open');
  setTimeout(function(){ $('newProjectName').focus(); }, 300);
}
function closeNewProject(){
  $('newProjectModal').classList.remove('open');
}
async function createProject(){
  var name = $('newProjectName').value.trim();
  if(!name){ toast('اكتب اسم المشروع', 'error'); return; }
  
  showLoader('جاري الإنشاء...');
  try {
    if(_fb.isGuest){
      var id = 'guest_' + Date.now();
      var proj = {
        id: id,
        name: name,
        userId: 'guest',
        type: 'kinetic',
        createdAt: Date.now(),
        updatedAt: Date.now(),
        data: {
          words: [],
          font: { family:'Cairo', size:36, color:'#0a84ff', glow:40, opacity:1, style:'glow' },
          anim: { in:'fade', out:'fade', inDur:300, outDur:200, special:'none' },
          bpm: 116, kick: 50, shake: 6, particles: 50,
          canvasRatio: '9:16',
          preset: 'neon',
          beatEnabled: true,
          kineticEnabled: true,
          wordPulseEnabled: true
        }
      };
      _projects.unshift(proj);
      saveGuestProjects();
      renderProjects();
      closeNewProject();
      hideLoader();
      toast('تم إنشاء المشروع', 'success');
      setTimeout(function(){ location.href = 'editor.html?project=' + id + '&guest=1'; }, 400);
      return;
    }
    
    var docRef = _fb.db.collection('projects').doc();
    await docRef.set({
      userId: _fb.user.uid,
      userEmail: _fb.user.email || '',
      type: 'kinetic',
      name: name,
      createdAt: Date.now(),
      updatedAt: Date.now(),
      isPublic: false,
      data: {
        words: [],
        font: { family:'Cairo', size:36, color:'#0a84ff', glow:40, opacity:1, style:'glow' },
        anim: { in:'fade', out:'fade', inDur:300, outDur:200, special:'none' },
        bpm: 116, kick: 50, shake: 6, particles: 50,
        canvasRatio: '9:16',
        preset: 'neon',
        beatEnabled: true,
        kineticEnabled: true,
        wordPulseEnabled: true
      }
    });
    
    closeNewProject();
    hideLoader();
    toast('تم إنشاء المشروع', 'success');
    setTimeout(function(){ location.href = 'editor.html?project=' + docRef.id; }, 400);
  } catch(e){
    console.error(e);
    hideLoader();
    toast('فشل الإنشاء: ' + e.message, 'error');
  }
}

/* ===== TABS ===== */
function switchDashTab(tab){
  _currentTab = tab;
  document.querySelectorAll('.dash-tab').forEach(function(t){
    t.classList.toggle('active', t.dataset.dashtab === tab);
  });
  document.querySelectorAll('.bnav-btn').forEach(function(b){
    b.classList.toggle('active', b.dataset.nav === (tab === 'templates' ? 'templates' : 'home'));
  });
  $('projectsContainer').classList.toggle('hidden', tab !== 'projects');
  $('templatesContainer').classList.toggle('hidden', tab !== 'templates');
  
  if(tab === 'templates') renderTemplates();
}

/* ===== TEMPLATES ===== */
function renderTemplates(){
  var list = $('templatesList');
  if(list.children.length) return;
  
  list.innerHTML = '';
  BUILTIN_TEMPLATES.forEach(function(t){
    var card = document.createElement('div');
    card.className = 'template-card';
    
    card.innerHTML = 
      '<div class="template-thumb" style="background:linear-gradient(135deg,rgba(10,10,20,0.95),rgba(30,20,50,0.95))">' +
        '<div class="template-preview-text" style="color:' + t.color + ';text-shadow:0 0 20px ' + t.color + ',0 0 40px ' + t.color + '">' + t.text + '</div>' +
        '<div class="template-badge">' + t.font + '</div>' +
      '</div>' +
      '<div class="template-info">' +
        '<div class="template-name">' + t.name + '</div>' +
      '</div>';
    
    card.onclick = function(){ useTemplate(t); };
    list.appendChild(card);
  });
}

async function useTemplate(t){
  showLoader('جاري تحضير القالب...');
  try {
    var projectData = {
      name: 'مشروع ' + t.name,
      type: 'kinetic',
      data: {
        words: [
          { text: t.text, start: 1, duration: 3 }
        ],
        font: { family: t.font, size: 36, color: t.color, glow: t.glow, opacity: 1, style: 'glow' },
        anim: { in: 'fade', out: 'fade', inDur: 300, outDur: 200, special: 'none' },
        bpm: 116, kick: 50, shake: 6, particles: 50,
        canvasRatio: '9:16',
        preset: t.preset,
        beatEnabled: true,
        kineticEnabled: true,
        wordPulseEnabled: true
      }
    };
    
    if(_fb.isGuest){
      var id = 'guest_' + Date.now();
      projectData.id = id;
      projectData.userId = 'guest';
      projectData.createdAt = Date.now();
      projectData.updatedAt = Date.now();
      _projects.unshift(projectData);
      saveGuestProjects();
      hideLoader();
      toast('تم التحضير', 'success');
      setTimeout(function(){ location.href = 'editor.html?project=' + id + '&guest=1'; }, 400);
      return;
    }
    
    var docRef = _fb.db.collection('projects').doc();
    await docRef.set({
      ...projectData,
      userId: _fb.user.uid,
      userEmail: _fb.user.email || '',
      createdAt: Date.now(),
      updatedAt: Date.now(),
      isPublic: false
    });
    
    hideLoader();
    toast('تم التحضير', 'success');
    setTimeout(function(){ location.href = 'editor.html?project=' + docRef.id; }, 400);
  } catch(e){
    console.error(e);
    hideLoader();
    toast('فشل', 'error');
  }
}

/* ===== ENTER KEY ===== */
$('inputPassword').addEventListener('keydown', function(e){
  if(e.key === 'Enter') handleAuth();
});
$('newProjectName').addEventListener('keydown', function(e){
  if(e.key === 'Enter') createProject();
});

console.log('✅ Dashboard loaded');
</script>
</body>
</html>
