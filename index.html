<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>dk.llyric — استوديو الكلمات</title>
<meta name="theme-color" content="#06060a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="dk.llyric">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;700;900&family=Almarai:wght@400;700;800&family=Reem+Kufi:wght@400;700&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#06060a;
  --bg2:#0a0a14;
  --card:rgba(255,255,255,0.04);
  --card2:rgba(255,255,255,0.07);
  --text:#fff;
  --sub:#8e8e93;
  --accent:#5b8dff;
  --accent2:#8b5cf6;
  --pink:#ec4899;
  --success:#22c55e;
  --danger:#ef4444;
  --border:rgba(255,255,255,0.08);
  --border2:rgba(255,255,255,0.15);
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);
  --sar:env(safe-area-inset-right,0px);
  --grad:linear-gradient(135deg,#5b8dff,#8b5cf6);
  --grad2:linear-gradient(135deg,#8b5cf6,#ec4899);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
html,body{background:var(--bg);color:var(--text);font-family:Cairo,-apple-system,BlinkMacSystemFont,sans-serif;overflow-x:hidden;height:100dvh;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
body{position:fixed;width:100%;-webkit-touch-callout:none}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;border:none;background:none;color:inherit}

/* Ambient */
.ambient{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(110px);opacity:0.5;animation:orbFloat 22s ease-in-out infinite}
.orb-1{width:340px;height:340px;background:#5b8dff;top:-100px;right:-100px}
.orb-2{width:300px;height:300px;background:#ec4899;bottom:-80px;left:-80px;animation-delay:-7s}
.orb-3{width:280px;height:280px;background:#8b5cf6;top:45%;left:40%;animation-delay:-14s}
@keyframes orbFloat{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(40px,-50px) scale(1.15)}66%{transform:translate(-40px,40px) scale(0.9)}}

/* Screens */
.screen{display:none;flex-direction:column;height:100dvh;overflow-y:auto;position:relative;z-index:1;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.screen.active{display:flex}

/* ===== LOGIN ===== */
#screenLogin{justify-content:center;align-items:center;padding:calc(var(--sat) + 40px) 24px calc(var(--sab) + 40px)}
.login-wrap{width:100%;max-width:440px}
.brand{text-align:center;margin-bottom:44px}
.brand-icon{width:96px;height:96px;margin:0 auto 24px;border-radius:28px;background:var(--grad);display:flex;align-items:center;justify-content:center;box-shadow:0 24px 70px rgba(91,141,255,0.5);position:relative;overflow:hidden}
.brand-icon::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.3),transparent 60%);pointer-events:none}
.brand-icon svg{width:52px;height:52px;stroke:#fff;fill:none;stroke-width:2.2;position:relative;z-index:1}
.brand-title{font-size:38px;font-weight:900;background:linear-gradient(135deg,#fff,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-1.5px;line-height:1}
.brand-sub{font-size:14px;color:var(--sub);margin-top:12px;font-weight:500;letter-spacing:0.3px}

.auth-card{background:rgba(255,255,255,0.03);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);border:1px solid var(--border);border-radius:26px;padding:26px 22px;box-shadow:0 20px 60px rgba(0,0,0,0.4)}
.auth-toggle{display:flex;gap:4px;padding:4px;background:rgba(0,0,0,0.4);border-radius:14px;margin-bottom:24px}
.auth-toggle button{flex:1;padding:11px;color:var(--sub);font-size:13px;font-weight:700;border-radius:10px;transition:all 0.25s}
.auth-toggle button.active{background:var(--grad);color:#fff;box-shadow:0 6px 18px rgba(91,141,255,0.4)}
.auth-field{margin-bottom:14px;position:relative}
.auth-label{display:block;font-size:11px;font-weight:800;color:var(--sub);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:8px}
.auth-input{width:100%;padding:16px 18px;background:rgba(255,255,255,0.05);border:1.5px solid var(--border);border-radius:14px;color:#fff;font-size:16px;font-weight:600;outline:none;font-family:inherit;transition:all 0.2s;-webkit-user-select:text;user-select:text}
.auth-input::placeholder{color:rgba(255,255,255,0.25)}
.auth-input:focus{border-color:var(--accent);background:rgba(91,141,255,0.08);box-shadow:0 0 0 4px rgba(91,141,255,0.1)}
.auth-submit{width:100%;padding:17px;background:var(--grad);color:#fff;border-radius:15px;font-size:15px;font-weight:900;margin-top:10px;box-shadow:0 12px 36px rgba(91,141,255,0.4);transition:transform 0.15s;display:flex;align-items:center;justify-content:center;gap:10px;font-family:inherit}
.auth-submit:active{transform:scale(0.97)}
.auth-submit:disabled{opacity:0.5;pointer-events:none}
.auth-submit svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.5}
.auth-error{padding:12px 14px;background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.3);color:#f87171;border-radius:12px;font-size:12.5px;font-weight:600;margin-bottom:14px;display:none}
.auth-error.show{display:block;animation:shake 0.4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.auth-divider{display:flex;align-items:center;gap:14px;margin:20px 0;color:var(--sub);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1px}
.auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--border)}
.auth-guest{width:100%;padding:15px;background:rgba(255,255,255,0.06);border:1.5px solid var(--border);color:#fff;border-radius:15px;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px;transition:all 0.2s;font-family:inherit}
.auth-guest:active{transform:scale(0.97);background:rgba(255,255,255,0.1)}
.auth-guest svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2}

/* ===== DASHBOARD ===== */
#screenDash{padding-top:0}
.dash-header{padding:calc(var(--sat) + 20px) 22px 16px;display:flex;align-items:center;gap:14px}
.avatar{width:52px;height:52px;border-radius:16px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;color:#fff;flex-shrink:0;box-shadow:0 8px 24px rgba(91,141,255,0.4);position:relative}
.avatar::after{content:'';position:absolute;bottom:-2px;right:-2px;width:14px;height:14px;background:var(--success);border:3px solid var(--bg);border-radius:50%}
.dash-header-info{flex:1;min-width:0}
.dash-hi{font-size:12px;color:var(--sub);font-weight:700;letter-spacing:0.5px}
.dash-user{font-size:22px;font-weight:900;color:#fff;letter-spacing:-0.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dash-action{width:44px;height:44px;border-radius:14px;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.2s}
.dash-action:active{transform:scale(0.92);background:var(--card2)}
.dash-action svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2}

.stats{padding:0 22px 20px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px 12px;text-align:center;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--grad);opacity:0.8}
.stat-val{font-size:26px;font-weight:900;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1}
.stat-lbl{font-size:10px;color:var(--sub);font-weight:800;margin-top:6px;text-transform:uppercase;letter-spacing:0.5px}

.cta-btn{display:flex;align-items:center;justify-content:center;gap:12px;width:calc(100% - 44px);margin:0 22px 20px;padding:20px;background:var(--grad);color:#fff;border-radius:20px;font-size:16px;font-weight:900;box-shadow:0 16px 44px rgba(91,141,255,0.4);transition:transform 0.15s;font-family:inherit}
.cta-btn:active{transform:scale(0.97)}
.cta-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.5}

.tabs{padding:0 22px;margin-bottom:16px}
.tabs-inner{display:flex;gap:4px;padding:4px;background:rgba(0,0,0,0.35);border-radius:14px}
.tab{flex:1;padding:11px;color:var(--sub);font-size:13px;font-weight:800;border-radius:10px;transition:all 0.25s;font-family:inherit}
.tab.active{background:var(--card2);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,0.2)}

.projects-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:0 22px calc(var(--sab) + 120px)}
.proj{background:var(--card);border:1px solid var(--border);border-radius:18px;overflow:hidden;transition:transform 0.2s,box-shadow 0.2s;cursor:pointer;position:relative;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.proj:active{transform:scale(0.96)}
.proj-thumb{aspect-ratio:4/5;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(91,141,255,0.25),rgba(139,92,246,0.25))}
.proj-thumb img{width:100%;height:100%;object-fit:cover}
.proj-thumb svg{width:44px;height:44px;stroke:rgba(255,255,255,0.4);fill:none;stroke-width:1.5}
.proj-overlay{position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,0.7) 100%);pointer-events:none}
.proj-badge{position:absolute;top:10px;right:10px;padding:5px 10px;background:rgba(0,0,0,0.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:9px;font-size:10px;font-weight:900;color:#fff;letter-spacing:0.3px;display:flex;align-items:center;gap:4px}
.proj-badge svg{width:11px;height:11px;stroke:#fff;fill:none;stroke-width:2.5}
.proj-del{position:absolute;top:10px;left:10px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,0.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:center;transition:all 0.2s}
.proj-del:active{transform:scale(0.9);background:rgba(239,68,68,0.6)}
.proj-del svg{width:15px;height:15px;stroke:#ffb4b4;fill:none;stroke-width:2.5}
.proj-info{padding:12px 14px}
.proj-name{font-size:13px;font-weight:800;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-0.2px}
.proj-date{font-size:10.5px;color:var(--sub);margin-top:5px;font-weight:600}

.templates-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:0 22px calc(var(--sab) + 120px)}
.tpl{background:var(--card);border:1px solid var(--border);border-radius:18px;overflow:hidden;cursor:pointer;transition:transform 0.2s,box-shadow 0.2s;position:relative}
.tpl:active{transform:scale(0.96)}
.tpl-thumb{aspect-ratio:9/16;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.tpl-grad{position:absolute;inset:0;opacity:0.9}
.tpl-text{position:relative;font-size:17px;font-weight:900;padding:12px;text-align:center;line-height:1.3;z-index:1}
.tpl-tag{position:absolute;top:10px;right:10px;padding:4px 9px;background:rgba(0,0,0,0.6);backdrop-filter:blur(14px);border-radius:8px;font-size:9px;font-weight:900;color:#fff;z-index:2;letter-spacing:0.5px;text-transform:uppercase}
.tpl-info{padding:10px 12px}
.tpl-name{font-size:12px;font-weight:800;color:#fff;text-align:center;letter-spacing:-0.2px}

.empty{padding:80px 30px calc(var(--sab) + 120px);text-align:center;color:var(--sub)}
.empty svg{width:80px;height:80px;stroke:var(--sub);fill:none;stroke-width:1.2;opacity:0.35;margin-bottom:20px}
.empty-title{font-size:17px;font-weight:900;color:#fff;margin-bottom:8px}
.empty-text{font-size:13px;line-height:1.7;max-width:280px;margin:0 auto}

/* Bottom Nav */
.bnav{position:fixed;bottom:calc(var(--sab) + 14px);left:50%;transform:translateX(-50%);display:flex;align-items:center;justify-content:space-around;background:rgba(20,20,28,0.85);backdrop-filter:blur(50px) saturate(200%);-webkit-backdrop-filter:blur(50px) saturate(200%);border:1px solid var(--border2);border-radius:32px;padding:8px 6px;width:calc(100% - 32px);max-width:420px;z-index:100;box-shadow:0 24px 60px rgba(0,0,0,0.7);transition:opacity 0.25s,transform 0.25s}
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;color:rgba(255,255,255,0.5);font-size:9.5px;font-weight:800;border-radius:24px;font-family:inherit;transition:all 0.25s;letter-spacing:0.3px}
.bnav-btn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2.2}
.bnav-btn.active{color:#fff;background:var(--grad);box-shadow:0 8px 22px rgba(91,141,255,0.5);transform:translateY(-1px)}

/* Modal */
.modal{position:fixed;inset:0;z-index:9999;display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.modal-back{position:absolute;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);animation:fadeIn 0.2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-box{position:relative;width:100%;max-width:500px;background:rgba(20,20,26,0.96);backdrop-filter:blur(50px);-webkit-backdrop-filter:blur(50px);border-top-left-radius:32px;border-top-right-radius:32px;border-top:1px solid var(--border2);padding:16px 24px calc(var(--sab) + 28px);animation:slideUp 0.4s cubic-bezier(0.16,1,0.3,1)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.handle{width:44px;height:5px;background:rgba(255,255,255,0.3);border-radius:5px;margin:0 auto 20px}
.modal-title{font-size:20px;font-weight:900;text-align:center;margin-bottom:6px;letter-spacing:-0.3px}
.modal-sub{font-size:13px;color:var(--sub);text-align:center;margin-bottom:22px;line-height:1.6;font-weight:500}
.modal-input{width:100%;padding:17px;background:rgba(255,255,255,0.05);border:1.5px solid var(--border);border-radius:15px;color:#fff;font-size:16px;font-weight:700;outline:none;font-family:inherit;margin-bottom:14px;transition:all 0.2s;-webkit-user-select:text;user-select:text}
.modal-input::placeholder{color:rgba(255,255,255,0.25);font-weight:600}
.modal-input:focus{border-color:var(--accent);background:rgba(91,141,255,0.08);box-shadow:0 0 0 4px rgba(91,141,255,0.1)}
.modal-btn{width:100%;padding:16px;background:var(--grad);color:#fff;border-radius:15px;font-size:15px;font-weight:900;box-shadow:0 12px 36px rgba(91,141,255,0.4);display:flex;align-items:center;justify-content:center;gap:10px;font-family:inherit;transition:transform 0.15s}
.modal-btn:active{transform:scale(0.97)}
.modal-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.5}
.modal-btn.ghost{background:rgba(255,255,255,0.06);box-shadow:none;margin-top:10px;color:#fff}

/* Toast */
.toast{position:fixed;top:calc(var(--sat) + 70px);left:50%;transform:translateX(-50%) translateY(-20px) scale(0.9);padding:12px 22px;background:rgba(40,40,48,0.95);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);color:#fff;font-size:13px;font-weight:700;border-radius:22px;z-index:99999;opacity:0;transition:all 0.3s cubic-bezier(0.16,1,0.3,1);pointer-events:none;white-space:nowrap;box-shadow:0 12px 40px rgba(0,0,0,0.5);border:1px solid var(--border2)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
.toast.success{background:rgba(34,197,94,0.95)}
.toast.error{background:rgba(239,68,68,0.95)}

.loader{position:fixed;inset:0;z-index:99999;background:rgba(6,6,10,0.96);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);display:none;align-items:center;justify-content:center;flex-direction:column;gap:24px}
.loader.show{display:flex}
.spinner{width:56px;height:56px;border:3px solid rgba(255,255,255,0.08);border-top-color:#5b8dff;border-right-color:#8b5cf6;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-text{font-size:13px;font-weight:700;color:var(--sub);letter-spacing:0.3px}
.hidden{display:none!important}
</style>
</head>
<body>

<div class="ambient">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>

<!-- ===== LOGIN SCREEN ===== -->
<div class="screen active" id="screenLogin">
  <div class="login-wrap">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
      </div>
      <div class="brand-title">dk.llyric</div>
      <div class="brand-sub">استوديو الكلمات الحركية</div>
    </div>

    <div class="auth-card">
      <div class="auth-toggle">
        <button class="active" data-auth="login" onclick="switchAuth('login')">دخول</button>
        <button data-auth="signup" onclick="switchAuth('signup')">حساب جديد</button>
      </div>

      <div class="auth-error" id="authError"></div>

      <div class="auth-field" id="fieldName" style="display:none">
        <label class="auth-label">الاسم</label>
        <input type="text" class="auth-input" id="inputName" placeholder="اسمك الكامل" autocomplete="name">
      </div>
      <div class="auth-field">
        <label class="auth-label">البريد الإلكتروني</label>
        <input type="email" class="auth-input" id="inputEmail" placeholder="example@mail.com" autocomplete="email" inputmode="email">
      </div>
      <div class="auth-field">
        <label class="auth-label">كلمة المرور</label>
        <input type="password" class="auth-input" id="inputPassword" placeholder="••••••••" autocomplete="current-password">
      </div>

      <button class="auth-submit" id="authSubmit" onclick="handleAuth()">
        <svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        <span id="authBtnText">دخول</span>
      </button>

      <div class="auth-divider">أو</div>

      <button class="auth-guest" onclick="handleGuest()">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        الدخول كضيف
      </button>
    </div>
  </div>
</div>

<!-- ===== DASHBOARD SCREEN ===== -->
<div class="screen" id="screenDash">
  <div class="dash-header">
    <div class="avatar" id="userAvatar">?</div>
    <div class="dash-header-info">
      <div class="dash-hi">مرحباً بك</div>
      <div class="dash-user" id="userName">مستخدم</div>
    </div>
    <button class="dash-action" onclick="handleLogout()" title="خروج">
      <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </button>
  </div>

  <div class="stats">
    <div class="stat"><div class="stat-val" id="statProjects">0</div><div class="stat-lbl">مشروع</div></div>
    <div class="stat"><div class="stat-val">24</div><div class="stat-lbl">قالب</div></div>
    <div class="stat"><div class="stat-val">∞</div><div class="stat-lbl">إبداع</div></div>
  </div>

  <button class="cta-btn" onclick="openNewProject()">
    <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    مشروع جديد
  </button>

/* ===== UTILS ===== */
function $(id){ return document.getElementById(id); }
function showToast(msg, type){
  var t = $('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2200);
}
function showLoader(text){
  $('loaderText').textContent = text || 'جاري التحميل...';
  $('loader').classList.add('show');
}
function hideLoader(){ $('loader').classList.remove('show'); }
function showAuthError(msg){
  var el = $('authError');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(function(){ el.classList.remove('show'); }, 4500);
}
function showScreen(name){
  document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('active'); });
  $('screen' + (name === 'login' ? 'Login' : 'Dash')).classList.add('active');
  $('bottomNav').style.display = (name === 'dash') ? 'flex' : 'none';
}
function haptic(style){
  if(!navigator.vibrate) return;
  var p = { light:[5], medium:[12], heavy:[20], success:[10,50,15], error:[30,40,30] };
  try { navigator.vibrate(p[style] || p.light); } catch(e){}
}

/* ===== FIREBASE INIT ===== */
try {
  if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  _fb.db = firebase.firestore();
  firebase.auth().onAuthStateChanged(function(u){
    _fb.user = u;
    _fb.ready = true;
    if(u){
      console.log('✅ Logged:', u.email || u.uid);
      showScreen('dash');
      loadUserProfile();
      loadProjects();
    } else if(!_fb.isGuest){
      showScreen('login');
    }
  });
} catch(e){ console.error(e); }

/* ===== AUTH ===== */
function switchAuth(mode){
  _currentAuth = mode;
  document.querySelectorAll('.auth-toggle button').forEach(function(t){
    t.classList.toggle('active', t.dataset.auth === mode);
  });
  $('fieldName').style.display = (mode === 'signup') ? 'block' : 'none';
  $('authBtnText').textContent = (mode === 'signup') ? 'إنشاء حساب' : 'دخول';
  haptic('light');
}

async function handleAuth(){
  var email = $('inputEmail').value.trim();
  var pass = $('inputPassword').value;
  var name = $('inputName').value.trim();
  
  if(!email || !pass){ showAuthError('خاصك تكتب البريد وكلمة المرور'); haptic('error'); return; }
  if(pass.length < 6){ showAuthError('كلمة المرور خاصها 6 أحرف على الأقل'); haptic('error'); return; }
  if(_currentAuth === 'signup' && !name){ showAuthError('خاصك تكتب الاسم'); haptic('error'); return; }
  
  $('authSubmit').disabled = true;
  showLoader(_currentAuth === 'signup' ? 'جاري إنشاء الحساب...' : 'جاري الدخول...');
  haptic('medium');
  
  try {
    if(_currentAuth === 'signup'){
      var cred = await firebase.auth().createUserWithEmailAndPassword(email, pass);
      await cred.user.updateProfile({ displayName: name });
      await _fb.db.collection('users').doc(cred.user.uid).set({
        name: name, email: email, createdAt: Date.now()
      }, { merge: true });
      showToast('تم إنشاء حسابك!', 'success');
      haptic('success');
    } else {
      await firebase.auth().signInWithEmailAndPassword(email, pass);
      showToast('مرحباً بك!', 'success');
      haptic('success');
    }
    hideLoader();
  } catch(err){
    hideLoader();
    haptic('error');
    var msg = 'خطأ غير معروف';
    var codes = {
      'auth/email-already-in-use':'البريد مستعمل من قبل',
      'auth/invalid-email':'البريد غير صحيح',
      'auth/weak-password':'كلمة المرور ضعيفة',
      'auth/user-not-found':'الحساب ما كاينش',
      'auth/wrong-password':'كلمة المرور غلط',
      'auth/invalid-credential':'البريد ولا كلمة المرور غلط',
      'auth/network-request-failed':'مشكل في الاتصال'
    };
    msg = codes[err.code] || err.message;
    showAuthError(msg);
  } finally {
    $('authSubmit').disabled = false;
  }
}

function handleGuest(){
  _fb.isGuest = true;
  _fb.user = { uid:'guest_' + Date.now(), displayName:'ضيف', email:'' };
  showScreen('dash');
  $('userName').textContent = 'ضيف';
  $('userAvatar').textContent = 'ض';
  loadGuestProjects();
  showToast('مرحباً بك كضيف', 'success');
  haptic('light');
}

function handleLogout(){
  if(_fb.isGuest){
    _fb.isGuest = false;
    _fb.user = null;
    showScreen('login');
    return;
  }
  firebase.auth().signOut().then(function(){
    showToast('تم الخروج', 'success');
    haptic('light');
  });
}

/* ===== USER PROFILE ===== */
async function loadUserProfile(){
  if(!_fb.user) return;
  try {
    var doc = await _fb.db.collection('users').doc(_fb.user.uid).get();
    var name = _fb.user.displayName || (_fb.user.email ? _fb.user.email.split('@')[0] : 'مستخدم');
    if(doc.exists && doc.data().name) name = doc.data().name;
    $('userName').textContent = name;
    $('userAvatar').textContent = name.charAt(0).toUpperCase();
  } catch(e){
    var n = _fb.user.email ? _fb.user.email.split('@')[0] : 'مستخدم';
    $('userName').textContent = n;
    $('userAvatar').textContent = n.charAt(0).toUpperCase();
  }
}

/* ===== PROJECTS ===== */
async function loadProjects(){
  if(!_fb.user || _fb.isGuest) return;
  showLoader('جاري تحميل المشاريع...');
  try {
    var snap = await _fb.db.collection('projects')
      .where('userId', '==', _fb.user.uid)
      .orderBy('updatedAt', 'desc')
      .limit(60).get();
    _projects = [];
    snap.forEach(function(d){ _projects.push({ id:d.id, ...d.data() }); });
    renderProjects();
    $('statProjects').textContent = _projects.length;
    hideLoader();
  } catch(e){
    console.error(e);
    hideLoader();
    showToast('فشل التحميل', 'error');
  }
}

function loadGuestProjects(){
  try {
    var raw = localStorage.getItem('dk_guest_projects');
    _projects = raw ? JSON.parse(raw) : [];
    renderProjects();
    $('statProjects').textContent = _projects.length;
  } catch(e){ _projects = []; }
}

function saveGuestProjects(){
  try {
    localStorage.setItem('dk_guest_projects', JSON.stringify(_projects));
    $('statProjects').textContent = _projects.length;
  } catch(e){}
}

function renderProjects(){
  var list = $('projectsList');
  var empty = $('projectsEmpty');
  list.innerHTML = '';
  if(!_projects.length){
    empty.classList.remove('hidden');
    list.style.display = 'none';
    return;
  }
  empty.classList.add('hidden');
  list.style.display = 'grid';
  
  _projects.forEach(function(p){
    var card = document.createElement('div');
    card.className = 'proj';
    
    var thumbContent = '';
    if(p.bgImgUrl){
      thumbContent = '<img src="' + p.bgImgUrl + '" alt="" loading="lazy">';
    } else if(p.bgVideoUrl){
      thumbContent = '<svg viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>';
    } else {
      thumbContent = '<svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>';
    }
    
    var wc = (p.data && p.data.words && p.data.words.length) || 0;
    var date = p.updatedAt ? new Date(p.updatedAt).toLocaleDateString('ar-EG', {day:'numeric',month:'short'}) : '';
    
    card.innerHTML = 
      '<div class="proj-thumb">' +
        thumbContent +
        '<div class="proj-overlay"></div>' +
        '<div class="proj-badge">' +
          '<svg viewBox="0 0 24 24"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>' +
          wc +
        '</div>' +
      '</div>' +
      '<button class="proj-del" onclick="event.stopPropagation();deleteProject(\'' + p.id + '\')">' +
        '<svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>' +
      '</button>' +
      '<div class="proj-info">' +
        '<div class="proj-name">' + escapeHtml(p.name || 'بدون اسم') + '</div>' +
        '<div class="proj-date">' + date + '</div>' +
      '</div>';
    
    card.onclick = function(){ haptic('light'); openProject(p.id); };
    list.appendChild(card);
  });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

async function deleteProject(id){
  haptic('medium');
  if(!confirm('واش متأكد من الحذف؟')) return;
  
  if(_fb.isGuest){
    _projects = _projects.filter(function(p){ return p.id !== id; });
    saveGuestProjects();
    renderProjects();
    showToast('تم الحذف', 'success');
    return;
  }
  
  try {
    await _fb.db.collection('projects').doc(id).delete();
    _projects = _projects.filter(function(p){ return p.id !== id; });
    renderProjects();
    showToast('تم الحذف', 'success');
    haptic('success');
  } catch(e){
    showToast('فشل الحذف', 'error');
  }
}

function openProject(id){
  var url = 'editor.html?project=' + id;
  if(_fb.isGuest) url += '&guest=1';
  location.href = url;
}

/* ===== NEW PROJECT ===== */
function openNewProject(){
  haptic('light');
  $('newProjectName').value = '';
  $('newProjectModal').classList.add('open');
  setTimeout(function(){ $('newProjectName').focus(); }, 350);
}
function closeNewProject(){
  $('newProjectModal').classList.remove('open');
}

async function createProject(){
  var name = $('newProjectName').value.trim();
  if(!name){ showToast('اكتب اسم المشروع', 'error'); haptic('error'); return; }
  
  showLoader('جاري الإنشاء...');
  haptic('medium');
  
  var baseData = {
    words: [],
    font: { family:'Cairo', size:36, color:'#5b8dff', glow:40, opacity:1, style:'glow' },
    anim: { in:'fade', out:'fade', inDur:300, outDur:200, special:'none' },
    bpm: 116, kick: 50, shake: 6, particles: 50,
    canvasRatio: '9:16',
    preset: 'neon',
    beatEnabled: true,
    kineticEnabled: true,
    wordPulseEnabled: true,
    textY: 0.5,
    textScale: 1,
    textOffsetX: 0, textOffsetY: 0,
    bgOffsetX: 0, bgOffsetY: 0, bgScale: 1,
    bgOp: 40, bgBlur: 0
  };
  
  try {
    if(_fb.isGuest){
      var id = 'guest_' + Date.now();
      var proj = {
        id: id, name: name, userId: 'guest', type: 'kinetic',
        createdAt: Date.now(), updatedAt: Date.now(),
        data: baseData
      };
      _projects.unshift(proj);
      saveGuestProjects();
      renderProjects();
      closeNewProject();
      hideLoader();
      showToast('تم الإنشاء', 'success');
      haptic('success');
      setTimeout(function(){ location.href = 'editor.html?project=' + id + '&guest=1'; }, 350);
      return;
    }
    
    var docRef = _fb.db.collection('projects').doc();
    await docRef.set({
      userId: _fb.user.uid,
      userEmail: _fb.user.email || '',
      type: 'kinetic',
      name: name,
      createdAt: Date.now(),
      updatedAt: Date.now(),
      isPublic: false,
      data: baseData
    });
    
    closeNewProject();
    hideLoader();
    showToast('تم الإنشاء', 'success');
    haptic('success');
    setTimeout(function(){ location.href = 'editor.html?project=' + docRef.id; }, 350);
  } catch(e){
    console.error(e);
    hideLoader();
    showToast('فشل: ' + e.message, 'error');
    haptic('error');
  }
}

/* ===== TABS ===== */
function switchTab(tab){
  _currentTab = tab;
  haptic('light');
  document.querySelectorAll('.tab').forEach(function(t){
    t.classList.toggle('active', t.dataset.tab === tab);
  });
  document.querySelectorAll('.bnav-btn').forEach(function(b){
    var n = b.dataset.nav;
    b.classList.toggle('active', (tab === 'templates' && n === 'templates') || (tab === 'projects' && n === 'home'));
  });
  $('projectsWrap').classList.toggle('hidden', tab !== 'projects');
  $('templatesWrap').classList.toggle('hidden', tab !== 'templates');
  if(tab === 'templates') renderTemplates();
}

/* ===== TEMPLATES ===== */
function renderTemplates(){
  var list = $('templatesList');
  if(list.dataset.rendered === '1') return;
  list.dataset.rendered = '1';
  list.innerHTML = '';
  
  TEMPLATES.forEach(function(t){
    var card = document.createElement('div');
    card.className = 'tpl';
    
    var gradient = 'linear-gradient(135deg,' + hexA(t.color, 0.35) + ',' + hexA(t.color, 0.15) + ')';
    var textShadow = '0 0 24px ' + t.color + ',0 0 48px ' + t.color;
    
    card.innerHTML = 
      '<div class="tpl-thumb">' +
        '<div class="tpl-grad" style="background:' + gradient + '"></div>' +
        '<div class="tpl-text" style="color:' + t.color + ';text-shadow:' + textShadow + ';font-family:\'' + t.font + '\',Cairo,sans-serif">' + t.text + '</div>' +
        '<div class="tpl-tag">' + t.preset + '</div>' +
      '</div>' +
      '<div class="tpl-info">' +
        '<div class="tpl-name">' + t.name + '</div>' +
      '</div>';
    
    card.onclick = function(){ haptic('medium'); useTemplate(t); };
    list.appendChild(card);
  });
}

function hexA(hex, a){
  hex = hex.replace('#','');
  if(hex.length === 3) hex = hex.split('').map(function(c){ return c+c; }).join('');
  var r = parseInt(hex.substr(
