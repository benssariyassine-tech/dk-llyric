<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0a0a1a" />
<title>حرب البلدان</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%; overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  background: #0a0a1a; color: white;
  -webkit-user-select: none; user-select: none;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
::-webkit-scrollbar { width: 0; height: 0; }

/* ============ SCREENS ============ */
.screen {
  position: fixed; inset: 0;
  display: none; flex-direction: column;
  z-index: 1;
}
.screen.active { display: flex; }

/* ============ MENU ============ */
#menu-screen {
  background: radial-gradient(circle at 50% 30%, #2a1a4e 0%, #0a0a1a 70%);
  align-items: center; justify-content: center;
  padding: 30px 20px; z-index: 10;
}
.menu-emoji { font-size: 80px; text-align: center; margin-bottom: 10px; }
.menu-title {
  font-size: 38px; font-weight: 900; text-align: center;
  margin-bottom: 6px;
  background: linear-gradient(135deg, #ff3b30, #ff9500, #ffcc00);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.menu-sub { font-size: 14px; color: rgba(255,255,255,0.5); text-align: center; margin-bottom: 30px; }
.menu-section { width: 100%; max-width: 360px; margin-bottom: 20px; }
.menu-label { font-size: 12px; color: rgba(255,255,255,0.5); margin-bottom: 10px; text-align: center; letter-spacing: 1px; }
.menu-options { display: flex; gap: 8px; }
.menu-option {
  flex: 1; padding: 14px 6px; border-radius: 12px;
  background: rgba(255,255,255,0.08); border: 2px solid transparent;
  color: rgba(255,255,255,0.7); font-size: 14px; font-weight: 700;
  transition: all 0.2s; text-align: center;
}
.menu-option.active {
  background: linear-gradient(135deg, #ff3b30, #ff9500);
  color: white; border-color: rgba(255,255,255,0.3);
  box-shadow: 0 6px 20px rgba(255,59,48,0.4);
}
.play-btn {
  width: 100%; max-width: 360px; padding: 20px;
  background: linear-gradient(135deg, #ff3b30, #ff9500);
  border-radius: 16px; color: white; font-size: 20px; font-weight: 800;
  margin-top: 10px; box-shadow: 0 10px 30px rgba(255,59,48,0.5);
  display: flex; align-items: center; justify-content: center; gap: 10px;
}
.play-btn:active { transform: scale(0.97); }

/* ============ GAME ============ */
#game-screen { background: #0a0a1a; z-index: 5; }

.game-header {
  padding: 10px 12px 6px;
  display: flex; align-items: center; justify-content: space-between;
  background: rgba(0,0,0,0.6);
  flex-shrink: 0; z-index: 20;
  min-height: 56px;
}
.game-turn { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.08); padding: 6px 12px; border-radius: 18px; }
.turn-dot { width: 12px; height: 12px; border-radius: 50%; }
.turn-info { display: flex; flex-direction: column; }
.turn-label { font-size: 9px; color: rgba(255,255,255,0.5); }
.turn-name { font-size: 13px; font-weight: 700; }
.armies-badge {
  display: flex; align-items: center; gap: 6px;
  background: linear-gradient(135deg, #ff3b30, #ff9500);
  padding: 8px 14px; border-radius: 18px;
  font-weight: 800; font-size: 15px;
}

/* Map */
#map-container {
  flex: 1; position: relative;
  background: linear-gradient(180deg, #0a1628 0%, #0a0a1a 100%);
  overflow: hidden;
  min-height: 0;
}
#map-svg {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 1;
}
#territories {
  position: absolute; inset: 0;
  z-index: 2;
}

.territory {
  position: absolute;
  width: 56px; height: 56px;
  margin-left: -28px; margin-top: -28px;
  display: flex; flex-direction: column; align-items: center;
  z-index: 3;
  cursor: pointer;
}
.territory-circle {
  width: 50px; height: 50px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 900; color: white;
  border: 3px solid rgba(0,0,0,0.5);
  box-shadow: 0 4px 14px rgba(0,0,0,0.6), inset 0 2px 6px rgba(255,255,255,0.25);
  transition: transform 0.15s;
  pointer-events: none;
}
.territory:active .territory-circle { transform: scale(0.9); }
.territory-name {
  font-size: 10px; font-weight: 700;
  margin-top: 3px;
  text-shadow: 0 1px 4px rgba(0,0,0,0.95), 0 0 4px rgba(0,0,0,0.9);
  white-space: nowrap;
  pointer-events: none;
  color: white;
}
.territory.selected .territory-circle {
  animation: glow 1s infinite;
  transform: scale(1.15);
}
@keyframes glow {
  0%,100% { box-shadow: 0 0 0 3px #fff, 0 4px 14px rgba(0,0,0,0.6); }
  50% { box-shadow: 0 0 0 8px rgba(255,255,255,0.3), 0 0 24px rgba(255,255,255,0.8), 0 4px 14px rgba(0,0,0,0.6); }
}
.territory.attackable .territory-circle {
  animation: pulseRed 1s infinite;
}
@keyframes pulseRed {
  0%,100% { box-shadow: 0 0 0 0 rgba(255,50,50,0.9), {
 0 4px 14px rgba( 0,0,0,0.6); }
   flex50% { box-shadow: 0 0 0 12px rgba(255,50,50,0), 0 4px 14px rgba(0,0,0,0.6); }
}

/* Stats */
.stats-bar {
  position: absolute; top: 8px; left: 8px;
  display: flex; flex-direction: column; gap: 5px;
  background: rgba(0,0,0,0.6); padding: 6px 10px; border-radius: 10px;
  font-size: 11px; z-index: 15;
  backdrop-filter: blur(10px);
}
.stat-row { display: flex; align-items: center; gap: 6px; }
.stat-color { width: 10px; height: 10px; border-radius: 50%; }
.stat-name { font-weight: 600; }
.stat-count { font-weight: 800; color: #ffcc00; min-width: 16px; text-align: right; }

/* Footer */
.game-footer {
  padding: 10px 12px 16px;
  background: rgba(0,0,0,0.85);
  display: flex; gap: 8px; flex-shrink: 0;
  z-index: 20;
}
.footer-info {
  flex: 1; display: flex; align-items: center; gap: 8px;
  background: rgba(255,255,255,0.08);
  padding: 10px 14px; border-radius: 12px;
  font-size: 12px; color: rgba(255,255,255,0.85);
  min-width: 0;
}
#hint-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.footer-btn {
  padding: 12px 16px; border-radius: 12px;
  background: linear-gradient(135deg, #ff3b30, #ff9500);
  font-weight: 800; font-size: 13px; color: white;
  display: flex; align-items: center; gap: 6px;
  box-shadow: 0 4px 14px rgba(255,59,48,0.4);
  flex-shrink: 0;
}
.footer-btn:active { transform: scale(0.96); }

/* ============ BATTLE MODAL ============ */
#battle-modal {
  position: fixed; inset: 0; background: rgba(0,0,0,0.85);
  z-index: 100; display: none; align-items: center; justify-content: center;
  padding: 16px;
}
#battle-modal.show { display: flex; }
.battle-box {
  background: linear-gradient(180deg, #1a1a2e, #0a0a1a);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 20px; padding: 20px; width: 100%; max-width: 380px;
}
.battle-title { text-align: center; font-size: 20px; font-weight: 800; margin-bottom: 4px; }
.battle-sub { text-align: center; font-size: 12px; color: rgba(255,255,255,0.6); margin-bottom: 16px; }
.battle-sides { display: flex; gap: 10px; margin-bottom: 16px; }
.battle-side: 1; padding: 12px; border-radius: 14px;
  background: rgba(255,255,255,0.06);
  border: 2px solid rgba(255,255,255,0.1);
}
.battle-side.attacker { border-color: rgba(255,59,48,0.5); }
.battle-side.defender { border-color: rgba(0,122,255,0.5); }
.battle-side-label { font-size: 10px; color: rgba(255,255,255,0.5); margin-bottom: 3px; text-align: center; }
.battle-side-name { font-size: 14px; font-weight: 700; margin-bottom: 8px; text-align: center; }
.battle-dice { display: flex; gap: 4px; justify-content: center; min-height: 40px; align-items: center; flex-wrap: wrap; }
.die {
  width: 34px; height: 34px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 900;
  box-shadow: 0 3px 8px rgba(0,0,0,0.5);
}
.die.attacker { background: linear-gradient(135deg, #ff3b30, #ff6b5b); color: white; }
.die.defender { background: linear-gradient(135deg, #007aff, #4aa3ff); color: white; }
.battle-result { text-align: center; font-size: 14px; font-weight: 700; margin-bottom: 16px; min-height: 20px; color: #ffcc00; }
.battle-actions { display: flex; gap: 8px; }
.battle-btn {
  flex: 1; padding: 14px; border-radius: 12px;
  font-weight: 800; font-size: 15px;
}
.battle-btn:active { transform: scale(0.96); }
.battle-btn.attack { background: linear-gradient(135deg, #ff3b30, #ff9500); color: white; }
.battle-btn.cancel { background: rgba(255,255,255,0.12); color: white; }

/* ============ AI BANNER ============ */
#ai-overlay {
  position: fixed; top: 70px; left: 50%;
  transform: translateX(-50%);
  z-index: 90; display: none;
}
#ai-overlay.show { display: block; }
.ai-banner {
  padding: 10px 20px; border-radius: 16px;
  background: rgba(0,0,0,0.9);
  font-weight: 700; font-size: 14px;
  display: flex; align-items: center; gap: 10px;
  border: 2px solid rgba(255,255,255,0.2);
}
.ai-banner .dot {
  width: 10px; height: 10px; border-radius: 50%;
  animation: blink 1s infinite;
}
@keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

/* ============ END MODAL ============ */
#end-modal {
  position: fixed; inset: 0; background: rgba(0,0,0,0.9);
  z-index: 200; display: none; align-items: center; justify-content: center;
  padding: 20px;
}
#end-modal.show { display: flex; }
.end-box { text-align: center; max-width: 340px; width: 100%; }
.end-icon { font-size: 80px; margin-bottom: 16px; }
.end-title { font-size: 32px; font-weight: 900; margin-bottom: 8px; }
.end-title.win { color: #ffcc00; }
.end-title.lose { color: #ff3b30; }
.end-sub { font-size: 14px; color: rgba(255,255,255,0.7); margin-bottom: 24px; }
.end-btn {
  padding: 16px 32px; border-radius: 14px;
  background: linear-gradient(135deg, #ff3b30, #ff9500);
  font-weight: 800; font-size: 16px; color: white;
}

/* ============ TOAST ============ */
#toast {
  position: fixed; top: 70px; left: 50%;
  transform: translateX(-50%) translateY(-20px);
  background: rgba(0,0,0,0.95); color: white;
  padding: 12px 20px; border-radius: 30px;
  font-size: 13px; font-weight: 600;
  z-index: 300; opacity: 0;
  transition: all 0.3s;
  pointer-events: none; max-width: 90%;
  text-align: center;
  border: 1px solid rgba(255,255,255,0.15);
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ============ DEBUG ============ */
#debug {
  position: fixed; bottom: 4px; left: 4px; right: 4px;
  background: rgba(0,0,0,0.85); color: #0f0;
  font-family: monospace; font-size: 10px;
  padding: 4px 8px; border-radius: 4px;
  z-index: 999; display: none;
  max-height: 80px; overflow: auto;
}
#debug.show { display: block; }
</style>
</head>
<body>

<!-- ========== MENU ========== -->
<div id="menu-screen" class="screen active">
  <div class="menu-emoji">⚔️</div>
  <div class="menu-title">حرب البلدان</div>
  <div class="menu-sub">وحّد العالم • 20 دولة</div>

  <div class="menu-section">
    <div class="menu-label">عدد الأعداء</div>
    <div class="menu-options" data-group="enemies">
      <button class="menu-option active" data-value="1">1</button>
      <button class="menu-option" data-value="2">2</button>
      <button class="menu-option" data-value="3">3</button>
    </div>
  </div>

  <div class="menu-section">
    <div class="menu-label">الصعوبة</div>
    <div class="menu-options" data-group="difficulty">
      <button class="menu-option active" data-value="easy">سهل</button>
      <button class="menu-option" data-value="normal">عادي</button>
      <button class="menu-option" data-value="hard">صعب</button>
    </div>
  </div>

  <button class="play-btn" id="start-btn">▶ ابدأ الحرب</button>
</div>

<!-- ========== GAME ========== -->
<div id="game-screen" class="screen">
  <div class="game-header">
    <div class="game-turn">
      <div class="turn-dot" id="turn-dot"></div>
      <div class="turn-info">
        <div class="turn-label">الدور</div>
        <div class="turn-name" id="turn-name">-</div>
      </div>
    </div>
    <div class="armies-badge">🛡 <span id="armies-count">0</span></div>
  </div>

  <div id="map-container">
    <svg id="map-svg"></svg>
    <div id="territories"></div>
    <div class="stats-bar" id="stats-bar"></div>
  </div>

  <div class="game-footer">
    <div class="footer-info">💡 <span id="hint-text">اختر دولة</span></div>
    <button class="footer-btn" id="end-turn-btn">إنهاء ⏭</button>
  </div>
</div>

<!-- ========== BATTLE ========== -->
<div id="battle-modal">
  <div class="battle-box">
    <div class="battle-title">⚔️ معركة</div>
    <div class="battle-sub" id="battle-sub">-</div>
    <div class="battle-sides">
      <div class="battle-side attacker">
        <div class="battle-side-label">المهاجم</div>
        <div class="battle-side-name" id="atk-name">-</div>
        <div class="battle-dice" id="atk-dice"></div>
      </div>
      <div class="battle-side defender">
        <div class="battle-side-label">المدافع</div>
        <div class="battle-side-name" id="def-name">-</div>
        <div class="battle-dice" id="def-dice"></div>
      </div>
    </div>
    <div class="battle-result" id="battle-result"></div>
    <div class="battle-actions">
      <button class="battle-btn cancel" id="battle-cancel">انسحاب</button>
      <button class="battle-btn attack" id="battle-attack">🎲 هجوم</button>
    </div>
  </div>
</div>

<!-- ========== AI ========== -->
<div id="ai-overlay">
  <div class="ai-banner">
    <div class="dot"></div>
    <span id="ai-text">يفكر...</span>
  </div>
</div>

<!-- ========== END ========== -->
<div id="end-modal">
  <div class="end-box">
    <div class="end-icon" id="end-icon">🏆</div>
    <div class="end-title win" id="end-title">النصر!</div>
    <div class="end-sub" id="end-sub">-</div>
    <button class="end-btn" id="restart-btn">لعبة جديدة</button>
  </div>
</div>

<!-- ========== TOAST ========== -->
<div id="toast"></div>

<!-- ========== DEBUG ========== -->
<div id="debug"></div>

<script>
(function() {
'use strict';

// ============ DEBUG ============
var debugEl = document.getElementById('debug');
function log(msg) {
  console.log(msg);
  if (debugEl) {
    debugEl.textContent = '[' + new Date().toLocaleTimeString('ar-DZ') + '] ' + msg;
  }
}
window.addEventListener('error', function(e) {
  debugEl.classList.add('show');
  debugEl.textContent = 'ERROR: ' + e.message + ' @ ' + e.lineno;
  debugEl.style.color = '#f00';
});

log('Script started');

// ============ TERRITORIES ============
var TERRITORIES = [
  { id: 0,  name: 'ألاسكا',   x: 12, y: 14, n: [1, 5, 9] },
  { id: 1,  name: 'كندا',     x: 30, y: 11, n: [0, 2, 5, 6] },
  { id: 2,  name: 'جرينلاند', x: 50, y: 9,  n: [1, 3, 6] },
  { id: 3,  name: 'النرويج',  x: 70, y: 11, n: [2, 4, 7, 8] },
  { id: 4,  name: 'روسيا',    x: 88, y: 14, n: [3, 7, 9] },
  { id: 5,  name: 'أمريكا',   x: 12, y: 37, n: [0, 1, 6, 10] },
  { id: 6,  name: 'المكسيك',  x: 30, y: 39, n: [1, 5, 7, 10, 11] },
  { id: 7,  name: 'إسبانيا',  x: 50, y: 37, n: [3, 6, 8, 11, 12] },
  { id: 8,  name: 'فرنسا',    x: 70, y: 39, n: [3, 7, 9, 12, 13] },
  { id: 9,  name: 'الصين',    x: 88, y: 37, n: [4, 8, 13, 14] },
  { id: 10, name: 'البرازيل', x: 12, y: 61, n: [5, 6, 11, 15] },
  { id: 11, name: 'كولومبيا', x: 30, y: 61, n: [6, 7, 10, 12, 15, 16] },
  { id: 12, name: 'المغرب',   x: 50, y: 61, n: [7, 8, 11, 13, 16, 17] },
  { id: 13, name: 'مصر',      x: 70, y: 61, n: [8, 9, 12, 14, 17, 18] },
  { id: 14, name: 'الهند',    x: 88, y: 61, n: [9, 13, 18, 19] },
  { id: 15, name: 'الأرجنتين', x: 12, y: 85, n: [10, 11, 16] },
  { id: 16, name: 'بيرو',     x: 30, y: 85, n: [11, 12, 15, 17] },
  { id: 17, name: 'نيجيريا',  x: 50, y: 85, n: [12, 13, 16, 18] },
  { id: 18, name: 'الكونغو',  x: 70, y: 85, n: [13, 14, 17, 19] },
  { id: 19, name: 'أستراليا', x: 88, y: 85, n: [14, 18] }
];

var COLORS = [
  { name: 'أزرق', color: '#007aff', dark: '#003d80' },
  { name: 'أحمر', color: '#ff3b30', dark: '#a01810' },
  { name: 'أخضر', color: '#34c759', dark: '#1a7a35' },
  { name: 'أصفر', color: '#ffcc00', dark: '#b38900' }
];

// ============ STATE ============
var S = {
  territories: [],
  players: [],
  current: 0,
  phase: 'reinforce',
  reinforcements: 0,
  selected: null,
  over: false,
  turn: 1,
  difficulty: 'normal'
};

var settings = { enemies: 1, difficulty: 'normal' };
var battleState = null;

// ============ UTILS ============
function vibrate(ms) {
  try { if (navigator.vibrate) navigator.vibrate(ms); } catch(e) {}
}
function toast(msg, dur) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(function() { t.classList.remove('show'); }, dur || 2000);
}
function wait(ms) {
  return new Promise(function(r) { setTimeout(r, ms); });
}
function $(sel) { return document.querySelector(sel); }
function $$(sel) { return document.querySelectorAll(sel); }

log('Utils ready');

// ============ MENU EVENTS ============
$$('.menu-options').forEach(function(group) {
  group.querySelectorAll('.menu-option').forEach(function(opt) {
    opt.addEventListener('click', function() {
      group.querySelectorAll('.menu-option').forEach(function(o) { o.classList.remove('active'); });
      opt.classList.add('active');
      var key = group.dataset.group;
      var val = opt.dataset.value;
      if (key === 'enemies') settings.enemies = parseInt(val);
      if (key === 'difficulty') settings.difficulty = val;
      vibrate(10);
    });
  });
});

$('#start-btn').addEventListener('click', function() {
  log('Start clicked');
  vibrate(20);
  startGame();
});

$('#end-turn-btn').addEventListener('click', function() {
  var p = S.players[S.current];
  if (!p || p.isAI) return;
  if (S.phase === 'reinforce' && S.reinforcements > 0) {
    if (!confirm('لديك ' + S.reinforcements + ' جيش. إنهاء؟')) return;
  }
  vibrate(15);
  clearSelection();
  nextPlayer();
});

$('#battle-cancel').addEventListener('click', function() {
  $('#battle-modal').classList.remove('show');
  battleState = null;
  clearSelection();
  vibrate(10);
});

$('#battle-attack').addEventListener('click', function() {
  if (!battleState) return;
  vibrate(20);
  resolveAttack();
});

$('#restart-btn').addEventListener('click', function() {
  $('#end-modal').classList.remove('show');
  $('#game-screen').classList.remove('active');
  $('#menu-screen').classList.add('active');
  S.over = false;
});

log('Events ready');

// ============ START GAME ============
function startGame() {
  log('Starting game...');
  
  S.territories = TERRITORIES.map(function(t) {
    return { id: t.id, name: t.name, x: t.x, y: t.y, n: t.n.slice(), owner: -1, armies: 1 };
  });
  S.players = [];
  S.current = 0;
  S.phase = 'reinforce';
  S.selected = null;
  S.over = false;
  S.turn = 1;
  S.difficulty = settings.difficulty;
  
  var total = 1 + settings.enemies;
  for (var i = 0; i < total; i++) {
    S.players.push({
      id: i,
      name: i === 0 ? 'أنت' : 'العدو ' + i,
      color: COLORS[i].color,
      dark: COLORS[i].dark,
      isAI: i !== 0,
      alive: true
    });
  }
  
  // Distribute territories
  var shuffled = S.territories.slice().sort(function() { return Math.random() - 0.5; });
  for (var j = 0; j < shuffled.length; j++) {
    shuffled[j].owner = j % total;
    shuffled[j].armies = 2 + Math.floor(Math.random() * 3);
  }
  
  $('#menu-screen').classList.remove('active');
  $('#game-screen').classList.add('active');
  
  renderMap();
  startTurn();
  log('Game started');
}

// ============ RENDER ============
function renderMap() {
  var container = $('#territories');
  container.innerHTML = '';
  
  S.territories.forEach(function(t) {
    var el = document.createElement('div');
    el.className = 'territory';
    el.setAttribute('data-id', t.id);
    el.style.left = t.x + '%';
    el.style.top = t.y + '%';
    
    var owner = S.players[t.owner];
    var circle = document.createElement('div');
    circle.className = 'territory-circle';
    circle.style.background = 'radial-gradient(circle at 35% 25%, ' + owner.color + ', ' + owner.dark + ')';
    circle.textContent = t.armies;
    
    var nameEl = document.createElement('div');
    nameEl.className = 'territory-name';
    nameEl.textContent = t.name;
    
    el.appendChild(circle);
    el.appendChild(nameEl);
    
    el.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      onTerritoryClick(t.id);
    });
    
    container.appendChild(el);
  });
  
  drawConnections();
  updateStats();
}

function drawConnections() {
  var svg = $('#map-svg');
  svg.innerHTML = '';
  var drawn = {};
  
  S.territories.forEach(function(t) {
    t.n.forEach(function(nid) {
      var key = Math.min(t.id, nid) + '-' + Math.max(t.id, nid);
      if (drawn[key]) return;
      drawn[key] = true;
      
      var n = S.territories[nid];
      var line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', t.x + '%');
      line.setAttribute('y1', t.y + '%');
      line.setAttribute('x2', n.x + '%');
      line.setAttribute('y2', n.y + '%');
      line.setAttribute('stroke', 'rgba(255,255,255,0.07)');
      line.setAttribute('stroke-width', '2');
      line.setAttribute('stroke-dasharray', '4 4');
      svg.appendChild(line);
    });
  });
}

function updateTerritoryDisplay(t) {
  var el = document.querySelector('[data-id="' + t.id + '"]');
  if (!el) return;
  var owner = S.players[t.owner];
  var circle = el.querySelector('.territory-circle');
  circle.style.background = 'radial-gradient(circle at 35% 25%, ' + owner.color + ', ' + owner.dark + ')';
  circle.textContent = t.armies;
}

function updateStats() {
  var bar = $('#stats-bar');
  bar.innerHTML = '';
  S.players.forEach(function(p) {
    var count = S.territories.filter(function(t) { return t.owner === p.id; }).length;
    var row = document.createElement('div');
    row.className = 'stat-row';
    row.innerHTML = '<div class="stat-color" style="background:' + p.color + ';box-shadow:0 0 8px ' + p.color + '"></div>' +
                    '<div class="stat-name" style="color:' + p.color + '">' + (p.isAI ? 'AI' : 'أنت') + '</div>' +
                    '<div class="stat-count">' + count + '</div>';
    bar.appendChild(row);
  });
}

// ============ TURN ============
function startTurn() {
  if (S.over) return;
  var p = S.players[S.current];
  if (!p) return;
  
  updateHeader();
  
  var owned = S.territories.filter(function(t) { return t.owner === p.id; });
  if (owned.length === 0) {
    p.alive = false;
    nextPlayer();
    return;
  }
  
  S.reinforcements = Math.max(3, Math.floor(owned.length / 3));
  S.phase = 'reinforce';
  S.selected = null;
  $('#armies-count').textContent = S.reinforcements;
  
  if (p.isAI) {
    $('#ai-text').textContent = p.name + ' يفكر...';
    $('#ai-overlay').classList.add('show');
    setTimeout(function() { aiTurn(); }, 700);
  } else {
    $('#ai-overlay').classList.remove('show');
    toast('دورك! لديك ' + S.reinforcements + ' جيش', 2500);
    setHint('انقر دولة من مملكتك');
  }
  
  clearSelection();
}

function updateHeader() {
  var p = S.players[S.current];
  if (!p) return;
  var dot = $('#turn-dot');
  dot.style.background = p.color;
  dot.style.boxShadow = '0 0 12px ' + p.color;
  $('#turn-name').textContent = p.name;
}

function setHint(text) {
  $('#hint-text').textContent = text;
}

function nextPlayer() {
  if (S.over) return;
  
  var alive = S.players.filter(function(p) { return p.alive; });
  if (alive.length === 1) {
    endGame(alive[0]);
    return;
  }
  
  var next = (S.current + 1) % S.players.length;
  var tries = 0;
  while (!S.players[next].alive && tries < S.players.length) {
    next = (next + 1) % S.players.length;
    tries++;
  }
  
  S.current = next;
  if (S.current === 0) S.turn++;
  startTurn();
}

// ============ CLICK ============
function onTerritoryClick(id) {
  if (S.over) return;
  var t = S.territories[id];
  var me = S.players[S.current];
  if (me.isAI) return;
  
  log('Click territory ' + id + ' (' + t.name + ')');
  vibrate(8);
  
  // No selection
  if (S.selected === null) {
    if (t.owner !== me.id) {
      toast('ليست دولتلك', 1200);
      return;
    }
    S.selected = id;
    clearSelection();
    document.querySelector('[data-id="' + id + '"]').classList.add('selected');
    if (S.phase === 'reinforce') {
      setHint('انقر مرة أخرى لوضع جيش');
    } else {
      highlightAttackable(id);
      setHint('اختر دولة عدو مجاورة');
    }
    return;
  }
  
  // Same territory
  if (S.selected === id) {
    var sel = S.territories[S.selected];
    if (S.phase === 'reinforce' && S.reinforcements > 0) {
      sel.armies++;
      S.reinforcements--;
      $('#armies-count').textContent = S.reinforcements;
      updateTerritoryDisplay(sel);
      vibrate(15);
      if (S.reinforcements === 0) {
        S.phase = 'attack';
        setHint('التعزيزات انتهت، ابدأ الهجوم');
        toast('ابدأ الهجوم!', 1800);
        clearSelection();
      }
    } else {
      clearSelection();
      setHint('اختر دولة');
    }
    return;
  }
  
  // Different territory
  var target = S.territories[id];
  
  if (S.phase === 'reinforce' && target.owner === me.id) {
    clearSelection();
    S.selected = id;
    document.querySelector('[data-id="' + id + '"]').classList.add('selected');
    return;
  }
  
  // Attack
  if (target.owner === me.id) {
    toast('دولة صديقة', 1200);
    return;
  }
  
  var sel2 = S.territories[S.selected];
  if (sel2.n.indexOf(id) === -1) {
    toast('غير متجاورة!', 1200);
    return;
  }
  if (sel2.armies < 2) {
    toast('تحتاج جيشين على الأقل', 1500);
    return;
  }
  
  openBattle(S.selected, id);
}

function clearSelection() {
  $$('.territory').forEach(function(el) {
    el.classList.remove('selected', 'attackable');
  });
  S.selected = null;
}

function highlightAttackable(fromId) {
  var t = S.territories[fromId];
  var me = S.players[S.current];
  t.n.forEach(function(nid) {
    var n = S.territories[nid];
    if (n.owner !== me.id) {
      var el = document.querySelector('[data-id="' + nid + '"]');
      if (el) el.classList.add('attackable');
    }
  });
}

// ============ BATTLE ============
function openBattle(atkId, defId) {
  var atk = S.territories[atkId];
  var def = S.territories[defId];
  battleState = { atkId: atkId, defId: defId };
  
  $('#battle-sub').textContent = atk.name + ' ← ' + def.name;
  $('#atk-name').textContent = atk.name + ' (' + atk.armies + ')';
  $('#atk-name').style.color = S.players[atk.owner].color;
  $('#def-name').textContent = def.name + ' (' + def.armies + ')';
  $('#def-name').style.color = S.players[def.owner].color;
  $('#atk-dice').innerHTML = '';
  $('#def-dice').innerHTML = '';
  $('#battle-result').textContent = '';
  
  $('#battle-modal').classList.add('show');
  vibrate(15);
}

function rollDice(n) {
  var r = [];
  for (var i = 0; i < n; i++) r.push(1 + Math.floor(Math.random() * 6));
  r.sort(function(a, b) { return b - a; });
  return r;
}

async function resolveAttack() {
  if (!battleState) return;
  var atk = S.territories[battleState.atkId];
  var def = S.territories[battleState.defId];
  
  var aDice = rollDice(Math.min(3, atk.armies - 1));
  var dDice = rollDice(Math.min(2, def.armies));
  
  var atkEl = $('#atk-dice');
  var defEl = $('#def-dice');
  atkEl.innerHTML = '';
  defEl.innerHTML = '';
  
  for (var i = 0; i < aDice.length; i++) {
    await wait(100);
    var d = document.createElement('div');
    d.className = 'die attacker';
    d.textContent = aDice[i];
    atkEl.appendChild(d);
    vibrate(5);
  }
  for (var j = 0; j < dDice.length; j++) {
    await wait(100);
    var d2 = document.createElement('div');
    d2.className = 'die defender';
    d2.textContent = dDice[j];
    defEl.appendChild(d2);
    vibrate(5);
  }
  
  await wait(250);
  
  var pairs = Math.min(aDice.length, dDice.length);
  var aLoss = 0, dLoss = 0;
  for (var k = 0; k < pairs; k++) {
    if (aDice[k] > dDice[k]) dLoss++;
    else aLoss++;
  }
  
  atk.armies -= aLoss;
  def.armies -= dLoss;
  
  var msg = [];
  if (aLoss > 0) msg.push('خسرت ' + aLoss);
  if (dLoss > 0) msg.push('العدو خسر ' + dLoss);
  $('#battle-result').textContent = msg.join(' • ') || 'تعادل';
  
  if (def.armies <= 0) {
    var oldOwner = def.owner;
    def.owner = atk.owner;
    def.armies = Math.max(1, atk.armies - 1);
    atk.armies = 1;
    updateTerritoryDisplay(atk);
    updateTerritoryDisplay(def);
    updateStats();
    
    $('#battle-result').textContent = '🏆 فتحت ' + def.name + '!';
    vibrate([100, 50, 100]);
    
    await wait(1200);
    $('#battle-modal').classList.remove('show');
    battleState = null;
    clearSelection();
    toast('🏆 فتحت ' + def.name + '!', 2000);
    
    checkElimination(oldOwner);
    checkVictory();
  } else if (atk.armies <= 1) {
    await wait(600);
    $('#battle-modal').classList.remove('show');
    battleState = null;
    clearSelection();
    updateTerritoryDisplay(atk);
    updateTerritoryDisplay(def);
    updateStats();
  } else {
    vibrate(20);
    await wait(500);
    $('#atk-dice').innerHTML = '';
    $('#def-dice').innerHTML = '';
    $('#battle-result').textContent = '';
    $('#atk-name').textContent = atk.name + ' (' + atk.armies + ')';
    $('#def-name').textContent = def.name + ' (' + def.armies + ')';
    updateTerritoryDisplay(atk);
    updateTerritoryDisplay(def);
  }
}

function checkElimination(ownerId) {
  var p = S.players[ownerId];
  if (!p) return;
  var count = S.territories.filter(function(t) { return t.owner === ownerId; }).length;
  if (count === 0) {
    p.alive = false;
    toast('💀 تم القضاء على ' + p.name, 2000);
  }
}

function checkVictory() {
  var alive = S.players.filter(function(p) { return p.alive; });
  if (alive.length === 1) {
    endGame(alive[0]);
    return true;
  }
  return false;
}

// ============ AI ============
async function aiTurn() {
  var p = S.players[S.current];
  if (!p || !p.isAI || S.over) return;
  
  var mine = S.territories.filter(function(t) { return t.owner === p.id; });
  if (mine.length === 0) {
    $('#ai-overlay').classList.remove('show');
    nextPlayer();
    return;
  }
  
  // Reinforce
  var border = mine.filter(function(t) {
    return t.n.some(function(nid) { return S.territories[nid].owner !== p.id; });
  });
  var targets = border.length > 0 ? border : mine;
  
  var r = S.reinforcements;
  for (var i = 0; i < r; i++) {
    var t = targets[Math.floor(Math.random() * targets.length)];
    t.armies++;
    S.reinforcements--;
    updateTerritoryDisplay(t);
    await wait(120);
  }
  
  await wait(400);
  S.phase = 'attack';
  
  var diff = S.difficulty;
  var thresh = diff === 'easy' ? 3 : diff === 'normal' ? 2 : 1.5;
  var maxAtk = diff === 'easy' ? 2 : diff === 'normal' ? 5 : 8;
  var atkCount = 0;
  
  while (atkCount < maxAtk && !S.over) {
    var best = null;
    var bestScore = -Infinity;
    S.territories.forEach(function(t) {
      if (t.owner !== p.id || t.armies <= 1) return;
      t.n.forEach(function(nid) {
        var n = S.territories[nid];
        if (n.owner === p.id || n.owner < 0) return;
        var adv = t.armies - n.armies;
        if (adv >= thresh) {
          var score = adv - Math.random() * 0.8;
          if (score > bestScore) {
            bestScore = score;
            best = { from: t, to: n };
          }
        }
      });
    });
    
    if (!best) break;
    
    var fromEl = document.querySelector('[data-id="' + best.from.id + '"]');
    var toEl = document.querySelector('[data-id="' + best.to.id + '"]');
    if (fromEl) fromEl.classList.add('selected');
    if (toEl) toEl.classList.add('attackable');
    
    await wait(600);
    
    var aDice = rollDice(Math.min(3, best.from.armies - 1));
    var dDice = rollDice(Math.min(2, best.to.armies));
    var pairs = Math.min(aDice.length, dDice.length);
    var aLoss = 0, dLoss = 0;
    for (var z = 0; z < pairs; z++) {
      if (aDice[z] > dDice[z]) dLoss++;
      else aLoss++;
    }
    
    best.from.armies -= aLoss;
    best.to.armies -= dLoss;
    
    updateTerritoryDisplay(best.from);
    updateTerritoryDisplay(best.to);
    
    if (best.to.armies <= 0) {
      best.to.owner = best.from.owner;
      best.to.armies = Math.max(1, best.from.armies - 1);
      best.from.armies = 1;
      updateTerritoryDisplay(best.from);
      updateTerritoryDisplay(best.to);
      updateStats();
      toast(p.name + ' فتح ' + best.to.name, 1500);
    }
    
    if (fromEl) fromEl.classList.remove('selected');
    if (toEl) toEl.classList.remove('attackable');
    
    atkCount++;
    await wait(300);
    
    if (checkVictory()) return;
  }
  
  await wait(400);
  $('#ai-overlay').classList.remove('show');
  nextPlayer();
}

// ============ END GAME ============
function endGame(winner) {
  S.over = true;
  var icon = $('#end-icon');
  var title = $('#end-title');
  var sub = $('#end-sub');
  
  if (winner.id === 0) {
    icon.textContent = '🏆';
    title.textContent = 'النصر!';
    title.className = 'end-title win';
    sub.textContent = 'وحّدت العالم في ' + S.turn + ' دور';
    vibrate([100, 50, 100, 50, 200]);
  } else {
    icon.textContent = '💀';
    title.textContent = 'هزيمة!';
    title.className = 'end-title lose';
    sub.textContent = winner.name + ' سيطر على العالم';
    vibrate([300, 100, 300]);
  }
  
  $('#end-modal').classList.add('show');
  $('#ai-overlay').classList.remove('show');
}

log('All ready - waiting for user');

})();
</script>
