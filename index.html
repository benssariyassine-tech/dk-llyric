<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0a0a1a" />
<title>حرب البلدان</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; background: #0a0a1a; color: white; user-select: none; -webkit-user-select: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
::-webkit-scrollbar { width: 0; height: 0; }

/* ====== SCREENS ====== */
.screen { position: fixed; inset: 0; display: none; flex-direction: column; }
.screen.active { display: flex; }

/* ====== MENU ====== */
#menu-screen {
  background: radial-gradient(circle at 50% 30%, #2a1a4e 0%, #0a0a1a 70%);
  align-items: center; justify-content: center; padding: 30px 24px;
}
.menu-logo { text-align: center; margin-bottom: 40px; }
.menu-logo svg { width: 100px; height: 100px; filter: drop-shadow(0 0 30px rgba(255,50,50,0.6)); animation: pulse 3s infinite; }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
.menu-title { font-size: 42px; font-weight: 900; text-align: center; margin-bottom: 6px; background: linear-gradient(135deg, #ff3b30, #ff9500, #ffcc00); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; letter-spacing: -1px; }
.menu-sub { font-size: 15px; color: rgba(255,255,255,0.5); text-align: center; margin-bottom: 40px; }

.menu-section { width: 100%; max-width: 380px; margin-bottom: 24px; }
.menu-label { font-size: 13px; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; text-align: center; }
.menu-options { display: flex; gap: 8px; justify-content: center; }
.menu-option {
  flex: 1; padding: 14px 8px; border-radius: 12px;
  background: rgba(255,255,255,0.08); border: 2px solid transparent;
  color: rgba(255,255,255,0.7); font-size: 14px; font-weight: 600;
  transition: all 0.2s; text-align: center;
}
.menu-option.active {
  background: linear-gradient(135deg, #ff3b30, #ff9500);
  color: white; border-color: rgba(255,255,255,0.3);
  box-shadow: 0 6px 20px rgba(255,59,48,0.4);
}
.menu-option:active { transform: scale(0.96); }

.play-btn {
  width: 100%; max-width: 380px; padding: 20px;
  background: linear-gradient(135deg, #ff3b30, #ff9500);
  border-radius: 16px; color: white; font-size: 20px; font-weight: 800;
  margin-top: 10px; box-shadow: 0 10px 30px rgba(255,59,48,0.5);
  display: flex; align-items: center; justify-content: center; gap: 10px;
  transition: transform 0.15s;
}
.play-btn:active { transform: scale(0.97); }
.play-btn svg { width: 24px; height: 24px; }

/* ====== GAME SCREEN ====== */
#game-screen { background: #0a0a1a; }

.game-header {
  padding: 12px 16px 8px;
  display: flex; align-items: center; justify-content: space-between;
  background: linear-gradient(180deg, rgba(0,0,0,0.6), transparent);
  flex-shrink: 0; z-index: 10;
}
.game-turn {
  display: flex; align-items: center; gap: 10px;
  background: rgba(255,255,255,0.08); padding: 8px 14px; border-radius: 20px;
}
.turn-dot { width: 12px; height: 12px; border-radius: 50%; box-shadow: 0 0 12px currentColor; }
.turn-info { display: flex; flex-direction: column; }
.turn-label { font-size: 10px; color: rgba(255,255,255,0.5); letter-spacing: 1px; }
.turn-name { font-size: 14px; font-weight: 700; }
.armies-badge {
  display: flex; align-items: center; gap: 6px;
  background: linear-gradient(135deg, #ff3b30, #ff9500);
  padding: 8px 14px; border-radius: 20px;
  font-weight: 800; font-size: 15px;
}
.armies-badge svg { width: 16px; height: 16px; }

/* Map area */
.map-container {
  flex: 1; position: relative; overflow: hidden;
  background:
    radial-gradient(circle at 30% 40%, rgba(60,100,200,0.15), transparent 50%),
    radial-gradient(circle at 70% 60%, rgba(200,60,60,0.15), transparent 50%),
    linear-gradient(180deg, #0a1628 0%, #0a0a1a 100%);
}
#map-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#territories { position: absolute; inset: 0; }

.territory {
  position: absolute; transform: translate(-50%, -50%);
  display: flex; flex-direction: column; align-items: center;
  cursor: pointer; transition: transform 0.2s;
}
.territory:active { transform: translate(-50%, -50%) scale(0.92); }
.territory-circle {
  width: 48px; height: 48px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 800; color: white;
  border: 3px solid rgba(0,0,0,0.4);
  box-shadow: 0 4px 16px rgba(0,0,0,0.5), inset 0 2px 6px rgba(255,255,255,0.2);
  transition: all 0.3s;
  position: relative;
}
.territory-circle::before {
  content: ""; position: absolute; inset: -3px;
  border-radius: 50%; padding: 3px;
  background: linear-gradient(135deg, rgba(255,255,255,0.4), transparent);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
  pointer-events: none;
}
.territory-name {
  font-size: 10px; color: rgba(255,255,255,0.85); margin-top: 4px;
  text-shadow: 0 1px 4px rgba(0,0,0,0.9); font-weight: 600;
  max-width: 70px; text-align: center; white-space: nowrap;
}
.territory.selected .territory-circle {
  animation: glow 1s infinite;
  transform: scale(1.15);
}
@keyframes glow {
  0%,100% { box-shadow: 0 0 0 3px #fff, 0 0 20px #fff, 0 4px 16px rgba(0,0,0,0.5); }
  50% { box-shadow: 0 0 0 6px rgba(255,255,255,0.3), 0 0 30px rgba(255,255,255,0.8), 0 4px 16px rgba(0,0,0,0.5); }
}
.territory.attackable .territory-circle {
  animation: targetPulse 1.2s infinite;
}
@keyframes targetPulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(255,50,50,0.8), 0 4px 16px rgba(0,0,0,0.5); }
  50% { box-shadow: 0 0 0 10px rgba(255,50,50,0), 0 4px 16px rgba(0,0,0,0.5); }
}
.territory.attackable .territory-circle::after {
  content: ""; position: absolute; inset: -8px;
  border: 2px dashed rgba(255,50,50,0.6); border-radius: 50%;
  animation: spin 4s linear infinite;
  pointer-events: none;
}
@keyframes spin { to { transform: rotate(360deg); } }

.territory-flag { font-size: 18px; line-height: 1; }

/* Footer */
.game-footer {
  padding: 12px 16px 20px;
  background: linear-gradient(0deg, rgba(0,0,0,0.9), transparent);
  display: flex; gap: 10px; flex-shrink: 0; z-index: 10;
}
.footer-info {
  flex: 1; display>
: flex; align-items: center; gap: 12px     ;
  background: rgba(255,255,255, <0.08); padding: 12divpx 16px; border-radius: 14 classpx;
  font-size: 13px; color: rgba(255,255,255,0.75);
}
.footer-info svg { width: 18px; height: 18px; color: #ff9500; }
.footer-btn {
  padding: 12px 20px; border-radius: 14px;
  background: linear-gradient(135deg, #ff3b30, #ff9500);
  font-weight: 800; font-size: 14px; color: white;
  display: flex; align-items: center; gap: 8px;
  box-shadow: 0 6px 20px rgba(255,59,48,0.4);
  transition: transform 0.15s;
}
.footer-btn:active { transform: scale(0.96); }
.footer-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.footer-btn svg { width: 18px; height: 18px; }
.footer-btn.secondary { background: rgba(255,255,255,0.15); box-shadow: none; }

/* ====== TOAST ====== */
#toast {
  position: fixed; top: 80px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,0.9); color: white;
  padding: 12px 20px; border-radius: 30px;
  font-size: 14px; font-weight: 600; z-index: 9999;
  opacity: 0; transition: opacity 0.3s, transform 0.3s;
  pointer-events: none; max-width: 90%;
  display: flex; align-items: center; gap: 8px;
  border: 1px solid rgba(255,255,255,0.15);
  backdrop-filter: blur(20px);
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast.hidden { transform: translateX(-50%) translateY(-20px); }

/* ====== BATTLE MODAL ====== */
#battle-modal {
  position: fixed; inset: 0; background: rgba(0,0,0,0.85);
  z-index: 500; display: none; align-items: center; justify-content: center;
  padding: 20px; backdrop-filter: blur(10px);
}
#battle-modal.show { display: flex; }
.battle-box {
  background: linear-gradient(180deg, #1a1a2e, #0a0a1a);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 24px; padding: 24px; width: 100%; max-width: 400px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.7);
  animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes popIn { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }
.battle-title { text-align: center; font-size: 20px; font-weight: 800; margin-bottom: 6px; }
.battle-sub { text-align: center; font-size: 13px; color: rgba(255,255,255,0.6); margin-bottom: 20px; }
.battle-sides { display: flex; gap: 12px; margin-bottom: 20px; }
.battle-side {
  flex: 1; padding: 16px; border-radius: 16px; text-align: center;
  background: rgba(255,255,255,0.06);
  border: 2px solid rgba(255,255,255,0.1);
}
.battle-side.attacker { border-color: rgba(255,59,48,0.5); }
.battle-side.defender { border-color: rgba(0,122,255,0.5); }
.battle-side-label { font-size: 11px; color: rgba(255,255,255,0.5); margin-bottom: 4px; letter-spacing: 1px; }
.battle-side-name { font-size: 15px; font-weight: 700; margin-bottom: 8px; }
.battle-dice { display: flex; gap: 6px; justify-content: center; min-height: 44px; align-items: center; }
.die {
  width: 40px; height: 40px; border-radius: 10px;
  background: white; color: #111;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; font-weight: 800;
  box-shadow: 0 3px 10px rgba(0,0,0,0.5);
  animation: rollIn 0.4s ease;
}
@keyframes rollIn {
  from { transform: rotate(180deg) scale(0); opacity: 0; }
  to { transform: rotate(0) scale(1); opacity: 1; }
}
.die.attacker { background: linear-gradient(135deg, #ff3b30, #ff6b5b); color: white; }
.die.defender { background: linear-gradient(135deg, #007aff, #4aa3ff); color: white; }
.battle-result { text-align: center; font-size: 15px; font-weight: 700; margin-bottom: 20px; min-height: 22px; color: #ffcc00; }
.battle-actions { display: flex; gap: 10px; }
.battle-btn {
  flex: 1; padding: 14px; border-radius: 14px;
  font-weight: 800; font-size: 15px;
  transition: transform 0.15s;
}
.battle-btn:active { transform: scale(0.96); }
.battle-btn.attack { background: linear-gradient(135deg, #ff3b30, #ff9500); }
.battle-btn.cancel { background: rgba(255,255,255,0.12); color: white; }

/* ====== END MODAL ====== */
#end-modal {
  position: fixed; inset: 0; background: rgba(0,0,0,0.9);
  z-index: 600; display: none; align-items: center; justify-content: center;
  padding: 20px; backdrop-filter: blur(20px);
}
#end-modal.show { display: flex; }
.end-box { text-align: center; max-width: 360px; width: 100%; animation: popIn 0.4s; }
.end-icon { font-size: 80px; margin-bottom: 16px; animation: pulse 2s infinite; }
.end-title { font-size: 34px; font-weight: 900; margin-bottom: 8px; }
.end-title.win { background: linear-gradient(135deg, #ffcc00, #ff9500); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.end-title.lose { color: #ff3b30; }
.end-sub { font-size: 15px; color: rgba(255,255,255,0.6); margin-bottom: 30px; }
.end-btn { padding: 16px 32px; border-radius: 14px; background: linear-gradient(135deg, #ff3b30, #ff9500); font-weight: 800; font-size: 16px; }

/* ====== AI TURN OVERLAY ====== */
#ai-overlay {
  position: fixed; inset: 0; pointer-events: none;
  display: none; align-items: center; justify-content: center;
  z-index: 400;
}
#ai-overlay.show { display: flex; }
.ai-banner {
  padding: 14px 28px; border-radius: 20px;
  background: rgba(0,0,0,0.9); backdrop-filter: blur(20px);
  font-weight: 700; font-size: 16px;
  border: 2px solid currentColor;
  animation: popIn 0.3s;
  display: flex; align-items: center; gap: 12px;
}
.ai-banner .dot { width: 12px; height: 12px; border-radius: 50%; animation: blink 1s infinite; }
@keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

/* ====== STATS BAR ====== */
.stats-bar {
  position: absolute; top: 60px; right: 10px;
  display: flex; flex-direction: column; gap: 6px;
  background: rgba(0,0,0,0.5); padding: 8px; border-radius: 12px;
  backdrop-filter: blur(10px); font-size: 12px;
}
.stat-row { display: flex; align-items: center; gap: 8px; }
.stat-color { width: 12px; height: 12px; border-radius: 50%; }
.stat-count { font-weight: 700; color: #ffcc00; min-width: 20px; text-align: right; }

@media (max-width: 400px) {
  .territory-circle { width: 42px; height: 42px; font-size: 12px; }
  .territory-name { font-size: 9px; max-width: 60px; }
  .menu-title { font-size: 34px; }
  .die { width: 34px; height: 34px; font-size: 17px; }
}
</style>
</head>

<!-- ============== MENU SCREEN ============== -->
<div id="menu-screen" class="screen active">

<!-- ============== GAME SCREEN ============== -->
<div id="game-screen" class="screen">

<!-- ============== BATTLE MODAL ============== -->

</div>

<!-- ============== AI OVERLAY ============== -->

<!-- ============== END MODAL ============== -->

    <button class="end-btn" id="restart-btn">لعبة جديدة</button>
  </div>
</div>

<!-- ============== TOAST ============== -->
<div id="toast"></div>

// ============ GAME STATE ============
const state = {
  territories: [],
  players: [],
  currentPlayer: 0,
  phase: 'reinforce', // reinforce | attack | fortify

};

// ============ AUDIO ============
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new AudioCtx();
}
function beep(freq, dur, type = 'sine', vol = 0.1) {
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + dur);
  } catch(e) {}
}
function sfxClick() { beep(600, 0.05, 'sine', 0.05); }
function sfxDice() { beep(400 + Math.random() * 200, 0.08, 'square', 0.06); }
function sfxWin() { beep(880, 0.15); setTimeout(() => beep(1320, 0.2), 150); }
function sfxLose() { beep(200, 0.3, 'sawtooth', 0.08); }
function sfxConquer() { beep(500, 0.1); setTimeout(() => beep(750, 0.15), 100); setTimeout(() => beep(1000, 0.2), 220); }

// ============ UTILS ============
function vibrate(ms = 10) {
  try { if (navigator.vibrate) navigator.vibrate(ms); } catch(e) {}
}
function showToast(msg, duration = 2000) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  t.classList.remove('hidden');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => {
    t.classList.remove('show');
    t.classList.add('hidden');
  }, duration);
}
function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

// ============ GAME INIT ============
function startGame() {
  // Reset state
  state.territories = TERRITORY_DATA.map(t => ({ ...t, owner: -1, armies: 1 }));
  state.players = [];
  state.currentPlayer = 0;
  state.phase = 'reinforce';
  state.selectedId = null;
  state.gameOver = false;
  state.turnNumber = 1;
  state.difficulty = settings.difficulty;

  // Setup players: player 0 = human, others = AI
  const totalPlayers = 1 + settings.enemies;
  for (let i = 0; i < totalPlayers; i++) {
    state.players.push({
      id: i,
      name: i === 0 ? 'أنت' : `العدو ${i}`,
      color: PLAYER_COLORS[i].color,
      darkColor: PLAYER_COLORS[i].dark,
      emoji: PLAYER_COLORS[i].emoji,
      isAI: i !== 0,
      alive: true
    });
  }

  // Distribute territories evenly
  const shuffled = [...state.territories].sort(() => Math.random() - 0.5);
  shuffled.forEach((t, i) => {
    t.owner = i % totalPlayers;
    t.armies = Math.floor(Math.random() * 3) + 2; // 2-4
  });

  // Show game screen
  document.getElementById('menu-screen').classList.remove('active');
  document.getElementById('game-screen').classList.add('active');

  renderMap();
  startTurn();
}

// ============ RENDER MAP ============
function renderMap() {
  const container = document.getElementById('territories');
  container.innerHTML = '';
  
  state.territories.forEach(t => {
    const el = document.createElement('div');
    el.className = 'territory';
    el.dataset.id = t.id;
    el.style.left = t.x + '%';
    el.style.top = t.y + '%';
    
    const owner = state.players[t.owner];
    el.innerHTML = `
      <div class="territory-circle" style="background: radial-gradient(circle at 35% 25%, ${owner.color}, ${owner.darkColor});">
        ${t.armies}
      </div>
      <div class="territory-name">${t.name}</div>
    `;
    
    el.onclick = () => onTerritoryClick(t.id);
    container.appendChild(el);
  });
  
  drawConnections();
  updateStatsBar();
}

function drawConnections() {
  const svg = document.getElementById('map-svg');
  svg.innerHTML = '';
  const drawn = new Set();
  
  state.territories.forEach(t => {
    t.neighbors.forEach(nid => {
      const key = [Math.min(t.id, nid), Math.max(t.id, nid)].join('-');
      if (drawn.has(key)) return;
      drawn.add(key);
      
      const n = state.territories[nid];
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.set="Attribute('x1', t.x + '%');
      line.setAttribute('staty1', t.y + '%');
-name      line.setAttribute('x2', n.x + '%');
      line.setAttribute('y2', n.y + '%');
      line.setAttribute('stroke', 'rgba(255,255,255,0.08)');
      line.setAttribute('stroke-width', '2');
      line.setAttribute('stroke-dasharray', '4 4');
      svg.appendChild(line);
    });
  });
}

function updateStatsBar() {
  const bar = document.getElementById('stats-bar');
  bar.innerHTML = '';
  state.players.forEach(p => {
    const count = state.territories.filter(t => t.owner === p.id).length;
    const row = document.createElement('div');
    row.className = 'stat-row';
    row.innerHTML = `
      <div class="stat-color" style="background:${p.color}; box-shadow: 0 0 8px ${p.color};"></div" style="color:${p.color};">${p.isAI ? 'AI' : 'أنت'}</div>
      <div class="stat-count">${count}</div>
    `;
    bar.appendChild(row);
  });
}

// ============ TURN MANAGEMENT ============
function startTurn() {
  const player = state.players[state.currentPlayer];
  if (!player) return;
  
  updateTurnHeader();
  
  // Check if player is alive
  const owned = state.territories.filter(t => t.owner === player.id);
  if (owned.length === 0) {
    player.alive = false;
    nextPlayer();
    return;
  }
  
  // Calculate reinforcements: territories / 3, min 3
  state.reinforcements = Math.max(3, Math.floor(owned.length / 3));
  state.phase = 'reinforce';
  state.selectedId = null;
  document.getElementById('armies-count').textContent = state.reinforcements;
  
  if (player.isAI) {
    document.getElementById('ai-banner').style.color = player.color;
    document.getElementById('ai-banner-text').textContent = `${player.name} يفكر...`;
    document.getElementById('ai-overlay').classList.add('show');
    setTimeout(() => aiTurn(), 600);
  } else {
    document.getElementById('ai-overlay').classList.remove('show');
    showToast(`دورك! لديك ${state.reinforcements} جيش`, 2500);
    setHint('انقر على دولة من مملكتك لوضع الجيش');
  }
  
  clearSelection();
  renderMap();
}

function nextPlayer() {
  let next = (state.currentPlayer + 1) % state.players.length;
  let tries = 0;
  while (!state.players[next].alive && tries < state.players.length) {
    next = (next + 1) % state.players.length;
    tries++;
  }
  
  // Count alive
  const alive = state.players.filter(p => p.alive);
  if (alive.length === 1) {
    endGame(alive[0]);
    return;
  }
  
  state.currentPlayer = next;
  if (state.currentPlayer === 0) state.turnNumber++;
  startTurn();
}

function updateTurnHeader() {
  const p = state.players[state.currentPlayer];
  if (!p) return;
  document.getElementById('turn-dot').style.background = p.color;
  document.getElementById('turn-dot').style.color = p.color;
  document.getElementById('turn-name').textContent = p.name;
}

function setHint(text) {
  document.getElementById('hint-text').textContent = text;
}

// ============ TERRITORY CLICK ============
function onTerritoryClick(id) {
  if (state.gameOver) return;
  const t = state.territories[id];
  const current = state.players[state.currentPlayer];
  
  // AI's turn - ignore clicks
  if (current.isAI) return;
  
  // If no selection
  if (state.selectedId === null) {
    if (t.owner !== current.id) {
      showToast('هذه دولة ليست لك!', 1500);
      sfxLose();
      return;
    }
    state.selectedId = id;
    clearSelection();
    document.querySelector(`[data-id="${id}"]`).classList.add('selected');
    sfxClick();
    
    if (state.phase === 'reinforce') {
      setHint('انقر مرة أخرى على نفس الدولة لوضع جيش');
    } else {
      // Highlight attackable neighbors
      highlightAttackable(id);
      setHint('اختر دولة عدو مجاورة للهجوم');
    }
    return;
  }
  
  // If same territory selected
  if (state.selectedId === id) {
    const sel = state.territories[state.selectedId];
    if (state.phase === 'reinforce' && state.reinforcements > 0) {
      // Place 1 army per click
      sel.armies++;
      state.reinforcements--;
      document.getElementById('armies-count').textContent = state.reinforcements;
      updateTerritoryDisplay(sel);
      beep(700, 0.05, 'sine', 0.05);
      
      if (state.reinforcements === 0) {
        state.phase = 'attack';
        setHint('الآن اختر دولة للهجوم');
        showToast('انتهت التعزيزات، ابدأ الهجوم!', 1800);
        clearSelection();
      }
    } else {
      // Deselect
      clearSelection();
      setHint('اختر دولة');
    }
    return;
  }
  
  // Different territory clicked
  const target = state.territories[id];
  
  // If reinforcing and clicked own territory, move selection
  if (state.phase === 'reinforce' && target.owner === current.id) {
    clearSelection();
    state.selectedId = id;
    document.querySelector(`[data-id="${id}"]`).classList.add('selected');
    sfxClick();
    return;
  }
  
  // If clicked enemy territory - try attack
  if (state.phase === 'attack' || state.phase === 'reinforce') {
    if (target.owner === current.id) {
      showToast('اخترت دولة صديقة، انقر دولة عدو', 1500);
      return;
    }
    
    const sel = state.territories[state.selectedId];
    if (!sel.neighbors.includes(id)) {
      showToast('غير متجاورة!', 1500);
      sfxLose();
      return;
    }
    
    if (sel.armies < 2) {
      showToast('تحتاج جيشين على الأقل للهجوم', 1800);
      sfxLose();
      return;
    }
    
    openBattle(state.selectedId, id);
  }
}

function clearSelection() {
  document.querySelectorAll('.territory').forEach(el => {
    el.classList.remove('selected', 'attackable');
  });
  state.selectedId = null;
}

function highlightAttackable(fromId) {
  const t = state.territories[fromId];
  const current = state.players[state.currentPlayer];
  t.neighbors.forEach(nid => {
    const n = state.territories[nid];
    if (n.owner !== current.id) {
      const el = document.querySelector(`[data-id="${nid}"]`);
      if (el) el.classList.add('attackable');
    }
  });
}

function updateTerritoryDisplay(t) {
  const el = document.querySelector(`[data-id="${t.id}"]`);
  if (!el) return;
  const owner = state.players[t.owner];
  const circle = el.querySelector('.territory-circle');
  circle.style.background = `radial-gradient(circle at 35% 25%, ${owner.color}, ${owner.darkColor})`;
  circle.textContent = t.armies;
}

// ============ BATTLE ============
let currentBattle = null;

function openBattle(atkId, defId) {
  const atk = state.territories[atkId];
  const def = state.territories[defId];
  currentBattle = { atkId, defId };
  
  document.getElementById('battle-sub').textContent = `${atk.name} ← ${def.name}`;
  document.getElementById('battle-atk-name').textContent = atk.name;
  document.getElementById('battle-atk-name').style.color = state.players[atk.owner].color;
  document.getElementById('battle-def-name').textContent = def.name;
  document.getElementById('battle-def-name').style.color = state.players[def.owner].color;
  document.getElementById('battle-atk-dice').innerHTML = '';
  document.getElementById('battle-def-dice').innerHTML = '';
  document.getElementById('battle-result').textContent = '';
  
  document.getElementById('battle-modal').classList.add('show');
}

document.getElementById('battle-cancel').onclick = () => {
  document.getElementById('battle-modal').classList.remove('show');
  clearSelection();
  currentBattle = null;
  sfxClick();
};

document.getElementById('battle-attack').onclick = () => {
  if (!currentBattle) return;
  resolveAttack();
};

function rollDice(n) {
  const rolls = [];
  for (let i = 0; i < n; i++) rolls.push(Math.floor(Math.random() * 6) + 1);
  return rolls.sort((a, b) => b - a);
}

async function resolveAttack() {
  const atk = state.territories[currentBattle.atkId];
  const def = state.territories[currentBattle.defId];
  
  const atkDice = rollDice(Math.min(3, atk.armies - 1));
  const defDice = rollDice(Math.min(2, def.armies));
  
  // Display dice
  const atkEl = document.getElementById('battle-atk-dice');
  const defEl = document.getElementById('battle-def-dice');
  atkEl.innerHTML = ''; defEl.innerHTML = '';
  
  for (let i = 0; i < atkDice.length; i++) {
    await wait(80);
    sfxDice();
    const d = document.createElement('div');
    d.className = 'die attacker';
    d.textContent = atkDice[i];
    atkEl.appendChild(d);
  }
  for (let i = 0; i < defDice.length; i++) {
    await wait(80);
    sfxDice();
    const d = document.createElement('div');
    d.className = 'die defender';
    d.textContent = defDice[i];
    defEl.appendChild(d);
  }
  
  await wait(200);
  
  // Resolve combat
  const pairs = Math.min(atkDice.length, defDice.length);
  let atkLoss = 0, defLoss = 0;
  for (let i = 0; i < pairs; i++) {
    if (atkDice[i] > defDice[i]) defLoss++;
    else atkLoss++;
  }
  
  atk.armies -= atkLoss;
  def.armies -= defLoss;
  
  const resultEl = document.getElementById('battle-result');
  const resultParts = [];
  if (atkLoss > 0) resultParts.push(`المهاجم خسر ${atkLoss}`);
  if (defLoss > 0) resultParts.push(`المدافع خسر ${defLoss}`);
  resultEl.textContent = resultParts.join(' • ') || 'تعادل';
  
  // Check for conquest
  if (def.armies <= 0) {
    // Attacker conquers
    const oldOwner = def.owner;
    def.owner = atk.owner;
    def.armies = atk.armies - 1;
    atk.armies = 1;
    
    sfxConquer();
    vibrate(100);
    
    resultEl.textContent = `🏆 فتحت ${def.name}!`;
    resultEl.style.color = '#ffcc00';
    
    await wait(1000);
    document.getElementById('battle-modal').classList.remove('show');
    clearSelection();
    currentBattle = null;
    renderMap();
    
    showToast(`🏆 فتحت ${def.name}!`, 2500);
    checkElimination(oldOwner);
    checkVictory();
  } else if (atk.armies <= 1) {
    // Attacker can't continue
    sfxLose();
    await wait(600);
    document.getElementById('battle-modal').classList.remove('show');
    clearSelection();
    currentBattle = null;
    renderMap();
  } else {
    // Continue battle
    vibrate(20);
    await wait(600);
    document.getElementById('battle-atk-dice').innerHTML = '';
    document.getElementById('battle-def-dice').innerHTML = '';
    document.getElementById('battle-result').textContent = '';
    // Update displays
    updateTerritoryDisplay(atk);
    updateTerritoryDisplay(def);
  }
  
  updateStatsBar();
}

function checkElimination(ownerId) {
  const p = state.players[ownerId];
  if (!p) return;
  const count = state.territories.filter(t => t.owner === ownerId).length;
  if (count === 0) {
    p.alive = false;
    showToast(`💀 تم القضاء على ${p.name}`, 2500);
  }
}

function checkVictory() {
  const alive = state.players.filter(p => p.alive);
  if (alive.length === 1) {
    endGame(alive[0]);
    return true;
  }
  return false;
}

// ============ AI TURN ============
async function aiTurn() {
  const player = state.players[state.currentPlayer];
  if (!player || !player.isAI || state.gameOver) return;
  
  const myTerritories = state.territories.filter(t => t.owner === player.id);
  if (myTerritories.length === 0) {
    document.getElementById('ai-overlay').classList.remove('show');
    nextPlayer();
    return;
  }
  
  // ===== Phase 1: Reinforce =====
  // Sort by border priority (borders first)
  const borders = myTerritories.filter(t => 
    t.neighbors.some(n => state.territories[n].owner !== player.id)
  );
  const reinforceTargets = borders.length > 0 ? borders : myTerritories;
  
  const totalReinforcements = state.reinforcements;
  for (let i = 0; i < totalReinforcements; i++) {
    const t = reinforceTargets[Math.floor(Math.random() * reinforceTargets.length)];
    t.armies++;
    state.reinforcements--;
    updateTerritoryDisplay(t);
    beep(500 + i * 20, 0.05, 'sine', 0.04);
    await wait(150);
  }
  
  await wait(400);
  state.phase = 'attack';
  
  // ===== Phase 2: Attack =====
  const difficulty = state.difficulty;
  const threshold = difficulty === 'easy' ? 3 : difficulty === 'normal' ? 2 : 1.5;
  
  let attackCount = 0;
  const maxAttacks = difficulty === 'easy' ? 2 : difficulty === 'normal' ? 4 : 6;
  
  while (attackCount < maxAttacks) {
    if (state.gameOver) return;
    if (checkVictory()) return;
    
    // Find best attack
    let bestAttack = null;
    let bestScore = -Infinity;
    
    const myT = state.territories.filter(t => t.owner === player.id && t.armies > 1);
    myT.forEach(t => {
      t.neighbors.forEach(nid => {
        const n = state.territories[nid];
        if (n.owner !== player.id && n.owner >= 0) {
          const advantage = t.armies - n.armies;
          if (advantage >= threshold) {
            const score = advantage - Math.random() * 0.5;
            if (score > bestScore) {
              bestScore = score;
              bestAttack = { from: t, to: n };
            }
          }
        }
      });
    });
    
    if (!bestAttack) break;
    
    // Show AI attacking
    const fromEl = document.querySelector(`[data-id="${bestAttack.from.id}"]`);
    const toEl = document.querySelector(`[data-id="${bestAttack.to.id}"]`);
    if (fromEl) fromEl.classList.add('selected');
    if (toEl) toEl.classList.add('attackable');
    
    await wait(500);
    
    // Resolve attack
    const result = await aiResolveBattle(bestAttack.from, bestAttack.to, player);
    attackCount++;
    
    if (fromEl) fromEl.classList.remove('selected');
    if (toEl) toEl.classList.remove('attackable');
    
    await wait(300);
    
    if (checkVictory()) return;
  }
  
  await wait(500);
  document.getElementById('ai-overlay').classList.remove('show');
  nextPlayer();
}

async function aiResolveBattle(atk, def, player) {
  // One round of combat
  const atkDice = rollDice(Math.min(3, atk.armies - 1));
  const defDice = rollDice(Math.min(2, def.armies));
  
  const pairs = Math.min(atkDice.length, defDice.length);
  let atkLoss = 0, defLoss = 0;
  for (let i = 0; i < pairs; i++) {
    if (atkDice[i] > defDice[i]) defLoss++;
    else atkLoss++;
  }
  
  atk.armies -= atkLoss;
  def.armies -= defLoss;
  
  updateTerritoryDisplay(atk);
  updateTerritoryDisplay(def);
  
  if (def.armies <= 0) {
    def.owner = atk.owner;
    def.armies = Math.max(1, atk.armies - 1);
    atk.armies = 1;
    updateTerritoryDisplay(atk);
    updateTerritoryDisplay(def);
    updateStatsBar();
    sfxConquer();
    showToast(`${player.name} فتح ${def.name}`, 1500);
  }
}

// ============ END TURN ============
document.getElementById('end-turn-btn').onclick = () => {
  const p = state.players[state.currentPlayer];

    if (!confirm(`لديك ${state.reinforcements} جيش لم تستخدمه. إنهاء الدور؟`)) return;
  }
  
  sfxClick();
  nextPlayer();
};

function endGame(winner) {
  state.gameOver = true;
  const modal = document.getElementById('end-modal');
  const icon = document.getElementById('end-icon');
  const title = document.getElementById('end-title');
  const sub = document.getElementById('end-sub');

    icon.textContent = '🏆';
    title.textContent = 'النصر!';
    title.className = 'end-title win';
    sub.textContent = `وحّدت العالم في ${state.turnNumber} دور`;
    sfxWin();
    vibrate([100, 50, 100, 50, 200]);
  } else {
    icon.textContent = '💀';
    title.textContent = 'هزيمة!';
    title.className = 'end-title lose';
    sub.textContent = `${winner.name} سيطر على العالم`;
    sfxLose();
    vibrate([300, 100, 300]);
  }
  
  modal.classList.add('show');
  document.getElementById('ai-overlay').classList.remove('show');
}

// ============ PREVENT DOUBLE TAP ZOOM ============
let lastTouch = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTouch <= 300) e.preventDefault();
  lastTouch = now;
}, { passive: false });
