<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0a0a14" />
<title>DK Web OS</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💻</text></svg>">
<style>
/* ============================================
   DK WEB OS - Complete Stylesheet
   ============================================ */

:root {
  --bg-primary: #0a0a14;
  --bg-secondary: #13131f;
  --bg-tertiary: #1c1c2e;
  --bg-window: #16161f;
  --bg-hover: #252538;
  --accent: #6366f1;
  --accent-hover: #7c7ff2;
  --accent-light: #818cf8;
  --text-primary: #ffffff;
  --text-secondary: #a1a1aa;
  --text-muted: #71717a;
  --border: #2a2a3e;
  --danger: #ef4444;
  --success: #22c55e;
  --warning: #f59e0b;
  --taskbar-height: 56px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "Helvetica Neue", Arial, sans-serif;
  --font-mono: "SF Mono", Monaco, "Cascadia Code", "Roboto Mono", Consolas, monospace;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
  --shadow-md: 0 8px 24px rgba(0,0,0,0.4);
  --shadow-lg: 0 20px 60px rgba(0,0,0,0.6);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  height: 100%;
  overflow: hidden;
  font-family: var(--font);
  background: var(--bg-primary);
  color: var(--text-primary);
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}

/* ============================================
   LOGIN SCREEN
   ============================================ */
#login-screen {
  position: fixed;
  inset: 0;
  background: linear-gradient(135deg, #0a0a14 0%, #1a1a2e 50%, #16213e 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10000;
  padding: 20px;
  overflow-y: auto;
}

#login-screen::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 20% 30%, rgba(99,102,241,0.15) 0%, transparent 50%),
    radial-gradient(circle at 80% 70%, rgba(139,92,246,0.15) 0%, transparent 50%);
  pointer-events: none;
}

.login-container {
  width: 100%;
  max-width: 420px;
  background: rgba(19,19,31,0.85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 40px 30px;
  box-shadow: var(--shadow-lg);
  position: relative;
  z-index: 1;
  animation: loginFade 0.5s ease;
}

@keyframes loginFade {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.login-logo {
  text-align: center;
  margin-bottom: 8px;
}

.login-logo svg {
  width: 64px;
  height: 64px;
  filter: drop-shadow(0 4px 12px rgba(99,102,241,0.5));
}

.login-title {
  text-align: center;
  font-size: 26px;
  font-weight: 700;
  margin-bottom: 6px;
  background: linear-gradient(135deg, #818cf8, #c084fc);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.login-subtitle {
  text-align: center;
  color: var(--text-secondary);
  font-size: 14px;
  margin-bottom: 30px;
}

.login-tabs {
  display: flex;
  background: var(--bg-primary);
  border-radius: var(--radius-md);
  padding: 4px;
  margin-bottom: 24px;
  border: 1px solid var(--border);
}

.login-tab {
  flex: 1;
  padding: 10px;
  background: transparent;
  border: none;
  color: var(--text-secondary);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  border-radius: var(--radius-sm);
  transition: all 0.2s;
  font-family: var(--font);
}

.login-tab.active {
  background: var(--accent);
  color: white;
  box-shadow: var(--shadow-sm);
}

.login-form {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.input-group {
  position: relative;
  display: flex;
  align-items: center;
}

.input-group svg {
  position: absolute;
  right: 14px;
  width: 18px;
  height: 18px;
  stroke: var(--text-muted);
  pointer-events: none;
}

.input-group input {
  width: 100%;
  padding: 14px 44px 14px 14px;
  background: var(--bg-primary);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  color: var(--text-primary);
  font-size: 15px;
  font-family: var(--font);
  outline: none;
  transition: all 0.2s;
  direction: rtl;
}

.input-group input:focus {
  border-color: var(--accent);
  background: var(--bg-secondary);
  box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
}

.input-group input::placeholder {
  color: var(--text-muted);
}

.btn {
  padding: 14px 20px;
  border: none;
  border-radius: var(--radius-md);
  font-size: 15px;
  font-weight: 600;
  font-family: var(--font);
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.btn-primary {
  background: var(--accent);
  color: white;
  box-shadow: 0 4px 14px rgba(99,102,241,0.4);
}

.btn-primary:hover:not(:disabled) {
  background: var(--accent-hover);
  transform: translateY(-1px);
}

.btn-primary:active:not(:disabled) {
  transform: translateY(0);
}

.btn-primary:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.btn-google {
  background: white;
  color: #333;
  border: 1px solid #ddd;
}

.btn-google:hover {
  background: #f5f5f5;
}

.btn-google svg {
  width: 20px;
  height: 20px;
}

.login-divider {
  display: flex;
  align-items: center;
  gap: 12px;
  color: var(--text-muted);
  font-size: 12px;
  margin: 8px 0;
}

.login-divider::before,
.login-divider::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--border);
}

.login-message {
  padding: 12px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  text-align: center;
  display: none;
  margin-top: 8px;
}

.login-message.error {
  background: rgba(239,68,68,0.15);
  color: #fca5a5;
  border: 1px solid rgba(239,68,68,0.3);
  display: block;
}

.login-message.success {
  background: rgba(34,197,94,0.15);
  color: #86efac;
  border: 1px solid rgba(34,197,94,0.3);
  display: block;
}

.login-loader {
  width: 20px;
  height: 20px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: white;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* ============================================
   DESKTOP
   ============================================ */
#os-screen {
  position: fixed;
  inset: 0;
  display: none;
  overflow: hidden;
}

#desktop {
  position: absolute;
  inset: 0;
  bottom: var(--taskbar-height);
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  overflow: hidden;
}

#desktop-icons {
  position: absolute;
  inset: 0;
  padding: 15px;
  display: flex;
  flex-direction: column;
  flex-wrap: wrap;
  align-content: flex-start;
  gap: 12px;
  pointer-events: none;
}

.desktop-icon {
  width: 90px;
  padding: 10px 5px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  pointer-events: auto;
  transition: background 0.15s;
  text-align: center;
}

.desktop-icon:hover {
  background: rgba(255,255,255,0.1);
}

.desktop-icon:active {
  background: rgba(255,255,255,0.2);
}

.desktop-icon svg {
  width: 42px;
  height: 42px;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
}

.desktop-icon-label {
  font-size: 12px;
  color: white;
  text-shadow: 0 1px 3px rgba(0,0,0,0.9);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 100%;
}

/* ============================================
   WINDOWS
   ============================================ */
.window {
  position: absolute;
  background: var(--bg-window);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 280px;
  min-height: 200px;
  animation: windowOpen 0.18s ease;
  transition: opacity 0.15s, transform 0.15s;
}

@keyframes windowOpen {
  from { opacity: 0; transform: scale(0.95); }
  to { opacity: 1; transform: scale(1); }
}

.window.minimized {
  display: none;
}

.window.maximized {
  top: 0 !important;
  left: 0 !important;
  width: 100% !important;
  height: 100% !important;
  border-radius: 0;
}

.window-header {
  display: flex;
  align-items: center;
  padding: 10px 14px;
  background: var(--bg-tertiary);
  border-bottom: 1px solid var(--border);
  cursor: move;
  touch-action: none;
  flex-shrink: 0;
  gap: 10px;
}

.window-header svg.window-icon {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
}

.window-title {
  flex: 1;
  font-size: 13px;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--text-primary);
}

.window-controls {
  display: flex;
  gap: 6px;
  flex-shrink: 0;
}

.window-control {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
  padding: 0;
  background: transparent;
}

.window-control svg {
  width: 12px;
  height: 12px;
  stroke: currentColor;
}

.window-control.minimize {
  background: var(--warning);
  color: #000;
}

.window-control.maximize {
  background: var(--success);
  color: #000;
}

.window-control.close {
  background: var(--danger);
  color: white;
}

.window-control:hover {
  filter: brightness(1.2);
  transform: scale(1.1);
}

.window-body {
  flex: 1;
  overflow: auto;
  position: relative;
  display: flex;
  flex-direction: column;
}

.window-resize {
  position: absolute;
  bottom: 0;
  right: 0;
  width: 18px;
  height: 18px;
  cursor: nwse-resize;
  touch-action: none;
  z-index: 10;
}

.window-resize::after {
  content: "";
  position: absolute;
  bottom: 3px;
  right: 3px;
  width: 8px;
  height: 8px;
  border-right: 2px solid var(--text-muted);
  border-bottom: 2px solid var(--text-muted);
}

/* ============================================
   TASKBAR
   ============================================ */
#taskbar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: var(--taskbar-height);
  background: rgba(19,19,31,0.92);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 10px;
  gap: 8px;
  z-index: 5000;
}

#start-btn {
  width: 42px;
  height: 42px;
  border-radius: var(--radius-md);
  border: none;
  background: transparent;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s;
  flex-shrink: 0;
}

#start-btn:hover {
  background: var(--bg-hover);
}

#start-btn.active {
  background: var(--accent);
}

#start-btn svg {
  width: 24px;
  height: 24px;
}

#taskbar-apps {
  flex: 1;
  display: flex;
  gap: 6px;
  overflow-x: auto;
  overflow-y: hidden;
  scrollbar-width: none;
  height: 100%;
  align-items: center;
}

#taskbar-apps::-webkit-scrollbar {
  display: none;
}

.taskbar-app {
  height: 40px;
  padding: 0 14px;
  border-radius: var(--radius-md);
  border: 1px solid transparent;
  background: var(--bg-tertiary);
  color: var(--text-primary);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  white-space: nowrap;
  flex-shrink: 0;
  transition: all 0.15s;
  font-family: var(--font);
  max-width: 180px;
}

.taskbar-app svg {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
}

.taskbar-app .label {
  overflow: hidden;
  text-overflow: ellipsis;
}

.taskbar-app:hover {
  background: var(--bg-hover);
}

.taskbar-app.active {
  background: var(--bg-hover);
  border-color: var(--accent);
}

#taskbar-tray {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}

.tray-icon {
  width: 32px;
  height: 32px;
  border: none;
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-sm);
  transition: background 0.15s;
  padding: 0;
}

.tray-icon:hover {
  background: var(--bg-hover);
  color: var(--text-primary);
}

.tray-icon svg {
  width: 18px;
  height: 18px;
}

#clock {
  font-size: 13px;
  font-weight: 500;
  color: var(--text-primary);
  cursor: pointer;
  padding: 6px 10px;
  border-radius: var(--radius-sm);
  text-align: center;
  line-height: 1.3;
  min-width: 80px;
}

#clock:hover {
  background: var(--bg-hover);
}

#clock .time {
  font-size: 14px;
  font-weight: 600;
}

#clock .date {
  font-size: 11px;
  color: var(--text-secondary);
}

/* ============================================
   START MENU
   ============================================ */
#start-menu {
  position: fixed;
  bottom: calc(var(--taskbar-height) + 10px);
  left: 10px;
  width: 340px;
  max-width: calc(100vw - 20px);
  max-height: 70vh;
  background: rgba(19,19,31,0.96);
  backdrop-filter: blur(30px);
  -webkit-backdrop-filter: blur(30px);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  z-index: 6000;
  display: none;
  flex-direction: column;
  overflow: hidden;
  animation: slideUp 0.2s ease;
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

#start-menu.open {
  display: flex;
}

.start-search {
  padding: 14px;
  border-bottom: 1px solid var(--border);
}

.start-search input {
  width: 100%;
  padding: 10px 14px;
  background: var(--bg-primary);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  color: var(--text-primary);
  font-size: 14px;
  outline: none;
  font-family: var(--font);
}

.start-search input:focus {
  border-color: var(--accent);
}

.start-user {
  padding: 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid var(--border);
}

.start-user-avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), #c084fc);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 16px;
  color: white;
  flex-shrink: 0;
}

.start-user-info {
  flex: 1;
  overflow: hidden;
}

.start-user-name {
  font-size: 14px;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.start-user-email {
  font-size: 12px;
  color: var(--text-secondary);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.start-apps {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  align-content: start;
}

.start-app {
  aspect-ratio: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 4px;
  background: transparent;
  border: none;
  border-radius: var(--radius-md);
  cursor: pointer;
  color: var(--text-primary);
  transition: background 0.15s;
  font-family: var(--font);
}

.start-app:hover {
  background: var(--bg-hover);
}

.start-app svg {
  width: 26px;
  height: 26px;
}

.start-app span {
  font-size: 10px;
  text-align: center;
  line-height: 1.2;
  overflow: hidden;
  text-overflow: ellipsis;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}

.start-footer {
  padding: 10px 14px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.start-footer-btn {
  background: transparent;
  border: none;
  color: var(--text-secondary);
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  font-family: var(--font);
  transition: all 0.15s;
}

.start-footer-btn:hover {
  background: var(--bg-hover);
  color: var(--text-primary);
}

.start-footer-btn svg {
  width: 16px;
  height: 16px;
}

/* ============================================
   CONTEXT MENU
   ============================================ */
#context-menu {
  position: fixed;
  background: rgba(19,19,31,0.98);
  backdrop-filter: blur(20px);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-lg);
  padding: 6px;
  min-width: 200px;
  z-index: 9000;
  display: none;
  animation: ctxFade 0.15s ease;
}

@keyframes ctxFade {
  from { opacity: 0; transform: scale(0.95); }
  to { opacity: 1; transform: scale(1); }
}

#context-menu.open {
  display: block;
}

.ctx-item {
  width: 100%;
  padding: 10px 12px;
  background: transparent;
  border: none;
  color: var(--text-primary);
  font-size: 13px;
  font-family: var(--font);
  text-align: right;
  cursor: pointer;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  gap: 10px;
  transition: background 0.1s;
}

.ctx-item:hover {
  background: var(--accent);
}

.ctx-item svg {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
}

.ctx-sep {
  height: 1px;
  background: var(--border);
  margin: 4px 0;
}

/* ============================================
   NOTIFICATIONS
   ============================================ */
#notifications {
  position: fixed;
  top: 20px;
  left: 20px;
  right: 20px;
  z-index: 9500;
  display: flex;
  flex-direction: column;
  gap: 10px;
  pointer-events: none;
  align-items: flex-end;
}

.notification {
  background: rgba(19,19,31,0.98);
  backdrop-filter: blur(20px);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  box-shadow: var(--shadow-md);
  display: flex;
  align-items: center;
  gap: 12px;
  max-width: 380px;
  pointer-events: auto;
  animation: notifIn 0.3s ease;
  border-right: 3px solid var(--accent);
}

@keyframes notifIn {
  from { opacity: 0; transform: translateX(50px); }
  to { opacity: 1; transform: translateX(0); }
}

.notification.removing {
  animation: notifOut 0.3s ease forwards;
}

@keyframes notifOut {
  to { opacity: 0; transform: translateX(50px); }
}

.notification svg {
  width: 20px;
  height: 20px;
  flex-shrink: 0;
}

.notification-content {
  flex: 1;
}

.notification-title {
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 2px;
}

.notification-message {
  font-size: 12px;
  color: var(--text-secondary);
}

/* ============================================
   APP STYLES
   ============================================ */

/* Notes App */
.notes-app {
  display: flex;
  flex-direction: column;
  height: 100%;
  background: var(--bg-window);
}

.notes-toolbar {
  padding: 10px;
  display: flex;
  gap: 8px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.notes-toolbar input {
  flex: 1;
  padding: 8px 12px;
  background: var(--bg-primary);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  font-size: 13px;
  outline: none;
  font-family: var(--font);
}

.notes-list {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.note-item {

function showNotification(title, message, type = 'info') {
  const container = document.getElementById('notifications');
  const notif = document.createElement('div');
  notif.className = 'notification';
  
  let icon = ICONS.info;
  if (type === 'success') icon = ICONS.check;
  if (type === 'error') icon = ICONS.warning;
  if (type === 'warning') icon = ICONS.warning;
  
  notif.innerHTML = `
    ${icon}
    <div class="notification-content">
      <div class="notification-title">${title}</div>
      <div class="notification-message">${message}</div>
    </div>
  `;
  
  container.appendChild(notif);
  
  setTimeout(() => {
    notif.classList.add('removing');
    setTimeout(() => notif.remove(), 300);
  }, 3500);
}

const loginScreen = document.getElementById('login-screen');
const osScreen = document.getElementById('os-screen');
const loginForm = document.getElementById('login-form');
const signupForm = document.getElementById('signup-form');
const loginMessage = document.getElementById('login-message');

document.querySelectorAll('.login-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.login-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    
    if (tab.dataset.tab === 'login') {
      loginForm.classList.remove('hidden');
      signupForm.classList.add('hidden');
    } else {
      loginForm.classList.add('hidden');
      signupForm.classList.remove('hidden');
    }
    loginMessage.className = 'login-message';
  });
});

function showLoginMessage(msg, type = 'error') {
  loginMessage.textContent = msg;
  loginMessage.className = `login-message ${type}`;
  setTimeout(() => {
    loginMessage.className = 'login-message';
  }, 5000);
}

function setLoading(btn, loading) {
  const span = btn.querySelector('span');
  const originalText = span ? span.textContent : btn.textContent;
  
  if (loading) {
    btn.disabled = true;
    if (span) {
      span.innerHTML = '<div class="login-loader" style="display:inline-block;vertical-align:middle;"></div>';
    }
  } else {
    btn.disabled = false;
    if (span) span.textContent = originalText;
  }
}

loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const btn = document.getElementById('login-submit');
  
  setLoading(btn, true);
  try {
    await signInWithEmailAndPassword(auth, email, password);
    showLoginMessage('تم تسجيل الدخول بنجاح!', 'success');
  } catch (err) {
    console.error(err);
    let msg = 'خطأ في تسجيل الدخول';
    if (err.code === 'auth/user-not-found') msg = 'الحساب غير موجود';
    else if (err.code === 'auth/wrong-password') msg = 'كلمة المرور غير صحيحة';
    else if (err.code === 'auth/invalid-email') msg = 'البريد الإلكتروني غير صالح';
    else if (err.code === 'auth/invalid-credential') msg = 'البيانات غير صحيحة';
    else if (err.code === 'auth/too-many-requests') msg = 'حاول لاحقًا، عدد المحاولات كبير';
    showLoginMessage(msg);
  } finally {
    setLoading(btn, false);
  }
});

signupForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = document.getElementById('signup-name').value.trim();
  const email = document.getElementById('signup-email').value.trim();
  const password = document.getElementById('signup-password').value;
  const btn = document.getElementById('signup-submit');
  
  setLoading(btn, true);
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, password);
    await updateProfile(cred.user, { displayName: name });
    // إنشاء مستند المستخدم في Firestore
    await setDoc(doc(db, 'users', cred.user.uid), {
      name: name,
      email: email,
      createdAt: serverTimestamp(),
      settings: userSettings
    });
    showLoginMessage('تم إنشاء الحساب بنجاح!', 'success');
  } catch (err) {
    console.error(err);
    let msg = 'خطأ في إنشاء الحساب';
    if (err.code === 'auth/email-already-in-use') msg = 'البريد مستخدم مسبقًا';
    else if (err.code === 'auth/weak-password') msg = 'كلمة المرور ضعيفة';
    else if (err.code === 'auth/invalid-email') msg = 'البريد الإلكتروني غير صالح';
    showLoginMessage(msg);
  } finally {
    setLoading(btn, false);
  }
});

document.getElementById('google-login').addEventListener('click', async () => {
  const provider = new GoogleAuthProvider();
  try {
    const result = await signInWithPopup(auth, provider);
    // إنشاء مستند المستخدم إذا لم يكن موجودًا
    const userRef = doc(db, 'users', result.user.uid);
    const userSnap = await getDoc(userRef);
    if (!userSnap.exists()) {
      await setDoc(userRef, {
        name: result.user.displayName || 'مستخدم',
        email: result.user.email,
        createdAt: serverTimestamp(),
        settings: userSettings
      });
    }
  } catch (err) {
    console.error(err);
    if (err.code === 'auth/popup-closed-by-user') return;
    showLoginMessage('خطأ في الدخول بـ Google');
  }
});

onAuthStateChanged(auth, async (user) => {
  if (user) {
    currentUser = user;
    // تحميل إعدادات المستخدم
    try {
      const userRef = doc(db, 'users', user.uid);
      const userSnap = await getDoc(userRef);
      if (userSnap.exists() && userSnap.data().settings) {
        userSettings = { ...userSettings, ...userSnap.data().settings };
      }
    } catch (e) {
      console.warn('تعذر تحميل الإعدادات:', e);
    }
    
    loginScreen.style.display = 'none';
    osScreen.style.display = 'block';
    initOS();
  } else {
    currentUser = null;
    loginScreen.style.display = 'flex';
    osScreen.style.display = 'none';
    openWindows = {};
    document.getElementById('taskbar-apps').innerHTML = '';
    document.getElementById('desktop-icons').innerHTML = '';
  }
});

// ============================================
// WINDOW MANAGER
// ============================================
function createWindow(options) {
  const {
    id,
    title,
    icon,
    content,
    width = 500,
    height = 400,
    onMount
  } = options;
  
  // إذا كانت النافذة موجودة
  if (openWindows[id]) {
    const win = openWindows[id].element;
    if (win.classList.contains('minimized')) {
      win.classList.remove('minimized');
    }
    bringToFront(win);
    updateTaskbarActiveState();
    return openWindows[id];
  }
  
  const winId = `win-${++windowCounter}`;
  const win = document.createElement('div');
  win.className = 'window';
  win.id = winId;
  win.dataset.appId = id;
  
  // حساب الموقع
  const dw = window.innerWidth;
  const dh = window.innerHeight;
  const w = Math.min(width, dw - 20);
  const h = Math.min(height, dh - 100);
  const left = Math.max(10, (dw - w) / 2 + (windowCounter % 5) * 20 - 40);
  const top = Math.max(10, (dh - h - 80) / 2 + (windowCounter % 5) * 20 - 40);
  
  win.style.left = left + 'px';
  win.style.top = top + 'px';
  win.style.width = w + 'px';
  win.style.height = h + 'px';
  win.style.zIndex = ++zIndexCounter;
  
  win.innerHTML = `
    <div class="window-header">
      <span class="window-icon">${icon || ''}</span>
      <span class="window-title">${title}</span>
      <div class="window-controls">
        <button class="window-control minimize" title="تصغير">${ICONS.minimize}</button>
        <button class="window-control maximize" title="تكبير">${ICONS.maximize}</button>
        <button class="window-control close" title="إغلاق">${ICONS.close}</button>
      </div>
    </div>
    <div class="window-body">
      ${content || ''}
    </div>
    <div class="window-resize"></div>
  `;
  
  document.getElementById('desktop').appendChild(win);
  
  const body = win.querySelector('.window-body');
  
  // إغلاق
  win.querySelector('.window-control.close').addEventListener('click', (e) => {
    e.stopPropagation();
    closeWindow(id);
  });
  
  // تصغير
  win.querySelector('.window-control.minimize').addEventListener('click', (e) => {
    e.stopPropagation();
    win.classList.add('minimized');
    updateTaskbarActiveState();
  });
  
  // تكبير
  win.querySelector('.window-control.maximize').addEventListener('click', (e) => {
    e.stopPropagation();
    win.classList.toggle('maximized');
  });
  
  // السحب
  makeDraggable(win);
  
  // التكبير بالحجم
  makeResizable(win);
  
  // التركيز
  win.addEventListener('mousedown', () => {
    bringToFront(win);
    updateTaskbarActiveState();
  });
  win.addEventListener('touchstart', () => {
    bringToFront(win);
    updateTaskbarActiveState();
  }, { passive: true });
  
  openWindows[id] = { element: win, title, icon };
  
  addTaskbarApp(id, title, icon);
  updateTaskbarActiveState();
  
  // استدعاء onMount بعد الإضافة
  if (onMount) {
    setTimeout(() => onMount(body, win), 0);
  }
  
  return openWindows[id];
}

function closeWindow(id) {
  const entry = openWindows[id];
  if (!entry) return;
  
  const win = entry.element;
  win.style.opacity = '0';
  win.style.transform = 'scale(0.95)';
  
  setTimeout(() => {
    win.remove();
    delete openWindows[id];
    removeTaskbarApp(id);
    updateTaskbarActiveState();
  }, 150);
}

function bringToFront(win) {
  win.style.zIndex = ++zIndexCounter;
}

function makeDraggable(win) {
  const header = win.querySelector('.window-header');
  let isDragging = false;
  let startX, startY, startLeft, startTop;
  
  const start = (e) => {
    if (win.classList.contains('maximized')) return;
    if (e.target.closest('.window-control')) return;
    
    isDragging = true;
    const point = e.touches ? e.touches[0] : e;
    startX = point.clientX;
    startY = point.clientY;
    startLeft = win.offsetLeft;
    startTop = win.offsetTop;
    bringToFront(win);
  };
  
  const move = (e) => {
    if (!isDragging) return;
    const point = e.touches ? e.touches[0] : e;
    const dx = point.clientX - startX;
    const dy = point.clientY - startY;
    
    let newLeft = startLeft + dx;
    let newTop = startTop + dy;
    
    // الحدود
    newLeft = Math.max(-win.offsetWidth + 100, Math.min(window.innerWidth - 100, newLeft));
    newTop = Math.max(0, Math.min(window.innerHeight - 100, newTop));
    
    win.style.left = newLeft + 'px';
    win.style.top = newTop + 'px';
    
    if (e.cancelable) e.preventDefault();
  };
  
  const end = () => { isDragging = false; };
  
  header.addEventListener('mousedown', start);
  header.addEventListener('touchstart', start, { passive: true });
  document.addEventListener('mousemove', move);
  document.addEventListener('touchmove', move, { passive: false });
  document.addEventListener('mouseup', end);
  document.addEventListener('touchend', end);
}

function makeResizable(win) {
  const handle = win.querySelector('.window-resize');
  let isResizing = false;
  let startX, startY, startW, startH;
  
  const start = (e) => {
    if (win.classList.contains('maximized')) return;
    isResizing = true;
    const point = e.touches ? e.touches[0] : e;
    startX = point.clientX;
    startY = point.clientY;
    startW = win.offsetWidth;
    startH = win.offsetHeight;
    bringToFront(win);
    if (e.cancelable) e.preventDefault();
  };
  
  const move = (e) => {
    if (!isResizing) return;
    const point = e.touches ? e.touches[0] : e;
    const dw = startX - point.clientX;
    const dh = point.clientY - startY;
    win.style.width = Math.max(280, startW + dw) + 'px';
    win.style.height = Math.max(200, startH + dh) + 'px';
    if (e.cancelable) e.preventDefault();
  };
  
  const end = () => { isResizing = false; };
  
  handle.addEventListener('mousedown', start);
  handle.addEventListener('touchstart', start, { passive: false });
  document.addEventListener('mousemove', move);
  document.addEventListener('touchmove', move, { passive: false });
  document.addEventListener('mouseup', end);
  document.addEventListener('touchend', end);
}

function addTaskbarApp(id, title, icon) {
  const container = document.getElementById('taskbar-apps');
  const btn = document.createElement('button');
  btn.className = 'taskbar-app';
  btn.dataset.appId = id;
  btn.innerHTML = `
    ${icon || ''}
    <span class="label">${title}</span>
  `;
  btn.addEventListener('click', () => {
    const entry = openWindows[id];
    if (!entry) return;
    const win = entry.element;
    
    if (win.classList.contains('minimized')) {
      win.classList.remove('minimized');
      bringToFront(win);
    } else if (parseInt(win.style.zIndex) === zIndexCounter) {
      win.classList.add('minimized');
    } else {
      bringToFront(win);
    }
    updateTaskbarActiveState();
  });
  container.appendChild(btn);
}

function removeTaskbarApp(id) {
  const btn = document.querySelector(`.taskbar-app[data-app-id="${id}"]`);
  if (btn) btn.remove();
}

function updateTaskbarActiveState() {
  document.querySelectorAll('.taskbar-app').forEach(btn => {
    const entry = openWindows[btn.dataset.appId];
    if (!entry) return;
    const win = entry.element;
    const isActive = !win.classList.contains('minimized') && parseInt(win.style.zIndex) === zIndexCounter;
    btn.classList.toggle('active', isActive);
  });
}

}

  // تعديل الموقع
  const rect = contextMenu.getBoundingClientRect();
  let cx = x, cy = y;
  if (x + rect.width > window.innerWidth) cx = window.innerWidth - rect.width - 10;
  if (y + rect.height > window.innerHeight) cy = window.innerHeight - rect.height - 10;
  contextMenu.style.left = Math.max(5, cx) + 'px';
  contextMenu.style.top = Math.max(5, cy) + 'px';
  
  contextMenu.querySelectorAll('.ctx-item').forEach(item => {
    item.addEventListener('click', () => {
      const action = item.dataset.action;
      contextMenu.classList.remove('open');
      
      if (action === 'refresh') {
        location.reload();
      } else if (action === 'wallpaper') {
        openApp('settings');
        setTimeout(() => {
          const btn = document.querySelector('[data-settings-nav="appearance"]');
          if (btn) btn.click();
        }, 200);
      } else if (action === 'new-note') {
        openApp('notes');
      } else if (action === 'settings') {
        openApp('settings');
      } else if (action === 'about') {
        openApp('about');
      }
    });
  });
}

document.addEventListener('click', (e) => {
  if (!contextMenu.contains(e.target)) {
    contextMenu.classList.remove('open');
  }
});

function setupDesktopEvents() {
  // Long-press للهاتف لفتح قائمة السياق
  let pressTimer;
  desktop.addEventListener('touchstart', (e) => {
    if (e.target.closest('.window')) return;
    pressTimer = setTimeout(() => {
      const touch = e.touches[0];
      showContextMenu(touch.clientX, touch.clientY);
    }, 600);
  }, { passive: true });
  
  desktop.addEventListener('touchend', () => clearTimeout(pressTimer));
  desktop.addEventListener('touchmove', () => clearTimeout(pressTimer));
}

function openCalculatorApp() {
  createWindow({
    id: 'calculator',
    title: 'الآلة الحاسبة',
    icon: ICONS.calculator,
    width: 320,
    height: 480,
    content: `
      <div class="calc-app">
        <div class="calc-display">
          <div class="calc-history" id="calc-history"></div>
          <div id="calc-result">0</div>
        </div>
        <div class="calc-buttons">
          <button class="calc-btn clear" data-action="clear">C</button>
          <button class="calc-btn op" data-action="op" data-op="%">%</button>
          <button class="calc-btn op" data-action="op" data-op="/">÷</button>
          <button class="calc-btn op" data-action="del">⌫</button>
          
          <button class="calc-btn" data-num="7">7</button>
          <button class="calc-btn" data-num="8">8</button>
          <button class="calc-btn" data-num="9">9</button>
          <button class="calc-btn op" data-action="op" data-op="*">×</button>
          
          <button class="calc-btn" data-num="4">4</button>
          <button class="calc-btn" data-num="5">5</button>
          <button class="calc-btn" data-num="6">6</button>
          <button class="calc-btn op" data-action="op" data-op="-">−</button>
          
          <button class="calc-btn" data-num="1">1</button>
          <button class="calc-btn" data-num="2">2</button>
          <button class="calc-btn" data-num="3">3</button>
          <button class="calc-btn op" data-action="op" data-op="+">+</button>
          
          <button class="calc-btn" data-num="0">0</button>
          <button class="calc-btn" data-num=".">.</button>
          <button class="calc-btn equals" data-action="equals" style="grid-column: span 2;">=</button>
        </div>
      </div>
    `,
    onMount: (body) => {
      let current = '0';
      let previous = '';
      let operation = null;
      let shouldReset = false;
      
      const result = body.querySelector('#calc-result');
      const history = body.querySelector('#calc-history');
      
      const updateDisplay = () => {
        result.textContent = current;
        history.textContent = previous ? `${previous} ${operation || ''}` : '';
      };
      
      body.querySelectorAll('.calc-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          if (btn.dataset.num !== undefined) {
            const num = btn.dataset.num;
            if (shouldReset) {
              current = num === '.' ? '0.' : num;
              shouldReset = false;
            } else {
              if (num === '.' && current.includes('.')) return;
              current = current === '0' && num !== '.' ? num : current + num;
            }
          } else if (btn.dataset.action === 'clear') {
            current = '0';
            previous = '';
            operation = null;
            shouldReset = false;
          } else if (btn.dataset.action === 'del') {
            current = current.length > 1 ? current.slice(0, -1) : '0';
          } else if (btn.dataset.action === 'op') {
            if (operation && !shouldReset) {
              // احسب أولاً
              const res = compute(parseFloat(previous), parseFloat(current), operation);
              current = String(res);
            }
            previous = current;
            operation = btn.dataset.op;
            shouldReset = true;
          } else if (btn.dataset.action === 'equals') {
            if (operation) {
              const res = compute(parseFloat(previous), parseFloat(current), operation);
              current = String(res);
              previous = '';
              operation = null;
              shouldReset = true;
            }
          }
          updateDisplay();
        });
      });
      
      function compute(a, b, op) {
        switch(op) {
          case '+': return a + b;
          case '-': return a - b;
          case '*': return a * b;
          case '/': return b !== 0 ? a / b : 'خطأ';
          case '%': return a % b;
          default: return b;
        }
      }
      
      updateDisplay();
    }
  });
}

function openTerminalApp() {
  createWindow({
    id: 'terminal',
    title: 'الطرفية',
    icon: ICONS.terminal,
    width: 600,
    height: 400,
    content: `
      <div class="terminal-app" id="terminal">
        <div class="terminal-line">DK Web OS Terminal v1.0.0</div>
        <div class="terminal-line">اكتب "help" لعرض الأوامر المتاحة</div>
        <div class="terminal-line">&nbsp;</div>
        <div id="terminal-output"></div>
        <div class="terminal-input-line">
          <span class="terminal-prompt">user@dk-os:~$</span>
          <input type="text" class="terminal-input" id="terminal-input" autocomplete="off" autofocus />
        </div>
      </div>
    `,
    onMount: (body) => {
      const output = body.querySelector('#terminal-output');
      const input = body.querySelector('#terminal-input');
      const terminal = body.querySelector('#terminal');
      
      const history = [];
      let historyIndex = -1;
      
      const print = (text, color) => {
        const line = document.createElement('div');
        line.className = 'terminal-line';
        if (color) line.style.color = color;
        line.textContent = text;
        output.appendChild(line);
        terminal.scrollTop = terminal.scrollHeight;
      };
      
      const commands = {
        help: () => {
          print('الأوامر المتاحة:');
          print('  help        - عرض هذه القائمة');
          print('  clear       - مسح الشاشة');
          print('  date        - عرض التاريخ والوقت');
          print('  whoami      - عرض المستخدم الحالي');
          print('  echo [نص]   - طباعة النص');
          print('  ls          - عرض الملفات');
          print('  open [app]  - فتح تطبيق');
          print('  apps        - قائمة التطبيقات');
          print('  exit        - إغلاق الطرفية');
        },
        clear: () => {
          output.innerHTML = '';
        },
        date: () => {
          print(new Date().toLocaleString('ar-DZ'));
        },
        whoami: () => {
          print(currentUser.displayName || 'مستخدم');
          print(currentUser.email);
        },
        echo: (args) => {
          print(args.join(' '));
        },
        ls: () => {
          print('📁 Desktop/');
          print('📁 Documents/');
          print('📁 Pictures/');
          print('📄 notes.txt');
        },
        apps: () => {
          Object.entries(APPS).forEach(([id, def]) => {
            print(`  ${id.padEnd(15)} - ${def.name}`);
          });
        },
        open: (args) => {
          if (!args[0]) {
            print('الاستخدام: open [app-id]', '#f59e0b');
            return;
          }
          if (APPS[args[0]]) {
            openApp(args[0]);
            print(`تم فتح ${APPS[args[0]].name}`, '#22c55e');
          } else {
            print(`تطبيق غير موجود: ${args[0]}`, '#ef4444');
          }
        },
        exit: () => {
          closeWindow('terminal');
        }
      };
      
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          const cmd = input.value.trim();
          if (!cmd) return;
          print(`user@dk-os:~$ ${cmd}`, '#00ff00');
          history.push(cmd);
          historyIndex = history.length;
          
          const parts = cmd.split(' ');
          const command = parts[0];
          const args = parts.slice(1);
          
          if (commands[command]) {
            commands[command](args);
          } else {
            print(`الأمر غير موجود: ${command}`, '#ef4444');
            print('اكتب "help" للأوامر المتاحة', '#f59e0b');
          }
          
          input.value = '';
        } else if (e.key === 'ArrowUp') {
          if (historyIndex > 0) {
            historyIndex--;
            input.value = history[historyIndex];
          }
          e.preventDefault();
        } else if (e.key === 'ArrowDown') {
          if (historyIndex < history.length - 1) {
            historyIndex++;
            input.value = history[historyIndex];
          } else {
            historyIndex = history.length;
            input.value = '';
          }
          e.preventDefault();
        }
      });
      
      terminal.addEventListener('click', () => input.focus());
    }
  });
}

          <div class="loading-app"><div class="spinner"></div><span>جاري التحميل...</span></div>
        </div>
      </div>
    `,
    onMount: async (body) => {
      const grid = body.querySelector('#files-grid');
      
      const loadFiles = async () => {
        grid.innerHTML = '<div class="loading-app"><div class="spinner"></div><span>جاري التحميل...</span></div>';
        try {
          const q = query(collection(db, 'files'), where('userId', '==', currentUser.uid));
          const snap = await getDocs(q);
          const files = [];
          snap.forEach(d => files.push({ id: d.id, ...d.data() }));
          
          if (files.length === 0) {
            grid.innerHTML = `
              <div class="empty-state" style="grid-column: 1/-1;">
                ${ICONS.folder}
                <p>لا توجد ملفات</p>
                <p style="margin-top:8px;font-size:11px;">اضغط "جديد" لإضافة ملف</p>
              </div>
            `;
            return;
          }
          
          grid.innerHTML = '';
          files.forEach(file => {
            const item = document.createElement('div');
            item.className = 'file-item';
            const isImage = (file.type || '').startsWith('image/');
            item.innerHTML = `
              ${isImage ? ICONS.image : ICONS.file}
              <div class="file-item-name">${escapeHtml(file.name)}</div>
            `;
            item.addEventListener('click', () => {
              showNotification(file.name, file.content || 'ملف فارغ', 'info');
            });
            grid.appendChild(item);
          });
        } catch (e) {
          console.error(e);
          grid.innerHTML = '<div class="empty-state"><p>خطأ في التحميل</p></div>';
        }
      };
      
      body.querySelector('#files-new').addEventListener('click', async () => {
        const name = prompt('اسم الملف:');
        if (!name) return;
        await addDoc(collection(db, 'files'), {
          name,
          content: '',
          type: 'text/plain',
          userId: currentUser.uid,
          createdAt: serverTimestamp()
        });
        showNotification('تم', 'تم إنشاء الملف', 'success');
        loadFiles();
      });
      
      body.querySelector('#files-refresh').addEventListener('click', loadFiles);
      
      await loadFiles();
    }
  });
}

        }
      });
      
      body.querySelector('#music-prev').addEventListener('click', () => {
        progress = 0;
        progressBar.style.width = '0%';
      });

// PAINT APP
// ============================================
function openPaintApp() {
  createWindow({
    id: 'paint',
    title: 'الرسم',
    icon: ICONS.paint,
    width: 700,
    height: 550,
    content: `
      <div class="paint-app">
        <div class="paint-toolbar">
          <button class="paint-tool active" data-tool="brush" title="فرشاة">${ICONS.brush}</button>
          <button class="paint-tool" data-tool="eraser" title="ممحاة">${ICONS.eraser}</button>
          <div style="width:1px;height:24px;background:var(--border);margin:0 4px;"></div>
          <button class="paint-color active" data-color="#000000" style="background:#000;"></button>
          <button class="paint-color" data-color="#ef4444" style="background:#ef4444;"></button>
          <button class="paint-color" data-color="#f59e0b" style="background:#f59e0b;"></button>
          <button class="paint-color" data-color="#22c55e" style="background:#22c55e;"></button>
          <button class="paint-color" data-color="#3b82f6" style="background:#3b82f6;"></button>
          <button class="paint-color" data-color="#8b5cf6" style="background:#8b5cf6;"></button>
          <button class="paint-color" data-color="#ec4899" style="background:#ec4899;"></button>
          <div style="width:1px;height:24px;background:var(--border);margin:0 4px;"></div>
          <button class="settings-btn" id="paint-clear">مسح</button>
        </div>
        <canvas class="paint-canvas" id="paint-canvas"></canvas>
      </div>
    `,
    onMount: (body) => {
      const canvas = body.querySelector('#paint-canvas');
      const ctx = canvas.getContext('2d');
      let isDrawing = false;
      let tool = 'brush';
      let color = '#000000';
      
      const resize = () => {
        const parent = canvas.parentElement;
        const w = parent.clientWidth;
        const h = parent.clientHeight;
        const imageData = canvas.width ? ctx.getImageData(0, 0, canvas.width, canvas.height) : null;
        canvas.width = w;
        canvas.height = h;
        ctx.fillStyle = 'white';
        ctx.fillRect(0, 0, w, h);
        if (imageData) {
          try { ctx.putImageData(imageData, 0, 0); } catch(e){}
        }
      };
      
      setTimeout(resize, 50);
      window.addEventListener('resize', resize);
      
      const getPos = (e) => {
        const rect = canvas.getBoundingClientRect();
        const point = e.touches ? e.touches[0] : e;
        return {
          x: point.clientX - rect.left,
          y: point.clientY - rect.top
        };
      };
      
      const start = (e) => {
        isDrawing = true;
        const { x, y } = getPos(e);
        ctx.beginPath();
        ctx.moveTo(x, y);
        if (e.cancelable) e.preventDefault();
      };
      
      const draw = (e) => {
        if (!isDrawing) return;
        const { x, y } = getPos(e);
        ctx.lineTo(x, y);
        ctx.strokeStyle = tool === 'eraser' ? 'white' : color;
        ctx.lineWidth = tool === 'eraser' ? 20 : 3;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.stroke();
        if (e.cancelable) e.preventDefault();
      };
      
      const end = () => { isDrawing = false; };
      
      canvas.addEventListener('mousedown', start);
      canvas.addEventListener('mousemove', draw);
      canvas.addEventListener('mouseup', end);
      canvas.addEventListener('mouseleave', end);
      
      canvas.addEventListener('touchstart', start, { passive: false });
      canvas.addEventListener('touchmove', draw, { passive: false });
      canvas.addEventListener('touchend', end);
      
      body.querySelectorAll('.paint-tool').forEach(btn => {
        btn.addEventListener('click', () => {
          body.querySelectorAll('.paint-tool').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          tool = btn.dataset.tool;
        });
      });
      
      body.querySelectorAll('.paint-color').forEach(btn => {
        btn.addEventListener('click', () => {
          body.querySelectorAll('.paint-color').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          color = btn.dataset.color;
          tool = 'brush';
          body.querySelectorAll('.paint-tool').forEach(b => b.classList.remove('active'));
          body.querySelector('[data-tool="brush"]').classList.add('active');
        });
      });
      
      body.querySelector('#paint-clear').addEventListener('click', () => {
        if (confirm('مسح كل الرسم؟')) {
          ctx.fillStyle = 'white';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
      });
    }
  });
}

function openCalendarApp() {
  createWindow({
    id: 'calendar',
    title: 'التقويم',
    icon: ICONS.calendar,
    width: 420,
    height: 480,
    content: `
      <div class="calendar-app">
        <div class="calendar-header">
          <div class="calendar-title" id="cal-title"></div>
          <div class="calendar-nav">
            <button id="cal-prev">${ICONS.back}</button>
            <button id="cal-next">${ICONS.forward}</button>
          </div>
        </div>
        <div class="calendar-grid" id="cal-grid"></div>
      </div>
    `,
    onMount: (body) => {
      let currentDate = new Date();
      const title = body.querySelector('#cal-title');
      const grid = body.querySelector('#cal-grid');
      
      const render = () => {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        
        title.textContent = currentDate.toLocaleDateString('ar-DZ', { month: 'long', year: 'numeric' });
        
        const days = ['أحد', 'إثن', 'ثلا', 'أرب', 'خمي', 'جمع', 'سبت'];
        grid.innerHTML = '';
        
        days.forEach(d => {
          const el = document.createElement('div');
          el.className = 'calendar-day-name';
          el.textContent = d;
          grid.appendChild(el);
        });
        
        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const daysInPrev = new Date(year, month, 0).getDate();
        const today = new Date();
        
        for (let i = firstDay - 1; i >= 0; i--) {
          const el = document.createElement('div');
          el.className = 'calendar-day other-month';
          el.textContent = daysInPrev - i;
          grid.appendChild(el);
        }
        
        for (let i = 1; i <= daysInMonth; i++) {
          const el = document.createElement('div');
          el.className = 'calendar-day';
          if (i === today.getDate() && month === today.getMonth() && year === today.getFullYear()) {
            el.classList.add('today');
          }
          el.textContent = i;
          grid.appendChild(el);
        }
        
        const total = firstDay + daysInMonth;
        const remaining = (7 - total % 7) % 7;
        for (let i = 1; i <= remaining; i++) {
          const el = document.createElement('div');
          el.className = 'calendar-day other-month';
          el.textContent = i;
          grid.appendChild(el);
        }
      };
      
      body.querySelector('#cal-prev').addEventListener('click', () => {
        currentDate.setMonth(currentDate.getMonth() - 1);
        render();
      });
      
      body.querySelector('#cal-next').addEventListener('click', () => {
        currentDate.setMonth(currentDate.getMonth() + 1);
        render();
      });
      
      render();
    }
  });
}

function openEditorApp() {
  createWindow({
    id: 'editor',
    title: 'المحرر النصي',
    icon: ICONS.editor,
    width: 600,
    height: 450,
    content: `
      <div class="editor-app">
        <div class="editor-toolbar">
          <button id="ed-new">${ICONS.plus} جديد</button>
          <button id="ed-save">${ICONS.save} حفظ</button>
          <button id="ed-download">⬇️ تحميل</button>

          <span id="ed-status" style="font-size:11px;color:var(--text-secondary);padding:6px;"></span>
        </div>
        <textarea class="editor-textarea" id="ed-text" placeholder="اكتب هنا..."></textarea>
      </div>
    `,
    onMount: (body) => {
      const text = body.querySelector('#ed-text');
      const status = body.querySelector('#ed-status');
      
      const updateStatus = () => {
        const chars = text.value.length;
        const words = text.value.trim() ? text.value.trim().split(/\s+/).length : 0;
        status.textContent = `${words} كلمة، ${chars} حرف`;
      };
      
      text.addEventListener('input', updateStatus);
      
      body.querySelector('#ed-new').addEventListener('click', () => {
        if (text.value && !confirm('فقدان التغييرات غير المحفوظة؟')) return;
        text.value = '';
        updateStatus();
      });
      
      body.querySelector('#ed-save').addEventListener('click', async () => {
        const name = prompt('اسم الملف:', 'document.txt');
        if (!name) return;
        try {
          await addDoc(collection(db, 'files'), {
            name, content: text.value, type: 'text/plain',
            userId: currentUser.uid,
            createdAt: serverTimestamp()
          });
          showNotification('تم الحفظ', 'تم حفظ الملف في Firestore', 'success');
        } catch (e) {
          showNotification('خطأ', 'تعذر الحفظ', 'error');
        }
      });
      
      body.querySelector('#ed-download').addEventListener('click', () => {
        const blob = new Blob([text.value], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'document.txt';
        a.click();
        URL.revokeObjectURL(url);
      });
      
      updateStatus();
    }
  });
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text || '';
  return div.innerHTML;
}

// ============================================
// KEYBOARD SHORTCUTS
// ============================================
document.addEventListener('keydown', (e) => {
  // Escape لإغلاق قائمة ابدأ
  if (e.key === 'Escape') {
    closeStartMenu();
    contextMenu.classList.remove('open');
  }
  
  // Ctrl+Alt+T للطرفية
  if (e.ctrlKey && e.altKey && e.key === 't') {
    e.preventDefault();
    openTerminalApp();
  }
  
  // Super/Escape لفتح قائمة ابدأ
  if (e.key === 'Meta') {
    e.preventDefault();
    startBtn.click();
  }
});

  });
});

// ============================================
// PREVENT ZOOM ON DOUBLE TAP
// ============================================
let lastTouchEnd = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTouchEnd <= 300) {
    e.preventDefault();
  }
  lastTouchEnd = now;
}, { passive: false });
