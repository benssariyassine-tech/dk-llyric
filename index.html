<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>Attack on Titan - Interactive Episode</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body, html {
        width: 100%; height: 100%; overflow: hidden;
        background: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        touch-action: manipulation;
    }
    
    #episode-container {
        position: relative; width: 100%; height: 100%; overflow: hidden;
        cursor: pointer; background: #000;
    }

    /* الشاشة السينمائية (الأشرطة السوداء) */
    .cinematic-bar {
        position: absolute; left: 0; width: 100%; height: 8vh;
        background: #000; z-index: 100; pointer-events: none;
        transition: height 1s ease-in-out;
    }
    .top-bar { top: 0; }
    .bottom-bar { bottom: 0; }

    /* المشهد والخلفية */
    #scene-bg {
        position: absolute; inset: 0;
        background-size: cover; background-position: center;
        transition: transform 5s ease-out, filter 1s;
        transform: scale(1);
    }
    
    /* الشخصية */
    #character {
        position: absolute; bottom: -5%; left: 50%;
        transform: translateX(-50%) scale(1);
        height: 85%; max-height: 800px;
        object-fit: contain;
        filter: drop-shadow(0 0 20px rgba(0,0,0,0.8));
        transition: all 0.5s ease;
        opacity: 0; z-index: 10;
    }

    /* تأثير الاهتزاز */
    .shake {
        animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
    }
    @keyframes shake {
        10%, 90% { transform: translate3d(-2px, 0, 0) scale(1.05); }
        20%, 80% { transform: translate3d(4px, 0, 0) scale(1.05); }
        30%, 50%, 70% { transform: translate3d(-6px, 0, 0) scale(1.05); }
        40%, 60% { transform: translate3d(6px, 0, 0) scale(1.05); }
    }

    /* صندوق الحوار */
    #dialogue-box {
        position: absolute; bottom: 10vh; left: 5%; right: 5%;
        background: rgba(0, 0, 0, 0.85);
        border: 2px solid #fff;
        border-radius: 10px; padding: 20px;
        z-index: 200; backdrop-filter: blur(5px);
        box-shadow: 0 10px 30px rgba(0,0,0,0.9), inset 0 0 20px rgba(255,255,255,0.1);
        display: none;
    }
    #speaker-name {
        position: absolute; top: -18px; right: 20px;
        background: #fff; color: #000;
        padding: 4px 15px; border-radius: 5px;
        font-weight: bold; font-size: 16px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    #dialogue-text {
        color: #fff; font-size: 18px; line-height: 1.6;
        text-shadow: 0 2px 4px #000; min-height: 60px;
    }
    #next-hint {
        position: absolute; bottom: 10px; left: 20px;
        color: #888; font-size: 14px; animation: blink 1s infinite;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    /* تأثيرات إضافية */
    .flash-white {
        position: absolute; inset: 0; background: #fff;
        z-index: 500; opacity: 0; pointer-events: none;
    }
    .flash-red {
        position: absolute; inset: 0; background: #ff0000;
        z-index: 500; opacity: 0; pointer-events: none;
        mix-blend-mode: overlay;
    }
    
    /* شاشة البداية */
    #start-screen {
        position: absolute; inset: 0; z-index: 1000;
        background: #000; display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        color: white; text-align: center;
    }
    #start-screen h1 {
        font-size: 36px; letter-spacing: 2px; margin-bottom: 10px;
        color: #fff; text-shadow: 0 0 20px #ff0000;
    }
    #start-screen p { color: #888; margin-bottom: 30px; }
    #start-btn {
        padding: 15px 40px; font-size: 20px; font-weight: bold;
        background: #fff; color: #000; border: none; border-radius: 50px;
        cursor: pointer; box-shadow: 0 0 20px rgba(255,255,255,0.3);
        transition: transform 0.2s;
    }
    #start-btn:active { transform: scale(0.95); }
    
    /* السرعة (خطوط الأكشن) */
    .speed-lines {
        position: absolute; inset: 0; z-index: 15;
        background: repeating-linear-gradient(
            90deg,
            transparent,
            transparent 20px,
            rgba(255,255,255,0.1) 20px,
            rgba(255,255,255,0.1) 22px
        );
        opacity: 0; transition: opacity 0.3s; pointer-events: none;
    }
</style>
</head>
<body>

<div id="episode-container" onclick="nextDialogue()">
    
    <!-- شاشة البداية -->
    <div id="start-screen">
        <h1>進撃の巨人</h1>
        <p>الهجوم على العمالقة - الحلقة التفاعلية</p>
        <button id="start-btn" onclick="startEpisode(event)">ابدأ الحلقة</button>
    </div>

    <!-- أشرطة سينمائية -->
    <div class="cinematic-bar top-bar"></div>
    <div class="cinematic-bar bottom-bar"></div>

    <!-- الخلفيات والشخصيات -->
    <div id="scene-bg"></div>
    <div class="speed-lines" id="speed-lines"></div>
    <img id="character" src="" alt="Character">
    
    <!-- تأثيرات الضوء -->
    <div class="flash-white" id="flash-white"></div>
    <div class="flash-red" id="flash-red"></div>

    <!-- صندوق الحوار -->
    <div id="dialogue-box">
        <div id="speaker-name">إرين</div>
        <div id="dialogue-text"></div>
        <div id="next-hint">اضغط للمتابعة ▼</div>
    </div>

</div>

<script>
    // ============ السيناريو والحوارات ============
    const script = [
        {
            speaker: "الراوي",
            text: "في عام 845، سقط السور الخارجي... ودخلت العمالقة إلى المدينة.",
            bg: "https://images.unsplash.com/photo-1506459225024-1428097a7e18?q=80&w=1000&auto=format&fit=crop", // خلفية درامية
            char: null,
            effect: "shake",
            sound: "rumble"
        },
        {
            speaker: "إرين",
            text: "ميكاسا... أين أنت؟! لقد دمروا كل شيء... عائلتي، مدينتي، كل شيء!",
            bg: "https://images.unsplash.com/photo-1506459225024-1428097a7e18?q=80&w=1000&auto=format&fit=crop",
            char: "https://i.pinimg.com/736x/8a/e8/76/8ae8768b8007dccb39652f9134f1d9c8.jpg", // صورة إرين
            effect: "zoom",
            sound: "scream"
        },
        {
            speaker: "ميكاسا",
            text: "إرين، ابقَ خلفي. أنا سأحميك. هذا هو عالمنا القاسي.",
            bg: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1000&auto=format&fit=crop", // خلفية حمراء
            char: "https://i.pinimg.com/736x/e4/e0/79/e4e079e7f9fb7b8c5e7f9fc0d8d9f1c8.jpg", // صورة ميكاسا
            effect: "none",
            sound: "calm"
        },
        {
            speaker: "ليفاي",
            text: "ابتعدوا من طريقي. سأقضي على هؤلاء الحشرات بنفسي. اختر قراراً لن تندم عليه.",
            bg: "https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=1000&auto=format&fit=crop",
            char: "https://i.pinimg.com/736x/c2/54/2c/c2542cf4f2f1b3a51e1b2f9e7b6d2a1c.jpg", // صورة ليفاي
            effect: "red_flash",
            sound: "blade"
        },
        {
            speaker: "إرين",
            text: "أقسم... سأقضي على كل العمالقة! واحداً تلو الآخر! حتى آخر نفس في جسدي!",
            bg: "https://images.unsplash.com/photo-1519681393784-d120267933ba?q=80&w=1000&auto=format&fit=crop",
            char: "https://i.pinimg.com/736x/8a/e8/76/8ae8768b8007dccb39652f9134f1d9c8.jpg",
            effect: "shake",
            sound: "roar"
        },
        {
            speaker: "الراوي",
            text: "وهكذا بدأت رحلة فيلق الاستطلاع... للتضحية بقلوبهم من أجل البشرية.",
            bg: "https://images.unsplash.com/photo-1506459225024-1428097a7e18?q=80&w=1000&auto=format&fit=crop",
            char: null,
            effect: "white_flash",
            sound: "epic"
        }
    ];

    let currentIndex = 0;
    let isTyping = false;
    let typingTimer;
    let audioCtx;

    // ============ تهيئة المؤثرات الصوتية ============
    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function playSound(type) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'rumble') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(50, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 2);
            gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 2);
            osc.start(); osc.stop(audioCtx.currentTime + 2);
        } else if (type === 'scream' || type === 'roar') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.5);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.start(); osc.stop(audioCtx.currentTime + 0.5);
        } else if (type === 'blade') {
            osc.type = 'square'; osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        } else if (type === 'epic') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(400, audioCtx.currentTime + 2);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 3);
            osc.start(); osc.stop(audioCtx.currentTime + 3);
        }
    }

    // ============ بدء الحلقة ============
    function startEpisode(e) {
        e.stopPropagation();
        initAudio();
        // تفعيل الصوت في الهواتف
        if (audioCtx.state === 'suspended') audioCtx.resume();
        
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('dialogue-box').style.display = 'block';
        
        // تصغير الأشرطة السينمائية للتركيز على المشهد
        document.querySelector('.top-bar').style.height = '6vh';
        document.querySelector('.bottom-bar').style.height = '6vh';
        
        currentIndex = -1;
        nextDialogue();
    }

    // ============ الانتقال للحوار التالي ============
    function nextDialogue() {
        if (document.getElementById('start-screen').style.display !== 'none') return;

        // إذا كان النص مازال يتكتب، كمله فوراً
        if (isTyping) {
            clearInterval(typingTimer);
            document.getElementById('dialogue-text').innerText = script[currentIndex].text;
            isTyping = false;
            return;
        }

        currentIndex++;
        if (currentIndex >= script.length) {
            // نهاية الحلقة
            document.getElementById('dialogue-text').innerText = "شكراً للمشاهدة. اضغط لإعادة التشغيل.";
            document.getElementById('speaker-name').innerText = "النهاية";
            currentIndex = -1;
            return;
        }

        const scene = script[currentIndex];
        
        // تحديث الشخصية
        const charImg = document.getElementById('character');
        if (scene.char) {
            charImg.style.opacity = '0';
            setTimeout(() => {
                charImg.src = scene.char;
                charImg.style.opacity = '1';
            }, 200);
        } else {
            charImg.style.opacity = '0';
        }

        // تحديث الخلفية
        const bg = document.getElementById('scene-bg');
        bg.style.transform = 'scale(1.1)'; // زووم سينمائي
        setTimeout(() => {
            bg.style.backgroundImage = `linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.8)), url('${scene.bg}')`;
        }, 300);

        // المؤثرات
        const container = document.getElementById('episode-container');
        container.classList.remove('shake');
        
        if (scene.effect === 'shake') {
            void container.offsetWidth; // trigger reflow
            container.classList.add('shake');
            setTimeout(() => container.classList.remove('shake'), 500);
        } else if (scene.effect === 'white_flash') {
            const flash = document.getElementById('flash-white');
            flash.style.transition = 'none'; flash.style.opacity = '1';
            setTimeout(() => { flash.style.transition = '1s'; flash.style.opacity = '0'; }, 50);
        } else if (scene.effect === 'red_flash') {
            const flash = document.getElementById('flash-red');
            flash.style.transition = 'none'; flash.style.opacity = '0.8';
            setTimeout(() => { flash.style.transition = '1s'; flash.style.opacity = '0'; }, 50);
        }

        // تشغيل الصوت
        if (scene.sound) playSound(scene.sound);

        // تحديث صندوق الحوار
        document.getElementById('speaker-name').innerText = scene.speaker;
        document.getElementById('speaker-name').style.color = scene.speaker === 'إرين' ? '#e74c3c' : scene.speaker === 'ميكاسا' ? '#2c3e50' : scene.speaker === 'ليفاي' ? '#7f8c8d' : '#fff';
        document.getElementById('speaker-name').style.background = scene.speaker === 'إرين' ? '#fff' : '#fff'; // نوحد اللون
        
        // تأثير الكتابة
        typeText(scene.text);
    }

    // ============ تأثير الكتابة ============
    function typeText(text) {
        const el = document.getElementById('dialogue-text');
        el.innerText = '';
        isTyping = true;
        let i = 0;
        
        clearInterval(typingTimer);
        typingTimer = setInterval(() => {
            el.innerText += text.charAt(i);
            i++;
            if (i >= text.length) {
                clearInterval(typingTimer);
                isTyping = false;
            }
        }, 40); // سرعة الكتابة
    }
</script>
</body>
</html>
