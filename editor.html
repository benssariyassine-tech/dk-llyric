<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>المحرر — dk.llyric</title>
<meta name="theme-color" content="#07070d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Cairo:wght@400;700;900&family=Tajawal:wght@400;700&family=Almarai:wght@400;700;800&family=Reem+Kufi:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg-color:#07070d;
  --card-bg:rgba(255,255,255,0.055);
  --text-color:#fff;
  --subtext-color:#8e8e93;
  --accent:#0a84ff;
  --accent2:#0062d2;
  --danger:#ff453a;
  --border-color:rgba(255,255,255,0.1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
html,body{background:var(--bg-color);color:var(--text-color);font-family:Cairo,Inter,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font-family:inherit;cursor:pointer}

.ambient{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:0.4;animation:float 20s ease-in-out infinite}
.blob-1{width:280px;height:280px;background:#0a84ff;top:-60px;right:-60px}
.blob-2{width:260px;height:260px;background:#bf5af2;bottom:-40px;left:-40px;animation-delay:-8s}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,-30px)}}

.editor-body{position:relative;z-index:1;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}

.editor-topbar{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;background:rgba(7,7,13,0.7);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border-color);flex-shrink:0;z-index:10}
.etb-btn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.06);border:1px solid var(--border-color);color:#fff;display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0}
.etb-btn svg{width:16px;height:16px}
.etb-title-wrap{flex:1;text-align:center;min-width:0}
.etb-title{font-size:14px;font-weight:800;color:#fff}
.etb-badge{font-size:10px;font-weight:900;color:var(--accent);background:rgba(10,132,255,0.15);border:1px solid rgba(10,132,255,0.35);padding:4px 10px;border-radius:8px;flex-shrink:0}
.etb-export{padding:8px 16px;background:linear-gradient(135deg,rgba(10,132,255,0.9),rgba(0,98,210,0.9));color:#fff;border:1px solid rgba(255,255,255,0.15);border-radius:10px;font-size:12px;font-weight:800;flex-shrink:0;box-shadow:0 6px 20px rgba(10,132,255,0.35)}

.preview-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:8px 12px;min-height:0;overflow:hidden}
.preview-frame{position:relative;width:100%;max-width:240px;aspect-ratio:9/16;border-radius:22px;overflow:hidden;background:#000;box-shadow:0 20px 50px rgba(0,0,0,0.6),0 0 0 1px rgba(255,255,255,0.08)}
.preview-frame canvas{display:block;width:100%;height:100%}

.playback-controls{display:flex;align-items:center;justify-content:space-between;padding:6px 16px;flex-shrink:0;gap:8px;min-height:46px;position:relative;z-index:5}
.pc-btn{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,0.06);border:1px solid var(--border-color);color:#fff;display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0}
.pc-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2}
.pc-btn svg polygon{fill:currentColor;stroke:none}
.pc-time{flex:1;text-align:center;font-size:11px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums}

.timeline-wrap{flex-shrink:0;background:rgba(7,7,13,0.7);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border-color);padding-bottom:76px}
.timeline-viewport{position:relative;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:4px 0 6px;touch-action:pan-x}
.timeline-viewport::-webkit-scrollbar{display:none}
.timeline-content{position:relative;min-width:max-content;padding-right:60px}
.timeline-ruler{position:relative;height:18px;margin-bottom:4px}
.ruler-tick{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2px}
.ruler-tick span{font-size:9px;font-weight:700;color:var(--subtext-color)}
.ruler-tick i{display:block;width:1px;height:5px;background:var(--subtext-color);opacity:0.5}
.track{position:relative;min-height:42px;margin-bottom:4px}

.text-segment{position:absolute;top:0;height:40px;border-radius:10px;background:linear-gradient(135deg,rgba(191,90,242,0.85),rgba(142,68,173,0.85));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:2px solid transparent;padding:0 26px;display:flex;align-items:center;font-size:11px;font-weight:800;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;transition:box-shadow 0.15s;will-change:left,width}
.text-segment.selected{border-color:#ffd60a;box-shadow:0 0 0 2px #ffd60a,0 0 24px rgba(255,214,10,0.5);z-index:10}
.text-segment.moving{opacity:0.9;box-shadow:0 0 0 3px #ffd60a,0 0 30px rgba(255,214,10,0.7);z-index:20}

.audio-segment{position:absolute;top:0;height:40px;border-radius:10px;background:linear-gradient(135deg,rgba(255,45,146,0.85),rgba(214,51,132,0.85));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:2px solid transparent;display:flex;align-items:center;padding:0 26px;color:#fff;font-size:11px;font-weight:800;overflow:hidden;cursor:pointer;touch-action:none;user-select:none;transition:box-shadow 0.15s;will-change:left,width}
.audio-segment.dragging{opacity:0.85;box-shadow:0 0 0 3px #ffd60a,0 0 30px rgba(255,214,10,0.6);z-index:20;cursor:grabbing}
.audio-segment.selected{border-color:#ffd60a;box-shadow:0 0 0 2px #ffd60a,0 0 24px rgba(255,214,10,0.5);z-index:10}
.audio-wave{flex:1;height:60%;background:repeating-linear-gradient(90deg,rgba(255,255,255,0.6) 0 2px,transparent 2px 5px);margin-left:8px}
.audio-label{flex-shrink:0;font-size:11px;font-weight:800;white-space:nowrap}
.audio-add-btn{position:absolute;left:0;top:0;width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,0.05);border:1.5px dashed rgba(255,255,255,0.25);color:var(--accent);display:flex;align-items:center;justify-content:center;padding:0}
.audio-add-btn svg{width:20px;height:20px}

.seg-handle{position:absolute;top:0;bottom:0;width:22px;background:linear-gradient(180deg,#ffd60a,#ffb800);border-radius:8px;display:none;z-index:6;cursor:ew-resize;box-shadow:0 2px 8px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.4);align-items:center;justify-content:center;touch-action:none}
.seg-handle::before{content:'';width:2px;height:50%;background:rgba(0,0,0,0.55);border-radius:2px;box-shadow:-4px 0 0 rgba(0,0,0,0.55),4px 0 0 rgba(0,0,0,0.55)}
.text-segment.selected .seg-handle,
.audio-segment.selected .seg-handle{display:flex}
.handle-left{left:-2px;border-top-left-radius:10px;border-bottom-left-radius:10px}
.handle-right{right:-2px;border-top-right-radius:10px;border-bottom-right-radius:10px}

.playhead{position:absolute;top:0;bottom:0;left:0;width:2px;background:#ff453a;z-index:30;pointer-events:none;box-shadow:0 0 10px rgba(255,69,58,0.8);transform:translateX(0);will-change:transform}
.playhead-cap{position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:20px;height:8px;background:#ff453a;border-radius:4px;pointer-events:auto;cursor:ew-resize}

.editor-nav{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;align-items:center;justify-content:space-around;gap:4px;padding:8px 10px;background:rgba(28,28,34,0.75);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);border:1px solid rgba(255,255,255,0.12);border-radius:32px;box-shadow:0 20px 60px rgba(0,0,0,0.6),inset 0 1px 0 rgba(255,255,255,0.08);z-index:100;width:calc(100% - 32px);max-width:420px;transition:transform 0.3s,opacity 0.25s}
body.menu-open .editor-nav{transform:translateX(-50%) translateY(120%);opacity:0;pointer-events:none}
.editor-nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 4px;min-width:60px;height:52px;background:none;border:none;border-radius:22px;color:rgba(255,255,255,0.55);font-size:10px;font-weight:800;transition:all 0.25s}
.editor-nav-item svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2}
.editor-nav-item.active{color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 6px 18px rgba(10,132,255,0.5)}

.sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:200;opacity:0;visibility:hidden;transition:opacity 0.3s,visibility 0.3s}
.sheet-backdrop.open{opacity:1;visibility:visible}
.bottom-sheet{position:fixed;bottom:0;left:0;right:0;background:rgba(20,20,28,0.85);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);border-top-left-radius:28px;border-top-right-radius:28px;border-top:1px solid rgba(255,255,255,0.1);padding:12px 20px calc(90px + env(safe-area-inset-bottom,0px));max-height:70vh;overflow-y:auto;z-index:300;transform:translateY(100%);transition:transform 0.35s cubic-bezier(0.16,1,0.3,1);box-shadow:0 -20px 60px rgba(0,0,0,0.5)}
.bottom-sheet.open{transform:translateY(0)}
.sheet-handle{width:40px;height:4px;background:rgba(255,255,255,0.25);border-radius:4px;margin:0 auto 18px}
.sheet-content{display:none}
.sheet-content.active{display:block}
.sheet-title{font-size:16px;font-weight:900;color:#fff;margin-bottom:14px}
.sheet-hint{font-size:11.5px;color:var(--subtext-color);margin-bottom:14px;line-height:1.5}

.upload-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px;background:rgba(10,132,255,0.08);border:1.5px dashed rgba(10,132,255,0.4);border-radius:14px;color:var(--accent);font-size:13px;font-weight:700}
.upload-btn svg{width:18px;height:18px;stroke:currentColor;fill:none}
.upload-preview{display:flex;align-items:center;gap:10px;padding:10px;background:rgba(255,255,255,0.05);border:1px solid var(--border-color);border-radius:12px;margin-top:10px}
.upload-preview img{width:50px;height:50px;border-radius:10px;object-fit:cover}
.upload-preview-info{flex:1;min-width:0}
.upload-preview-name{font-size:12px;font-weight:700;color:var(--text-color);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upload-preview-meta{font-size:10px;color:var(--subtext-color);margin-top:2px}
.upload-preview-remove{width:30px;height:30px;border-radius:50%;background:rgba(255,69,58,0.15);border:1px solid rgba(255,69,58,0.3);color:#ff453a;font-size:16px;font-weight:bold;padding:0;flex-shrink:0}

.lyric-row{display:grid;grid-template-columns:1fr 32px;gap:8px;margin-bottom:8px;align-items:center}
.lyric-text-input{padding:12px 14px;background:rgba(255,255,255,0.05);border:1.5px solid var(--border-color);border-radius:12px;color:var(--text-color);font-size:14px;outline:none;width:100%;font-family:inherit}
.lyric-text-input:focus,.input-field:focus{border-color:var(--accent)}
.input-field{padding:12px 14px;background:rgba(255,255,255,0.05);border:1.5px solid var(--border-color);border-radius:12px;color:var(--text-color);font-size:14px;outline:none;width:100%;font-family:inherit}
  .lyric-meta{font-size:10px;font-weight:700;color:var(--subtext-color);padding:0 4px;font-variant-numeric:tabular-nums}
.lyric-remove-btn{width:32px;height:32px;border-radius:50%;background:rgba(255,69,58,0.12);border:1px solid rgba(255,69,58,0.25);color:#ff453a;font-size:18px;font-weight:900;padding:0;line-height:1}
.add-lyric-btn{width:100%;padding:12px;margin-top:6px;background:rgba(255,255,255,0.04);border:1.5px dashed var(--border-color);border-radius:12px;color:var(--accent);font-size:13px;font-weight:700}

.font-group{margin-bottom:18px}
.font-label{display:block;font-size:11px;font-weight:800;color:var(--subtext-color);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
.font-label span{color:var(--accent)}
.font-family-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.font-family-btn{padding:12px;background:rgba(255,255,255,0.05);border:1.5px solid var(--border-color);border-radius:12px;color:var(--text-color);font-size:14px;font-weight:700}
.font-family-btn.active{background:rgba(10,132,255,0.18);border-color:var(--accent);color:var(--accent)}
.font-family-btn.hidden{display:none}
.filter-row{display:flex;gap:8px}
.filter-btn{flex:1;padding:10px;background:rgba(255,255,255,0.05);border:1.5px solid var(--border-color);border-radius:12px;color:var(--text-color);font-size:12px;font-weight:700}
.filter-btn.active{background:rgba(10,132,255,0.18);border-color:var(--accent);color:var(--accent)}
.slider{width:100%;height:6px;background:rgba(255,255,255,0.1);border-radius:3px;outline:none;-webkit-appearance:none}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 4px 12px rgba(10,132,255,0.5)}
.color-grid{display:flex;gap:10px;flex-wrap:wrap}
.color-btn{width:36px;height:36px;border-radius:50%;border:2px solid rgba(255,255,255,0.15);padding:0}
.color-btn.active{border-color:#fff;transform:scale(1.15);box-shadow:0 0 15px rgba(255,255,255,0.4)}

.capcut-menu{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:12px;right:12px;max-width:420px;margin:0 auto;background:rgba(28,28,34,0.8);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);border:1px solid rgba(255,255,255,0.12);border-radius:24px;display:flex;overflow-x:auto;gap:4px;padding:10px 12px;transform:translateY(150%);opacity:0;transition:transform 0.3s,opacity 0.25s;z-index:90;box-shadow:0 20px 60px rgba(0,0,0,0.6),inset 0 1px 0 rgba(255,255,255,0.08)}
.capcut-menu.open{transform:translateY(0);opacity:1}
.cm-item{flex:0 0 auto;min-width:62px;display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 8px;background:none;border:none;color:var(--text-color);font-size:10px;font-weight:700;border-radius:10px}
.cm-item svg{width:20px;height:20px;stroke:var(--text-color);fill:none}
.cm-item.danger svg{stroke:var(--danger)}
.cm-item.danger span{color:var(--danger)}
  .confirm-modal{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;padding:20px}
.confirm-modal.open{display:flex}
.confirm-modal-backdrop{position:absolute;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.confirm-modal-box{position:relative;width:100%;max-width:360px;background:rgba(20,20,28,0.95);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);border-radius:22px;border:1px solid rgba(255,255,255,0.12);padding:24px 22px;animation:confirmPop 0.3s cubic-bezier(0.16,1,0.3,1)}
@keyframes confirmPop{from{transform:scale(0.9);opacity:0}to{transform:scale(1);opacity:1}}
.confirm-modal-title{font-size:17px;font-weight:900;color:#fff;margin-bottom:10px;text-align:center}
.confirm-modal-message{font-size:13.5px;color:var(--subtext-color);text-align:center;line-height:1.6;margin-bottom:22px}
.confirm-modal-actions{display:flex;gap:10px}
.confirm-modal-btn{flex:1;padding:13px;border-radius:12px;font-size:14px;font-weight:800;border:none;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.confirm-modal-btn.cancel{background:rgba(255,255,255,0.08);color:#fff}
.confirm-modal-btn.confirm{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 20px rgba(10,132,255,0.4)}
.time-modal{position:fixed;inset:0;z-index:9999;display:none;align-items:flex-end;justify-content:center}
.time-modal.open{display:flex}
.time-modal-backdrop{position:absolute;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.time-modal-box{position:relative;width:100%;max-width:480px;background:rgba(20,20,28,0.95);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);border-top-left-radius:28px;border-top-right-radius:28px;border-top:1px solid rgba(255,255,255,0.12);padding:20px 22px calc(24px + env(safe-area-inset-bottom,0px));animation:slideUp 0.35s cubic-bezier(0.16,1,0.3,1)}
.time-modal-handle{width:40px;height:4px;background:rgba(255,255,255,0.25);border-radius:4px;margin:0 auto 18px}
.time-modal-title{font-size:16px;font-weight:900;color:#fff;margin-bottom:18px;text-align:center}
.time-modal-group{margin-bottom:14px}
.time-modal-label{display:block;font-size:11px;font-weight:800;color:var(--subtext-color);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.time-modal-input{padding:14px;background:rgba(255,255,255,0.06);border:1.5px solid var(--border-color);border-radius:12px;color:#fff;font-size:16px;font-weight:700;outline:none;width:100%;font-family:inherit;text-align:center;font-variant-numeric:tabular-nums;-webkit-user-select:text;user-select:text}
.time-modal-input:focus{border-color:var(--accent);background:rgba(10,132,255,0.08)}
.time-modal-actions{display:flex;gap:10px;margin-top:20px}
.time-modal-btn{flex:1;padding:14px;border-radius:12px;font-size:14px;font-weight:800;border:none;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.time-modal-btn.cancel{background:rgba(255,255,255,0.08);color:#fff}
.time-modal-btn.confirm{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 20px rgba(10,132,255,0.4)}
.export-modal{position:fixed;inset:0;z-index:9999;display:none;align-items:flex-end;justify-content:center}
.export-modal.open{display:flex}
.export-backdrop{position:absolute;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.export-box{position:relative;width:100%;max-width:480px;background:rgba(20,20,28,0.9);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);border-top-left-radius:28px;border-top-right-radius:28px;border-top:1px solid rgba(255,255,255,0.12);padding:24px 22px calc(30px + env(safe-area-inset-bottom,0px));animation:slideUp 0.4s cubic-bezier(0.16,1,0.3,1)}
@keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
.export-close{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,0.08);border:none;color:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.export-close svg{width:14px;height:14px}
.export-title{font-size:20px;font-weight:900;text-align:center;margin-bottom:4px}
.export-subtitle{font-size:12px;color:var(--subtext-color);text-align:center;margin-bottom:24px}
.export-group{margin-bottom:20px}
.export-label{display:block;font-size:11px;font-weight:800;color:var(--subtext-color);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
.export-options{display:flex;gap:8px}
.export-opt{flex:1;padding:12px;background:rgba(255,255,255,0.05);border:1.5px solid var(--border-color);border-radius:12px;color:#fff;font-size:13px;font-weight:700}
.export-opt.active{background:rgba(10,132,255,0.18);border-color:var(--accent);color:var(--accent)}
.export-progress{margin-bottom:20px}
.export-progress-bar{width:100%;height:6px;background:rgba(255,255,255,0.1);border-radius:3px;overflow:hidden;margin-bottom:8px}
.export-progress-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width 0.3s}

<script>
/* ============================================================
   dk.llyric Editor — Final
   ============================================================ */
var DESIGN_W = 360;
var DESIGN_H = 640;
var PX_PER_SEC = 30;
var LONG_PRESS_MS = 600;
var LYRIC_ANIM_MS = 450;

var state = {
  audioUrl: null, duration: 0,
  audioStart: 0, audioEnd: 15,
  trimIn: 0, trimOut: 15,
  currentTime: 0, isPlaying: false,
  songName: '', artistName: '', igName: 'dk.llyric',
  bgImg: null, coverImg: null, bgImgVersion: 0,
  bgFilters: { blur: 0, bright: 100, sat: 100, con: 100, op: 100 },
  card: { scale: 1, opacity: 0.65, radius: 26, coverSize: 68 },
  font: { family: 'Cairo', size: 28, color: '#ffffff' },
  lyrics: [
    { text: 'كلمات الأغنية هنا تجرب', start: 0, duration: 4 },
    { text: 'السطر الثاني من الأغنية', start: 4, duration: 4 }
  ],
  selected: { type: null, index: -1 }
};

var currentTab = null;
var previewCanvas = null;
var previewCtx = null;
var renderRAF = null;
var _lpTimer = null;
var _bgCache = { key: '', imgVersion: -1, canvas: null };

/* ===== UNDO / REDO ===== */
var _history = [];
var _historyIndex = -1;
var _historyLimit = 30;
var _isRestoring = false;

function captureState() {
  if (_isRestoring) return;
  return JSON.stringify({
    lyrics: state.lyrics,
    songName: state.songName,
    artistName: state.artistName,
    igName: state.igName,
    font: state.font,
    card: state.card,
    bgFilters: state.bgFilters,
    audioStart: state.audioStart,
    audioEnd: state.audioEnd,

}

function pushHistory() {
  if (_isRestoring) return;
  var snap = captureState();
  if (_history[_historyIndex] === snap) return;
  _history = _history.slice(0, _historyIndex + 1);
  _history.push(snap);
  if (_history.length > _historyLimit) _history.shift();
  _historyIndex = _history.length - 1;
  updateHistoryButtons();
}

function undo() {
  if (_historyIndex <= 0) return;
  _historyIndex--;
  restoreSnapshot(_history[_historyIndex]);
  showSaveToast('رجوع', 'success');
}

function redo() {
  if (_historyIndex >= _history.length - 1) return;
  _historyIndex++;
  restoreSnapshot(_history[_historyIndex]);
  showSaveToast('إعادة', 'success');
}

function restoreSnapshot(snap) {
  _isRestoring = true;
  try {
    var d = JSON.parse(snap);
    state.lyrics = d.lyrics || state.lyrics;
    state.songName = d.songName || '';
    state.artistName = d.artistName || '';
    state.igName = d.igName || 'dk.llyric';
    state.font = d.font || state.font;
    state.card = d.card || state.card;
    state.bgFilters = d.bgFilters || state.bgFilters;
    state.audioStart = d.audioStart || 0;
    state.audioEnd = d.audioEnd || 15;
    state.trimIn = d.trimIn || 0;
    state.trimOut = d.trimOut || 15;
    
    if ($('songNameInput')) $('songNameInput').value = state.songName;
    if ($('artistNameInput')) $('artistNameInput').value = state.artistName;
    if ($('igNameInput')) $('igNameInput').value = state.igName;
    
    renderLyricsList();
    renderTimeline();
    renderRuler();
    updateAudioSegmentUI();
    updateTimeDisplay();
    invalidateBgCache();
    markDirty();
  } catch (e) {
    console.error('restore error:', e);
  } finally {
    _isRestoring = false;
    updateHistoryButtons();
  }
}

function updateHistoryButtons() {

}

/* ===== BOX BLUR ===== */
function boxBlurCanvas(canvas, radius) {
  var w = canvas.width, h = canvas.height;
  if (w < 2 || h < 2) return;
  var ctx = canvas.getContext('2d');
  var imgData = ctx.getImageData(0, 0, w, h);
  var data = imgData.data;
  var tmp = new Uint8ClampedArray(data.length);
  var r = Math.max(1, Math.min(Math.round(radius), Math.floor(w / 4), Math.floor(h / 4)));
  var count = 2 * r + 1;

  for (var y = 0; y < h; y++) {
    var rs = 0, gs = 0, bs = 0, as = 0;
    for (var dx = -r; dx <= r; dx++) {
      var xx = Math.min(w - 1, Math.max(0, dx));
      var idx = (y * w + xx) * 4;
      rs += data[idx]; gs += data[idx+1]; bs += data[idx+2]; as += data[idx+3];
    }
    for (var x = 0; x < w; x++) {
      var idx2 = (y * w + x) * 4;
      tmp[idx2] = rs / count; tmp[idx2+1] = gs / count;
      tmp[idx2+2] = bs / count; tmp[idx2+3] = as / count;
      var xOut = Math.max(0, x - r);
      var xIn = Math.min(w - 1, x + r + 1);
      var iO = (y * w + xOut) * 4;
      var iI = (y * w + xIn) * 4;
      rs += data[iI] - data[iO];
      gs += data[iI+1] - data[iO+1];
      bs += data[iI+2] - data[iO+2];
      as += data[iI+3] - data[iO+3];
    }
  }
  for (var x2 = 0; x2 < w; x2++) {
    var rs2 = 0, gs2 = 0, bs2 = 0, as2 = 0;
    for (var dy = -r; dy <= r; dy++) {
      var yy = Math.min(h - 1, Math.max(0, dy));
      var idx3 = (yy * w + x2) * 4;
      rs2 += tmp[idx3]; gs2 += tmp[idx3+1]; bs2 += tmp[idx3+2]; as2 += tmp[idx3+3];
    }
    for (var y2 = 0; y2 < h; y2++) {
      var idx4 = (y2 * w + x2) * 4;
      data[idx4] = rs2 / count; data[idx4+1] = gs2 / count;
      data[idx4+2] = bs2 / count; data[idx4+3] = as2 / count;
      var yOut = Math.max(0, y2 - r);
      var yIn = Math.min(h - 1, y2 + r + 1);
      var iO2 = (yOut * w + x2) * 4;
      var iI2 = (yIn * w + x2) * 4;
      rs2 += tmp[iI2] - tmp[iO2];
      gs2 += tmp[iI2+1] - tmp[iO2+1];
      bs2 += tmp[iI2+2] - tmp[iO2+2];
      as2 += tmp[iI2+3] - tmp[iO2+3];
    }
  }
  ctx.putImageData(imgData, 0, 0);
}

function generateFilteredBg(W, H) {
  if (!state.bgImg || !state.bgImg.complete) return null;
  var f = state.bgFilters;
  var scale = 1 / 3;
  var tw = Math.max(8, Math.round(W * scale));
  var th = Math.max(8, Math.round(H * scale));
  var tmp = document.createElement('canvas');
  tmp.width = tw; tmp.height = th;
  var tctx = tmp.getContext('2d');
  drawCover(tctx, state.bgImg, 0, 0, tw, th);

  var usedCtxFilter = false;
  if (typeof tctx.filter !== 'undefined') {
    try {
      tctx.clearRect(0, 0, tw, th);
      tctx.filter = 'brightness(' + f.bright + '%) saturate(' + f.sat + '%) contrast(' + f.con + '%)';
      drawCover(tctx, state.bgImg, 0, 0, tw, th);
      tctx.filter = 'none';
      usedCtxFilter = true;
    } catch (e) { tctx.filter = 'none'; }
  }

  if (!usedCtxFilter) {
    try {
      var imgData = tctx.getImageData(0, 0, tw, th);
      var data = imgData.data;
      var b = f.bright / 100, c = f.con / 100, s = f.sat / 100;
      for (var i = 0; i < data.length; i += 4) {
        var r = data[i] * b, g = data[i+1] * b, bl = data[i+2] * b;
        r = (r - 128) * c + 128; g = (g - 128) * c + 128; bl = (bl - 128) * c + 128;
        var gray = r * 0.299 + g * 0.587 + bl * 0.114;
        r = gray + (r - gray) * s; g = gray + (g - gray) * s; bl = gray + (bl - gray) * s;
        data[i] = r < 0 ? 0 : (r > 255 ? 255 : r);
        data[i+1] = g < 0 ? 0 : (g > 255 ? 255 : g);
        data[i+2] = bl < 0 ? 0 : (bl > 255 ? 255 : bl);
      }
      tctx.putImageData(imgData, 0, 0);
    } catch (e) {}
  }

  if (f.blur > 0) {
    var blurR = Math.max(1, Math.round(f.blur / 3));
    boxBlurCanvas(tmp, blurR);
  }

  var out = document.createElement('canvas');
  out.width = W; out.height = H;
  var octx = out.getContext('2d');
  octx.imageSmoothingEnabled = true;
  octx.imageSmoothingQuality = 'high';
  octx.globalAlpha = f.op / 100;
  octx.drawImage(tmp, 0, 0, tw, th, 0, 0, W, H);
  return out;
}

function getFilteredBg(W, H) {
  var f = state.bgFilters;
  var key = W + 'x' + H + '|' + f.blur + ',' + f.bright + ',' + f.sat + ',' + f.con + ',' + f.op;
  if (_bgCache.canvas && _bgCache.key === key && _bgCache.imgVersion === state.bgImgVersion) return _bgCache.canvas;
  var canvas = generateFilteredBg(W, H);
  _bgCache = { key: key, imgVersion: state.bgImgVersion, canvas: canvas };
  return canvas;
}

function invalidateBgCache() { _bgCache = { key: '', imgVersion: -1, canvas: null }; }

/* ===== DRAW FRAME ===== */
function drawFrame(ctx, W, H, t) {
  var s = W / DESIGN_W;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  if (state.bgImg) {
    var filtered = getFilteredBg(W, H);
    if (filtered) ctx.drawImage(filtered, 0, 0, W, H);
  }

  var cardW = 320 * s * state.card.scale;
  var cardH = cardW;
  var cardX = (W - cardW) / 2;
  var cardY = (H - cardH) / 2;
  var radius = state.card.radius * s;

  if (state.bgImg) {
    var filtered2 = getFilteredBg(W, H);
    if (filtered2) {
      ctx.save();
      roundRect(ctx, cardX, cardY, cardW, cardH, radius);
      ctx.clip();
      ctx.globalAlpha = 0.6;
      ctx.drawImage(filtered2, 0, 0, W, H);
      ctx.restore();
    }
  }

  ctx.save();
  ctx.fillStyle = 'rgba(15,15,15,' + state.card.opacity + ')';
  roundRect(ctx, cardX, cardY, cardW, cardH, radius);
  ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.12)';
  ctx.lineWidth = 1 * s;
  roundRect(ctx, cardX, cardY, cardW, cardH, radius);
  ctx.stroke();
  ctx.restore();

  var padX = 22 * s;
  var padY = 20 * s;

  var artSize = state.card.coverSize * s * state.card.scale;
  var artX = cardX + cardW - padX - artSize;
  var artY = cardY + padY;
  var artR = 10 * s;

  if (state.coverImg && state.coverImg.complete) {
    ctx.save();
    roundRect(ctx, artX, artY, artSize, artSize, artR);
    ctx.clip();
    drawCover(ctx, state.coverImg, artX, artY, artSize, artSize);
    ctx.restore();
  } else {
    ctx.save();
    ctx.fillStyle = '#1a1a24';
    roundRect(ctx, artX, artY, artSize, artSize, artR);
    ctx.fill();
    ctx.restore();
  }

  var textRight = artX - 14 * s;
  ctx.save();
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  if (state.songName) {
    ctx.fillStyle = '#fff';
    ctx.font = '700 ' + (18 * s) + 'px "Cairo", "Inter", sans-serif';
    ctx.fillText(state.songName, textRight, artY + artSize * 0.35);
  }
  if (state.artistName) {
    ctx.fillStyle = '#b3b3b3';
    ctx.font = '500 ' + (14 * s) + 'px "Cairo", "Inter", sans-serif';
    ctx.fillText(state.artistName, textRight, artY + artSize * 0.7);
  }
  ctx.restore();

  var gap = 16 * s;
  var div1Y = artY + artSize + gap;
  drawDivider(ctx, cardX + padX, div1Y, cardW - padX * 2, s);

  var footerH = 20 * s;
  var div2Y = cardY + cardH - padY - footerH - gap;

var idx = findActiveLyric(t);
  var prev = '', curr = '♪ ♪', next = '';

  if (idx >= 0) {
    prev = idx > 0 ? (state.lyrics[idx - 1].text || '') : '';
    next = idx < state.lyrics.length - 1 ? (state.lyrics[idx + 1].text || '') : '';

    var currText = state.lyrics[idx].text || '';
    if (currText.trim() !== '') {
      curr = currText;
    } else {
      curr = '♪ ♪';
    }
  } else {
    for (var i = 0; i < state.lyrics.length; i++) {
      var l = state.lyrics[i];
      if (l.start + l.duration <= t) {
        prev = l.text || '';
      }
      if (l.start > t && next === '') {
        next = l.text || '';
      }
    }
    curr = '♪ ♪';
  }

// ✅ الأنيميشن فقط للسطور اللي فيها نص حقيقي
  var animElapsed = 1000; // افتراضي: مكتمل (بلا أنيميشن)
  if (idx >= 0 && state.lyrics[idx] && state.lyrics[idx].text && state.lyrics[idx].text.trim() !== '') {
    animElapsed = Math.max(0, (t - state.lyrics[idx].start)) * 1000;
  }
  var animP = Math.min(1, animElapsed / LYRIC_ANIM_MS);
  var easeOut = 1 - Math.pow(1 - animP, 3);

  var fontSize = state.font.size * s * state.card.scale;
  var smallSize = 15 * s * state.card.scale;
  var font = '"' + state.font.family + '", "Cairo", "Inter", sans-serif';
  var cx = cardX + cardW / 2;
  var lyricsCenterY = (div1Y + div2Y) / 2;

  if (prev) {
    ctx.save();
    ctx.globalAlpha = 0.4;
    ctx.fillStyle = '#fff';
    ctx.font = '500 ' + smallSize + 'px ' + font;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(prev, cx, lyricsCenterY - fontSize * 1.5);
    ctx.restore();
  }

if (curr) {
    ctx.save();
    var slideY = (1 - easeOut) * 8 * s;
    var scaleAmt = 0.94 + easeOut * 0.06;
    // ✅ الشفافية ما تنقصش على 0.85 — باش تبقى واضحة
    ctx.globalAlpha = Math.max(0.85, easeOut);
    ctx.translate(cx, lyricsCenterY + slideY);
    ctx.scale(scaleAmt, scaleAmt);
    ctx.translate(-cx, -(lyricsCenterY + slideY));
    ctx.fillStyle = state.font.color;
    ctx.font = '700 ' + fontSize + 'px ' + font;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    // ✅ ظل أقوى للوضوح
    ctx.shadowColor = 'rgba(0,0,0,0.85)';
    ctx.shadowBlur = 12 * s;
    ctx.shadowOffsetX = 0;
    ctx.shadowOffsetY = 2 * s;
    ctx.fillText(curr, cx, lyricsCenterY);
    ctx.restore();
  }

  if (next) {
    ctx.save();
    ctx.globalAlpha = 0.4;
    ctx.fillStyle = '#fff';
    ctx.font = '500 ' + smallSize + 'px ' + font;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(next, cx, lyricsCenterY + fontSize * 1.5);
    ctx.restore();
  }

  drawDivider(ctx, cardX + padX, div2Y, cardW - padX * 2, s);

  var footerY = cardY + cardH - padY - footerH / 2;
  var iconSize = 18 * s;
  var igX = cardX + padX;

  ctx.save();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1.5 * s;
  roundRect(ctx, igX, footerY - iconSize / 2, iconSize, iconSize, iconSize * 0.28);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(igX + iconSize / 2, footerY, iconSize * 0.22, 0, Math.PI * 2);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(igX + iconSize * 0.72, footerY - iconSize * 0.22, iconSize * 0.06, 0, Math.PI * 2);
  ctx.fillStyle = '#fff';
  ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.fillStyle = '#fff';
  ctx.font = '500 ' + (14 * s) + 'px "Inter", "Cairo", sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(state.igName, igX + iconSize + 6 * s, footerY);
  ctx.restore();
}

function roundRect(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function drawCover(ctx, img, dx, dy, dw, dh) {
  if (!img || !img.naturalWidth || !img.naturalHeight) return;
  var ir = img.naturalWidth / img.naturalHeight;
  var cr = dw / dh;
  var w, h, x, y;
  if (ir > cr) { h = dh; w = dh * ir; x = dx + (dw - w) / 2; y = dy; }
  else { w = dw; h = dw / ir; x = dx; y = dy + (dh - h) / 2; }
  ctx.drawImage(img, x, y, w, h);
}

function drawDivider(ctx, x, y, w, s) {
  var g = ctx.createLinearGradient(x, 0, x + w, 0);
  g.addColorStop(0, 'rgba(180,180,190,0)');
  g.addColorStop(0.25, 'rgba(180,180,190,0.45)');
  g.addColorStop(0.5, 'rgba(220,220,230,0.65)');
  g.addColorStop(0.75, 'rgba(180,180,190,0.45)');
  g.addColorStop(1, 'rgba(180,180,190,0)');
  ctx.save();
  ctx.fillStyle = g;
  ctx.fillRect(x, y, w, Math.max(1, s));
  ctx.restore();
}

function findActiveLyric(t) {
  for (var i = 0; i < state.lyrics.length; i++) {
    var l = state.lyrics[i];
    if (t >= l.start && t < l.start + l.duration) return i;
  }
  return -1;
}

/* ===== AUDIO ===== */
function bindAudio() {
  var input = $('audioInput');
  var player = $('audioPlayer');

  input.addEventListener('change', function(e) {
    var file = e.target.files[0];
    if (!file) return;
    if (state.audioUrl) URL.revokeObjectURL(state.audioUrl);
    state.audioUrl = URL.createObjectURL(file);
    state._cloudAudioUrl = null;
    player.src = state.audioUrl;
    player.src = state.audioUrl;
    player.load();

    player.onloadedmetadata = function() {
      state.duration = player.duration;
      state.audioStart = 0;
      state.audioEnd = player.duration;
      state.trimIn = 0;
      state.trimOut = player.duration;
      updateAudioSegmentUI();
      renderRuler(); renderTimeline(); updateTimeDisplay();
    };

    player.addEventListener('timeupdate', function() {
      if (!state.isPlaying) return;
      var fileT = player.currentTime;
      state.currentTime = state.audioStart + (fileT - state.trimIn);
      if (state.currentTime > state.audioEnd) state.currentTime = state.audioEnd;
      seekPlayhead(state.currentTime);
      updateTimeDisplay();
    });

    player.addEventListener('pause', function() {
      if (state.isPlaying) { state.isPlaying = false; updatePlayIcon(); }
    });

    player.addEventListener('stalled', function() {
      if (state.isPlaying) setTimeout(function() { player.play().catch(function() {}); }, 200);
    });

    $('audioUploadBtn').classList.add('hidden');
    $('audioPreview').classList.remove('hidden');
    $('audioPreviewName').textContent = file.name;
    $('audioPreviewMeta').textContent = (file.size / 1024 / 1024).toFixed(1) + ' MB';
  });
}

function openAudioPicker() { $('audioInput').click(); }

function removeAudio() {
  if (state.audioUrl) URL.revokeObjectURL(state.audioUrl);
  state.audioUrl = null;
  state._cloudAudioUrl = null;
  state.duration = 0;
  state.audioEnd = 15;
  $('audioPlayer').src = '';
  $('audioUploadBtn').classList.remove('hidden');
  $('audioPreview').classList.add('hidden');
  $('audioSegment').classList.add('hidden');
  $('audioAddBtn').classList.remove('hidden');
  updateTimeDisplay(); renderRuler();
}

function updateAudioSegmentUI() {
  var seg = $('audioSegment');
  seg.classList.remove('hidden');
  $('audioAddBtn').classList.add('hidden');
  seg.style.left = (state.audioStart * PX_PER_SEC) + 'px';
  seg.style.width = ((state.audioEnd - state.audioStart) * PX_PER_SEC) + 'px';
}

/* ===== PLAYBACK ===== */
function togglePlay() {
  var el = $('audioPlayer');
  if (state.isPlaying) {
    el.pause();
    state.isPlaying = false;
    updatePlayIcon();
    return;
  }
  var startAt = state.currentTime;
  if (startAt < state.audioStart || startAt >= state.audioEnd - 0.05) startAt = state.audioStart;
  state.currentTime = startAt;
  seekPlayhead(startAt);

  if (state.audioUrl) {
    el.currentTime = state.trimIn + (startAt - state.audioStart);
    var p = el.play();
    if (p && p.catch) p.catch(function(err) { console.error('Play failed:', err); });
  }

  state.isPlaying = true;
  updatePlayIcon();
  playLoop();
}

function updatePlayIcon() {
  $('playIcon').innerHTML = state.isPlaying
    ? '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>'
    : '<polygon points="5 3 19 12 5 21 5 3"/>';
}

function playLoop() {
  if (!state.isPlaying) return;
  var el = $('audioPlayer');
  if (state.audioUrl && el && !el.paused) {
    var fileT = el.currentTime;
    state.currentTime = state.audioStart + (fileT - state.trimIn);
    if (fileT >= state.trimOut) {
      state.currentTime = state.audioEnd;
      el.pause();
      state.isPlaying = false;
      updatePlayIcon();
      seekPlayhead(state.audioEnd);
      updateTimeDisplay();
      return;
    }
  } else if (!state.audioUrl) {
    state.currentTime += 0.016;
    if (state.currentTime >= state.audioEnd) {
      state.currentTime = state.audioEnd;
      state.isPlaying = false;
      updatePlayIcon();
    }
  }
  seekPlayhead(state.currentTime);
  updateTimeDisplay();
  requestAnimationFrame(playLoop);
}

function seekBy(delta) {
  var t = clamp(state.currentTime + delta, state.audioStart, state.audioEnd);
  state.currentTime = t;
  if (state.audioUrl) $('audioPlayer').currentTime = state.trimIn + (t - state.audioStart);
  seekPlayhead(t);
  updateTimeDisplay();
}

function updateTimeDisplay() {
  $('timeDisplay').textContent = fmtTime(state.currentTime) + ' / ' + fmtTime(state.audioEnd);
}

/* ===== TIMELINE ===== */
function getTimelineDuration() {
  var last = state.lyrics.reduce(function(m, l) { return Math.max(m, l.start + l.duration); }, 0);
  return Math.max(state.audioEnd, last, 15);
}

function renderRuler() {
  var r = $('timelineRuler');
  var total = getTimelineDuration();
  r.innerHTML = '';
  r.style.width = (total * PX_PER_SEC) + 'px';
  for (var s = 0; s <= total; s++) {
    var tick = document.createElement('div');
    tick.className = 'ruler-tick';
    tick.style.left = (s * PX_PER_SEC) + 'px';
    tick.innerHTML = '<span>' + s + 's</span><i></i>';
    r.appendChild(tick);
  }
  $('timelineContent').style.width = (total * PX_PER_SEC + 60) + 'px';
}

function renderTimeline() {
  var t = $('trackText');
  t.innerHTML = '';
  t.style.width = (getTimelineDuration() * PX_PER_SEC) + 'px';

  state.lyrics.forEach(function(l, i) {
    var seg = document.createElement('div');
    seg.className = 'text-segment';
    if (state.selected.type === 'text' && state.selected.index === i) seg.classList.add('selected');
    seg.style.left = (l.start * PX_PER_SEC) + 'px';
    seg.style.width = (l.duration * PX_PER_SEC) + 'px';
    seg.textContent = l.text || ('السطر ' + (i + 1));

    var hL = document.createElement('div');
    hL.className = 'seg-handle handle-left';
    hL.addEventListener('mousedown', function(e) { e.stopPropagation(); state.selected = { type: 'text', index: i }; startResize(e, i, 'left'); });
    hL.addEventListener('touchstart', function(e) { e.stopPropagation(); state.selected = { type: 'text', index: i }; startResize(e, i, 'left'); }, { passive: false });
    seg.appendChild(hL);

    var hR = document.createElement('div');
    hR.className = 'seg-handle handle-right';
    hR.addEventListener('mousedown', function(e) { e.stopPropagation(); state.selected = { type: 'text', index: i }; startResize(e, i, 'right'); });
    hR.addEventListener('touchstart', function(e) { e.stopPropagation(); state.selected = { type: 'text', index: i }; startResize(e, i, 'right'); }, { passive: false });
    seg.appendChild(hR);

    seg.addEventListener('click', function(e) {
      if (e.target.classList.contains('seg-handle')) return;
      state.selected = { type: 'text', index: i };
      renderTimeline();
      showCapcutMenu();
      if (navigator.vibrate) try { navigator.vibrate(10); } catch (err) {}
    });

    seg.addEventListener('mousedown', function(e) {
      if (!e.target.classList.contains('seg-handle')) startLongPress(e, i, seg);
    });
    seg.addEventListener('touchstart', function(e) {
      if (!e.target.classList.contains('seg-handle')) startLongPress(e, i, seg);
    }, { passive: true });

    t.appendChild(seg);
  });

  var aSeg = $('audioSegment');
  if (aSeg) {
    aSeg.classList.toggle('selected', state.selected.type === 'audio');
  }
}

function clearSelection() {
  state.selected = { type: null, index: -1 };
  renderTimeline();
  var aSeg = $('audioSegment');
  if (aSeg) aSeg.classList.remove('selected');
  hideCapcutMenu();
  hideAudioMenu();   // ✅ زيد هاد السطر
}

/* ===== TEXT RESIZE ===== */
function startResize(e, index, side) {
  e.preventDefault(); e.stopPropagation();
  var segEl = document.querySelectorAll('.text-segment')[index];
  if (!segEl) return;

  var cx = e.touches ? e.touches[0].clientX : e.clientX;
  var startStart = state.lyrics[index].start;
  var startDur = state.lyrics[index].duration;
  var rafId = null;
  var pending = null;

  function move(ev) {
    ev.preventDefault();
    var mx = ev.touches ? ev.touches[0].clientX : ev.clientX;
    var dx = (mx - cx) / PX_PER_SEC;

    if (side === 'right') {
      pending = { start: startStart, duration: Math.max(0.5, startDur + dx) };
    } else {
      var ns = Math.max(0, startStart + dx);
      var diff = ns - startStart;
      pending = { start: round1(ns), duration: Math.max(0.5, startDur - diff) };
    }

    if (!rafId) {
      rafId = requestAnimationFrame(function() {
        rafId = null;
        if (!pending) return;
        segEl.style.left = (pending.start * PX_PER_SEC) + 'px';
        segEl.style.width = (pending.duration * PX_PER_SEC) + 'px';
      });
    }
  }

  function end() {
    document.removeEventListener('mousemove', move);
    document.removeEventListener('mouseup', end);
    document.removeEventListener('touchmove', move);
    document.removeEventListener('touchend', end);
    if (rafId) cancelAnimationFrame(rafId);
    if (pending) {
      state.lyrics[index].start = pending.start;
      state.lyrics[index].duration = pending.duration;
    }
renderRuler();
    renderTimeline();
    markDirty();
  }

  document.addEventListener('mousemove', move);
  document.addEventListener('mouseup', end);
  document.addEventListener('touchmove', move, { passive: false });
  document.addEventListener('touchend', end);
}

/* ===== TEXT LONG PRESS ===== */
function startLongPress(e, index, segEl) {
  var cx = e.touches ? e.touches[0].clientX : e.clientX;
  var cancelled = false;

  function cancelIfMove(ev) {
    var mx = ev.touches ? ev.touches[0].clientX : ev.clientX;
    if (Math.abs(mx - cx) > 8) { cancelled = true; clearTimeout(_lpTimer); }
  }
  document.addEventListener('mousemove', cancelIfMove, { passive: true });
  document.addEventListener('touchmove', cancelIfMove, { passive: true });

  _lpTimer = setTimeout(function() {
    if (cancelled) return;

    state.selected = { type: 'text', index: index };
    renderTimeline();
    showCapcutMenu();
    if (navigator.vibrate) try { navigator.vibrate(20); } catch (err) {}

    var dragEl = document.querySelectorAll('.text-segment')[index];
    if (!dragEl) return;
    dragEl.classList.add('moving');

    var startStart = state.lyrics[index].start;
    var startX = cx;
    var rafId = null;
    var pendingLeft = null;

    function move(ev) {
      ev.preventDefault();
      var mx = ev.touches ? ev.touches[0].clientX : ev.clientX;
      var dx = (mx - startX) / PX_PER_SEC;
      pendingLeft = round1(Math.max(0, startStart + dx));

      if (!rafId) {
        rafId = requestAnimationFrame(function() {
          rafId = null;
          if (pendingLeft != null) dragEl.style.left = (pendingLeft * PX_PER_SEC) + 'px';
        });
      }
    }
    function end() {
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', end);
      document.removeEventListener('touchmove', move);
      document.removeEventListener('touchend', end);
      if (rafId) cancelAnimationFrame(rafId);
      dragEl.classList.remove('moving');
      if (pendingLeft != null) {
        state.lyrics[index].start = pendingLeft;
      }
      renderRuler();
      renderTimeline();
    }
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', end);
    document.addEventListener('touchmove', move, { passive: false });
    document.addEventListener('touchend', end);
  }, LONG_PRESS_MS);
}

/* ===== PLAYHEAD ===== */
function seekPlayhead(sec) {
  $('playhead').style.transform = 'translateX(' + (sec * PX_PER_SEC) + 'px)';
}

function setupPlayheadDrag() {
  var ph = $('playhead');
  var content = $('timelineContent');
  var dragging = false;

  function pxToTime(cx) {
    var r = content.getBoundingClientRect();
    return Math.max(0, (cx - r.left) / PX_PER_SEC);
  }

  var cap = ph.querySelector('.playhead-cap');
  if (!cap) return;

  function onDown(e) {
    e.preventDefault();
    dragging = true;

    function start(ev) {
      if (!dragging) return;
      var cx = ev.touches ? ev.touches[0].clientX : ev.clientX;
      var t = clamp(pxToTime(cx), state.audioStart, state.audioEnd);
      state.currentTime = t;
      seekPlayhead(t);
      if (state.audioUrl) $('audioPlayer').currentTime = state.trimIn + (t - state.audioStart);
      updateTimeDisplay();
    }
    function end() {
      dragging = false;
      document.removeEventListener('mousemove', start);
      document.removeEventListener('mouseup', end);
      document.removeEventListener('touchmove', start);
      document.removeEventListener('touchend', end);
    }
    document.addEventListener('mousemove', start);
    document.addEventListener('mouseup', end);
    document.addEventListener('touchmove', start, { passive: false });
    document.addEventListener('touchend', end);
    start(e);
  }
  cap.addEventListener('mousedown', onDown);
  cap.addEventListener('touchstart', onDown, { passive: false });
}

function setupTimelineClick() {
  $('timelineViewport').addEventListener('click', function(e) {
    if (e.target.closest('.text-segment')) return;
    if (e.target.closest('.audio-segment')) return;
    if (e.target.closest('.seg-handle')) return;
    if (e.target.closest('.playhead-cap')) return;
    if (e.target.closest('.audio-add-btn')) return;
    var content = $('timelineContent');
    var r = content.getBoundingClientRect();
    var t = clamp(Math.max(0, (e.clientX - r.left) / PX_PER_SEC), state.audioStart, state.audioEnd);
    state.currentTime = t;
    seekPlayhead(t);
    if (state.audioUrl) $('audioPlayer').currentTime = state.trimIn + (t - state.audioStart);
    updateTimeDisplay();
  });
}

/* ===== AUDIO SEGMENT ===== */
function bindAudioSegment() {
  var seg = $('audioSegment');
  if (!seg) return;

  var lpTimer = null;
  var dragging = false;
  var startX = 0;
  var snapStart = 0;
  var snapWidth = 0;
  var rafId = null;

  function onDown(e) {
    if (e.target.classList.contains('seg-handle')) return;
    
    e.stopPropagation();

    state.selected = { type: 'audio', index: -1 };
    seg.classList.add('selected');

    var cx = e.touches ? e.touches[0].clientX : e.clientX;
    startX = cx;
    snapStart = state.audioStart;
    snapWidth = state.audioEnd - state.audioStart;
    dragging = false;

lpTimer = setTimeout(function() {
      dragging = true;
      seg.classList.add('dragging');
      if (navigator.vibrate) try { navigator.vibrate(15); } catch (err) {}
      state.selected = { type: 'audio', index: -1 };
    }, LONG_PRESS_MS);

    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onEnd);
    document.addEventListener('touchmove', onMove, { passive: false });
    document.addEventListener('touchend', onEnd);
  }

  function onMove(e) {
    var cx = e.touches ? e.touches[0].clientX : e.clientX;
    var dx = (cx - startX) / PX_PER_SEC;

    if (!dragging) {
      if (Math.abs(dx) > 0.15) clearTimeout(lpTimer);
      return;
    }

    e.preventDefault();
    var newStart = Math.max(0, snapStart + dx);

    if (!rafId) {
      rafId = requestAnimationFrame(function() {
        rafId = null;
        state.audioStart = round1(newStart);
        state.audioEnd = round1(newStart + snapWidth);
        seg.style.left = (state.audioStart * PX_PER_SEC) + 'px';
        seg.style.width = ((state.audioEnd - state.audioStart) * PX_PER_SEC) + 'px';
      });
    }
  }

function onEnd() {
    var wasDragging = dragging;
    clearTimeout(lpTimer);
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onEnd);
    document.removeEventListener('touchmove', onMove);
    document.removeEventListener('touchend', onEnd);
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    if (wasDragging) {
      seg.classList.remove('dragging');
      renderRuler();
      updateTimeDisplay();
    } else {
      // ضغطة سريعة = افتح القائمة
      state.selected = { type: 'audio', index: -1 };
      showAudioMenu();
      if (navigator.vibrate) try { navigator.vibrate(10); } catch (err) {}
    }
    dragging = false;
  }
seg.addEventListener('mousedown', onDown);
  seg.addEventListener('touchstart', onDown, { passive: false });

  // ✅ ضغطة وحدة = قائمة الأغنية
  seg.addEventListener('click', function(e) {
    if (e.target.classList.contains('seg-handle')) return;
    e.preventDefault();
    e.stopPropagation();
    state.selected = { type: 'audio', index: -1 };
    seg.classList.add('selected');
    showAudioMenu();
    if (navigator.vibrate) try { navigator.vibrate(10); } catch (err) {}
  });

  var hL = document.createElement('div');
  hL.className = 'seg-handle handle-left';
  hL.addEventListener('mousedown', function(e) { e.stopPropagation(); state.selected = { type: 'audio', index: -1 }; seg.classList.add('selected'); startAudioResize(e, 'left'); });
  hL.addEventListener('touchstart', function(e) { e.stopPropagation(); state.selected = { type: 'audio', index: -1 }; seg.classList.add('selected'); startAudioResize(e, 'left'); }, { passive: false });
  seg.appendChild(hL);

  var hR = document.createElement('div');
  hR.className = 'seg-handle handle-right';
  hR.addEventListener('mousedown', function(e) { e.stopPropagation(); state.selected = { type: 'audio', index: -1 }; seg.classList.add('selected'); startAudioResize(e, 'right'); });
  hR.addEventListener('touchstart', function(e) { e.stopPropagation(); state.selected = { type: 'audio', index: -1 }; seg.classList.add('selected'); startAudioResize(e, 'right'); }, { passive: false });
  seg.appendChild(hR);
}

/* ===== AUDIO TRIM ===== */
function startAudioResize(e, side) {
  e.preventDefault(); e.stopPropagation();
  var seg = $('audioSegment');
  var startX = e.touches ? e.touches[0].clientX : e.clientX;
  var snap = {
    startStart: state.audioStart,
    startEnd: state.audioEnd,
    trimIn: state.trimIn,
    trimOut: state.trimOut
  };
  var rafId = null;
  var pending = null;

  function move(ev) {
    ev.preventDefault();
    var cx = ev.touches ? ev.touches[0].clientX : ev.clientX;
    var dx = (cx - startX) / PX_PER_SEC;

    if (side === 'left') {
      var nt = snap.trimIn + dx;
      var ns = snap.startStart + dx;
      if (nt < 0) { ns -= nt; nt = 0; }
      if (nt > snap.trimOut - 0.5) { nt = snap.trimOut - 0.5; ns = snap.startStart + (nt - snap.trimIn); }
      pending = {
        trimIn: round1(nt),
        audioStart: round1(Math.max(0, ns)),
        audioEnd: snap.startEnd,
        trimOut: snap.trimOut
      };
    } else {
      var nt2 = snap.trimOut + dx;
      if (nt2 > state.duration) nt2 = state.duration;
      if (nt2 < snap.trimIn + 0.5) nt2 = snap.trimIn + 0.5;
      pending = {
        trimOut: round1(nt2),
        audioEnd: round1(state.audioStart + (nt2 - state.trimIn)),
        audioStart: snap.startStart,
        trimIn: snap.trimIn
      };
    }

    if (!rafId) {
      rafId = requestAnimationFrame(function() {
        rafId = null;
        if (!pending) return;
        seg.style.left = (pending.audioStart * PX_PER_SEC) + 'px';
        seg.style.width = ((pending.audioEnd - pending.audioStart) * PX_PER_SEC) + 'px';
      });
    }
  }

  function end() {
    document.removeEventListener('mousemove', move);
    document.removeEventListener('mouseup', end);
    document.removeEventListener('touchmove', move);
    document.removeEventListener('touchend', end);
    if (rafId) cancelAnimationFrame(rafId);
    if (pending) {
      state.trimIn = pending.trimIn;
      state.trimOut = pending.trimOut;
      state.audioStart = pending.audioStart;
      state.audioEnd = pending.audioEnd;
    }
    renderRuler();
    updateTimeDisplay();
  }

  document.addEventListener('mousemove', move);
  document.addEventListener('mouseup', end);
  document.addEventListener('touchmove', move, { passive: false });
  document.addEventListener('touchend', end);
}

/* ===== TABS ===== */
function openTab(name, btn) {
  if (currentTab === name) { closeSheet(); return; }
  currentTab = name;
  document.querySelectorAll('.editor-nav-item').forEach(function(el) { el.classList.remove('active'); });
  if (btn) btn.classList.add('active');
  document.querySelectorAll('.sheet-content').forEach(function(el) { el.classList.remove('active'); });
  var t = document.querySelector('[data-sheet="' + name + '"]');
  if (t) t.classList.add('active');
  $('bottomSheet').classList.add('open');
  $('sheetBackdrop').classList.add('open');
}

function closeSheet() {
  currentTab = null;
  document.querySelectorAll('.editor-nav-item').forEach(function(el) { el.classList.remove('active'); });
  $('bottomSheet').classList.remove('open');
  $('sheetBackdrop').classList.remove('open');
}

function showCapcutMenu() {
  $('capcutMenu').classList.add('open');
  document.body.classList.add('menu-open');
}
function hideCapcutMenu() {
  $('capcutMenu').classList.remove('open');
  document.body.classList.remove('menu-open');
}
function audioAction(action) {
  if (action === 'change') {
    hideCapcutMenu();
    hideAudioMenu();
    openAudioPicker();
    
  } else if (action === 'delete') {
    hideAudioMenu();
    removeAudio();
    clearSelection();
    
  } else if (action === 'trim') {
    // قص الأغنية من موضع playhead
    var t = state.currentTime;
    if (t > state.audioStart + 0.5 && t < state.audioEnd - 0.5) {
      // الجزء الأول
      var newEnd = round1(t);
state.audioEnd = newEnd;
      state.trimOut = round1(state.trimIn + (newEnd - state.audioStart));
      renderRuler();
      updateAudioSegmentUI();
      markDirty();
      hideAudioMenu();
      clearSelection();
      showSaveToast('تم القص', 'success');
    } else {
      alert('حدد موضع داخل الأغنية (ماشي فـ البداية ولا النهاية)');
    }
    
  } else if (action === 'copy') {
    if (state._cloudAudioUrl) {
      navigator.clipboard.writeText(state._cloudAudioUrl).then(function() {
        showSaveToast('تم نسخ الرابط', 'success');
      }).catch(function() {
        showSaveToast(' فشل النسخ', 'error');
      });
    } else {
      showSaveToast(' الأغنية ماشي مرفوعة للسحابة', 'error');
    }
    hideAudioMenu();
  }
}

function showAudioMenu() {
  var m = document.getElementById('audioMenu');
  if (m) m.classList.add('open');
  document.body.classList.add('menu-open');
}
function hideAudioMenu() {
  var m = document.getElementById('audioMenu');
  if (m) m.classList.remove('open');
  document.body.classList.remove('menu-open');
}
function cmAction(action) {
  if (action === 'delete') {
    if (state.selected.type === 'text' && state.selected.index >= 0) {
      if (state.lyrics.length <= 1) return;
      state.lyrics.splice(state.selected.index, 1);
      renderTimeline(); renderLyricsList(); renderRuler();
      markDirty();
    } else if (state.selected.type === 'audio') {
      removeAudio();
    }
    clearSelection();
  } else if (action === 'split') {
    if (state.selected.type === 'text' && state.selected.index >= 0) {
      var i = state.selected.index;
      var l = state.lyrics[i];
      var t = state.currentTime;
      if (t > l.start && t < l.start + l.duration) {
        var first = { text: l.text, start: l.start, duration: round1(t - l.start) };
        var second = { text: l.text, start: round1(t), duration: round1(l.start + l.duration - t) };
state.lyrics.splice(i, 1, first, second);
        renderTimeline(); renderLyricsList(); renderRuler();
        markDirty();
      }
    }
    hideCapcutMenu();
    } else if (action === 'copy') {
    if (state.selected.type === 'text' && state.selected.index >= 0) {
      var i = state.selected.index;
      var orig = state.lyrics[i];
      var copy = {
        text: orig.text || '',
        start: round1(orig.start + orig.duration),
        duration: orig.duration
      };
 state.lyrics.splice(i + 1, 0, copy);
      renderTimeline(); renderLyricsList(); renderRuler();
      markDirty();
      showSaveToast('تم النسخ', 'success');
    }
    hideCapcutMenu();
  } else if (action === 'edit') {
    hideCapcutMenu();
    openTab('text', document.querySelector('[data-tab="text"]'));
  }
}

/* ===== LYRICS ===== */
function addLyric() {
  var t = round1(state.currentTime);
  state.lyrics.push({ text: '', start: t, duration: 3 });
  renderLyricsList(); renderTimeline(); renderRuler();
  markDirty();
}
var _editingLyricIndex = -1;

function editLyricTime(i) {
  _editingLyricIndex = i;
  var l = state.lyrics[i];
  $('timeStartInput').value = round1(l.start);
  $('timeDurationInput').value = round1(l.duration);
  $('timeModal').classList.add('open');
}

function closeTimeModal() {
  $('timeModal').classList.remove('open');
  _editingLyricIndex = -1;
}

function saveTimeModal() {
  if (_editingLyricIndex < 0) return;
  
  var newStart = parseFloat($('timeStartInput').value);
  var newDuration = parseFloat($('timeDurationInput').value);
  
  if (isNaN(newStart) || newStart < 0) {
    showSaveToast('وقت البداية غير صحيح', 'error');
    return;
  }
  if (isNaN(newDuration) || newDuration < 0.5) {
    showSaveToast('المدة خاصها تكون 0.5 على الأقل', 'error');
    return;
  }
  
  state.lyrics[_editingLyricIndex].start = round1(newStart);
  state.lyrics[_editingLyricIndex].duration = round1(newDuration);
  
  renderLyricsList();
  renderTimeline();
  renderRuler();
  updateTimeDisplay();
  markDirty();
  showSaveToast('تم التعديل', 'success');
  closeTimeModal();
}
function removeLyricAt(i) {
  if (state.lyrics.length <= 1) return;
  state.lyrics.splice(i, 1);
  renderLyricsList(); renderTimeline(); renderRuler();
  markDirty();
}

function renderLyricsList() {
  var c = $('lyricsList');
  c.innerHTML = '';
  state.lyrics.forEach(function(l, i) {
    var row = document.createElement('div');
    row.className = 'lyric-row';

    // عدد السطر + الوقت
var meta = document.createElement('div');
    meta.className = 'lyric-meta';
    meta.style.cursor = 'pointer';
    meta.style.padding = '4px 6px';
    meta.style.borderRadius = '6px';
    meta.style.background = 'rgba(255,255,255,0.04)';
    meta.style.display = 'flex';
    meta.style.alignItems = 'center';
    meta.style.gap = '6px';
    meta.innerHTML = '<svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><span>' + (i + 1) + '. ' + round1(l.start) + 's → ' + round1(l.start + l.duration) + 's</span>';
    meta.onclick = (function(idx) {

async function startExport() {
  var btn = $('exportStartBtn');
  var progress = $('exportProgress');
  var fill = $('exportProgressFill');
  var txt = $('exportProgressText');

  btn.disabled = true;
  progress.style.display = 'block';
  fill.style.width = '0%';
  txt.textContent = 'جاري التحضير...';

  var heartbeat = null;
  var recorder = null;

  try {
    var W = exportSettings.quality === 1080 ? 1080 : 720;
    var H = Math.round(W * DESIGN_H / DESIGN_W);

    var canvas = document.createElement('canvas');
    canvas.width = W;
    canvas.height = H;
    var ctx = canvas.getContext('2d', { alpha: false });

    var stream = canvas.captureStream(exportSettings.fps);
    var player = $('audioPlayer');

    if (!_audioCtx) {
      _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      _audioSource = _audioCtx.createMediaElementSource(player);
      _audioDest = _audioCtx.createMediaStreamDestination();
      _audioSource.connect(_audioDest);
      _audioSource.connect(_audioCtx.destination);
    }
    if (_audioCtx.state === 'suspended') await _audioCtx.resume();

    stream.getAudioTracks().forEach(function(t) { stream.removeTrack(t); });
    _audioDest.stream.getAudioTracks().forEach(function(t) { stream.addTrack(t); });

    var mimeType = 'video/webm';
    var prefs = [
      'video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4',
      'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'
    ];
    for (var i = 0; i < prefs.length; i++) {
      if (MediaRecorder.isTypeSupported(prefs[i])) { mimeType = prefs[i]; break; }
    }

    recorder = new MediaRecorder(stream, {
      mimeType: mimeType,
      videoBitsPerSecond: exportSettings.quality === 1080 ? 8000000 : 4000000,
      audioBitsPerSecond: 128000
    });

    var chunks = [];
    recorder.ondataavailable = function(e) { if (e.data.size > 0) chunks.push(e.data); };
    var stopped = new Promise(function(r) { recorder.onstop = r; });
    recorder.start(200);

    player.currentTime = state.trimIn;
    await new Promise(function(r) {
      var h = function() { player.removeEventListener('seeked', h); r(); };
      player.addEventListener('seeked', h);
      setTimeout(r, 400);
    });

    try {
      var p = player.play();
      if (p && p.catch) await p;
    } catch (playErr) {
      try { recorder.stop(); } catch (e) {}
      throw new Error('المتصفح رفض تشغيل الصوت. اضغط على الصفحة ثم أعد المحاولة.');
    }

    heartbeat = setInterval(function() {
      if (player.paused && !player.ended) player.play().catch(function() {});
      if (_audioCtx && _audioCtx.state === 'suspended') _audioCtx.resume().catch(function() {});
      if (recorder && recorder.state === 'paused') { try { recorder.resume(); } catch (e) {} }
    }, 300);

    await new Promise(function(resolve) {
      function render() {
        var audioT = player.currentTime;

        if (audioT >= state.trimOut - 0.02 || player.ended) {
          if (recorder && recorder.state !== 'inactive') {
            try { recorder.stop(); } catch (e) {}
          }
          resolve();
          return;
        }

        var videoT = state.audioStart + (audioT - state.trimIn);
        var safeT = Math.max(state.audioStart, Math.min(videoT, state.audioEnd));
        drawFrame(ctx, W, H, safeT);

        var total = state.trimOut - state.trimIn;
        var done = audioT - state.trimIn;
        var pct = Math.min(100, Math.round((done / total) * 100));
        fill.style.width = pct + '%';
        txt.textContent = 'جاري التصدير: ' + pct + '%';

        requestAnimationFrame(render);
      }
      render();
    });

    await stopped;

    var blob = new Blob(chunks, { type: mimeType });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    var ext = mimeType.indexOf('mp4') !== -1 ? 'mp4' : 'webm';
    a.href = url;
    a.download = 'dk.llyric-' + Date.now() + '.' + ext;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function() { URL.revokeObjectURL(url); }, 15000);

    fill.style.width = '100%';
    txt.textContent = 'تم التصدير بنجاح!';
    setTimeout(function() {
      closeExportModal();
      btn.disabled = false;
    }, 1500);
  } catch (err) {
    console.error(err);
    alert('خطأ في التصدير: ' + err.message);
    btn.disabled = false;
    progress.style.display = 'none';
  } finally {
    if (heartbeat) clearInterval(heartbeat);
  }
}

async function saveProjectToCloud(manual) {
  if (state._saving) return;
  state._saving = true;
  
  try {
    if (!state.audioUrl) { if (manual) alert('ارفع أغنية أول'); state._saving = false; return; }
    if (!_fb.ready || !_fb.user) { if (manual) alert('Firebase ماشي جاهز'); state._saving = false; return; }
    
    showSaveToast('⏳ جاري الحفظ...', 'saving');
    
    var userId = _fb.user.uid;
    var projectId = state._projectId || ('proj_' + Date.now());
    
    // 1. رفع الأغنية (إلا ما كانتش مرفوعة من قبل)
    var audioUrl = state._cloudAudioUrl;
    if (!audioUrl && state.audioUrl) {
      var audioBlob = await fetch(state.audioUrl).then(function(r) { return r.blob(); });
      audioUrl = await new Promise(function(resolve, reject) {
        var xhr = new XMLHttpRequest();
        xhr.open('POST', 'https://api.cloudinary.com/v1_1/' + CLOUDINARY_CLOUD + '/video/upload', true);
        xhr.timeout = 300000;
        xhr.upload.onprogress = function(e) {
          if (e.lengthComputable) {
            var pct = Math.round((e.loaded / e.total) * 100);
            showSaveToast('⏳ رفع الأغنية: ' + pct + '%', 'saving');
          }
        };
        xhr.onload = function() {
          if (xhr.status === 200) {
            var d = JSON.parse(xhr.responseText);
            if (d.error) reject(new Error(d.error.message));
            else resolve(d.secure_url);
          } else reject(new Error('HTTP ' + xhr.status));
        };
        xhr.onerror = function() { reject(new Error('فشل الاتصال')); };
        xhr.ontimeout = function() { reject(new Error('انتهت المهلة')); };
        var fd = new FormData();
        fd.append('file', audioBlob);
        fd.append('upload_preset', CLOUDINARY_PRESET);
        xhr.send(fd);
      });
      state._cloudAudioUrl = audioUrl;
    }
    
    // 2. رفع الخلفية
    var bgUrl = state._cloudBgUrl;
    if (state.bgImg && !bgUrl) {
      var bgCanvas = document.createElement('canvas');
      bgCanvas.width = state.bgImg.naturalWidth;
      bgCanvas.height = state.bgImg.naturalHeight;

      var bgBlob = await new Promise(function(res) { bgCanvas.toBlob(res, 'image/jpeg', 0.85); });
      var fd1 = new FormData();

      var r1 = await fetch('https://api.cloudinary.com/v1_1/' + CLOUDINARY_CLOUD + '/image/upload', { method: 'POST', body: fd1 });
      var d1 = await r1.json();
      if (!d1.error) { bgUrl = d1.secure_url; state._cloudBgUrl = bgUrl; }

    // 3. رفع الغلاف

      var covCanvas = document.createElement('canvas');
      covCanvas.width = state.coverImg.naturalWidth;
      covCanvas.height = state.coverImg.naturalHeight;
      covCanvas.getContext('2d').drawImage(state.coverImg, 0, 0);
      var covBlob = await new Promise(function(res) { covCanvas.toBlob(res, 'image/jpeg', 0.9); });
      var fd2 = new FormData();
      fd2.append('file', covBlob);
      fd2.append('upload_preset', CLOUDINARY_PRESET);
      var r2 = await fetch('https://api.cloudinary.com/v1_1/' + CLOUDINARY_CLOUD + '/image/upload', { method: 'POST', body: fd2 });
      var d2 = await r2.json();
      if (!d2.error) { coverUrl = d2.secure_url; state._cloudCoverUrl = coverUrl; }
    }
    
    // 4. حفظ في Firestore
    await _fb.db.collection('projects').doc(projectId).set({
      userId: userId,
      name: state.songName || 'مشروعي',
      createdAt: state._createdAt || Date.now(),
      updatedAt: Date.now(),
      audioUrl: audioUrl || null,
      bgUrl: bgUrl || null,
      coverUrl: coverUrl || null,
      data: {
        songName: state.songName || '',
        artistName: state.artistName || '',
        igName: state.igName || 'dk.llyric',
        lyrics: (state.lyrics || []).map(function(l) {
          return { text: l.text || '', start: l.start || 0, duration: l.duration || 3 };
        }),

        card: state.card,

        audioEnd: state.audioEnd || 15,
        trimIn: state.trimIn || 0,
        trimOut: state.trimOut || 15,
        duration: state.duration || 0
      }
    }, { merge: true });
    
    state._projectId = projectId;
    state._createdAt = state._createdAt || Date.now();
    state._dirty = false;
    
    showSaveToast(' تم الحفظ', 'success');
    localStorage.removeItem('dk_llyric_draft');

    if (full.audioUrl) {
      var audioEl = $('audioPlayer');
      audioEl.src = full.audioUrl;
      audioEl.crossOrigin = 'anonymous';
      await new Promise(function(res) {
        var done = false;
        var finish = function() { if (!done) { done = true; res(); } };
        audioEl.onloadedmetadata = finish;
        setTimeout(finish, 4000);
      });
      state.audioUrl = full.audioUrl;
state.audioUrl = full.audioUrl;
      state.duration = audioEl.duration || d.duration || 15;

      state._projectId = projectId;
      state._cloudAudioUrl = full.audioUrl || null;
      state._cloudBgUrl = full.bgUrl || null;
      state._cloudCoverUrl = full.coverUrl || null;

    state.audioStart = d.audioStart || 0;
    state.audioEnd = d.audioEnd || (state.duration || 15);
    state.trimIn = d.trimIn || 0;
    state.trimOut = d.trimOut || (state.duration || 15);

    // حدّث UI
    $('songNameInput').value = state.songName;
    $('artistNameInput').value = state.artistName;
    $('igNameInput').value = state.igName;
    renderLyricsList();
    renderTimeline();
    renderRuler();
    updateAudioSegmentUI();
    updateTimeDisplay();
    applyFont();

    console.log('✅ تم تحميل المشروع:', full.name);
  } catch (err) {
    console.error('Load error:', err);
    alert('خطأ في التحميل: ' + err.message);
  }
}

function loadImageCORS(url) {
  return new Promise(function(resolve, reject) {
    var img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = function() { resolve(img); };
    img.onerror = function() { reject(new Error('فشل تحميل الصورة')); };
    img.src = url;
  });
}
  /* ============================================================
   💾 Auto-Save System
   ============================================================ */

// 1. Toast بسيط
function showSaveToast(msg, type) {
  var t = document.getElementById('saveToast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'saveToast';
    t.style.cssText = 'position:fixed;top:60px;left:50%;transform:translateX(-50%);padding:8px 16px;border-radius:20px;font-size:12px;font-weight:700;color:#fff;z-index:99999;backdrop-filter:blur(20px);transition:opacity 0.3s;opacity:0;pointer-events:none;';
    document.body.appendChild(t);
  }
  var colors = {
    saving: 'rgba(10,132,255,0.9)',
    success: 'rgba(50,215,75,0.9)',
    error: 'rgba(255,69,58,0.9)'
  };
  t.style.background = colors[type] || colors.saving;
  t.textContent = msg;
  t.style.opacity = '1';
  
  clearTimeout(t._timer);
  if (type !== 'saving') {
    t._timer = setTimeout(function() { t.style.opacity = '0'; }, 2000);
  }
}

// 2. علامة "تغيير غير محفوظ"
function markDirty() {
  state._dirty = true;
  updateSaveIcon();
  pushHistory();
}

// 3. حفظ محلي كل 5 ثواني
function saveLocalDraft() {
  try {
    var draft = {
      songName: state.songName,
      artistName: state.artistName,
      igName: state.igName,
      lyrics: state.lyrics,
      font: state.font,
      card: state.card,
      bgFilters: state.bgFilters,
      audioStart: state.audioStart,
      audioEnd: state.audioEnd,
      trimIn: state.trimIn,
      trimOut: state.trimOut,
      duration: state.duration,
      savedAt: Date.now()
    };
    localStorage.setItem('dk_llyric_draft', JSON.stringify(draft));
  } catch (e) {}
}

// 4. تشغيل الحفظ التلقائي
function startAutoSave() {
  // حفظ محلي كل 5 ثواني
  setInterval(saveLocalDraft, 5000);
  
  // حفظ سحابي كل 60 ثانية (إلا كان تغيير + أغنية)
  setInterval(function() {
    if (state._dirty && state.audioUrl && _fb.user && !state._saving) {
      console.log('☁️ Auto-save...');
      saveProjectToCloud(false);
    }
  }, 60000);
  
  // حفظ محلي ملي يخرج من الصفحة
  window.addEventListener('beforeunload', saveLocalDraft);
  
  console.log('✅ Auto-save مفعّل');
}

// 5. استرجاع المسودة
function restoreLocalDraft() {
  try {
    var raw = localStorage.getItem('dk_llyric_draft');
    if (!raw) return false;
    var d = JSON.parse(raw);
    
    // ما نسترجعوش إلا كان قديم بزاف (7 أيام)
    if (Date.now() - (d.savedAt || 0) > 7 * 24 * 60 * 60 * 1000) {
      localStorage.removeItem('dk_llyric_draft');
      return false;
    }
    
    state.songName = d.songName || '';
    state.artistName = d.artistName || '';
    state.igName = d.igName || 'dk.llyric';
    state.lyrics = d.lyrics || state.lyrics;
    state.font = d.font || state.font;
    state.card = d.card || state.card;
    state.bgFilters = d.bgFilters || state.bgFilters;
    state.audioStart = d.audioStart || 0;
    state.audioEnd = d.audioEnd || 15;
    state.trimIn = d.trimIn || 0;
    state.trimOut = d.trimOut || 15;
    state.duration = d.duration || 0;
    
    // حدّث UI
    if ($('songNameInput')) $('songNameInput').value = state.songName;
    if ($('artistNameInput')) $('artistNameInput').value = state.artistName;
    if ($('igNameInput')) $('igNameInput').value = state.igName;
    
    renderLyricsList();
    renderTimeline();
    renderRuler();
    updateTimeDisplay();
    
    console.log('✅ استرجعنا المسودة:', new Date(d.savedAt).toLocaleString());
    return true;
  } catch (e) {
    console.error('restore draft error:', e);
    return false;
  }
}

// 6. ربط كل الأحداث بـ markDirty
function bindDirtyTracking() {
  // 1. الكلمات — Event Delegation (كيخدم حتى مع الـ inputs الجدد)
  var lyricsList = document.getElementById('lyricsList');
  if (lyricsList) {
    lyricsList.addEventListener('input', function(e) {
      if (e.target.classList.contains('lyric-text-input')) markDirty();
    });
  }
  
  // 2. الـ sliders
  document.querySelectorAll('.slider').forEach(function(s) {
    s.addEventListener('input', markDirty);
  });
  
  // 3. inputs الأساسية
  ['songNameInput','artistNameInput','igNameInput'].forEach(function(id) {
    var el = $(id);
    if (el) el.addEventListener('input', markDirty);
  });
  
  console.log('✅ تتبع التغييرات مفعّل');
}
