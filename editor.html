<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>المحرر — dk.llyric</title>
<meta name="theme-color" content="#0b0b0f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Cairo:wght@400;700;900&family=Tajawal:wght@400;700&family=Almarai:wght@400;700;800&family=Reem+Kufi:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="editor-body">

<header class="editor-topbar">
  <button class="etb-btn" onclick="closeEditor()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
  </button>
  <div class="etb-title-wrap"><span class="etb-title">مشروع جديد</span></div>
  <span class="etb-badge">HD</span>
  <button class="etb-export" onclick="openExportModal()">حفظ</button>
</header>

<div class="preview-wrap">
  <div class="preview-frame" id="previewFrame">
    <canvas id="previewCanvas"></canvas>
  </div>
</div>

<div class="playback-controls">
  <button class="pc-btn" onclick="seekBy(-5)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="11 17 6 12 11 7"/><polyline points="18 17 13 12 18 7"/></svg>
  </button>
  <button class="pc-btn" id="playBtn" onclick="togglePlay()">
    <svg id="playIcon" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
  </button>
  <div class="pc-time" id="timeDisplay">00:00 / 00:15</div>
  <button class="pc-btn" onclick="seekBy(5)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="13 17 18 12 13 7"/><polyline points="6 17 11 12 6 7"/></svg>
  </button>
</div>

<div class="timeline-wrap">
  <div class="timeline-viewport" id="timelineViewport">
    <div class="timeline-content" id="timelineContent">
      <div class="timeline-ruler" id="timelineRuler"></div>
      <div class="track track-audio" id="trackAudio">
        <div class="audio-segment hidden" id="audioSegment">
          <div class="audio-wave"></div>
          <span class="audio-label">🎵 الصوت</span>
        </div>
        <button class="audio-add-btn" id="audioAddBtn" onclick="openAudioPicker()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>
      <div class="track track-text" id="trackText"></div>
      <div class="playhead" id="playhead"><div class="playhead-cap"></div></div>
    </div>
  </div>
</div>

<nav class="editor-nav">
  <button class="editor-nav-item" data-tab="audio" onclick="openTab('audio', this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
    <span>صوت</span>
  </button>
  <button class="editor-nav-item" data-tab="text" onclick="openTab('text', this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
    <span>نص</span>
  </button>
  <button class="editor-nav-item" data-tab="effects" onclick="openTab('effects', this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
    <span>تأثيرات</span>
  </button>
  <button class="editor-nav-item" data-tab="bg" onclick="openTab('bg', this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
    <span>خلفية</span>
  </button>
  <button class="editor-nav-item" data-tab="card" onclick="openTab('card', this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="3"/></svg>
    <span>بطاقة</span>
  </button>
</nav>

<div class="sheet-backdrop" id="sheetBackdrop" onclick="closeSheet()"></div>

<div class="bottom-sheet" id="bottomSheet">
  <div class="sheet-handle"></div>

  <div class="sheet-content" data-sheet="audio">
    <h3 class="sheet-title">الصوت</h3>
    <label for="audioInput" class="upload-btn" id="audioUploadBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="18" height="18"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      <span>اختر أغنية</span>
    </label>
    <input type="file" id="audioInput" accept="audio/*" hidden>
    <div class="upload-preview hidden" id="audioPreview">
      <div class="upload-preview-info" style="text-align:center;flex:1;">
        <div class="upload-preview-name" id="audioPreviewName"></div>
        <div class="upload-preview-meta" id="audioPreviewMeta"></div>
      </div>
      <button class="upload-preview-remove" onclick="removeAudio()">×</button>
    </div>
    <audio id="audioPlayer" class="hidden"></audio>
  </div>

  <div class="sheet-content" data-sheet="text">
    <h3 class="sheet-title">النصوص</h3>
    <div class="font-group">
      <label class="font-label">اسم الأغنية</label>
      <input type="text" id="songNameInput" class="input-field" placeholder="اسم الأغنية">
    </div>
    <div class="font-group">
      <label class="font-label">اسم الفنان</label>
      <input type="text" id="artistNameInput" class="input-field" placeholder="اسم الفنان">
    </div>
    <div class="font-group" style="margin-top:20px;">
      <label class="font-label">الكلمات</label>
      <p class="sheet-hint">كل سطر يظهر حسب توقيته</p>
      <div id="lyricsList"></div>
      <button class="add-lyric-btn" onclick="addLyric()">+ إضافة سطر</button>
    </div>
  </div>

  <div class="sheet-content" data-sheet="effects">
    <h3 class="sheet-title">التأثيرات</h3>
    <div class="font-group">
      <label class="font-label">فلتر الخطوط</label>
      <div class="filter-row">
        <button class="filter-btn active" onclick="setFontFilter('all', this)">الكل</button>
        <button class="filter-btn" onclick="setFontFilter('ar', this)">عربي</button>
        <button class="filter-btn" onclick="setFontFilter('en', this)">إنجليزي</button>
      </div>
    </div>
    <div class="font-group">
      <label class="font-label">الخط</label>
      <div class="font-family-grid">
        <button class="font-family-btn active" data-font="Cairo" data-lang="ar" style="font-family:Cairo">Cairo</button>
        <button class="font-family-btn" data-font="Tajawal" data-lang="ar" style="font-family:Tajawal">Tajawal</button>
        <button class="font-family-btn" data-font="Almarai" data-lang="ar" style="font-family:Almarai">Almarai</button>
        <button class="font-family-btn" data-font="Reem Kufi" data-lang="ar" style="font-family:'Reem Kufi'">Reem Kufi</button>
        <button class="font-family-btn" data-font="IBM Plex Sans Arabic" data-lang="ar" style="font-family:'IBM Plex Sans Arabic'">IBM Plex</button>
        <button class="font-family-btn" data-font="Inter" data-lang="en" style="font-family:Inter">Inter</button>
      </div>
    </div>
    <div class="font-group">
      <label class="font-label">الحجم: <span id="fontSizeVal">28</span>px</label>
      <input type="range" id="fontSizeRange" min="16" max="60" value="28" class="slider">
    </div>
    <div class="font-group">
      <label class="font-label">اللون</label>
      <div class="color-grid">
        <button class="color-btn active" data-color="#ffffff" style="background:#ffffff"></button>
        <button class="color-btn" data-color="#ffd60a" style="background:#ffd60a"></button>
        <button class="color-btn" data-color="#0a84ff" style="background:#0a84ff"></button>
        <button class="color-btn" data-color="#ff453a" style="background:#ff453a"></button>
        <button class="color-btn" data-color="#32d74b" style="background:#32d74b"></button>
        <button class="color-btn" data-color="#bf5af2" style="background:#bf5af2"></button>
      </div>
    </div>
    <div class="font-group">
      <label class="font-label">اسم Instagram</label>
      <input type="text" id="igNameInput" class="input-field" placeholder="dk.llyric" value="dk.llyric">
    </div>
  </div>

  <div class="sheet-content" data-sheet="bg">
    <h3 class="sheet-title">الخلفية</h3>
    <label for="bgInput" class="upload-btn" id="bgUploadBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="18" height="18"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      <span>اختر صورة خلفية</span>
    </label>
    <input type="file" id="bgInput" accept="image/*" hidden>
    <div class="upload-preview hidden" id="bgPreview">
      <img id="bgPreviewImg" alt="">
      <div class="upload-preview-info">
        <div class="upload-preview-name" id="bgPreviewName"></div>
        <div class="upload-preview-meta">تم الرفع ✓</div>
      </div>
      <button class="upload-preview-remove" onclick="removeBackground()">×</button>
    </div>
    <div id="bgFiltersBox" style="display:none;margin-top:20px;">
      <div class="font-group"><label class="font-label">الضبابية: <span id="bgBlurVal">0</span>px</label><input type="range" id="bgBlurRange" min="0" max="30" value="0" class="slider"></div>
      <div class="font-group"><label class="font-label">السطوع: <span id="bgBrightVal">100</span>%</label><input type="range" id="bgBrightRange" min="20" max="200" value="100" class="slider"></div>
      <div class="font-group"><label class="font-label">التشبع: <span id="bgSatVal">100</span>%</label><input type="range" id="bgSatRange" min="0" max="200" value="100" class="slider"></div>
      <div class="font-group"><label class="font-label">التباين: <span id="bgConVal">100</span>%</label><input type="range" id="bgConRange" min="50" max="200" value="100" class="slider"></div>
      <div class="font-group"><label class="font-label">الشفافية: <span id="bgOpVal">100</span>%</label><input type="range" id="bgOpRange" min="10" max="100" value="100" class="slider"></div>
      <button class="add-lyric-btn" onclick="resetBgFilters()">إعادة ضبط الفلاتر</button>
    </div>
  </div>

  <div class="sheet-content" data-sheet="card">
    <h3 class="sheet-title">البطاقة</h3>
    <div class="font-group">
      <label class="font-label">صورة الغلاف</label>
      <label for="coverInput" class="upload-btn" id="coverUploadBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="18" height="18"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        <span>اختر صورة الغلاف</span>
      </label>
      <input type="file" id="coverInput" accept="image/*" hidden>
      <div class="upload-preview hidden" id="coverPreview">
        <img id="coverPreviewImg" alt="">
        <div class="upload-preview-info">
          <div class="upload-preview-name" id="coverPreviewName"></div>
          <div class="upload-preview-meta">تم الرفع ✓</div>
        </div>
        <button class="upload-preview-remove" onclick="removeCover()">×</button>
      </div>
    </div>
    <div class="font-group"><label class="font-label">حجم البطاقة: <span id="cardScaleVal">1.00</span>x</label><input type="range" id="cardScaleRange" min="0.5" max="1.2" step="0.05" value="1" class="slider"></div>
    <div class="font-group"><label class="font-label">شفافية: <span id="cardOpVal">65</span>%</label><input type="range" id="cardOpRange" min="20" max="100" value="65" class="slider"></div>
    <div class="font-group"><label class="font-label">استدارة: <span id="cardRadVal">26</span>px</label><input type="range" id="cardRadRange" min="0" max="40" value="26" class="slider"></div>
    <div class="font-group"><label class="font-label">حجم الغلاف: <span id="coverSizeVal">68</span>px</label><input type="range" id="coverSizeRange" min="40" max="120" value="68" class="slider"></div>
  </div>

</div>

<div class="capcut-menu" id="capcutMenu">
  <button class="cm-item" onclick="cmAction('split')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="3"/><path d="M8.12 8.12L12 12"/><path d="M20 4L8.12 15.88"/><circle cx="6" cy="18" r="3"/><path d="M14.8 14.8L20 20"/></svg>
    <span>تقسيم</span>
  </button>
  <button class="cm-item" onclick="cmAction('edit')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
    <span>تعديل</span>
  </button>
  <button class="cm-item danger" onclick="cmAction('delete')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
    <span>حذف</span>
  </button>
</div>

<div id="exportModal" class="export-modal">
  <div class="export-backdrop" onclick="closeExportModal()"></div>
  <div class="export-box">
    <button class="export-close" onclick="closeExportModal()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <h3 class="export-title">تصدير الفيديو</h3>
    <p class="export-subtitle">MP4 على iPhone • WebM على Android/PC</p>
    <div class="export-group">
      <label class="export-label">الجودة</label>
      <div class="export-options" id="exportQuality">
        <button class="export-opt" data-value="720">720p</button>
        <button class="export-opt active" data-value="1080">1080p</button>
      </div>
    </div>
    <div class="export-group">
      <label class="export-label">FPS</label>
      <div class="export-options" id="exportFps">
        <button class="export-opt" data-value="24">24</button>
        <button class="export-opt active" data-value="30">30</button>
        <button class="export-opt" data-value="60">60</button>
      </div>
    </div>
    <div class="export-progress" id="exportProgress" style="display:none;">
      <div class="export-progress-bar"><div class="export-progress-fill" id="exportProgressFill"></div></div>
      <div class="export-progress-text" id="exportProgressText">0%</div>
    </div>
    <button class="export-btn" id="exportStartBtn" onclick="startExport()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="18" height="18"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      <span>حمّل الفيديو</span>
    </button>
    <p class="export-note">⏱️ قد يأخذ التصدير وقتاً حسب طول الأغنية</p>
  </div>
</div>

<script src="editor.js"></script>
</body>
</html>
