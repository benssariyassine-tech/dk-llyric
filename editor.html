<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>المحرر — dk.llyric</title>
<meta name="theme-color" content="#0b0b0f">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;700;900&family=Almarai:wght@400;700;800&family=Reem+Kufi:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="editor-body">

  <header class="editor-topbar">
    <button class="etb-btn" onclick="closeEditor()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <div class="etb-title-wrap"><span class="etb-title">مشروع جديد</span></div>
    <span class="etb-badge">HD</span>
    <button class="etb-export" onclick="exportVideo()">حفظ</button>
  </header>

  <div class="preview-wrap">
    <div class="preview-frame">
      <div class="bg-layer" id="bgLayer">
        <img id="bgImage" src="" alt="">
      </div>
      <div class="preview-card" id="mainCard">
        <div class="preview-header">
          <div class="cover-wrap">
            <img class="preview-cover" id="previewCover" src="https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=200&q=80" alt="">
          </div>
          <div class="preview-header-text">
            <div class="preview-song" id="previewSong">راجع</div>
            <div class="preview-artist" id="previewArtist">عمرو دياب</div>
          </div>
        </div>
        <div class="preview-lyrics">
          <div class="lyric-element" id="lyricElement">
            <span class="lyric-text" id="previewLyric">راجع بتقولي اللي ما بينا</span>
          </div>
        </div>
        <div class="preview-footer"><span class="pf-text">Spotify</span></div>
      </div>
    </div>
  </div>

  <div class="playback-controls">
    <button class="pc-btn" onclick="undoAction()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg>
    </button>
    <button class="pc-btn" onclick="redoAction()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 14 20 9 15 4"/><path d="M4 20v-7a4 4 0 0 1 4-4h12"/></svg>
    </button>
    <div class="pc-time" id="timeDisplay">00:00 / 00:00</div>
    <button class="pc-btn" id="playBtn" onclick="togglePlay()">
      <svg id="playIcon" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
    </button>
  </div>

  <div class="timeline-wrap">
    <div class="timeline-viewport" id="timelineViewport">
      <div class="timeline-content" id="timelineContent">
        <div class="timeline-ruler" id="timelineRuler"></div>
        <div class="track track-text" id="trackText"></div>
        <div class="track track-audio" id="trackAudio">
          <div class="audio-segment hidden" id="audioSegment">
            <div class="audio-wave"></div>
            <span class="audio-label" id="audioLabel">الصوت</span>
          </div>
          <button class="audio-add-btn" id="audioAddBtn" onclick="openAudioPicker()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
        </div>
      </div>
      <div class="playhead" id="playhead"><div class="playhead-cap"></div></div>
    </div>
  </div>

  <nav class="editor-nav">
    <button class="editor-nav-item" data-tab="audio" onclick="openTab('audio', this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      <span>صوت</span>
    </button>
    <button class="editor-nav-item" data-tab="text" onclick="openTab('text', this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
      <span>نص</span>
    </button>
    <button class="editor-nav-item" data-tab="effects" onclick="openTab('effects', this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
      <span>تأثيرات</span>
    </button>
    <button class="editor-nav-item" data-tab="template" onclick="openTab('template', this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      <span>قوالب</span>
    </button>
  </nav>

  <!-- Bottom Sheet العام -->
  <div class="sheet-backdrop" id="sheetBackdrop" onclick="closeSheet()"></div>
  <div class="bottom-sheet" id="bottomSheet">
    <div class="sheet-handle"></div>

    <div class="sheet-content" data-sheet="audio">
      <h3 class="sheet-title">الصوت</h3>
      <label for="audioInput" class="upload-btn" id="audioUploadBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        <span>اختر أغنية أو فيديو</span>
      </label>
      <input type="file" id="audioInput" accept="audio/*,video/*" hidden>
      <div class="upload-preview hidden" id="audioPreview">
        <div class="upload-preview-info" style="text-align:center;flex:1;">
          <div class="upload-preview-name" id="audioPreviewName"></div>
          <div class="upload-preview-meta" id="audioPreviewMeta"></div>
        </div>
        <button class="upload-preview-remove" onclick="removeAudio()">×</button>
      </div>
      <audio id="audioPlayer" class="hidden"></audio>
    </div>

    <div class="sheet-content" data-sheet="text">
      <h3 class="sheet-title">الكلمات</h3>
      <p class="sheet-hint">اضغط مطولاً على الكتلة في الأسفل لتحريكها</p>
      <div id="lyricsList"></div>
      <button class="add-lyric-btn" onclick="addLyricLine()">+ إضافة سطر</button>
    </div>

    <div class="sheet-content" data-sheet="effects">
      <h3 class="sheet-title">التأثيرات</h3>
      <div class="font-group">
        <label class="font-label">الخط</label>
        <div class="font-family-grid">
          <button class="font-family-btn active" data-font="Cairo" style="font-family:'Cairo',sans-serif;">Cairo</button>
          <button class="font-family-btn" data-font="Tajawal" style="font-family:'Tajawal',sans-serif;">Tajawal</button>
          <button class="font-family-btn" data-font="Almarai" style="font-family:'Almarai',sans-serif;">Almarai</button>
          <button class="font-family-btn" data-font="Reem Kufi" style="font-family:'Reem Kufi',sans-serif;">Reem Kufi</button>
        </div>
      </div>
      <div class="font-group">
        <label class="font-label">الحجم: <span id="fontSizeVal">24</span>px</label>
        <input type="range" id="fontSizeRange" min="12" max="48" value="24" class="font-slider">
      </div>
      <div class="font-group">
        <label class="font-label">اللون</label>
        <div class="color-grid">
          <button class="color-btn active" data-color="#ffffff" style="background:#ffffff;"></button>
          <button class="color-btn" data-color="#ffd60a" style="background:#ffd60a;"></button>
          <button class="color-btn" data-color="#0a84ff" style="background:#0a84ff;"></button>
          <button class="color-btn" data-color="#ff453a" style="background:#ff453a;"></button>
          <button class="color-btn" data-color="#32d74b" style="background:#32d74b;"></button>
          <button class="color-btn" data-color="#bf5af2" style="background:#bf5af2;"></button>
        </div>
      </div>
    </div>

    <div class="sheet-content" data-sheet="template">
      <h3 class="sheet-title">القوالب</h3>
      <div class="template-locked">
        <div class="template-thumb active">
          <div class="tt-card-mini"><div class="tt-cover"></div></div>
          <span class="tt-label">Spotify Style ✓</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 🎬 CapCut-Style Menu (كي تمس كلمة أو أغنية) -->
  <div class="capcut-menu" id="capcutMenu">
    <button class="cm-item" onclick="cmAction('split')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="6" cy="6" r="3"/><path d="M8.12 8.12L12 12"/><path d="M20 4L8.12 15.88"/><circle cx="6" cy="18" r="3"/><path d="M14.8 14.8L20 20"/>
      </svg>
      <span>تقسيم</span>
    </button>
    <button class="cm-item" onclick="cmAction('edit')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
      </svg>
      <span>تعديل</span>
    </button>
    <button class="cm-item" onclick="cmAction('copy')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
      </svg>
      <span>نسخ</span>
    </button>
    <button class="cm-item" onclick="cmAction('duplicate')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="13" height="13" rx="2"/><path d="M8 21h11a2 2 0 0 0 2-2V8"/>
      </svg>
      <span>تكرار</span>
    </button>
    <button class="cm-item danger" onclick="cmAction('delete')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/>
      </svg>
      <span>حذف</span>
    </button>
    <button class="cm-item" onclick="cmAction('glass')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="4"/><path d="M3 12h18" opacity="0.4"/><path d="M12 3v18" opacity="0.4"/>
      </svg>
      <span>زجاجي</span>
    </button>
  </div>

  <script src="script.js"></script>
</body>
</html>
