<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>مساعد جيزي السريع</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body, html {
        width: 100%; height: 100%; overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #0a0a0a; color: #ffffff;
        touch-action: manipulation;
    }

    /* شاشة التطبيق */
    #app {
        display: flex; flex-direction: column; height: 100%;
        padding: 20px; padding-top: 60px;
        background: linear-gradient(180deg, #0a0a0a 0%, #111 100%);
    }

    /* الترويسة */
    header {
        text-align: center; margin-bottom: 30px;
    }
    .logo-icon {
        width: 70px; height: 70px; border-radius: 50%;
        background: linear-gradient(135deg, #e30613, #b00510);
        display: flex; align-items: center; justify-content: center;
        margin: 0 auto 15px; box-shadow: 0 0 30px rgba(227, 6, 19, 0.4);
    }
    .logo-icon svg { width: 40px; height: 40px; fill: white; }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 5px; }
    p.subtitle { font-size: 14px; color: #888; }

    /* الأزرار الرئيسية */
    .actions-grid {
        display: grid; grid-template-columns: 1fr 1fr; gap: 15px;
        margin-bottom: 20px;
    }
    .action-card {
        background: #1c1c1e; border: 1px solid #333;
        border-radius: 16px; padding: 20px 10px;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 10px; cursor: pointer; text-decoration: none; color: white;
        transition: transform 0.1s, background 0.2s;
    }
    .action-card:active { transform: scale(0.96); background: #2c2c2e; }
    .action-card svg { width: 30px; height: 30px; stroke: #e30613; fill: none; stroke-width: 2; }
    .action-card span { font-size: 13px; font-weight: 600; text-align: center; }

    /* معلومات إضافية */
    .info-box {
        background: rgba(255, 255, 255, 0.05); border-radius: 12px;
        padding: 15px; font-size: 13px; color: #aaa; line-height: 1.6;
        text-align: center; margin-top: auto; margin-bottom: 20px;
    }
    .info-box b { color: #fff; }

    /* تأثير النقر */
    .toast {
        position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px);
        background: #333; color: white; padding: 10px 20px; border-radius: 20px;
        font-size: 14px; opacity: 0; transition: all 0.3s; pointer-events: none;
        z-index: 100; white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div id="app">
    <header>
        <div class="logo-icon">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
        </div>
        <h1>مساعد جيزي السريع</h1>
        <p class="subtitle">كل ما تحتاجه في مكان واحد</p>
    </header>

    <div class="actions-grid">
        <a href="tel:*710%23" class="action-card" onclick="showToast('جاري فتح الاتصال...')">
            <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span>فحص الرصيد<br>*710#</span>
        </a>
        <a href="tel:*700%23" class="action-card" onclick="showToast('جاري فتح الاتصال...')">
            <svg viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
            <span>تعبئة الرصيد<br>*700#</span>
        </a>
        <a href="tel:*720%23" class="action-card" onclick="showToast('جاري فتح الاتصال...')">
            <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
            <span>الإنترنت<br>*720#</span>
        </a>
        <a href="tel:*777%23" class="action-card" onclick="showToast('جاري فتح الاتصال...')">
            <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
            <span>خدمة العملاء<br>*777#</span>
        </a>
    </div>

    <div class="info-box">
        <b>ملاحظة:</b> هذا التطبيق لا يقرأ رصيدك تلقائياً. عند النقر على أي زر، سيتم فتح تطبيق الاتصال في هاتفك مباشرة مع الكود المطلوب، وستظهر لك النتيجة على شاشة الهاتف.
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    let toastTimer;
    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
    }
</script>

</body>
</html>
