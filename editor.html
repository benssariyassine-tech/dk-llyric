<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>المحرر — dk.llyric</title>
<meta name="theme-color" content="#0b0b0f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Cairo:wght@400;700;900&family=Tajawal:wght@400;700&family=Almarai:wght@400;700;800&family=Reem+Kufi:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg-color:#0b0b0f;--card-bg:#16161c;--text-color:#fff;--subtext-color:#8e8e93;
  --accent:#0a84ff;--accent2:#0062d2;--danger:#ff453a;--border-color:rgba(255,255,255,0.08);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
html,body{background:var(--bg-color);color:var(--text-color);font-family:Cairo,Inter,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font-family:inherit;cursor:pointer}

/* EDITOR LAYOUT */
.editor-body{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
.editor-topbar{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;background:rgba(11,11,15,0.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border-color);flex-shrink:0;z-index:10}
.etb-btn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.06);border:1px solid var(--border-color);color:#fff;display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0}
.etb-btn svg{width:16px;height:16px}
.etb-title-wrap{flex:1;text-align:center;min-width:0}
.etb-title{font-size:14px;font-weight:800;color:#fff}
.etb-badge{font-size:10px;font-weight:900;color:var(--accent);background:rgba(10,132,255,0.12);border:1px solid rgba(10,132,255,0.3);padding:4px 10px;border-radius:8px;flex-shrink:0}
.etb-export{padding:8px 16px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:10px;font-size:12px;font-weight:800;flex-shrink:0}

/* PREVIEW */
.preview-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:8px 12px;min-height:0;overflow:hidden}
.preview-frame{position:relative;width:100%;max-width:240px;aspect-ratio:9/16;border-radius:22px;overflow:hidden;background:#000;box-shadow:0 20px 50px rgba(0,0,0,0.5)}
.preview-frame canvas{display:block;width:100%;height:100%}

/* PLAYBACK */
.playback-controls{display:flex;align-items:center;justify-content:space-between;padding:6px 16px;flex-shrink:0;gap:8px;min-height:46px;position:relative;z-index:5}
.pc-btn{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,0.06);border:1px solid var(--border-color);color:#fff;display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0}
.pc-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2}
.pc-btn svg polygon{fill:currentColor;stroke:none}
.pc-time{flex:1;text-align:center;font-size:11px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums}

/* TIMELINE */
.timeline-wrap{flex-shrink:0;background:rgba(11,11,15,0.6);border-top:1px solid var(--border-color);padding-bottom:76px}
.timeline-viewport{position:relative;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:4px 0 6px;touch-action:pan-x}
.timeline-viewport::-webkit-scrollbar{display:none}
.timeline-content{position:relative;min-width:max-content;padding-right:60px}
.timeline-ruler{position:relative;height:18px;margin-bottom:4px}
.ruler-tick{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2px}
.ruler-tick span{font-size:9px;font-weight:700;color:var(--subtext-color)}
.ruler-tick i{display:block;width:1px;height:5px;background:var(--subtext-color);opacity:0.5}
.track{position:relative;min-height:42px;margin-bottom:4px}

/* SEGMENTS */
.text-segment{position:absolute;top:0;height:40px;border-radius:8px;background:linear-gradient(135deg,#bf5af2,#8e44ad);border:2px solid transparent;padding:0 16px;display:flex;align-items:center;font-size:11px;font-weight:800;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.text-segment.selected{border-color:#ffd60a;box-shadow:0 0 0 2px #ffd60a,0 0 24px rgba(255,214,10,0.5);z-index:10}
.seg-handle{position:absolute;top:50%;transform:translateY(-50%);width:12px;height:60%;background:#ffd60a;border-radius:3px;display:none;z-index:5;cursor:ew-resize}
.text-segment.selected .seg-handle,.audio-segment.selected .seg-handle{display:block}
.seg-handle::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:2px;height:40%;background:#000;border-radius:2px;opacity:0.8}
.handle-left{left:2px}
.handle-right{right:2px}

.audio-segment{position:absolute;top:0;height:40px;border-radius:8px;background:linear-gradient(135deg,#ff2d92,#d63384);border:2px solid transparent;display:flex;align-items:center;padding:0 20px;color:#fff;font-size:11px;font-weight:800;overflow:hidden;cursor:pointer}
.audio-segment.selected{border-color:#ffd60a;box-shadow:0 0 0 2px #ffd60a,0 0 24px rgba(255,214,10,0.5);z-index:10}
.audio-wave{flex:1;height:60%;background:repeating-linear-gradient(90deg,rgba(255,255,255,0.6) 0 2px,transparent 2px 5px);margin-left:8px}
.audio-label{flex-shrink:0;font-size:11px;font-weight:800;white-space:nowrap}
.audio-add-btn{position:absolute;left:0;top:0;width:40px;height:40px;border-radius:8px;background:rgba(255,255,255,0.05);border:1.5px dashed rgba(255,255,255,0.2);color:var(--accent);display:flex;align-items:center;justify-content:center;padding:0}
.audio-add-btn svg{width:20px;height:20px}

/* PLAYHEAD */
.playhead{position:absolute;top:0;bottom:0;left:0;width:2px;background:#ff453a;z-index:30;pointer-events:none;box-shadow:0 0 10px rgba(255,69,58,0.8);transform:translateX(0);will-change:transform}
.playhead-cap{position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:20px;height:8px;background:#ff453a;border-radius:4px;pointer-events:auto;cursor:ew-resize}

/* NAV */
.editor-nav{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;align-items:center;justify-content:space-around;gap:4px;padding:8px 10px;background:rgba(28,28,34,0.85);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);border:1px solid rgba(255,255,255,0.08);border-radius:32px;box-shadow:0 20px 60px rgba(0,0,0,0.55);z-index:100;width:calc(100% - 32px);max-width:420px;transition:transform 0.3s,opacity 0.25s}
body.menu-open .editor-nav{transform:translateX(-50%) translateY(120%);opacity:0;pointer-events:none}
.editor-nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 4px;min-width:60px;height:52px;background:none;border:none;border-radius:22px;color:rgba(255,255,255,0.55);font-size:10px;font-weight:800;transition:all 0.25s}
.editor-nav-item svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2}
.editor-nav-item.active{color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 6px 18px rgba(10,132,255,0.5)}

/* SHEET */
.sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.5);backdrop-filter:blur(8px);z-index:200;opacity:0;visibility:hidden;transition:opacity 0.3s,visibility 0.3s}
.sheet-backdrop.open{opacity:1;visibility:visible}
.bottom-sheet{position:fixed;bottom:0;left:0;right:0;background:rgba(22,22,28,0.96);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);border-top-left-radius:28px;border-top-right-radius:28px;border-top:1px solid rgba(255,255,255,0.08);padding:12px 20px calc(90px + env(safe-area-inset-bottom,0px));max-height:70vh;overflow-y:auto;z-index:300;transform:translateY(100%);transition:transform 0.35s cubic-bezier(0.16,1,0.3,1)}
.bottom-sheet.open{transform:translateY(0)}
.sheet-handle{width:40px;height:4px;background:rgba(255,255,255,0.25);border-radius:4px;margin:0 auto 18px}
.sheet-content{display:none}
.sheet-content.active{display:block}
.sheet-title{font-size:16px;font-weight:900;color:#fff;margin-bottom:14px}
.sheet-hint{font-size:11.5px;color:var(--subtext-color);margin-bottom:14px;line-height:1.5}

/* UPLOAD */
.upload-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px;background:rgba(10,132,255,0.08);border:1.5px dashed rgba(10,132,255,0.4);border-radius:14px;color:var(--accent);font-size:13px;font-weight:700}
.upload-btn svg{width:18px;height:18px;stroke:currentColor;fill:none}
.upload-preview{display:flex;align-items:center;gap:10px;padding:10px;background:var(--card-bg);border:1px solid var(--border-color);border-radius:12px;margin-top:10px}
.upload-preview img{width:50px;height:50px;border-radius:10px;object-fit:cover}
.upload-preview-info{flex:1;min-width:0}
.upload-preview-name{font-size:12px;font-weight:700;color:var(--text-color);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upload-preview-meta{font-size:10px;color:var(--subtext-color);margin-top:2px}
.upload-preview-remove{width:30px;height:30px;border-radius:50%;background:rgba(255,69,58,0.15);border:1px solid rgba(255,69,58,0.3);color:#ff453a;font-size:16px;font-weight:bold;padding:0;flex-shrink:0}

/* LYRICS */
.lyric-row{display:grid;grid-template-columns:1fr 32px;gap:8px;margin-bottom:8px;align-items:center}
.lyric-text-input{padding:12px 14px;background:rgba(11,11,15,0.6);border:1.5px solid var(--border-color);border-radius:12px;color:var(--text-color);font-size:14px;outline:none;width:100%;font-family:inherit}
.lyric-text-input:focus,.input-field:focus{border-color:var(--accent)}
.input-field{padding:12px 14px;background:rgba(11,11,15,0.6);border:1.5px solid var(--border-color);border-radius:12px;color:var(--text-color);font-size:14px;outline:none;width:100%;font-family:inherit}
.lyric-remove-btn{width:32px;height:32px;border-radius:50%;background:rgba(255,69,58,0.12);border:1px solid rgba(255,69,58,0.25);color:#ff453a;font-size:18px;font-weight:900;padding:0;line-height:1}
.add-lyric-btn{width:100%;padding:12px;margin-top:6px;background:rgba(255,255,255,0.04);border:1.5px dashed var(--border-color);border-radius:12px;color:var(--accent);font-size:13px;font-weight:700}

/* CONTROLS */
.font-group{margin-bottom:18px}
.font-label{display:block;font-size:11px;font-weight:800;color:var(--subtext-color);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
.font-label span{color:var(--accent)}
.font-family-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.font-family-btn{padding:12px;background:rgba(11,11,15,0.6);border:1.5px solid var(--border-color);border-radius:12px;color:var(--text-color);font-size:14px;font-weight:700}
.font-family-btn.active{background:rgba(10,132,255,0.15);border-color:var(--accent);color:var(--accent)}
.font-family-btn.hidden{display:none}
.filter-row{display:flex;gap:8px}
.filter-btn{flex:1;padding:10px;background:rgba(11,11,15,0.6);border:1.5px solid var(--border-color);border-radius:12px;color:var(--text-color);font-size:12px;font-weight:700}
.filter-btn.active{background:rgba(10,132,255,0.15);border-color:var(--accent);color:var(--accent)}
.slider{width:100%;height:6px;background:rgba(255,255,255,0.1);border-radius:3px;outline:none;-webkit-appearance:none}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 4px 12px rgba(10,132,255,0.5)}
.color-grid{display:flex;gap:10px;flex-wrap:wrap}
.color-btn{width:36px;height:36px;border-radius:50%;border:2px solid rgba(255,255,255,0.15);padding:0}
.color-btn.active{border-color:#fff;transform:scale(1.15);box-shadow:0 0 15px rgba(255,255,255,0.4)}

/* CAPCUT MENU */
.capcut-menu{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:12px;right:12px;max-width:420px;margin:0 auto;background:rgba(28,28,34,0.92);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);border:1px solid rgba(255,255,255,0.08);border-radius:24px;display:flex;overflow-x:auto;gap:4px;padding:10px 12px;transform:translateY(150%);opacity:0;transition:transform 0.3s,opacity 0.25s;z-index:90;box-shadow:0 20px 60px rgba(0,0,0,0.55)}
.capcut-menu.open{transform:translateY(0);opacity:1}
.cm-item{flex:0 0 auto;min-width:62px;display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 8px;background:none;border:none;color:var(--text-color);font-size:10px;font-weight:700;border-radius:10px}
.cm-item svg{width:20px;height:20px;stroke:var(--text-color);fill:none}
.cm-item.danger svg{stroke:var(--danger)}
.cm-item.danger span{color:var(--danger)}

/* EXPORT MODAL */
.export-modal{position:fixed;inset:0;z-index:9999;display:none;align-items:flex-end;justify-content:center}
.export-modal.open{display:flex}
.export-backdrop{position:absolute;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(10px)}
.export-box{position:relative;width:100%;max-width:480px;background:rgba(22,22,28,0.98);backdrop-filter:blur(40px);border-top-left-radius:28px;border-top-right-radius:28px;padding:24px 22px calc(30px + env(safe-area-inset-bottom,0px));animation:slideUp 0.4s cubic-bezier(0.16,1,0.3,1)}
@keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
.export-close{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,0.08);border:none;color:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.export-close svg{width:14px;height:14px}
.export-title{font-size:20px;font-weight:900;text-align:center;margin-bottom:4px}
.export-subtitle{font-size:12px;color:var(--subtext-color);text-align:center;margin-bottom:24px}
.export-group{margin-bottom:20px}
.export-label{display:block;font-size:11px;font-weight:800;color:var(--subtext-color);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
.export-options{display:flex;gap:8px}
.export-opt{flex:1;padding:12px;background:rgba(11,11,15,0.6);border:1.5px solid var(--border-color);border-radius:12px;color:#fff;font-size:13px;font-weight:700}
.export-opt.active{background:rgba(10,132,255,0.15);border-color:var(--accent);color:var(--accent)}
.export-progress{margin-bottom:20px}
.export-progress-bar{width:100%;height:6px;background:rgba(255,255,255,0.1);border-radius:3px;overflow:hidden;margin-bottom:8px}
.export-progress-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width 0.3s}
.export-progress-text{text-align:center;font-size:12px;font-weight:800;color:var(--accent)}
.export-btn{width:100%;padding:16px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:14px;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 10px 28px rgba(10,132,255,0.4)}
.export-btn svg{width:18px;height:18px}
.export-note{font-size:11px;color:var(--subtext-color);text-align:center;margin-top:14px;line-height:1.5}
.hidden{display:none!important}
</style>
</head>
<body class="editor-body">

<header class="editor-topbar">
  <button class="etb-btn" onclick="closeEditor()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
  </button>
  <div class="etb-title-wrap"><span class="etb-title">مشروع جديد</span></div>
  <span class="etb-badge">HD</span>
  <button class="etb-export" onclick="openExportModal()">حفظ</button>
</header>

<div class="preview-wrap">
  <div class="preview-frame" id="previewFrame">
    <canvas id="previewCanvas"></canvas>
  </div>
</div>

<div class="playback-controls">
  <button class="pc-btn" onclick="seekBy(-5)">
    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><polyline points="11 17 6 12 11 7"/><polyline points="18 17 13 12 18 7"/></svg>
  </button>
  <button class="pc-btn" id="playBtn" onclick="togglePlay()">
    <svg id="playIcon" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
  </button>
  <div class="pc-time" id="timeDisplay">00:00 / 00:15</div>
  <button class="pc-btn" onclick="seekBy(5)">
    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><polyline points="13 17 18 12 13 7"/><polyline points="6 17 11 12 6 7"/></svg>
  </button>
</div>

<div class="timeline-wrap">
  <div class="timeline-viewport" id="timelineViewport">
    <div class="timeline-content" id="timelineContent">
      <div class="timeline-ruler" id="timelineRuler"></div>
      <div class="track track-audio" id="trackAudio">
        <div class="audio-segment hidden" id="audioSegment">
          <div class="audio-wave"></div>
          <span class="audio-label">🎵 الصوت</span>
        </div>
        <button class="audio-add-btn" id="audioAddBtn" onclick="openAudioPicker()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>
      <div class="track track-text" id="trackText"></div>
      <div class="playhead" id="playhead"><div class="playhead-cap"></div></div>
    </div>
  </div>
</div>

<nav class="editor-nav">
  <button class="editor-nav-item" data-tab="audio" onclick="openTab('audio', this)">
    <svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
    <span>صوت</span>
  </button>
  <button class="editor-nav-item" data-tab="text" onclick="openTab('text', this)">
    <svg viewBox="0 0 24 24"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
    <span>نص</span>
  </button>
  <button class="editor-nav-item" data-tab="effects" onclick="openTab('effects', this)">
    <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
    <span>تأثيرات</span>
  </button>
  <button class="editor-nav-item" data-tab="bg" onclick="openTab('bg', this)">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
    <span>خلفية</span>
  </button>
  <button class="editor-nav-item" data-tab="card" onclick="openTab('card', this)">
    <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/></svg>
    <span>بطاقة</span>
  </button>
</nav>

<div class="sheet-backdrop" id="sheetBackdrop" onclick="closeSheet()"></div>

<div class="bottom-sheet" id="bottomSheet">
  <div class="sheet-handle"></div>

  <div class="sheet-content" data-sheet="audio">
    <h3 class="sheet-title">الصوت</h3>
    <label for="audioInput" class="upload-btn" id="audioUploadBtn">
      <svg viewBox="0 0 24 24" stroke-width="2.2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      <span>اختر أغنية</span>
    </label>
    <input type="file" id="audioInput" accept="audio/*" hidden>
    <div class="upload-preview hidden" id="audioPreview">
      <div class="upload-preview-info" style="text-align:center;flex:1;">
        <div class="upload-preview-name" id="audioPreviewName"></div>
        <div class="upload-preview-meta" id="audioPreviewMeta"></div>
      </div>
      <button class="upload-preview-remove" onclick="removeAudio()">×</button>
    </div>
    <audio id="audioPlayer" class="hidden"></audio>
  </div>

  <div class="sheet-content" data-sheet="text">
    <h3 class="sheet-title">النصوص</h3>
    <div class="font-group">
      <label class="font-label">اسم الأغنية</label>
      <input type="text" id="songNameInput" class="input-field" placeholder="اسم الأغنية">
    </div>
    <div class="font-group">
      <label class="font-label">اسم الفنان</label>
      <input type="text" id="artistNameInput" class="input-field" placeholder="اسم الفنان">
    </div>

<script>
/* ============================================================
   dk.llyric Editor
   ============================================================ */
const DESIGN_W = 360;
const DESIGN_H = 640;
const PX_PER_SEC = 30;
const LONG_PRESS_MS = 600;

const state = {
  audioUrl: null,
  duration: 0,
  audioStart: 0,
  audioEnd: 15,
  trimIn: 0,
  trimOut: 15,
  currentTime: 0,
  isPlaying: false,
  songName: '',
  artistName: '',
  igName: 'dk.llyric',
  bgImg: null,
  coverImg: null,
  bgFilters: { blur: 0, bright: 100, sat: 100, con: 100, op: 100 },
  card: { scale: 1, opacity: 0.65, radius: 26, coverSize: 68 },
  font: { family: 'Cairo', size: 28, color: '#ffffff' },
  lyrics: [
    { text: 'كلمات الأغنية هنا', start: 0, duration: 4 },
    { text: 'السطر الثاني', start: 4, duration: 4 }
  ],
  selected: { type: null, index: -1 }
};

let currentTab = null;
let previewCanvas = null;
let previewCtx = null;
let renderRAF = null;
let _resize = null;
let _lpTimer = null;

const $ = function(id) { return document.getElementById(id); };
const clamp = function(v, a, b) { return Math.max(a, Math.min(b, v)); };
const round1 = function(v) { return Math.round(v * 10) / 10; };
const fmtTime = function(s) {
  s = Math.max(0, Math.floor(s));
  return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
};

window.addEventListener('load', function() {
  try {
    setupCanvas();
    bindAudio();
    bindSliders();
    bindFontButtons();
    bindColorButtons();
    bindTextInputs();
    bindUploads();
    bindAudioSegment();
    setupTimelineClick();
    setupPlayheadDrag();
    bindExportOptions();
    renderLyricsList();
    renderTimeline();
    renderRuler();
    updateTimeDisplay();
    startRenderLoop();
    console.log('✅ dk.llyric loaded');
  } catch (err) {
    console.error('❌ Init error:', err);
    alert('خطأ في التحميل: ' + err.message);
  }
});

function setupCanvas() {
  previewCanvas = $('previewCanvas');
  if (!previewCanvas) { alert('canvas ماشي موجود'); return; }
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  previewCanvas.width = DESIGN_W * dpr;
  previewCanvas.height = DESIGN_H * dpr;
  previewCtx = previewCanvas.getContext('2d');
  previewCtx.scale(dpr, dpr);
}

function startRenderLoop() {
  function loop() {
    if (previewCtx) drawFrame(previewCtx, DESIGN_W, DESIGN_H, state.currentTime);
    renderRAF = requestAnimationFrame(loop);
  }
  loop();
}

/* ============ DRAW FRAME ============ */
function drawFrame(ctx, W, H, t) {
  const s = W / DESIGN_W;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  if (state.bgImg) {
    ctx.save();
    applyFilters(ctx, state.bgFilters);
    ctx.globalAlpha = state.bgFilters.op / 100;
    drawCover(ctx, state.bgImg, 0, 0, W, H);
    ctx.restore();
  }

  const cardW = 320 * s * state.card.scale;
  const cardH = cardW;
  const cardX = (W - cardW) / 2;
  const cardY = (H - cardH) / 2;
  const radius = state.card.radius * s;

  if (state.bgImg) {
    ctx.save();
    roundRect(ctx, cardX, cardY, cardW, cardH, radius);
    ctx.clip();
    const gf = Object.assign({}, state.bgFilters, { blur: Math.max(20, state.bgFilters.blur) });
    applyFilters(ctx, gf);
    ctx.globalAlpha = 0.6;
    drawCover(ctx, state.bgImg, 0, 0, W, H);
    ctx.restore();
  }

  ctx.save();
  ctx.fillStyle = 'rgba(15,15,15,' + state.card.opacity + ')';
  roundRect(ctx, cardX, cardY, cardW, cardH, radius);
  ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.12)';
  ctx.lineWidth = 1 * s;
  roundRect(ctx, cardX, cardY, cardW, cardH, radius);
  ctx.stroke();
  ctx.restore();

  const padX = 22 * s;
  const padY = 20 * s;

  const artSize = state.card.coverSize * s * state.card.scale;
  const artX = cardX + cardW - padX - artSize;
  const artY = cardY + padY;
  const artR = 10 * s;

  if (state.coverImg) {
    ctx.save();
    roundRect(ctx, artX, artY, artSize, artSize, artR);
    ctx.clip();
    drawCover(ctx, state.coverImg, artX, artY, artSize, artSize);
    ctx.restore();
  } else {
    ctx.save();
    ctx.fillStyle = '#1a1a24';
    roundRect(ctx, artX, artY, artSize, artSize, artR);
    ctx.fill();
    ctx.restore();
  }

  const textRight = artX - 14 * s;
  ctx.save();
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  if (state.songName) {
    ctx.fillStyle = '#fff';
    ctx.font = '700 ' + (18 * s) + 'px Cairo, Inter, sans-serif';
    ctx.fillText(state.songName, textRight, artY + artSize * 0.35);
  }
  if (state.artistName) {
    ctx.fillStyle = '#b3b3b3';
    ctx.font = '500 ' + (14 * s) + 'px Cairo, Inter, sans-serif';
    ctx.fillText(state.artistName, textRight, artY + artSize * 0.7);
  }
  ctx.restore();

  const gap = 16 * s;
  const div1Y = artY + artSize + gap;
  drawDivider(ctx, cardX + padX, div1Y, cardW - padX * 2, s);

  const footerH = 20 * s;
  const div2Y = cardY + cardH - padY - footerH - gap;
  const lyricsCenter = (div1Y + div2Y) / 2;

  const idx = findActiveLyric(t);
  let prev = '';
  let curr = '...';
  let next = '';

  if (idx >= 0) {
    prev = idx > 0 ? (state.lyrics[idx - 1].text || '') : '';
    curr = state.lyrics[idx].text || '...';
    next = idx < state.lyrics.length - 1 ? (state.lyrics[idx + 1].text || '') : '';
  } else if (state.lyrics.length > 0 && state.lyrics[0].text) {
    curr = state.lyrics[0].text;
    next = state.lyrics[1] ? (state.lyrics[1].text || '') : '';
  }

  const fontSize = state.font.size * s * state.card.scale;
  const smallSize = 15 * s * state.card.scale;
  const font = state.font.family + ', Cairo, Inter, sans-serif';
  const cx = cardX + cardW / 2;

  if (prev) {
    ctx.save();
    ctx.globalAlpha = 0.4;
    ctx.fillStyle = '#fff';
    ctx.font = '500 ' + smallSize + 'px ' + font;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(prev, cx, lyricsCenter - fontSize * 1.4);
    ctx.restore();
  }

  ctx.save();
  ctx.fillStyle = state.font.color;
  ctx.font = '700 ' + fontSize + 'px ' + font;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(0,0,0,0.5)';
  ctx.shadowBlur = 20 * s;
  ctx.fillText(curr, cx, lyricsCenter);
  ctx.restore();

  if (next) {
    ctx.save();
    ctx.globalAlpha = 0.4;
    ctx.fillStyle = '#fff';
    ctx.font = '500 ' + smallSize + 'px ' + font;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(next, cx, lyricsCenter + fontSize * 1.4);
    ctx.restore();
  }

  drawDivider(ctx, cardX + padX, div2Y, cardW - padX * 2, s);

  const footerY = cardY + cardH - padY - footerH / 2;
  const iconSize = 18 * s;
  const igX = cardX + padX;

  ctx.save();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1.5 * s;
  roundRect(ctx, igX, footerY - iconSize / 2, iconSize, iconSize, iconSize * 0.28);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(igX + iconSize / 2, footerY, iconSize * 0.22, 0, Math.PI * 2);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(igX + iconSize * 0.72, footerY - iconSize * 0.22, iconSize * 0.06, 0, Math.PI * 2);
  ctx.fillStyle = '#fff';
  ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.fillStyle = '#fff';
  ctx.font = '500 ' + (14 * s) + 'px Inter, Cairo, sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(state.igName, igX + iconSize + 6 * s, footerY);
  ctx.restore();
}

function roundRect(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function drawCover(ctx, img, dx, dy, dw, dh) {
  if (!img || !img.naturalWidth || !img.naturalHeight) return;
  const ir = img.naturalWidth / img.naturalHeight;
  const cr = dw / dh;
  let w, h, x, y;
  if (ir > cr) { h = dh; w = dh * ir; x = dx + (dw - w) / 2; y = dy; }
  else { w = dw; h = dw / ir; x = dx; y = dy + (dh - h) / 2; }
  ctx.drawImage(img, x, y, w, h);
}

function applyFilters(ctx, f) {
  if (typeof ctx.filter !== 'undefined') {
    try {
      ctx.filter = 'blur(' + f.blur + 'px) brightness(' + f.bright + '%) saturate(' + f.sat + '%) contrast(' + f.con + '%)';
    } catch (e) {}
  }
}

function drawDivider(ctx, x, y, w, s) {
  const g = ctx.createLinearGradient(x, 0, x + w, 0);
  g.addColorStop(0, 'rgba(180,180,190,0)');
  g.addColorStop(0.25, 'rgba(180,180,190,0.45)');
  g.addColorStop(0.5, 'rgba(220,220,230,0.65)');
  g.addColorStop(0.75, 'rgba(180,180,190,0.45)');
  g.addColorStop(1, 'rgba(180,180,190,0)');
  ctx.save();
  ctx.fillStyle = g;
  ctx.fillRect(x, y, w, Math.max(1, s));
  ctx.restore();
}

function findActiveLyric(t) {
  for (let i = 0; i < state.lyrics.length; i++) {
    const l = state.lyrics[i];
    if (t >= l.start && t < l.start + l.duration) return i;
  }
  return -1;
}

/* ============ AUDIO ============ */
function bindAudio() {
  $('audioInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    if (state.audioUrl) URL.revokeObjectURL(state.audioUrl);
    state.audioUrl = URL.createObjectURL(file);
    const player = $('audioPlayer');
    player.src = state.audioUrl;
    player.onloadedmetadata = function() {
      state.duration = player.duration;
      state.audioStart = 0;
      state.audioEnd = Math.min(player.duration, 30);
      state.trimIn = 0;
      state.trimOut = state.audioEnd;
      updateAudioSegmentUI();
      renderRuler();
      renderTimeline();
      updateTimeDisplay();
    };
    $('audioUploadBtn').classList.add('hidden');
    $('audioPreview').classList.remove('hidden');
    $('audioPreviewName').textContent = file.name;
    $('audioPreviewMeta').textContent = (file.size / 1024 / 1024).toFixed(1) + ' MB';
  });
}

function openAudioPicker() { $('audioInput').click(); }

function removeAudio() {
  if (state.audioUrl) URL.revokeObjectURL(state.audioUrl);
  state.audioUrl = null;
  state.duration = 0;
  state.audioEnd = 15;
  $('audioPlayer').src = '';
  $('audioUploadBtn').classList.remove('hidden');
  $('audioPreview').classList.add('hidden');
  $('audioSegment').classList.add('hidden');
  $('audioAddBtn').classList.remove('hidden');
  updateTimeDisplay();
  renderRuler();
}

function updateAudioSegmentUI() {
  const seg = $('audioSegment');
  seg.classList.remove('hidden');
  $('audioAddBtn').classList.add('hidden');
  seg.style.left = (state.audioStart * PX_PER_SEC) + 'px';
  seg.style.width = ((state.audioEnd - state.audioStart) * PX_PER_SEC) + 'px';
}

/* ============ PLAYBACK ============ */
function togglePlay() {
  const el = $('audioPlayer');
  if (state.isPlaying) {
    el.pause();
    state.isPlaying = false;
    updatePlayIcon();
    return;
  }
  let startAt = state.currentTime;
  if (startAt < state.audioStart || startAt >= state.audioEnd - 0.05) startAt = state.audioStart;
  state.currentTime = startAt;
  seekPlayhead(startAt);
  if (state.audioUrl) {
    el.currentTime = state.trimIn + (startAt - state.audioStart);
    el.play().catch(function() {});
  }
  state.isPlaying = true;
  updatePlayIcon();
  playLoop();
}

function updatePlayIcon() {
  $('playIcon').innerHTML = state.isPlaying
    ? '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>'
    : '<polygon points="5 3 19 12 5 21 5 3"/>';
}

function playLoop() {
  if (!state.isPlaying) return;
  const el = $('audioPlayer');
  if (state.audioUrl && el && !el.paused) {
    const fileT = el.currentTime;
    state.currentTime = state.audioStart + (fileT - state.trimIn);
    if (fileT >= state.trimOut) {
      state.currentTime = state.audioEnd;
      el.pause();
      state.isPlaying = false;
      updatePlayIcon();
      seekPlayhead(state.audioEnd);
      updateTimeDisplay();
      return;
    }
  } else {
    state.currentTime += 0.016;
    if (state.currentTime >= state.audioEnd) {
      state.currentTime = state.audioEnd;
      state.isPlaying = false;
      updatePlayIcon();
    }
  }
  seekPlayhead(state.currentTime);
  updateTimeDisplay();
  requestAnimationFrame(playLoop);
}

function seekBy(delta) {
  const t = clamp(state.currentTime + delta, state.audioStart, state.audioEnd);
  state.currentTime = t;
  if (state.audioUrl) $('audioPlayer').currentTime = state.trimIn + (t - state.audioStart);
  seekPlayhead(t);
  updateTimeDisplay();
}

function updateTimeDisplay() {
  $('timeDisplay').textContent = fmtTime(state.currentTime) + ' / ' + fmtTime(state.audioEnd);
}

/* ============ TIMELINE ============ */
function getTimelineDuration() {
  const last = state.lyrics.reduce(function(m, l) { return Math.max(m, l.start + l.duration); }, 0);
  return Math.max(state.audioEnd, last, 15);
}

function renderRuler() {
  const r = $('timelineRuler');
  const total = getTimelineDuration();
  r.innerHTML = '';
  r.style.width = (total * PX_PER_SEC) + 'px';
  for (let s = 0; s <= total; s++) {
    const tick = document.createElement('div');
    tick.className = 'ruler-tick';
    tick.style.left = (s * PX_PER_SEC) + 'px';
    tick.innerHTML = '<span>' + s + 's</span><i></i>';
    r.appendChild(tick);
  }
  $('timelineContent').style.width = (total * PX_PER_SEC + 60) + 'px';
}

function renderTimeline() {
  const t = $('trackText');
  t.innerHTML = '';
  t.style.width = (getTimelineDuration() * PX_PER_SEC) + 'px';

  state.lyrics.forEach(function(l, i) {
    const seg = document.createElement('div');
    seg.className = 'text-segment';
    if (state.selected.type === 'text' && state.selected.index === i) seg.classList.add('selected');
    seg.style.left = (l.start * PX_PER_SEC) + 'px';
    seg.style.width = (l.duration * PX_PER_SEC) + 'px';
    seg.textContent = l.text || ('السطر ' + (i + 1));

    const hL = document.createElement('div');
    hL.className = 'seg-handle handle-left';
    hL.addEventListener('mousedown', function(e) {
      state.selected = { type: 'text', index: i };
      startResize(e, i, 'left');
    });
    hL.addEventListener('touchstart', function(e) {
      state.selected = { type: 'text', index: i };
      startResize(e, i, 'left');
    }, { passive: false });
    seg.appendChild(hL);

    const hR = document.createElement('div');
    hR.className = 'seg-handle handle-right';
    hR.addEventListener('mousedown', function(e) {
      state.selected = { type: 'text', index: i };
      startResize(e, i, 'right');
    });
    hR.addEventListener('touchstart', function(e) {
      state.selected = { type: 'text', index: i };
      startResize(e, i, 'right');
    }, { passive: false });
    seg.appendChild(hR);

    seg.addEventListener('click', function(e) {
      if (e.target.classList.contains('seg-handle')) return;
      selectText(i);
    });

    seg.addEventListener('mousedown', function(e) {
      if (!e.target.classList.contains('seg-handle')) startLongPress(e, i, seg);
    });
    seg.addEventListener('touchstart', function(e) {
      if (!e.target.classList.contains('seg-handle')) startLongPress(e, i, seg);
    }, { passive: true });

    t.appendChild(seg);
  });
}

function selectText(i) {
  state.selected = { type: 'text', index: i };
  renderTimeline();
  showCapcutMenu();
  if (navigator.vibrate) try { navigator.vibrate(10); } catch (e) {}
}

function clearSelection() {
  state.selected = { type: null, index: -1 };
  renderTimeline();
  hideCapcutMenu();
}

/* ============ RESIZE ============ */
function startResize(e, index, side) {
  e.preventDefault();
  e.stopPropagation();
  const cx = e.touches ? e.touches[0].clientX : e.clientX;
  const l = state.lyrics[index];
  _resize = { index: index, side: side, startX: cx, startStart: l.start, startDur: l.duration };

  function move(ev) { onResizeMove(ev); }
  function end() {
    document.removeEventListener('mousemove', move);
    document.removeEventListener('mouseup', end);
    document.removeEventListener('touchmove', move);
    document.removeEventListener('touchend', end);
    _resize = null;
    renderRuler();
    renderTimeline();
  }

  document.addEventListener('mousemove', move);
  document.addEventListener('mouseup', end);
  document.addEventListener('touchmove', move, { passive: false });
  document.addEventListener('touchend', end);
}

function onResizeMove(e) {
  if (!_resize) return;
  e.preventDefault();
  const cx = e.touches ? e.touches[0].clientX : e.clientX;
  const dx = (cx - _resize.startX) / PX_PER_SEC;
  const l = state.lyrics[_resize.index];

  if (_resize.side === 'right') {
    l.duration = Math.max(0.5, _resize.startDur + dx);
  } else {
    const ns = Math.max(0, _resize.startStart + dx);
    const diff = ns - _resize.startStart;
    l.start = round1(ns);
    l.duration = Math.max(0.5, _resize.startDur - diff);
  }
  renderTimeline();
}

function startLongPress(e, index, segEl) {
  const cx = e.touches ? e.touches[0].clientX : e.clientX;
  let cancelled = false;

  function cancelIfMove(ev) {
    const mx = ev.touches ? ev.touches[0].clientX : ev.clientX;
    if (Math.abs(mx - cx) > 8) {
      cancelled = true;
      clearTimeout(_lpTimer);
    }
  }

  document.addEventListener('mousemove', cancelIfMove, { passive: true });
  document.addEventListener('touchmove', cancelIfMove, { passive: true });

  _lpTimer = setTimeout(function() {
    if (cancelled) return;
    selectText(index);
    if (navigator.vibrate) try { navigator.vibrate(20); } catch (e) {}

    const startStart = state.lyrics[index].start;
    const startX = cx;

    function move(ev) {
      const mx = ev.touches ? ev.touches[0].clientX : ev.clientX;
      const dx = (mx - startX) / PX_PER_SEC;
      state.lyrics[index].start = round1(Math.max(0, startStart + dx));
      renderTimeline();
    }
    function end() {
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', end);
      document.removeEventListener('touchmove', move);
      document.removeEventListener('touchend', end);
      renderRuler();
    }
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', end);
    document.addEventListener('touchmove', move, { passive: false });
    document.addEventListener('touchend', end);
  }, LONG_PRESS_MS);
}

/* ============ PLAYHEAD ============ */
function seekPlayhead(sec) {
  $('playhead').style.transform = 'translateX(' + (sec * PX_PER_SEC) + 'px)';
}

function setupPlayheadDrag() {
  const ph = $('playhead');
  const content = $('timelineContent');
  let dragging = false;

  function pxToTime(cx) {
    const r = content.getBoundingClientRect();
    return Math.max(0, (cx - r.left) / PX_PER_SEC);
  }

  const cap = ph.querySelector('.playhead-cap');
  if (!cap) return;

  function onDown(e) {
    e.preventDefault();
    dragging = true;

    function start(ev) {
      if (!dragging) return;
      const cx = ev.touches ? ev.touches[0].clientX : ev.clientX;
      const t = clamp(pxToTime(cx), state.audioStart, state.audioEnd);
      state.currentTime = t;
      seekPlayhead(t);
      if (state.audioUrl) $('audioPlayer').currentTime = state.trimIn + (t - state.audioStart);
      updateTimeDisplay();
    }
    function end() {
      dragging = false;
      document.removeEventListener('mousemove', start);
      document.removeEventListener('mouseup', end);
      document.removeEventListener('touchmove', start);
      document.removeEventListener('touchend', end);
    }

    document.addEventListener('mousemove', start);
    document.addEventListener('mouseup', end);
    document.addEventListener('touchmove', start, { passive: false });
    document.addEventListener('touchend', end);
    start(e);
  }

  cap.addEventListener('mousedown', onDown);
  cap.addEventListener('touchstart', onDown, { passive: false });
}

function setupTimelineClick() {
  $('timelineViewport').addEventListener('click', function(e) {
    if (e.target.closest('.text-segment')) return;
    if (e.target.closest('.audio-segment')) return;
    if (e.target.closest('.seg-handle')) return;
    if (e.target.closest('.playhead-cap')) return;
    if (e.target.closest('.audio-add-btn')) return;
    const content = $('timelineContent');
    const r = content.getBoundingClientRect();
    const t = clamp(Math.max(0, (e.clientX - r.left) / PX_PER_SEC), state.audioStart, state.audioEnd);
    state.currentTime = t;
    seekPlayhead(t);
    if (state.audioUrl) $('audioPlayer').currentTime = state.trimIn + (t - state.audioStart);
    updateTimeDisplay();
  });
}

/* ============ AUDIO SEGMENT ============ */
function bindAudioSegment() {
  const seg = $('audioSegment');
  seg.addEventListener('click', function(e) {
    if (e.target.classList.contains('seg-handle')) return;
    state.selected = { type: 'audio', index: -1 };
    renderTimeline();
    showCapcutMenu();
  });

  const hL = document.createElement('div');
  hL.className = 'seg-handle handle-left';
  hL.addEventListener('mousedown', function(e) { state.selected = { type: 'audio', index: -1 }; startAudioResize(e, 'left'); });
  hL.addEventListener('touchstart', function(e) { state.selected = { type: 'audio', index: -1 }; startAudioResize(e, 'left'); }, { passive: false });
  seg.appendChild(hL);

  const hR = document.createElement('div');
  hR.className = 'seg-handle handle-right';
  hR.addEventListener('mousedown', function(e) { state.selected = { type: 'audio', index: -1 }; startAudioResize(e, 'right'); });
  hR.addEventListener('touchstart', function(e) { state.selected = { type: 'audio', index: -1 }; startAudioResize(e, 'right'); }, { passive: false });
  seg.appendChild(hR);
}

function startAudioResize(e, side) {
  e.preventDefault();
  e.stopPropagation();
  const startX = e.touches ? e.touches[0].clientX : e.clientX;
  const snap = { startStart: state.audioStart, startEnd: state.audioEnd, trimIn: state.trimIn, trimOut: state.trimOut };

  function move(ev) {
    const cx = ev.touches ? ev.touches[0].clientX : ev.clientX;
    const dx = (cx - startX) / PX_PER_SEC;
    if (side === 'left') {
      let nt = snap.trimIn + dx;
      let ns = snap.startStart + dx;
      if (nt < 0) { ns -= nt; nt = 0; }
      if (nt > snap.trimOut - 0.5) { nt = snap.trimOut - 0.5; ns = snap.startStart + (nt - snap.trimIn); }
      state.trimIn = round1(nt);
      state.audioStart = round1(Math.max(0, ns));
      state.audioEnd = snap.startEnd;
      state.trimOut = snap.trimOut;
    } else {
      let nt = snap.trimOut + dx;
      if (nt > state.duration) nt = state.duration;
      if (nt < snap.trimIn + 0.5) nt = snap.trimIn + 0.5;
      state.trimOut = round1(nt);
      state.audioEnd = round1(state.audioStart + (nt - state.trimIn));
      state.audioStart = snap.startStart;
      state.trimIn = snap.trimIn;
    }
    updateAudioSegmentUI();
    renderRuler();
  }

  function end() {
    document.removeEventListener('mousemove', move);
    document.removeEventListener('mouseup', end);
    document.removeEventListener('touchmove', move);
    document.removeEventListener('touchend', end);
    updateTimeDisplay();
  }

  document.addEventListener('mousemove', move);
  document.addEventListener('mouseup', end);
  document.addEventListener('touchmove', move, { passive: false });
  document.addEventListener('touchend', end);
}

function openTab(name, btn) {
  if (currentTab === name) { closeSheet(); return; }
  currentTab = name;
  document.querySelectorAll('.editor-nav-item').forEach(function(el) { el.classList.remove('active'); });
  if (btn) btn.classList.add('active');
  document.querySelectorAll('.sheet-content').forEach(function(el) { el.classList.remove('active'); });
  const t = document.querySelector('[data-sheet="' + name + '"]');
  if (t) t.classList.add('active');
  $('bottomSheet').classList.add('open');
  $('sheetBackdrop').classList.add('open');
}

function closeSheet() {
  currentTab = null;
  document.querySelectorAll('.editor-nav-item').forEach(function(el) { el.classList.remove('active'); });
  $('bottomSheet').classList.remove('open');
  $('sheetBackdrop').classList.remove('open');
}

function showCapcutMenu() {
  $('capcutMenu').classList.add('open');
  document.body.classList.add('menu-open');
}
function hideCapcutMenu() {
  $('capcutMenu').classList.remove('open');
  document.body.classList.remove('menu-open');
}

function cmAction(action) {
  if (action === 'delete') {
    if (state.selected.type === 'text' && state.selected.index >= 0) {
      if (state.lyrics.length <= 1) return;
      state.lyrics.splice(state.selected.index, 1);
      renderTimeline();
      renderLyricsList();
      renderRuler();
    } else if (state.selected.type === 'audio') {
      removeAudio();
    }
    clearSelection();
  } else if (action === 'split') {
    if (state.selected.type === 'text' && state.selected.index >= 0) {
      const i = state.selected.index;
      const l = state.lyrics[i];
      const t = state.currentTime;
      if (t > l.start && t < l.start + l.duration) {
        const first = { text: l.text, start: l.start, duration: round1(t - l.start) };
        const second = { text: l.text, start: round1(t), duration: round1(l.start + l.duration - t) };
        state.lyrics.splice(i, 1, first, second);
        renderTimeline();
        renderLyricsList();
        renderRuler();
      }
    }
    hideCapcutMenu();
  } else if (action === 'edit') {
    hideCapcutMenu();
    openTab('text', document.querySelector('[data-tab="text"]'));
  }
}

/* ============ EXPORT ============ */
let exportSettings = { quality: 1080, fps: 30 };
let _audioCtx = null;
let _audioSource = null;
let _audioDest = null;

async function startExport() {
  const btn = $('exportStartBtn');
  const progress = $('exportProgress');
  const fill = $('exportProgressFill');
  const txt = $('exportProgressText');

  btn.disabled = true;
  progress.style.display = 'block';
  fill.style.width = '0%';
  txt.textContent = 'جاري التحضير...';

  try {
    const W = exportSettings.quality === 1080 ? 1080 : 720;
    const H = Math.round(W * DESIGN_H / DESIGN_W);

    const canvas = document.createElement('canvas');
    canvas.width = W;
    canvas.height = H;
    const ctx = canvas.getContext('2d', { alpha: false });

    const stream = canvas.captureStream(exportSettings.fps);

    const player = $('audioPlayer');
    try {
      if (!_audioCtx) {
        _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        _audioSource = _audioCtx.createMediaElementSource(player);
        _audioDest = _audioCtx.createMediaStreamDestination();
        _audioSource.connect(_audioDest);
        _audioSource.connect(_audioCtx.destination);
      }
      if (_audioCtx.state === 'suspended') await _audioCtx.resume();
      _audioDest.stream.getAudioTracks().forEach(function(t) { stream.addTrack(t); });
    } catch (audioErr) {
      console.warn('Audio setup:', audioErr);
    }

    let mimeType = 'video/webm';
    const prefs = [
      'video/mp4;codecs=avc1.42E01E,mp4a.40.2',
      'video/mp4',
      'video/webm;codecs=vp9,opus',
      'video/webm;codecs=vp8,opus',
      'video/webm'
    ];
    for (let i = 0; i < prefs.length; i++) {
      if (MediaRecorder.isTypeSupported(prefs[i])) { mimeType = prefs[i]; break; }
    }

    const recorder = new MediaRecorder(stream, {
      mimeType: mimeType,
      videoBitsPerSecond: exportSettings.quality === 1080 ? 8000000 : 4000000
    });

    const chunks = [];
    recorder.ondataavailable = function(e) {
      if (e.data.size > 0) chunks.push(e.data);
    };
    const stopped = new Promise(function(r) { recorder.onstop = r; });
    recorder.start(100);

    player.currentTime = state.trimIn;
    await new Promise(function(r) {
      function h() { player.removeEventListener('seeked', h); r(); }
      player.addEventListener('seeked', h);
      setTimeout(r, 300);
    });

    try {
      await player.play();
    } catch (playErr) {
      recorder.stop();
      throw new Error('المتصفح رفض تشغيل الصوت. اضغط على الصفحة ثم أعد المحاولة.');
    }

    const startAt = performance.now();
    const totalDur = state.audioEnd - state.audioStart;
    const frameInterval = 1000 / exportSettings.fps;

    await new Promise(function(resolve) {
      function render() {
        const elapsed = (performance.now() - startAt) / 1000;
        if (elapsed >= totalDur || player.ended) {
          if (recorder.state !== 'inactive') recorder.stop();
          resolve();
          return;
        }
        const t = state.audioStart + elapsed;
        drawFrame(ctx, W, H, t);

        const pct = Math.min(100, Math.round((elapsed / totalDur) * 100));
        fill.style.width = pct + '%';
        txt.textContent = 'جاري التصدير: ' + pct + '%';

        setTimeout(function() { requestAnimationFrame(render); }, frameInterval);
      }
      render();
    });

    await stopped;

    const blob = new Blob(chunks, { type: mimeType });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const ext = mimeType.indexOf('mp4') !== -1 ? 'mp4' : 'webm';
    a.href = url;
    a.download = 'dk.llyric-' + Date.now() + '.' + ext;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function() { URL.revokeObjectURL(url); }, 10000);

    fill.style.width = '100%';
    txt.textContent = '✅ تم التصدير بنجاح!';
    setTimeout(function() {
      closeExportModal();
      btn.disabled = false;
    }, 1500);
  } catch (err) {
    console.error(err);
    alert('خطأ في التصدير: ' + err.message);
    btn.disabled = false;
    progress.style.display = 'none';
  }
}

/* ============ MISC ============ */
function closeEditor() {
  if (confirm('إغلاق المشروع؟')) location.href = 'index.html';
}

document.addEventListener('click', function(e) {
  if (!state.selected.type) return;
  if (e.target.closest('.capcut-menu')) return;
  if (e.target.closest('.bottom-sheet')) return;
  if (e.target.closest('.editor-nav')) return;
  if (e.target.closest('.text-segment')) return;
  if (e.target.closest('.audio-segment')) return;
  if (e.target.closest('.seg-handle')) return;
  if (e.target.closest('.playhead')) return;
  clearSelection();
}, true);
</script>
