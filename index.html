<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#000000" />
<title>Vibe - iOS Social</title>
<style>
/* ============ RESET & VARIABLES ============ */
:root {
  --bg: #000000;
  --bg-elevated: #1c1c1e;
  --bg-glass: rgba(18, 18, 18, 0.75);
  --border: rgba(255, 255, 255, 0.12);
  --text-primary: #ffffff;
  --text-secondary: #8e8e93;
  --ios-blue: #0A84FF;
  --ios-red: #FF453A;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --safe-top: env(safe-area-inset-top, 44px);
  --safe-bottom: env(safe-area-inset-bottom, 20px);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  touch-action: manipulation; /* يمنع الزووم ويخلي النقر يخدم */
}

body {
  background-color: var(--bg);
  color: var(--text-primary);
  font-family: var(--font);
  height: 100vh;
  width: 100vw;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  user-select: none;
  -webkit-user-select: none;
}

svg { display: block; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

/* ============ TOP BAR ============ */
.top-bar {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: calc(var(--safe-top) + 44px);
  padding-top: var(--safe-top);
  background: var(--bg-glass);
  backdrop-filter: blur(25px) saturate(180%);
  -webkit-backdrop-filter: blur(25px) saturate(180%);
  border-bottom: 0.5px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-inline: 16px;
  z-index: 100;
}
.logo {
  font-size: 26px;
  font-weight: 800;
  letter-spacing: -0.5px;
  background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  font-style: italic;
}
.top-icons { display: flex; gap: 20px; }
.top-icons svg { width: 24px; height: 24px; stroke: white; fill: none; stroke-width: 2; cursor: pointer; }

/* ============ MAIN CONTENT ============ */
.main-content {
  flex: 1;
  overflow-y: auto;
  padding-top: calc(var(--safe-top) + 44px);
  padding-bottom: calc(var(--safe-bottom) + 60px);
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
}
.main-content::-webkit-scrollbar { display: none; }

.view { display: none; animation: fadeIn 0.3s ease; width: 100%; }
.view.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

/* ============ STORIES ============ */
.stories {
  display: flex;
  gap: 14px;
  padding: 12px 16px;
  overflow-x: auto;
  border-bottom: 0.5px solid var(--border);
}
.stories::-webkit-scrollbar { display: none; }
.story { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; }
.story-ring {
  width: 72px; height: 72px;
  border-radius: 50%;
  padding: 3px;
  background: linear-gradient(45deg, #f09433, #dc2743, #bc1888);
  position: relative;
}
.story-ring.seen { background: #333; }
.story-img {
  width: 100%; height: 100%; border-radius: 50%;
  object-fit: cover; border: 2px solid var(--bg);
  background: #222;
}
.story-name { font-size: 11px; color: var(--text-secondary); max-width: 72px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.story.add .story-ring { background: none; border: 1px dashed #555; }
.story.add .story-img { background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; border: none; }
.story.add svg { width: 24px; height: 24px; stroke: white; }

/* ============ POSTS ============ */
.post { margin-bottom: 20px; border-bottom: 0.5px solid var(--border); padding-bottom: 16px; }
.post-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; }
.post-user { display: flex; align-items: center; gap: 10px; }
.post-avatar { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; background: #333; }
.post-username { font-size: 14px; font-weight: 600; }
.post-location { font-size: 11px; color: var(--text-secondary); }
.post-more { width: 24px; height: 24px; stroke: white; fill: none; stroke-width: 2; }

.post-image-container { position: relative; width: 100%; aspect-ratio: 4/5; background: #111; overflow: hidden; }
.post-image { width: 100%; height: 100%; object-fit: cover; }
.heart-overlay {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%) scale(0);
  width: 100px; height: 100px;
  fill: white; opacity: 0; pointer-events: none;
  transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s;
  filter: drop-shadow(0 0 10px rgba(0,0,0,0.5));
}
.heart-overlay.animate { transform: translate(-50%, -50%) scale(1); opacity: 1; }

.post-actions { display: flex; justify-content: space-between; padding: 12px 16px 8px; }
.action-group { display: flex; gap: 16px; }
.action-btn { padding: 0; transition: transform 0.1s; }
.action-btn:active { transform: scale(0.85); }
.action-btn svg { width: 26px; height: 26px; stroke: white; fill: none; stroke-width: 2; transition: all 0.2s; }
.action-btn.liked svg { fill: var(--ios-red); stroke: var(--ios-red); animation: heartPop 0.3s; }
.action-btn.saved svg { fill: white; stroke: white; }
@keyframes heartPop { 0% { transform: scale(1); } 50% { transform: scale(1.3); } 100% { transform: scale(1); } }

.post-likes { padding: 0 16px; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
.post-caption { padding: 0 16px; font-size: 14px; line-height: 1.4; }
.post-caption span { font-weight: 600; margin-left: 6px; }
.post-comments { padding: 6px 16px 0; font-size: 14px; color: var(--text-secondary); cursor: pointer; }
.post-time { padding: 8px 16px 0; font-size: 10px; color: var(--text-secondary); text-transform: uppercase; }

/* ============ EXPLORE / SEARCH ============ */
.search-bar-container { padding: 12px 16px; }
.search-input {
  width: 100%; padding: 10px 16px; border-radius: 12px;
  background: var(--bg-elevated); color: white;
  border: none; font-size: 16px; outline: none;
}
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
.grid-item { aspect-ratio: 1; background: #222; cursor: pointer; position: relative; }
.grid-item img { width: 100%; height: 100%; object-fit: cover; }

/* ============ CREATE ============ */
.create-screen { padding: 20px; display: flex; flex-direction: column; align-items: center; height: 100vh; justify-content: center; }
.upload-box {
  width: 250px; height: 250px; border: 2px dashed #444; border-radius: 24px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 12px; color: var(--text-secondary); cursor: pointer;
  background: rgba(255,255,255,0.02); transition: all 0.2s;
}
.upload-box:active { background: rgba(255,255,255,0.05); border-color: var(--ios-blue); }
.upload-box svg { width: 48px; height: 48px; stroke: currentColor; fill: none; stroke-width: 1.5; }
.create-btn { margin-top: 24px; background: var(--ios-blue); color: white; padding: 16px 48px; border-radius: 30px; font-weight: 700; font-size: 16px; }

/* ============ ACTIVITY (NOTIFICATIONS) ============ */
.activity-list { padding: 10px 16px; }
.activity-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 0.5px solid var(--border); }
.activity-avatar { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; }
.activity-text { flex: 1; font-size: 14px; line-height: 1.4; }
.activity-text b { font-weight: 600; }
.activity-time { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
.activity-img { width: 44px; height: 44px; border-radius: 4px; object-fit: cover; }
.activity-follow-btn { background: var(--ios-blue); color: white; padding: 6px 14px; border-radius: 8px; font-weight: 600; font-size: 13px; }

/* ============ PROFILE ============ */
.profile-header { padding: 20px 16px; display: flex; align-items: center; gap: 20px; }
.profile-avatar { width: 86px; height: 86px; border-radius: 50%; object-fit: cover; border: 2px solid var(--border); padding: 2px; }
.profile-stats { display: flex; gap: 24px; flex: 1; justify-content: space-around; }
.stat { display: flex; flex-direction: column; align-items: center; }
.stat-num { font-size: 18px; font-weight: 700; }
.stat-label { font-size: 13px; color: var(--text-secondary); }
.profile-info { padding: 0 16px 20px; }
.profile-name { font-weight: 600; font-size: 15px; }
.profile-bio { font-size: 14px; margin-top: 4px; line-height: 1.4; }
.profile-actions { display: flex; gap: 8px; padding: 0 16px 20px; }
.profile-btn { flex: 1; background: var(--bg-elevated); color: white; padding: 8px; border-radius: 8px; font-weight: 600; font-size: 14px; }
.profile-btn.primary { background: var(--ios-blue); }
.profile-tabs { display: flex; border-top: 0.5px solid var(--border); }
.profile-tab { flex: 1; padding: 12px; text-align: center; border-bottom: 2px solid transparent; cursor: pointer; }
.profile-tab.active { border-bottom-color: white; }
.profile-tab svg { width: 24px; height: 24px; stroke: var(--text-secondary); }
.profile-tab.active svg { stroke: white; }

/* ============ BOTTOM NAV ============ */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  height: calc(var(--safe-bottom) + 50px); padding-bottom: var(--safe-bottom);
  background: var(--bg-glass);
  backdrop-filter: blur(25px) saturate(180%);
  -webkit-backdrop-filter: blur(25px) saturate(180%);
  border-top: 0.5px solid var(--border);
  display: flex; justify-content: space-around; align-items: center;
  z-index: 100;
}
.nav-item { padding: 10px; cursor: pointer; position: relative; }
.nav-item svg { width: 26px; height: 26px; stroke: var(--text-secondary); fill: none; stroke-width: 2; transition: all 0.2s; }
.nav-item.active svg { stroke: white; fill: white; }
.nav-item.active[data-tab="create"] svg { stroke: var(--ios-blue); fill: var(--ios-blue); }
.nav-avatar { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; border: 2px solid transparent; transition: border-color 0.2s; }
.nav-item.active[data-tab="profile"] .nav-avatar { border-color: white; }

/* ============ MODALS (COMMENTS, SHARE, STORY) ============ */
.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.6);
  z-index: 500; opacity: 0; pointer-events: none; transition: opacity 0.3s;
  display: flex; flex-direction: column; justify-content: flex-end;
}
.overlay.show { opacity: 1; pointer-events: auto; }

/* Comments Modal */
.comments-sheet {
  background: var(--bg); width: 100%; height: 75vh;
  border-radius: 24px 24px 0 0; display: flex; flex-direction: column;
  transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.1);
}
.overlay.show .comments-sheet { transform: translateY(0); }
.sheet-header { padding: 16px; border-bottom: 0.5px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.sheet-title { font-weight: 700; font-size: 16px; }
.sheet-close { color: white; font-size: 20px; font-weight: bold; }
.comments-list { flex: 1; overflow-y: auto; padding: 16px; }
.comment-item { display: flex; gap: 12px; margin-bottom: 16px; }
.comment-avatar { width: 32px; height: 32px; border-radius: 50%; }
.comment-text { font-size: 14px; line-height: 1.4; }
.comment-text b { font-weight: 600; margin-left: 6px; }
.comment-time { font-size: 11px; color: var(--text-secondary); margin-top: 4px; }
.comment-input-area { padding: 12px 16px; border-top: 0.5px solid var(--border); display: flex; gap: 10px; background: var(--bg); padding-bottom: var(--safe-bottom); }
.comment-input { flex: 1; background: var(--bg-elevated); border: none; color: white; padding: 10px 16px; border-radius: 20px; outline: none; font-size: 14px; }
.comment-send { color: var(--ios-blue); font-weight: 700; font-size: 14px; }

/* Share Modal */
.share-sheet { background: var(--bg); padding: 20px 16px var(--safe-bottom); border-radius: 24px 24px 0 0; transform: translateY(100%); transition: transform 0.3s; }
.overlay.show .share-sheet { transform: translateY(0); }
.share-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: 20px; text-align: center; }
.share-app { display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; }
.share-icon { width: 60px; height: 60px; border-radius: 16px; display: flex; align-items: center; justify-content: center; background: #333; }
.share-icon svg { width: 30px; height: 30px; stroke: white; }
.share-name { font-size: 12px; color: var(--text-secondary); }

/* Story Viewer */
#story-viewer {
  position: fixed; inset: 0; background: #000;
  z-index: 1000; display: none; flex-direction: column;
}
#story-viewer.show { display: flex; }
.sv-progress { display: flex; gap: 4px; padding: calc(var(--safe-top) + 10px) 16px 10px; }
.sv-bar { flex: 1; height: 3px; background: rgba(255,255,255,0.3); border-radius: 2px; overflow: hidden; }
.sv-fill { height: 100%; background: white; width: 0%; }
.sv-fill.animating { animation: svProgress 5s linear forwards; }
@keyframes svProgress { from { width: 0%; } to { width: 100%; } }
.sv-header { display: flex; align-items: center; gap: 10px; padding: 0 16px; color: white; z-index: 10; }
.sv-avatar { width: 32px; height: 32px; border-radius: 50%; }
.sv-name { font-weight: 600; font-size: 14px; }
.sv-time { font-size: 12px; opacity: 0.7; }
.sv-close { margin-left: auto; color: white; font-size: 28px; padding: 10px; }
.sv-image { flex: 1; object-fit: contain; width: 100%; position: absolute; inset: 0; }
.sv-nav { position: absolute; top: 0; bottom: 0; width: 30%; z-index: 5; }
.sv-nav.left { left: 0; } .sv-nav.right { right: 0; }

/* ============ IN-APP NOTIFICATION BANNER ============ */
.ios-banner {
  position: fixed;
  top: calc(var(--safe-top) + 10px);
  left: 10px; right: 10px;
  background: rgba(30, 30, 30, 0.85);
  backdrop-filter: blur(30px) saturate(180%);
  -webkit-backdrop-filter: blur(30px) saturate(180%);
  border-radius: 20px;
  padding: 12px 16px;
  display: flex; align-items: center; gap: 12px;
  z-index: 2000;
  transform: translateY(-150%);
  transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.2);
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  border: 0.5px solid rgba(255,255,255,0.15);
}
.ios-banner.show { transform: translateY(0); }
.banner-icon { width: 38px; height: 38px; border-radius: 10px; background: linear-gradient(45deg, #f09433, #dc2743); display: flex; align-items: center; justify-content: center; }
.banner-icon svg { width: 24px; height: 24px; stroke: white; fill: none; stroke-width: 2.5; }
.banner-content { flex: 1; overflow: hidden; }
.banner-title { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
.banner-body { font-size: 13px; color: rgba(255,255,255,0.8); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ============ TOAST ============ */
#toast {
  position: fixed; bottom: calc(var(--safe-bottom) + 70px); left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--bg-elevated); color: white; padding: 12px 24px; border-radius: 30px;
  font-size: 14px; font-weight: 500; z-index: 2000; opacity: 0; pointer-events: none;
  transition: all 0.3s; border: 0.5px solid var(--border);
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Loader */
#loader { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 9999; transition: opacity 0.5s; }
#loader.hide { opacity: 0; pointer-events: none; }
.spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.2); border-top-color: white; border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- Loader -->
<div id="loader"><div class="spinner"></div></div>

<!-- In-App iOS Banner -->
<div class="ios-banner" id="ios-banner">
  <div class="banner-icon">
    <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
  </div>
  <div class="banner-content">
    <div class="banner-title" id="banner-title">Vibe</div>
    <div class="banner-body" id="banner-body">إشعار جديد</div>
  </div>
</div>

<!-- Top Bar -->
<div class="top-bar">
  <div class="logo">Vibe</div>
  <div class="top-icons">
    <svg onclick="triggerMockNotification()" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
    <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
  </div>
</div>

<!-- Main Content -->
<div class="main-content" id="main-scroll">

  <!-- HOME VIEW -->
  <div class="view active" id="view-home">
    <div class="stories" id="stories-container">
      <div class="story add">
        <div class="story-ring"><div class="story-img"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></div></div>
        <div class="story-name">قصتك</div>
      </div>
    </div>
    <div id="feed-container"></div>
  </div>

  <!-- EXPLORE VIEW -->
  <div class="view" id="view-explore">
    <div class="search-bar-container">
      <input type="text" class="search-input" placeholder="بحث..." id="search-input">
    </div>
    <div class="grid" id="explore-grid"></div>
  </div>

  <!-- CREATE VIEW -->
  <div class="view" id="view-create">
    <div class="create-screen">
      <div class="upload-box" onclick="showToast('تم اختيار صورة')">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        <span>اختر صورة من المعرض</span>
      </div>
      <button class="create-btn" onclick="showToast('تم النشر بنجاح! ✨'); switchTab('home')">متابعة النشر</button>
    </div>
  </div>

  <!-- ACTIVITY (NOTIFICATIONS) VIEW -->
  <div class="view" id="view-activity">
    <div class="activity-list" id="activity-container"></div>

  <!-- PROFILE VIEW -->
  <div class="view" id="view-profile">

      <img src="https://i.pravatar.cc/150?img=11" class="profile-avatar" alt="Profile">
      <div class="profile-stats">
        <div class="stat"><span class="stat-num">128</span><span class="stat-label">منشور</span></div>
        <div class="stat"><span class="stat-num">14.5K</span><span class="stat-label">متابع</span></div>
        <div class="stat"><span class="stat-num">320</span><span class="stat-label">يتابع</span></div>
      </div>
    </div>
    <div class="profile-info">
      <div class="profile-name">ياسين بن سارية</div>
      <div class="profile-bio">مطور ويب 💻 | مهتم بتقنيات iOS 🍎 | الجزائر 🇩🇿</div>
    </div>
    <div class="profile-actions">
      <button class="profile-btn primary" onclick="showToast('تم فتح الإعدادات')">تعديل الملف</button>

      <div class="profile-tab"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></div>
    </div>
    <div class="grid" id="profile-grid"></div>
  </div>

</div>

<!-- Bottom Navigation -->
<div class="bottom-nav">
  <div class="nav-item active" data-tab="home" onclick="switchTab('home')">
    <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
  </div>
  <div class="nav-item" data-tab="explore" onclick="switchTab('explore')">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
  </div>
  <div class="nav-item" data-tab="create" onclick="switchTab('create')">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
  </div>
  <div class="nav-item" data-tab="activity" onclick="switchTab('activity')">
    <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
  </div>
  <div class="nav-item" data-tab="profile" onclick="switchTab('profile')">
    <img src="https://i.pravatar.cc/150?img=11" class="nav-avatar" alt="Profile">
  </div>
</div>

<!-- Comments Modal -->
<div class="overlay" id="comments-overlay" onclick="closeModal('comments-overlay')">
  <div class="comments-sheet" onclick="event.stopPropagation()">
    <div class="sheet-header">
      <div class="sheet-title">التعليقات</div>
      <button class="sheet-close" onclick="closeModal('comments-overlay')">✕</button>
    </div>
    <div class="comments-list" id="comments-list">
      <!-- Injected via JS -->
    </div>
    <div class="comment-input-area">
      <input type="text" class="comment-input" placeholder="أضف تعليقاً..." id="comment-input">
      <button class="comment-send" onclick="addComment()">نشر</button>
    </div>
  </div>
</div>

<!-- Share Modal -->
<div class="overlay" id="share-overlay" onclick="closeModal('share-overlay')">
  <div class="share-sheet" onclick="event.stopPropagation()">
    <div class="sheet-title" style="text-align:center;margin-bottom:20px;">مشاركة</div>
    <div class="share-grid">
      <div class="share-app" onclick="showToast('تم النسخ')">
        <div class="share-icon"><svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></div>
        <div class="share-name">نسخ الرابط</div>
      </div>
      <div class="share-app" onclick="showToast('تم الإرسال')">
        <div class="share-icon" style="background:#34c759;"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></div>
        <div class="share-name">رسائل</div>
      </div>
      <div class="share-app" onclick="showToast('تم النشر')">
        <div class="share-icon" style="background:#0A84FF;"><svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg></div>
        <div class="share-name">ستوري</div>
      </div>
    </div>
    <button class="comment-send" style="width:100%;text-align:center;margin-top:20px;padding:16px;background:var(--bg-elevated);border-radius:12px;" onclick="closeModal('share-overlay')">إلغاء</button>
  </div>
</div>

<!-- Story Viewer -->
<div id="story-viewer">
  <div class="sv-nav left" onclick="prevStory()"></div>
  <div class="sv-nav right" onclick="nextStory()"></div>
  <div class="sv-progress" id="sv-progress"></div>
  <div class="sv-header">
    <img src="" class="sv-avatar" id="sv-avatar">
    <div>
      <div class="sv-name" id="sv-name">User</div>
      <div class="sv-time">منذ ساعتين</div>
    </div>
    <button class="sv-close" onclick="closeStory()">✕</button>
  </div>
  <img src="" class="sv-image" id="sv-image">
</div>

<!-- Toast -->
<div id="toast"></div>

<script>
// ============ DATA ============
const users = [
  { id: 1, name: 'أحمد', avatar: 'https://i.pravatar.cc/150?img=12' },
  { id: 2, name: 'سارة', avatar: 'https://i.pravatar.cc/150?img=9' },
  { id: 3, name: 'محمد', avatar: 'https://i.pravatar.cc/150?img=3' },
  { id: 4, name: 'ليلى', avatar: 'https://i.pravatar.cc/150?img=5' },
  { id: 5, name: 'يوسف', avatar: 'https://i.pravatar.cc/150?img=7' }
];

const storiesData = [
  { user: users[0], image: 'https://picsum.photos/id/10/400/800', seen: false },
  { user: users[1], image: 'https://picsum.photos/id/20/400/800', seen: false },
  { user: users[2], image: 'https://picsum.photos/id/30/400/800', seen: true },
  { user: users[3], image: 'https://picsum.photos/id/40/400/800', seen: false }
];

const postsData = [
  { user: users[0], image: 'https://picsum.photos/id/101/600/750', likes: 1240, caption: 'غروب الشمس اليوم كان رائعاً 🌅', location: 'الجزائر العاصمة', time: 'منذ 2 ساعة' },
  { user: users[1], image: 'https://picsum.photos/id/104/600/750', likes: 856, caption: 'جولة في الطبيعة 🌲✨', location: 'جبال الأطلس', time: 'منذ 5 ساعات' },
  { user: users[2], image: 'https://picsum.photos/id/106/600/750', likes: 3204, caption: 'إبداع بلا حدود 🎨', location: 'وهران', time: 'منذ 8 ساعات' }
];

const notificationsData = [
  { user: users[0], type: 'like', text: 'أعجب بصورتك.', time: 'منذ دقيقتين', image: 'https://picsum.photos/id/101/100/100' },
  { user: users[1], type: 'follow', text: 'بدأ متابعتك.', time: 'منذ ساعة', image: null },
  { user: users[3], type: 'comment', text: 'علق: "صورة رائعة!"', time: 'منذ ساعتين', image: 'https://picsum.photos/id/104/100/100' }
];

// ============ RENDER FUNCTIONS ============
function renderStories() {
  const container = document.getElementById('stories-container');
  storiesData.forEach((story, index) => {
    const div = document.createElement('div');
    div.className = 'story';
    div.innerHTML = `
      <div class="story-ring ${story.seen ? 'seen' : ''}">
        <img src="${story.user.avatar}" class="story-img" alt="story">
      </div>
      <div class="story-name">${story.user.name}</div>
    `;
    div.onclick = () => openStory(index);
    container.appendChild(div);
  });
}

function renderFeed() {
  const container = document.getElementById('feed-container');
  postsData.forEach((post, index) => {
    const div = document.createElement('div');
    div.className = 'post';
    div.innerHTML = `
      <div class="post-header">
        <div class="post-user">
          <img src="${post.user.avatar}" class="post-avatar" alt="avatar">
          <div>
            <div class="post-username">${post.user.name}</div>
            <div class="post-location">${post.location}</div>
          </div>
        </div>
        <svg class="post-more" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/><circle cx="5" cy="12" r="1.5"/></svg>
      </div>
      <div class="post-image-container" id="post-img-${index}">
        <img src="${post.image}" class="post-image" alt="post">
        <svg class="heart-overlay" id="heart-${index}" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      </div>
      <div class="post-actions">
        <div class="action-group">
          <button class="action-btn" id="like-btn-${index}" onclick="toggleLike(${index}, ${post.likes})">
            <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          </button>
          <button class="action-btn" onclick="openComments()">
            <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
          </button>
          <button class="action-btn" onclick="openShare()">
            <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
        <button class="action-btn" id="save-btn-${index}" onclick="toggleSave(${index})">
          <svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        </button>
      </div>
      <div class="post-likes" id="likes-${index}">${post.likes.toLocaleString()} إعجاب</div>
      <div class="post-caption"><span>${post.user.name}</span>${post.caption}</div>
      <div class="post-comments" onclick="openComments()">عرض كل التعليقات (24)</div>
      <div class="post-time">${post.time}</div>
    `;
    
    // Double Tap Logic
    const imgContainer = document.getElementById(`post-img-${index}`);
    let lastTap = 0;
    imgContainer.addEventListener('click', (e) => {
      const now = Date.now();
      if (now - lastTap < 300) {
        doubleTapLike(index, post.likes);
        e.preventDefault();
      }
      lastTap = now;
    });

    container.appendChild(div);
  });
}

function renderExplore() {
  const container = document.getElementById('explore-grid');
  let html = '';
  for(let i=201; i<=224; i++) {
    html += `<div class="grid-item"><img src="https://picsum.photos/id/${i}/300/300" loading="lazy"></div>`;
  }
  container.innerHTML = html;
}

function renderProfile() {
  const container = document.getElementById('profile-grid');
  let html = '';
  for(let i=300; i<318; i++) {
    html += `<div class="grid-item"><img src="https://picsum.photos/id/${i}/300/300" loading="lazy"></div>`;
  }
  container.innerHTML = html;
}

function renderActivity() {
  const container = document.getElementById('activity-container');
  container.innerHTML = '';
  notificationsData.forEach(n => {
    const div = document.createElement('div');
    div.className = 'activity-item';
    div.innerHTML = `
      <img src="${n.user.avatar}" class="activity-avatar">
      <div class="activity-text">
        <b>${n.user.name}</b> ${n.text}
        <div class="activity-time">${n.time}</div>
      </div>
      ${n.image ? `<img src="${n.image}" class="activity-img">` : `<button class="activity-follow-btn">متابعة</button>`}
    `;
    container.appendChild(div);
  });
}

// ============ INTERACTIONS ============
function toggleLike(index, baseLikes) {
  const btn = document.getElementById(`like-btn-${index}`);
  const likesEl = document.getElementById(`likes-${index}`);
  if (btn.classList.contains('liked')) {
    btn.classList.remove('liked');
    likesEl.textContent = `${baseLikes.toLocaleString()} إعجاب`;
  } else {
    btn.classList.add('liked');
    likesEl.textContent = `${(baseLikes + 1).toLocaleString()} إعجاب`;
    setTimeout(() => {
      showIOSBanner('Vibe', `${users[0].name} أعجب بمنشورك أيضاً!`);
    }, 2000);
  }
}

function doubleTapLike(index, baseLikes) {
  const btn = document.getElementById(`like-btn-${index}`);
  const heart = document.getElementById(`heart-${index}`);
  const likesEl = document.getElementById(`likes-${index}`);
  
  btn.classList.add('liked');
  likesEl.textContent = `${(baseLikes + 1).toLocaleString()} إعجاب`;
  
  heart.classList.add('animate');
  setTimeout(() => heart.classList.remove('animate'), 800);
}

function toggleSave(index) {
  const btn = document.getElementById(`save-btn-${index}`);
  btn.classList.toggle('saved');
  if(btn.classList.contains('saved')) showToast('تم الحفظ في المجموعة');
}

// ============ MODALS ============
function openComments() {
  document.getElementById('comments-overlay').classList.add('show');
}
function openShare() {
  document.getElementById('share-overlay').classList.add('show');
}
function closeModal(id) {
  document.getElementById(id).classList.remove('show');
}
function addComment() {
  const input = document.getElementById('comment-input');
  const text = input.value.trim();
  if(!text) return; 
  
  const list = document.getElementById('comments-list');
  const div = document.createElement('div');
  div.className = 'comment-item';
  div.innerHTML = `
    <img src="https://i.pravatar.cc/150?img=11" class="comment-avatar">
    <div>
      <div class="comment-text"><b>أنت</b> ${text}</div>
      <div class="comment-time">الآن</div>
    </div>
  `;
  list.appendChild(div);
  input.value = '';
  input.blur();
  list.scrollTop = list.scrollHeight;
}

// ============ STORY VIEWER ============
let currentStoryIndex = 0;
let storyTimer = null;

function openStory(index) {
  currentStoryIndex = index;
  document.getElementById('story-viewer').classList.add('show');
  renderStoryContent();
}

function renderStoryContent() {
  const story = storiesData[currentStoryIndex];
  document.getElementById('sv-avatar').src = story.user.avatar;
  document.getElementById('sv-name').textContent = story.user.name;
  document.getElementById('sv-image').src = story.image;
  
  const progressContainer = document.getElementById('sv-progress');
  progressContainer.innerHTML = '';
  storiesData.forEach((_, i) => {
    const bar = document.createElement('div');
    bar.className = 'sv-bar';
    const fill = document.createElement('div');
    fill.className = 'sv-fill';
    if (i < currentStoryIndex) fill.style.width = '100%';
    if (i === currentStoryIndex) fill.classList.add('animating');
    bar.appendChild(fill);
    progressContainer.appendChild(bar);
  });
  
  clearTimeout(storyTimer);
  storyTimer = setTimeout(nextStory, 5000);
}

function nextStory() {
  if (currentStoryIndex < storiesData.length - 1) {
    currentStoryIndex++;
    renderStoryContent();
  } else {
    closeStory();
  }
}
function prevStory() {
  if (currentStoryIndex > 0) {
    currentStoryIndex--;
    renderStoryContent();
  }
}
function closeStory() {
  document.getElementById('story-viewer').classList.remove('show');
  clearTimeout(storyTimer);
}

// ============ NAVIGATION ============
function switchTab(tab) {
  document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
  document.querySelector(`.nav-item[data-tab="${tab}"]`).classList.add('active');
  
  document.querySelectorAll('.view').forEach(view => view.classList.remove('active'));
  document.getElementById(`view-${tab}`).classList.add('active');
  
  document.getElementById('main-scroll').scrollTop = 0;
}

// ============ IN-APP BANNER ============
let bannerTimer;
function showIOSBanner(title, body) {
  const banner = document.getElementById('ios-banner');
  document.getElementById('banner-title').textContent = title;
  document.getElementById('banner-body').textContent = body;
  
  banner.classList.add('show');
  clearTimeout(bannerTimer);
  bannerTimer = setTimeout(() => {
    banner.classList.remove('show');
  }, 4000);
}

function triggerMockNotification() {
  showIOSBanner('رسالة جديدة', 'أحمد: مرحباً، كيف حالك؟');
  notificationsData.unshift({
    user: users[0], type: 'message', text: 'أرسل لك رسالة.', time: 'الآن', image: null
  });
  renderActivity();
}

// ============ TOAST ============
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

// ============ INITIALIZATION ============
// تشغيل الدوال مباشرة
try {
  renderStories();
  renderFeed();
  renderExplore();
  renderProfile();
  renderActivity();
} catch(e) {
  console.log("Error loading data:", e);
}

// إخفاء اللودر بالقوة بعد نصف ثانية (حتى لو الصور مازال ما حملتش)
setTimeout(() => {
  const loader = document.getElementById('loader');
  if (loader) loader.classList.add('hide');
  
  // إشعار ترحيبي
  setTimeout(() => {
    showIOSBanner('مرحباً بك في Vibe', 'استكشف أحدث المنشورات الآن!');
  }, 1000);
}, 500);

</script>
</body>
</html>
