<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Attack on Titan - Canvas Anime</title>
<style>
    body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        user-select: none;
        -webkit-user-select: none;
    }
    canvas {
        display: block;
        width: 100%;
        height: 100%;
    }
    #overlay {
        position: absolute;
        bottom: 20px;
        left: 0;
        width: 100%;
        text-align: center;
        pointer-events: none;
        z-index: 10;
    }
    #overlay h1 {
        color: rgba(255, 255, 255, 0.8);
        font-size: 18px;
        margin: 0;
        text-shadow: 0 2px 4px #000;
    }
    #overlay p {
        color: rgba(255, 255, 255, 0.5);
        font-size: 12px;
        margin: 5px 0 0 0;
    }
</style>
</head>
<body>
    <canvas id="animeCanvas"></canvas>
    <div id="overlay">
        <h1>هجوم العمالقة - مشهد سينمائي</h1>
        <p>صُنع بالكامل بـ HTML5 Canvas & JavaScript</p>
    </div>

    <script>
        const canvas = document.getElementById('animeCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // ============ البخار والجزيئات ============
        const particles = [];
        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = -Math.random() * 2 - 1;
                this.size = Math.random() * 40 + 10;
                this.alpha = Math.random() * 0.5 + 0.2;
                this.life = Math.random() * 100 + 50;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.size += 0.3;
                this.alpha -= 0.005;
                this.life--;
            }
            draw() {
                if (this.alpha <= 0) return;
                ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // ============ الجندي (ODM Gear) ============
        const scout = {
            active: false,
            progress: 0,
            speed: 0.0035,
            waitTimer: 80,
            startX: 0, startY: 0, targetX: 0, targetY: 0,
            reset() {
                // ينطلق من اليمين لليسار
                this.startX = width + 100;
                this.startY = height * 0.3 + (Math.random() - 0.5) * 200;
                this.targetX = -100;
                this.targetY = height * 0.7 + (Math.random() - 0.5) * 200;
                this.active = true;
                this.progress = 0;
            },
            update() {
                if (!this.active) {
                    this.waitTimer--;
                    if (this.waitTimer <= 0) {
                        this.reset();
                        this.waitTimer = Math.random() * 200 + 150;
                    }
                    return;
                }
                
                this.progress += this.speed;
                if (this.progress >= 1) {
                    this.active = false;
                    return;
                }
                
                // حركة انسيابية (منحنى)
                let t = this.progress;
                let ease = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
                
                this.x = this.startX + (this.targetX - this.startX) * ease;
                this.y = this.startY + (this.targetY - this.startY) * ease - Math.sin(t * Math.PI) * 150;
                
                // إطلاق جزيئات السرعة
                if (Math.random() < 0.5) {
                    particles.push(new Particle(this.x, this.y));
                }
            },
            draw() {
                if (!this.active) return;
                
                // أسلاك الـ ODM
                ctx.strokeStyle = 'rgba(200, 200, 200, 0.6)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(width * 0.9, -50);
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(width * 0.1, -50);
                ctx.stroke();

                // رسم الجندي
                ctx.save();
                ctx.translate(this.x, this.y);
                
                let angle = Math.atan2(this.targetY - this.startY, this.targetX - this.startX);
                ctx.rotate(angle);
                
                if (this.targetX < this.startX) {
                    ctx.scale(1, -1); // قلب الجندي
                }

                // الكاب الأخضر
                ctx.fillStyle = '#1e8449';
                ctx.beginPath();
                ctx.moveTo(-10, -5);
                ctx.quadraticCurveTo(-30, 15, -20, 35);
                ctx.quadraticCurveTo(-5, 15, 10, 0);
                ctx.fill();

                // الجسم
                ctx.fillStyle = '#2c3e50';
                ctx.beginPath();
                ctx.ellipse(0, 0, 8, 15, 0, 0, Math.PI * 2);
                ctx.fill();

                // صندوق الغاز
                ctx.fillStyle = '#95a5a6';
                ctx.fillRect(-12, 0, 6, 18);
                ctx.fillRect(6, 0, 6, 18);

                // الرأس
                ctx.fillStyle = '#f1c40f';
                ctx.beginPath();
                ctx.arc(0, -12, 6, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        };
        scout.waitTimer = 30;

        // ============ المحرك الرئيسي ============
        let time = 0;
        let flashAlpha = 0;
        let lightningTimer = 100;

        function animate() {
            time++;
            
            // السماء
            const skyGrad = ctx.createLinearGradient(0, 0, 0, height);
            skyGrad.addColorStop(0, '#050505');
            skyGrad.addColorStop(0.5, '#1a0a0a');
            skyGrad.addColorStop(0.8, '#3a1010');
            skyGrad.addColorStop(1, '#0a0a0a');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, width, height);

            // شعار فيلق الاستطلاع في الخلفية (خافت)
            ctx.save();
            ctx.globalAlpha = 0.03;
            ctx.fillStyle = '#fff';
            ctx.font = `bold ${Math.min(width, height) * 0.5}px serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('翼', width / 2, height / 2);
            ctx.restore();

            // تأثير البرق
            lightningTimer--;
            if (lightningTimer <= 0) {
                flashAlpha = 0.8;
                lightningTimer = Math.random() * 200 + 200;
            }
            if (flashAlpha > 0) {
                ctx.fillStyle = `rgba(200, 220, 255, ${flashAlpha})`;
                ctx.fillRect(0, 0, width, height);
                flashAlpha -= 0.05;
            }

            // الجبال
            ctx.fillStyle = '#0f0808';
            ctx.beginPath();
            ctx.moveTo(0, height * 0.6);
            ctx.lineTo(width * 0.2, height * 0.35);
            ctx.lineTo(width * 0.4, height * 0.55);
            ctx.lineTo(width * 0.7, height * 0.3);
            ctx.lineTo(width, height * 0.5);
            ctx.lineTo(width, height);
            ctx.lineTo(0, height);
            ctx.fill();

            // ============ العملاق الكولوسال ============
            const titanX = width * 0.7;
            const titanY = height * 0.85;
            
            ctx.save();
            ctx.translate(titanX, titanY);
            
            // العضلات
            ctx.fillStyle = '#7a1f1f';
            ctx.beginPath();
            ctx.ellipse(0, 0, 130, 200, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // خطوط العضلات
            ctx.strokeStyle = '#4a0f0f';
            ctx.lineWidth = 6;
            for (let i = -110; i <= 110; i += 22) {
                ctx.beginPath();
                ctx.moveTo(i, 150);
                ctx.quadraticCurveTo(i * 1.5, -50, i * 0.8, -180);
                ctx.stroke();
            }
            
            // الفم
            ctx.fillStyle = '#111';
            ctx.beginPath();
            ctx.ellipse(0, -50, 90, 60, 0, 0, Math.PI);
            ctx.fill();
            
            // الأسنان
            ctx.fillStyle = '#e0e0e0';
            for (let i = -80; i <= 80; i += 25) {
                ctx.beginPath();
                ctx.moveTo(i, -105);
                ctx.lineTo(i + 15, -70);
                ctx.lineTo(i + 30, -105);
                ctx.fill();
                
                ctx.beginPath();
                ctx.moveTo(i, -5);
                ctx.lineTo(i + 15, -40);
                ctx.lineTo(i + 30, -5);
                ctx.fill();
            }
            
            // العيون المتوهجة
            ctx.fillStyle = '#ffaa00';
            ctx.shadowColor = '#ffaa00';
            ctx.shadowBlur = 30;
            
            ctx.beginPath();
            ctx.ellipse(-55, -130, 20, 10, 0.2, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.beginPath();
            ctx.ellipse(55, -130, 20, 10, -0.2, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.restore();

            // بخار من العملاق
            if (Math.random() < 0.4) {
                particles.push(new Particle(titanX + (Math.random() - 0.5) * 200, titanY - 150));
            }

            // ============ السور العظيم ============
            const wallY = height * 0.75;
            const wallH = height * 0.25;
            
            const wallGrad = ctx.createLinearGradient(0, wallY, 0, height);
            wallGrad.addColorStop(0, '#222');
            wallGrad.addColorStop(1, '#050505');
            ctx.fillStyle = wallGrad;
            ctx.fillRect(0, wallY, width, wallH);
            
            // نقشة الحجر
            ctx.strokeStyle = 'rgba(0,0,0,0.6)';
            ctx.lineWidth = 2;
            const brickH = 30;
            const brickW = 60;
            
            for (let y = wallY; y < height; y += brickH) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
                
                const offset = ((y - wallY) / brickH) % 2 === 0 ? 0 : brickW / 2;
                for (let x = offset; x < width; x += brickW) {
                    ctx.beginPath();
                    ctx.moveTo(x, y);
                    ctx.lineTo(x, y + brickH);
                    ctx.stroke();
                }
            }

            // تحديث ورسم البخار
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.update();
                p.draw();
                if (p.life <= 0 || p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }

            // تحديث ورسم الجندي
            scout.update();
            scout.draw();

            // ============ النصوص السينمائية ============
            ctx.textAlign = 'center';
            
            let textAlpha = 0.7 + Math.sin(time * 0.1) * 0.3;
            
            ctx.fillStyle = `rgba(255, 255, 255, ${textAlpha})`;
            ctx.font = 'bold clamp(24px, 5vw, 50px) -apple-system, BlinkMacSystemFont, sans-serif';
            ctx.shadowColor = '#ff0000';
            ctx.shadowBlur = 10;
            ctx.fillText('進撃の巨人', width / 2, height * 0.15);
            
            ctx.shadowBlur = 0;
            ctx.fillStyle = `rgba(255, 150, 150, ${textAlpha})`;
            ctx.font = 'bold clamp(12px, 2vw, 20px) -apple-system, BlinkMacSystemFont, sans-serif';
            ctx.fillText('Dedicate your hearts!', width / 2, height * 0.15 + 40);

            requestAnimationFrame(animate);
        }

        // تشغيل الأنمي
        animate();
    </script>
</body>
</html>
